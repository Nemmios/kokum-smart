      if (S.demo) S.db = window.KokumDB.DemoDB();
      else { await muatSkrip(URL_SB); S.db = window.KokumDB.SupabaseDB(C.supabaseUrl, C.supabaseAnonKey); }
    } catch (err) {
      app().innerHTML = `<div class="skrin-masuk"><div class="panel kad-masuk"><h2>Tidak dapat dimulakan</h2><p>${e(err.message)}</p><button class="btn utama" onclick="location.reload()">Cuba lagi</button></div></div>`;
      return;
    }
    S.db.onAuth((ev) => {
      if (ev === 'PASSWORD_RECOVERY') skrinMasuk('baharu');
      if (ev === 'SIGNED_OUT') { S.user = null; S.profil = null; S.data = null; skrinMasuk('masuk'); }
    });
    window.addEventListener('hashchange', () => { if (S.data && !BINGKAI) render(); });
    if (BINGKAI) document.addEventListener('click', (ev) => {
      const a = ev.target.closest('a[href^="#/"]');
      if (a) { ev.preventDefault(); pergi(a.getAttribute('href')); }
    }, true);
    const pulih = /type=recovery/.test(location.hash + location.search);
    const user = await S.db.sesi().catch(() => null);
    if (pulih && user) { S.user = user; return skrinMasuk('baharu'); }
    if (!user) return skrinMasuk('masuk');
    await selepasMasuk(user);
  }

  async function selepasMasuk(user) {
    S.user = user;
    try { S.profil = await S.db.profilSaya(user.id); } catch (err) { gagal(err); }
    if (!S.profil || !S.profil.aktif) return skrinMenunggu();
    await muatData(true);
  }

  async function muatData(pertama) {
    if (pertama) app().innerHTML = '<div class="pemuat">Memuatkan data murid…</div>';
    try {
      S.data = await S.db.muatSemua(penyelaras());
    } catch (err) {
      app().innerHTML = `<div class="skrin-masuk"><div class="panel kad-masuk"><h2>Data tidak dapat dimuatkan</h2><p>${e(err.message)}</p><div class="baris-btn"><button class="btn utama" data-act="muat-semula">Cuba lagi</button><button class="btn" data-act="keluar">Log keluar</button></div></div></div>`;
      return;
    }
    S.data.murid.sort(susunMurid);
    S.unitPeta = new Map(S.data.units.map((u) => [u.kod, u]));
    S.unitSaya = new Set(S.data.guruUnit.filter((g) => g.user_id === S.user.id).map((g) => g.unit_kod));
    S.berganda = KI.cariBerganda(aktif());
    S.bergandaId = new Set(S.berganda.flat().filter((x) => x && x.id).map((x) => x.id));
    S.dimuatPada = new Date();
    render();
  }

  // ------------------------------------------------------------------ skrin log masuk
  function skrinMasuk(mod, mesej) {
    const t = {
      masuk: ['Log masuk', 'Gunakan e-mel dan kata laluan akaun guru anda.'],
      daftar: ['Daftar akaun guru', 'Selepas mendaftar, penyelaras kokurikulum perlu mengesahkan akaun anda.'],
      lupa: ['Set semula kata laluan', 'Kami akan menghantar pautan ke e-mel anda.'],
      baharu: ['Kata laluan baharu', 'Masukkan kata laluan baharu untuk akaun anda.'],
    }[mod];
    app().innerHTML = `
      <main class="skrin-masuk">
        <div class="panel kad-masuk">
          <div class="jenama"><img src="${LOGO}" alt=""><div><b>KOKUM SMART</b><span>SMK Ulu Sugut, Ranau</span></div></div>
          <h2>${t[0]}</h2><p class="pudar kecil">${t[1]}</p>
          ${mesej ? `<div class="mesej ${mesej[0]}">${e(mesej[1])}</div>` : ''}
          <form class="borang" id="borang-masuk" data-mod="${mod}">
            ${mod === 'daftar' ? '<label class="medan">Nama penuh<input type="text" name="nama" required autocomplete="name"></label>' : ''}
            ${mod !== 'baharu' ? '<label class="medan">E-mel<input type="email" name="email" required autocomplete="email"></label>' : ''}
            ${mod !== 'lupa' ? `<label class="medan">Kata laluan<input type="password" name="pw" required minlength="6" autocomplete="${mod === 'masuk' ? 'current-password' : 'new-password'}"></label>` : ''}
            <button class="btn utama" type="submit">${{ masuk: 'Log masuk', daftar: 'Daftar akaun', lupa: 'Hantar pautan', baharu: 'Simpan kata laluan' }[mod]}</button>
          </form>
          <div class="tukar">
            ${mod === 'masuk' ? '<button data-act="ke" data-mod="daftar">Daftar akaun guru baharu</button><br><button data-act="ke" data-mod="lupa">Lupa kata laluan?</button>' : ''}
            ${mod === 'daftar' || mod === 'lupa' ? '<button data-act="ke" data-mod="masuk">Kembali ke log masuk</button>' : ''}
          </div>
        </div>
      </main>`;
    const f = $('#borang-masuk');
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      const btn = f.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        if (mod === 'masuk') { await S.db.masuk(d.email.trim(), d.pw); await selepasMasuk(await S.db.sesi()); return; }
        if (mod === 'daftar') {
          const r = await S.db.daftar(d.email.trim(), d.pw, d.nama.trim().toUpperCase());
          if (r.perluSahkan) return skrinMasuk('masuk', ['ok', 'Akaun didaftarkan. Buka pautan pengesahan dalam e-mel anda, kemudian log masuk.']);
          return selepasMasuk(await S.db.sesi());
        }
        if (mod === 'lupa') { await S.db.lupa(d.email.trim()); return skrinMasuk('masuk', ['ok', 'Pautan set semula telah dihantar jika e-mel ini berdaftar.']); }
        if (mod === 'baharu') { await S.db.tukarKataLaluan(d.pw); roti('Kata laluan dikemas kini'); history.replaceState(null, '', location.pathname); return selepasMasuk(await S.db.sesi()); }
      } catch (err) {
        skrinMasuk(mod, ['ralat', err.message]);
      } finally { btn.disabled = false; }
    });
  }

  function skrinMenunggu() {
    app().innerHTML = `
      <main class="skrin-masuk"><div class="panel kad-masuk">
        <div class="jenama"><img src="${LOGO}" alt=""><div><b>KOKUM SMART</b><span>SMK Ulu Sugut, Ranau</span></div></div>
        <h2>Menunggu pengesahan</h2>
        <p>Akaun <b>${e(S.user && S.user.email)}</b> telah didaftarkan tetapi belum diaktifkan.</p>
        <p class="pudar">Minta penyelaras kokurikulum membuka Tetapan, Akaun guru dan mengesahkan akaun anda. Selepas itu, tekan Semak semula.</p>
        <div class="baris-btn"><button class="btn utama" data-act="semak-semula">Semak semula</button><button class="btn" data-act="keluar">Log keluar</button></div>
      </div></main>`;
  }

  // ------------------------------------------------------------------ rangka & penghala
  const MENU = [['utama', 'Utama'], ['murid', 'Murid'], ['unit', 'Unit'], ['cetak', 'Cetak'], ['tetapan', 'Tetapan']];

  function rangka(aktifMenu, isi) {
    const t = S.data.tetapan || {};
    const nav = (kelas) => `<nav class="nav ${kelas}" aria-label="Menu utama">${MENU.map(([k, l]) =>
      `<a href="#/${k}" ${k === aktifMenu ? 'aria-current="page"' : ''}>${IKON[k]}<span>${l}</span></a>`).join('')}</nav>`;
    return `
      <div class="rangka">
        <aside class="rel">
          <div class="jenama"><img src="${LOGO}" alt=""><div><b>KOKUM SMART</b><span>${e(t.nama_sekolah || '')} · ${e(t.tahun || '')}</span></div></div>
          ${nav('')}
          <div class="bawah">
            <div><b>${e(S.profil.nama || S.profil.email)}</b></div>
            <div class="pudar">${penyelaras() ? 'Penyelaras' : S.unitSaya.size ? 'Guru penasihat' : 'Guru'}${S.demo ? ' <span class="lencana-demo">Demo</span>' : ''}</div>
          </div>
        </aside>
        <header class="atas-mudah"><img src="${LOGO}" alt=""><b>KOKUM SMART</b>${S.demo ? '<span class="lencana-demo">Demo</span>' : ''}</header>
        <main class="isi" id="isi">${S.demo ? bannerDemo() : ''}${isi}</main>
        ${nav('nav-bawah')}
      </div>
      <datalist id="senarai-jawatan">${JAWATAN.map((j) => `<option value="${j}">`).join('')}</datalist>
      <dialog id="dlg"></dialog>`;
  }

  function bannerDemo() {
    if (BINGKAI) return `<div class="mesej ${S.data.contoh ? 'ok' : 'amaran'} tanpa-cetak">${S.data.contoh
      ? 'Anda sedang melihat data contoh (murid rekaan). Import fail Excel DAFTAR KOKUM untuk menggantikannya dengan data sekolah. <a href="#/tetapan/import"><b>Import Excel sekarang</b></a>'
      : 'Versi cubaan dalam Claude. Data yang anda import disimpan dalam pelayar peranti ini sahaja dan tidak dikongsi dengan guru lain. Jika data hilang, import semula fail Excel.'}</div>`;
    return `<div class="mesej amaran tanpa-cetak">${S.tiadaKonfig
      ? 'Mod demo: aplikasi belum disambungkan ke Supabase. Data hanya disimpan dalam pelayar ini dan tidak dikongsi dengan guru lain. Lihat README untuk menyambung.'
      : 'Mod demo: data hanya disimpan dalam pelayar ini.'}</div>`;
  }

  function render() {
    const { bahagian, q } = hashBahagian();
    const [laluan = 'utama', a1, a2] = bahagian;
    let html, menu = laluan;
    try {
      if (laluan === 'murid') {
        ['ting', 'kelas', 'keg', 'unit', 'status'].forEach((k) => { if (q.has(k)) S.f[k] = q.get(k); });
        html = paparMurid();
      } else if (laluan === 'unit') html = a1 ? paparUnit(a1) : paparUnitSenarai();
      else if (laluan === 'cetak') {
        if (q.has('unit')) S.cetak = { ...S.cetak, mod: 'unit', pilih: q.get('unit') };
        if (q.has('kelas')) S.cetak = { ...S.cetak, mod: 'kelas', pilih: q.get('kelas') };
        html = paparCetak();
      } else if (laluan === 'tetapan') html = paparTetapan(a1 || 'profil', a2);
      else { menu = 'utama'; html = paparUtama(); }
    } catch (err) { console.error(err); html = `<div class="mesej ralat">${e(err.message)}</div>`; }
    app().innerHTML = rangka(menu, html);
    if (laluan === 'murid') isiSenaraiMurid();
    if (laluan === 'tetapan' && a1 === 'log') isiLog();
    const isi = $('#isi'); if (isi && !S.kekalSkrol) window.scrollTo(0, 0);
    S.kekalSkrol = false;
  }

  // ------------------------------------------------------------------ UTAMA
  function paparUtama() {
    const t = S.data.tetapan || {};
    const m = aktif();
    if (!S.data.murid.length) {
      return `<div class="kepala"><div><h1>Selamat datang, ${e(S.profil.nama || '')}</h1><p>${e(t.nama_sekolah)} · Tahun ${e(t.tahun)}</p></div></div>
        <div class="panel kosong-isi"><h3>Belum ada data murid</h3>
        <p>${penyelaras() ? 'Mulakan dengan mengimport fail Excel DAFTAR KOKUM sekolah.' : 'Penyelaras kokurikulum belum mengimport data murid.'}</p>
        <div class="baris-btn" style="justify-content:center">${penyelaras() ? `<a class="btn utama" href="#/tetapan/import">${IKON.naik} Import Excel</a>` : ''}
        ${S.demo ? '<button class="btn" data-act="isi-contoh">Cuba dengan data contoh</button>' : ''}</div></div>`;
    }
    const L = m.filter((x) => x.jantina === 'L').length, Pp = m.filter((x) => x.jantina === 'P').length;
    const lengkap = m.filter(kunciIsu.lengkap).length;
    const bil = bilanganUnit();
    const kira = (k) => m.filter(kunciIsu[k]).length;
    const semak = [
      ['tiadaUB', 'Belum ada unit beruniform'], ['tiadaKP', 'Belum ada kelab atau persatuan'], ['tiadaSP', 'Belum ada sukan atau permainan'],
      ['isuKad', 'No. MyKad belum sah'], ['jantinaUnit', 'Jantina tidak sesuai dengan unit'], ['berganda', 'Kemungkinan rekod berganda'],
      ['tiadaRumah', 'Rumah sukan belum ditetapkan'],
    ].map(([k, l]) => [k, l, kira(k)]);
    const perluSemak = semak.filter(([k]) => k !== 'tiadaRumah').reduce((s, x) => s + x[2], 0);
    const unitSaya = Array.from(S.unitSaya).map((k) => S.unitPeta.get(k)).filter(Boolean);

    const kategori = KATS.map((kat) => {
      const us = unitKat(kat);
      if (!us.length) return '';
      const purata = m.length / us.length;
      const maks = Math.max(purata, ...us.map((u) => Math.max(bil.get(u.kod).j, u.had_ahli || 0))) * 1.08 || 1;
      const ada = us.reduce((s, u) => s + bil.get(u.kod).j, 0);
      return `<section class="kategori ${kat}">
        <div class="kategori-kepala"><h2>${KAT[kat]}</h2>
          <div class="petunjuk"><span><i class="L"></i>Lelaki</span><span><i class="P"></i>Perempuan</span><span><i class="garis-p"></i>Purata ${Math.round(purata)} seunit</span><span>${ada} daripada ${m.length} murid</span></div></div>
        ${us.map((u) => {
          const c = bil.get(u.kod), lebih = u.had_ahli && c.j > u.had_ahli;
          return `<a class="palang ${lebih ? 'lebih' : ''}" href="#/unit/${encodeURIComponent(u.kod)}" title="${e(u.nama_penuh)}">
            <span class="kod">${e(u.kod)}</span>
            <span class="trek" role="img" aria-label="${e(u.kod)}: ${c.L} lelaki, ${c.P} perempuan">
              <span class="isi-L" style="width:${(c.L / maks) * 100}%"></span>
              <span class="isi-P" style="left:${(c.L / maks) * 100}%;width:${(c.P / maks) * 100}%"></span>
              <span class="purata" style="left:${(purata / maks) * 100}%"></span>
              ${u.had_ahli ? `<span class="had" style="left:${(u.had_ahli / maks) * 100}%" title="Had ${u.had_ahli}"></span>` : ''}
            </span>
            <span class="angka"><b>${c.j}</b> <small>${c.L}L ${c.P}P</small></span></a>`;
        }).join('')}
      </section>`;
    }).join('');

    const ikutTing = TING.map((tg) => {
      const x = m.filter((y) => y.tingkatan === tg);
      return x.length ? `<tr><td><a href="#/murid?ting=${tg}&kelas=&keg=&unit=">${labelTing(tg)}</a></td><td class="n">${x.filter((y) => y.jantina === 'L').length}</td><td class="n">${x.filter((y) => y.jantina === 'P').length}</td><td class="n"><b>${x.length}</b></td><td class="n">${kelasSenarai(tg).length}</td></tr>` : '';
    }).join('');

    return `
      <div class="kepala"><div><h1>Selamat datang, ${e((S.profil.nama || '').split(' ')[0] || 'cikgu')}</h1>
        <p>${e(t.nama_sekolah)} · Kokurikulum ${e(t.tahun)}</p></div>
        <button class="btn kecil" data-act="muat-semula" title="Muat semula data">${IKON.segar} Muat semula</button></div>
      ${unitSaya.length ? `<div class="panel" style="margin-bottom:18px"><h2>Unit yang anda urus</h2><div class="unit-grid">${unitSaya.map((u) => kadUnit(u, bil)).join('')}</div></div>` : ''}
      <div class="ringkas">
        <a class="kotak" href="#/murid?keg=&ting=&kelas=&unit=&status=aktif"><b>${m.length}</b><span>Murid aktif, ${L} lelaki, ${Pp} perempuan</span></a>
        <a class="kotak" href="#/murid?keg=lengkap&ting=&kelas=&unit="><b>${m.length ? Math.round((lengkap / m.length) * 100) : 0}%</b><span>Ada UB, KP dan SP (${lengkap} murid)</span></a>
        <div class="kotak"><b>${S.data.units.filter((u) => u.aktif !== false).length}</b><span>Unit aktif: ${KATS.map((k) => unitKat(k).length + ' ' + k).join(', ')}</span></div>
        <button type="button" class="kotak ${perluSemak ? 'isyarat' : ''}" data-act="lompat" data-sasaran="semakan"><b>${perluSemak}</b><span>Perkara perlu disemak</span></button>
      </div>
      ${kategori}
      <div class="grid2" style="margin-top:28px">
        <div class="panel semakan" id="semakan"><h2>Perlu disemak</h2>
          ${semak.map(([k, l, n]) => `<a href="#/murid?keg=${k}&ting=&kelas=&unit=&status=aktif"><span>${l}</span><b class="${n ? 'ada' : 'sifar'}">${n}</b></a>`).join('')}
        </div>
        <div class="panel"><h2>Enrolmen mengikut tingkatan</h2>
          <table class="jadual"><thead><tr><th>Tingkatan</th><th class="n">L</th><th class="n">P</th><th class="n">Jumlah</th><th class="n">Kelas</th></tr></thead>
          <tbody>${ikutTing}</tbody><tfoot><tr><th>Jumlah</th><th class="n">${L}</th><th class="n">${Pp}</th><th class="n">${m.length}</th><th class="n">${kelasSenarai('').length}</th></tr></tfoot></table>
          <p class="pudar kecil" style="margin-top:10px">Dikemas kini ${tarikh(S.dimuatPada)}. ${S.data.murid.length - m.length} murid berstatus keluar tidak dikira.</p>
        </div>
      </div>`;
  }

  // ------------------------------------------------------------------ MURID
  function paparMurid() {
    const f = S.f;
    const opsiUnit = KATS.map((k) => `<optgroup label="${KAT[k]}">${unitKat(k, true).map((u) => `<option value="${e(u.kod)}" ${f.unit === u.kod ? 'selected' : ''}>${e(u.kod)}, ${e(u.nama_penuh)}</option>`).join('')}</optgroup>`).join('');
    return `
      <div class="kepala"><div><h1>Daftar murid</h1><p>Cari murid, semak kegiatan dan kemas kini keahlian.</p></div>
        <div class="baris-btn">
          ${penyelaras() ? `<button class="btn utama" data-act="murid-baru">${IKON.tambah} Tambah murid</button>` : ''}
          <button class="btn" data-act="eksport-semua">${IKON.muat} Excel</button></div></div>
      <div class="penapis" id="penapis">
        <input class="cari" type="search" name="q" placeholder="Cari nama, kelas atau No. MyKad" value="${e(f.q)}" aria-label="Cari murid">
        <select name="ting" aria-label="Tingkatan"><option value="">Semua tingkatan</option>${TING.map((t) => `<option value="${t}" ${f.ting === t ? 'selected' : ''}>${labelTing(t)}</option>`).join('')}</select>
        <select name="kelas" aria-label="Kelas"><option value="">Semua kelas</option>${kelasSenarai(f.ting).map((k) => `<option ${f.kelas === k ? 'selected' : ''}>${e(k)}</option>`).join('')}</select>
        <select name="keg" aria-label="Kegiatan">${Object.entries(LABEL_KEG).map(([k, l]) => `<option value="${k}" ${f.keg === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <select name="unit" aria-label="Unit"><option value="">Semua unit</option>${opsiUnit}</select>
      </div>
      <div class="kiraan"><span id="bil-hasil"></span>
        <label class="cek"><input type="checkbox" name="keluar" ${f.status === 'semua' ? 'checked' : ''}> Termasuk murid keluar</label></div>
      <ul class="senarai" id="senarai-murid"></ul>
      <div id="lagi" style="text-align:center;margin-top:12px"></div>`;
  }

  function tapisMurid() {
    const f = S.f, q = f.q.trim().toUpperCase();
    return S.data.murid.filter((m) =>
      (f.status === 'semua' || m.status !== 'keluar') &&
      (!f.ting || m.tingkatan === f.ting) && (!f.kelas || m.kelas === f.kelas) &&
      (!f.unit || m.ub === f.unit || m.kp === f.unit || m.sp === f.unit) &&
      (!f.keg || (kunciIsu[f.keg] && kunciIsu[f.keg](m))) &&
      (!q || m.nama.includes(q) || (m.mykad || '').includes(q) || m.kelas.includes(q)));
  }

  function isiSenaraiMurid() {
    const hasil = tapisMurid();
    const ul = $('#senarai-murid'); if (!ul) return;
    $('#bil-hasil').textContent = `${hasil.length} murid`;
    if (!hasil.length) {
      ul.innerHTML = `<li class="kosong-isi"><h3>Tiada murid sepadan</h3><p>Ubah carian atau tapisan di atas.</p></li>`;
      $('#lagi').innerHTML = '';
      return;
    }
    ul.innerHTML = hasil.slice(0, S.had).map((m) => `<li class="${m.status === 'keluar' ? 'keluar' : ''}"><button class="baris" data-murid="${e(m.id)}">
      <span><span class="nama">${e(m.nama)}</span><br><span class="meta">${e(m.kelas)}, ${m.jantina === 'L' ? 'lelaki' : m.jantina === 'P' ? 'perempuan' : 'jantina ?'}, ${e(kadRingkas(m.mykad))}${m.status === 'keluar' ? ', keluar' : ''}</span></span>
      ${lencanaSet(m)}</button></li>`).join('');
    $('#lagi').innerHTML = hasil.length > S.had ? `<button class="btn" data-act="lagi">Papar ${Math.min(100, hasil.length - S.had)} lagi (${hasil.length - S.had} berbaki)</button>` : '';
  }

  // ---- dialog murid
  function bukaMurid(id) {
    const m = id ? S.data.murid.find((x) => x.id === id) : { nama: '', tingkatan: S.f.ting || '1', kelas: S.f.kelas || '', mykad: '', jantina: '', status: 'aktif' };
    if (!m) return;
    const boleh = penyelaras();
    const dlg = $('#dlg');
    const k = id ? kelengkapan(m) : null;
    const isu = id ? isuMurid(m) : [];
    if (id && S.bergandaId.has(id)) {
      S.berganda.filter((p) => p[0].id === id || p[1].id === id).forEach(([a, b, sebab]) => {
        const lain = a.id === id ? b : a; isu.push(`${sebab}: ${lain.nama} (${lain.kelas})`);
      });
    }
    const t = S.data.tetapan || {};
    const rumah = t.senarai_rumah && t.senarai_rumah.length
      ? `<select name="rumah_sukan" ${boleh ? '' : 'disabled'}><option value="">Belum ditetapkan</option>${t.senarai_rumah.map((r) => `<option ${m.rumah_sukan === r ? 'selected' : ''}>${e(r)}</option>`).join('')}</select>`
      : `<input type="text" name="rumah_sukan" value="${e(m.rumah_sukan)}" ${boleh ? '' : 'readonly'}>`;
    dlg.innerHTML = `
      <div class="dk"><div><h2>${id ? e(m.nama) : 'Tambah murid'}</h2>${id ? `<p class="pudar kecil" style="margin:2px 0 0">${e(m.kelas)}${m.updated_at ? `, dikemas kini ${tarikh(m.updated_at)}` : ''}</p>` : ''}</div>
        <button class="btn kosong kecil" data-act="tutup" aria-label="Tutup">${IKON.tutup}</button></div>
      <div class="db">
        ${id ? `<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between"><b class="kecil">Kelengkapan profil</b><b class="kecil">${k.peratus}%</b></div>
          <div class="meter"><div style="width:${k.peratus}%"></div></div>
          ${k.kurang.length ? `<p class="pudar kecil">Belum lengkap: ${e(k.kurang.join(', '))}</p>` : ''}
          ${isu.length ? `<ul class="isu">${isu.map((x) => `<li>${e(x)}</li>`).join('')}</ul>` : ''}</div>
          <h3 style="margin-bottom:6px">Keahlian kokurikulum</h3>
          <div id="slot-ahli">${KATS.map((kat) => slotAhli(m, kat)).join('')}</div>
          <h3 style="margin:20px 0 10px">Maklumat murid</h3>` : ''}
        <form class="borang" id="borang-murid">
          <label class="medan">Nama penuh<input type="text" name="nama" required value="${e(m.nama)}" ${boleh ? '' : 'readonly'}></label>
          <div class="dua">
            <label class="medan">Tingkatan<select name="tingkatan" ${boleh ? '' : 'disabled'}>${TING.map((x) => `<option value="${x}" ${m.tingkatan === x ? 'selected' : ''}>${labelTing(x)}</option>`).join('')}</select></label>
            <label class="medan">Kelas<input type="text" name="kelas" required list="senarai-kelas" value="${e(m.kelas)}" ${boleh ? '' : 'readonly'}></label>
          </div>
          <datalist id="senarai-kelas">${kelasSenarai('').map((x) => `<option value="${e(x)}">`).join('')}</datalist>
          <div class="dua">
            <label class="medan">No. MyKad / MyKid<input type="text" name="mykad" inputmode="numeric" value="${e(m.mykad)}" ${boleh ? '' : 'readonly'}><span class="bantu">12 digit tanpa sengkang</span></label>
            <label class="medan">Jantina<select name="jantina" ${boleh ? '' : 'disabled'}><option value="">Pilih</option><option value="L" ${m.jantina === 'L' ? 'selected' : ''}>Lelaki</option><option value="P" ${m.jantina === 'P' ? 'selected' : ''}>Perempuan</option></select></label>
          </div>
          <div class="dua">
            <label class="medan">Rumah sukan${rumah}</label>
            <label class="medan">Status<select name="status" ${boleh ? '' : 'disabled'}><option value="aktif" ${m.status !== 'keluar' ? 'selected' : ''}>Aktif</option><option value="keluar" ${m.status === 'keluar' ? 'selected' : ''}>Keluar / berpindah</option></select></label>
          </div>
          <label class="medan">Catatan<textarea name="catatan" ${boleh ? '' : 'readonly'}>${e(m.catatan)}</textarea></label>
          <div id="amaran-kad"></div>
        </form>
      </div>
      ${boleh ? `<div class="dt">${id ? '<button class="btn bahaya" data-act="padam-murid" style="margin-right:auto">Padam</button>' : ''}<button class="btn" data-act="tutup">Batal</button><button class="btn utama" data-act="simpan-murid">${id ? 'Simpan perubahan' : 'Tambah murid'}</button></div>` : ''}`;
    dlg.dataset.id = id || '';
    dlg.dataset.ubah = '';
    if (!dlg.open) dlg.showModal();
    const kad = $('input[name=mykad]', dlg);
    if (boleh && kad) kad.addEventListener('input', () => semakKadLangsung(kad.value, id));
  }

  function semakKadLangsung(nilai, id) {
    const v = KI.normalMykad(nilai), el = $('#amaran-kad'); if (!el) return;
    const sama = v && S.data.murid.find((x) => x.mykad === v && x.id !== id);
    el.innerHTML = sama ? `<div class="mesej ralat">No. MyKad ini sudah digunakan oleh ${e(sama.nama)} (${e(sama.kelas)}).</div>`
      : v && !KI.mykadSah(v) ? '<div class="mesej amaran">No. MyKad belum sah. Boleh disimpan sementara, tetapi akan disenaraikan untuk disemak.</div>' : '';
  }

  function slotAhli(m, kat) {
    const k = kat.toLowerCase(), kini = m[k] || '';
    const bolehUbah = !kini || bolehUrus(kini);
    const pilihan = unitKat(kat, true).filter((u) => (u.aktif !== false && bolehUrus(u.kod)) || u.kod === kini);
    const amaranJantina = (u) => (u.jantina && m.jantina && u.jantina !== m.jantina ? ` (${u.jantina === 'P' ? 'perempuan' : 'lelaki'} sahaja)` : '');
    return `<div class="slot" data-kat="${kat}">
      <span class="tag-kat ${kat}" title="${KAT[kat]}">${kat}</span>
      <select data-ahli="${kat}" aria-label="${KAT[kat]}" ${bolehUbah ? '' : 'disabled title="Hanya guru penasihat unit ini atau penyelaras boleh menukar"'}>
        <option value="">Belum ditetapkan</option>
        ${pilihan.map((u) => `<option value="${e(u.kod)}" ${u.kod === kini ? 'selected' : ''}>${e(u.kod)}, ${e(u.nama_penuh)}${amaranJantina(u)}</option>`).join('')}
      </select>
      <input class="jaw" type="text" data-jaw-kat="${kat}" list="senarai-jawatan" placeholder="Jawatan (jika ada)" value="${e(m[k + '_jawatan'])}" ${kini && bolehUrus(kini) ? '' : 'disabled'} aria-label="Jawatan ${kat}">
    </div>`;
  }

  async function setAhli(m, kat, kod, jawatan) {
    const k = kat.toLowerCase();
    await S.db.setAhli(m.id, kat, kod || null, kod ? jawatan : null);
    m[k] = kod || null; m[k + '_jawatan'] = kod ? (jawatan || null) : null;
  }

  async function simpanMurid() {
    const dlg = $('#dlg'), f = $('#borang-murid', dlg);
    if (!f.reportValidity()) return;
    const d = Object.fromEntries(new FormData(f));
    const id = dlg.dataset.id || null;
    const rec = {
      id, nama: d.nama.replace(/\s+/g, ' ').trim().toUpperCase(), tingkatan: d.tingkatan,
      kelas: d.kelas.replace(/\s+/g, ' ').trim().toUpperCase(), mykad: KI.normalMykad(d.mykad) || null,
      jantina: d.jantina || null, rumah_sukan: (d.rumah_sukan || '').trim().toUpperCase() || null, status: d.status || 'aktif',
      catatan: (d.catatan || '').trim() || null,
    };
    if (rec.mykad && S.data.murid.some((x) => x.mykad === rec.mykad && x.id !== id)) return roti('No. MyKad ini sudah digunakan oleh murid lain.', true);
    if (!id) {
      const mirip = S.data.murid.find((x) => x.nama === rec.nama);
      if (mirip && !(await sahkan(`Murid bernama ${mirip.nama} (${mirip.kelas}) sudah wujud. Tambah juga?`, { ok: 'Tambah juga' }))) return;
    }
    const lamaRec = id && S.data.murid.find((x) => x.id === id);
    if (rec.status === 'keluar' && !(lamaRec && lamaRec.status === 'keluar')) rec.tarikh_keluar = hariIni();
    if (rec.status === 'aktif') rec.tarikh_keluar = null;
    try {
      const simpan = await S.db.simpanMurid(rec);
      const sedia = id && S.data.murid.find((x) => x.id === id);
      if (sedia) Object.assign(sedia, simpan);
      else S.data.murid.push({ ub: null, kp: null, sp: null, ...simpan });
      S.data.murid.sort(susunMurid);
      roti(id ? 'Perubahan disimpan' : 'Murid ditambah');
      dlg.dataset.ubah = '1';
      bukaMurid(simpan.id);
    } catch (err) { gagal(err); }
  }

  // ------------------------------------------------------------------ UNIT
  function kadUnit(u, bil) {
    const c = bil.get(u.kod) || { L: 0, P: 0, j: 0 };
    return `<a class="kad-unit kategori ${u.kategori}" href="#/unit/${encodeURIComponent(u.kod)}" style="margin:0">
      <div class="atas"><b>${e(u.kod)}</b><span>${c.j}</span></div>
      <div class="nama-penuh">${e(u.nama_penuh)}</div>
      <div class="bawah"><span>${e(u.guru_penasihat || 'Guru penasihat belum ditetapkan')}</span><span>${c.L}L ${c.P}P</span></div>
      ${S.unitSaya.has(u.kod) ? '<div class="bawah"><span class="saya">Unit anda</span></div>' : ''}${u.aktif === false ? '<div class="bawah"><span>Tidak aktif</span></div>' : ''}</a>`;
  }

  function paparUnitSenarai() {
    const bil = bilanganUnit();
    return `<div class="kepala"><div><h1>Unit kokurikulum</h1><p>${S.data.units.length} unit dalam tiga kategori. Pilih unit untuk melihat dan mengurus ahli.</p></div>
      ${penyelaras() ? `<a class="btn" href="#/tetapan/unit">Urus senarai unit</a>` : ''}</div>
      ${KATS.map((kat) => `<section class="kategori ${kat}"><div class="kategori-kepala"><h2>${KAT[kat]}</h2></div>
        <div class="unit-grid">${unitKat(kat, true).map((u) => kadUnit(u, bil)).join('')}</div></section>`).join('')}`;
  }

  function ahliUnit(u) {
    const k = u.kategori.toLowerCase();
    const ij = (j) => { const i = JAWATAN.indexOf(j); return j ? (i < 0 ? JAWATAN.length : i) : 999; };
    return aktif().filter((m) => m[k] === u.kod).sort((a, b) => ij(a[k + '_jawatan']) - ij(b[k + '_jawatan']) || susunMurid(a, b));
  }

  function paparUnit(kod) {
    const u = S.unitPeta.get(kod);
    if (!u) return `<div class="mesej ralat">Unit ${e(kod)} tidak dijumpai.</div><a class="btn" href="#/unit">Kembali</a>`;
    const ahli = ahliUnit(u), k = u.kategori.toLowerCase(), boleh = bolehUrus(u.kod);
    const L = ahli.filter((m) => m.jantina === 'L').length, Pp = ahli.filter((m) => m.jantina === 'P').length;
    const purata = Math.round(aktif().length / Math.max(1, unitKat(u.kategori).length));
    const ting = TING.map((t) => [t, ahli.filter((m) => m.tingkatan === t).length]).filter((x) => x[1]);
    return `
      <p class="tanpa-cetak" style="margin-bottom:12px"><a href="#/unit">Semua unit</a></p>
      <div class="kepala kategori ${u.kategori}" style="margin-top:0">
        <div class="unit-kepala"><div class="kod-besar">${e(u.kod)}</div><h1 style="font-size:1.25rem;margin-top:6px">${e(u.nama_penuh)}</h1>
          <p>${KAT[u.kategori]}. Guru penasihat: ${e(u.guru_penasihat || 'belum ditetapkan')}. Bilik operasi: ${e(u.bilik_operasi || '—')}.</p></div>
        <div class="baris-btn">
          ${boleh ? `<button class="btn utama" data-act="tambah-ahli" data-kod="${e(u.kod)}">${IKON.tambah} Tambah ahli</button>` : ''}
          <a class="btn" href="#/cetak?unit=${encodeURIComponent(u.kod)}">${IKON.cetak} Cetak</a>
          <button class="btn" data-act="eksport-unit" data-kod="${e(u.kod)}">${IKON.muat} Excel</button></div>
      </div>
      <div class="panel">
        <div class="stat-baris"><div><b>${ahli.length}</b>ahli</div><div><b>${L}</b>lelaki</div><div><b>${Pp}</b>perempuan</div>
          <div><b>${purata}</b>purata seunit</div>${u.had_ahli ? `<div><b style="${ahli.length > u.had_ahli ? 'color:var(--bahaya)' : ''}">${u.had_ahli}</b>had ahli</div>` : ''}
          ${ting.map(([t, n]) => `<div><b>${n}</b>${t === 'PPKI' ? 'PPKI' : 'T' + t}</div>`).join('')}</div>
        ${u.jantina ? `<p class="pudar kecil" style="margin-top:10px">Unit ini untuk murid ${u.jantina === 'P' ? 'perempuan' : 'lelaki'} sahaja.</p>` : ''}
        ${!boleh ? '<p class="pudar kecil" style="margin-top:10px">Anda boleh melihat senarai ini. Hanya guru penasihat unit ini dan penyelaras boleh mengubahnya.</p>' : ''}
      </div>
      <div class="panel skrol-x" style="padding:0">
        ${ahli.length ? `<table class="jadual"><thead><tr><th>Bil</th><th>Nama</th><th>Kelas</th><th>J</th><th>Jawatan</th>${boleh ? '<th></th>' : ''}</tr></thead><tbody>
          ${ahli.map((m, i) => `<tr><td>${i + 1}</td><td><button class="btn kosong kecil" style="padding:0;min-height:0;font-weight:600;text-align:left;white-space:normal" data-murid="${e(m.id)}">${e(m.nama)}</button></td>
            <td>${e(m.kelas)}</td><td>${e(m.jantina)}</td>
            <td>${boleh ? `<input class="jawatan" type="text" list="senarai-jawatan" data-jaw="${e(m.id)}" data-kod="${e(u.kod)}" value="${e(m[k + '_jawatan'])}" placeholder="Ahli biasa" aria-label="Jawatan ${e(m.nama)}">` : e(m[k + '_jawatan'] || '')}</td>
            ${boleh ? `<td><button class="btn kecil kosong" data-act="keluar-unit" data-id="${e(m.id)}" data-kod="${e(u.kod)}" title="Keluarkan daripada unit">${IKON.tutup}</button></td>` : ''}</tr>`).join('')}
        </tbody></table>` : `<div class="kosong-isi"><h3>Belum ada ahli</h3><p>${boleh ? 'Tekan Tambah ahli untuk memilih murid.' : ''}</p></div>`}
      </div>`;
  }

  function bukaTambahAhli(kod) {
    const u = S.unitPeta.get(kod), k = u.kategori.toLowerCase();
    const dlg = $('#dlg');
    dlg.innerHTML = `
      <div class="dk"><div><h2>Tambah ahli ${e(u.kod)}</h2><p class="pudar kecil" style="margin:2px 0 0">${e(u.nama_penuh)}</p></div><button class="btn kosong kecil" data-act="tutup" aria-label="Tutup">${IKON.tutup}</button></div>
      <div class="db">
        <div class="penapis" style="grid-template-columns:2fr 1fr 1fr">
          <input class="cari" type="search" id="ta-q" placeholder="Cari nama atau kelas" aria-label="Cari">
          <select id="ta-ting" aria-label="Tingkatan"><option value="">Semua tingkatan</option>${TING.map((t) => `<option value="${t}">${labelTing(t)}</option>`).join('')}</select>
          <select id="ta-kelas" aria-label="Kelas"><option value="">Semua kelas</option>${kelasSenarai('').map((x) => `<option>${e(x)}</option>`).join('')}</select>
        </div>
        ${penyelaras() ? `<label class="cek" style="margin-bottom:8px"><input type="checkbox" id="ta-semua"> Papar juga murid yang sudah ada ${u.kategori} lain (akan dipindahkan)</label>` : ''}
        <p class="pudar kecil" id="ta-bil"></p>
        <ul class="senarai" id="ta-senarai" style="max-height:48vh;overflow:auto"></ul>
      </div>
      <div class="dt"><button class="btn" data-act="tutup">Batal</button><button class="btn utama" data-act="sahkan-tambah" data-kod="${e(u.kod)}" disabled>Tambah</button></div>`;
    dlg.dataset.id = ''; dlg.dataset.ubah = '';
    if (!dlg.open) dlg.showModal();
    const dipilih = new Set();
    const isi = () => {
      const q = $('#ta-q').value.trim().toUpperCase(), tg = $('#ta-ting').value, kl = $('#ta-kelas').value, semua = $('#ta-semua') && $('#ta-semua').checked;
      const calon = aktif().filter((m) => m[k] !== u.kod && (semua || !m[k]) && (!u.jantina || !m.jantina || m.jantina === u.jantina)
        && (!tg || m.tingkatan === tg) && (!kl || m.kelas === kl) && (!q || m.nama.includes(q) || m.kelas.includes(q)));
      $('#ta-bil').textContent = `${calon.length} murid boleh dipilih${u.jantina ? ` (${u.jantina === 'P' ? 'perempuan' : 'lelaki'} sahaja)` : ''}. ${dipilih.size} dipilih.`;
      $('#ta-senarai').innerHTML = calon.slice(0, 150).map((m) => `<li><label class="cek" style="padding:9px 12px">
        <input type="checkbox" value="${e(m.id)}" ${dipilih.has(m.id) ? 'checked' : ''}><span><b>${e(m.nama)}</b><br><span class="pudar kecil">${e(m.kelas)}, ${e(m.jantina || '?')}${m[k] ? `, kini ${e(m[k])}` : ''}</span></span></label></li>`).join('')
        || '<li class="kosong-isi">Tiada murid sepadan.</li>';
      const btn = $('[data-act=sahkan-tambah]'); btn.disabled = !dipilih.size; btn.textContent = dipilih.size ? `Tambah ${dipilih.size} murid` : 'Tambah';
    };
    ['#ta-q', '#ta-ting', '#ta-kelas', '#ta-semua'].forEach((s) => { const el = $(s); if (el) el.addEventListener('input', isi); });
    $('#ta-senarai').addEventListener('change', (ev) => { if (ev.target.type === 'checkbox') { ev.target.checked ? dipilih.add(ev.target.value) : dipilih.delete(ev.target.value); isi(); } });
    dlg._dipilih = dipilih;
    isi();
  }

  async function sahkanTambah(kod, btn) {
    const dlg = $('#dlg'), ids = Array.from(dlg._dipilih || []), u = S.unitPeta.get(kod);
    btn.disabled = true;
    let ok = 0;
    try {
      for (const id of ids) {
        const m = S.data.murid.find((x) => x.id === id);
        await setAhli(m, u.kategori, kod, null); ok++;
        btn.textContent = `Menambah ${ok}/${ids.length}…`;
      }
      roti(`${ok} murid ditambah ke ${kod}`);
    } catch (err) { gagal(err); if (ok) roti(`${ok} murid ditambah sebelum ralat`, true); }
    dlg.close(); S.kekalSkrol = true; render();
  }

  // ------------------------------------------------------------------ CETAK
  function kumpulanCetak() {
    const c = S.cetak;
    let kumpulan = [];
    if (c.mod === 'unit') {
      const us = c.pilih.startsWith('*') ? unitKat(c.pilih.slice(1), true) : [S.unitPeta.get(c.pilih)].filter(Boolean);
      kumpulan = us.map((u) => ({ tajuk: `${u.kod}, ${u.nama_penuh}`, info: [`Kategori: ${KAT[u.kategori]}`, `Guru penasihat: ${u.guru_penasihat || '—'}`, `Bilik operasi: ${u.bilik_operasi || '—'}`], u, ahli: ahliUnit(u) }));
    } else {
      const ks = c.pilih.startsWith('*') ? kelasSenarai(c.pilih.slice(1)) : [c.pilih];
      kumpulan = ks.map((k) => ({ tajuk: `Kelas ${k}`, info: [`Tingkatan: ${(aktif().find((m) => m.kelas === k) || {}).tingkatan || '—'}`], ahli: aktif().filter((m) => m.kelas === k).sort(susunMurid) }));
    }
    return kumpulan;
  }

  function paparCetak() {
    const c = S.cetak, t = S.data.tetapan || {};
    if (!c.pilih) c.pilih = c.mod === 'unit' ? (S.unitSaya.values().next().value || (S.data.units[0] || {}).kod || '') : (kelasSenarai('')[0] || '');
    const opsi = c.mod === 'unit'
      ? KATS.map((k) => `<optgroup label="${KAT[k]}"><option value="*${k}" ${c.pilih === '*' + k ? 'selected' : ''}>Semua unit ${k}</option>${unitKat(k, true).map((u) => `<option value="${e(u.kod)}" ${c.pilih === u.kod ? 'selected' : ''}>${e(u.kod)}, ${e(u.nama_penuh)}</option>`).join('')}</optgroup>`).join('')
      : TING.map((tg) => { const ks = kelasSenarai(tg); return ks.length ? `<optgroup label="${labelTing(tg)}"><option value="*${tg}" ${c.pilih === '*' + tg ? 'selected' : ''}>Semua kelas ${labelTing(tg)}</option>${ks.map((k) => `<option ${c.pilih === k ? 'selected' : ''}>${e(k)}</option>`).join('')}</optgroup>` : ''; }).join('');
    const kumpulan = kumpulanCetak();
    const kepala = (g) => `<h3>${e(t.nama_sekolah)} (${e(t.kod_sekolah)})</h3><p class="sub">${e(t.alamat)}</p>
      <p class="sub"><b>SENARAI ${c.mod === 'unit' ? 'AHLI' : 'KEGIATAN KOKURIKULUM MURID'} TAHUN ${e(t.tahun)}</b></p>
      <div class="info"><b>${e(g.tajuk)}</b><span>${g.info.map(e).join(' &nbsp; ')}</span></div>
      <div class="info"><span>Jumlah: ${g.ahli.length} (L: ${g.ahli.filter((m) => m.jantina === 'L').length}, P: ${g.ahli.filter((m) => m.jantina === 'P').length})</span><span>Dicetak: ${new Date().toLocaleDateString('ms-MY')}</span></div>`;
    const jadual = (g) => {
      if (c.mod === 'unit') {
        const k = g.u.kategori.toLowerCase();
        return `<table><thead><tr><th>BIL</th><th>NAMA MURID</th><th>KELAS</th><th>J</th>${c.mykad ? '<th>NO. MYKAD</th>' : ''}<th>JAWATAN</th><th style="width:22%">CATATAN</th></tr></thead><tbody>
          ${g.ahli.map((m, i) => `<tr><td>${i + 1}</td><td>${e(m.nama)}</td><td>${e(m.kelas)}</td><td>${e(m.jantina)}</td>${c.mykad ? `<td>${e(m.mykad)}</td>` : ''}<td>${e(m[k + '_jawatan'] || '')}</td><td></td></tr>`).join('')}</tbody></table>`;
      }
      return `<table><thead><tr><th>BIL</th><th>NAMA MURID</th><th>J</th>${c.mykad ? '<th>NO. MYKAD</th>' : ''}<th>UB</th><th>JAWATAN</th><th>KP</th><th>JAWATAN</th><th>SP</th><th>JAWATAN</th></tr></thead><tbody>
        ${g.ahli.map((m, i) => `<tr><td>${i + 1}</td><td>${e(m.nama)}</td><td>${e(m.jantina)}</td>${c.mykad ? `<td>${e(m.mykad)}</td>` : ''}<td>${e(m.ub || '')}</td><td>${e(m.ub_jawatan || '')}</td><td>${e(m.kp || '')}</td><td>${e(m.kp_jawatan || '')}</td><td>${e(m.sp || '')}</td><td>${e(m.sp_jawatan || '')}</td></tr>`).join('')}</tbody></table>`;
    };
    return `
      <div class="kepala tanpa-cetak"><div><h1>Cetak senarai</h1><p>Senarai ahli mengikut unit atau senarai kegiatan mengikut kelas, saiz A4.</p></div>
        ${BINGKAI ? `<button class="btn" data-act="eksport-cetak">${IKON.muat} Excel</button>` : `<button class="btn utama" data-act="cetak" ${kumpulan.length ? '' : 'disabled'}>${IKON.cetak} Cetak</button>`}</div>

  }

  async function bacaFailImport(fail) {
    const papar = $('#import-papar');
    papar.innerHTML = '<p class="pudar">Membaca fail…</p>';
    try {
      await muatXLSX();
      const wb = window.XLSX.read(await fail.arrayBuffer(), { type: 'array' });
      const nama = wb.SheetNames.find((n) => /DAFTAR KOKUM/i.test(n)) || wb.SheetNames[0];
      let hasil = null, ralatAkhir = null;
      for (const n of [nama, ...wb.SheetNames.filter((x) => x !== nama)]) {
        const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: true, blankrows: true });
        try { hasil = KI.bacaDaftar(rows, S.data.units); hasil.helaian = n; if (hasil.murid.length) break; } catch (err) { ralatAkhir = err; }
      }
      if (!hasil || !hasil.murid.length) throw ralatAkhir || new Error('Tiada rekod murid dijumpai dalam fail ini.');
      S.importSedia = hasil;
      const m = hasil.murid, ralatBaris = new Set(hasil.amaran.filter((a) => a.tahap === 'ralat').map((a) => a.baris));
      const sedia = new Set(S.data.murid.map((x) => x.mykad).filter(Boolean));
      const padan = m.filter((x) => x.mykad && sedia.has(x.mykad)).length;
      papar.innerHTML = `
        <h3>Semakan fail: ${e(fail.name)}</h3><p class="pudar kecil">Helaian ${e(hasil.helaian)}</p>
        <div class="ringkas" style="margin:12px 0">
          <div class="kotak"><b>${m.length}</b><span>Murid dijumpai (${m.filter((x) => x.jantina === 'L').length}L, ${m.filter((x) => x.jantina === 'P').length}P)</span></div>
          <div class="kotak"><b>${padan}</b><span>Sudah ada dalam aplikasi (akan dikemas kini)</span></div>
          <div class="kotak"><b>${KATS.map((k) => m.filter((x) => x[k.toLowerCase()]).length).join(' / ')}</b><span>Ada UB / KP / SP</span></div>
          <div class="kotak ${hasil.amaran.length ? 'isyarat' : ''}"><b>${hasil.amaran.length}</b><span>Perkara untuk disemak</span></div>
        </div>
        ${hasil.ditolak ? `<div class="mesej ralat">${hasil.ditolak} baris tanpa tingkatan atau kelas tidak akan diimport.</div>` : ''}
        ${ralatBaris.size ? `<div class="mesej ralat">${ralatBaris.size} baris mempunyai ralat dan akan gagal disimpan. Betulkan dalam Excel atau tambah unit yang tiada di Tetapan, Senarai unit.</div>` : ''}
        ${hasil.amaran.length ? `<details ${hasil.amaran.length < 30 ? 'open' : ''}><summary class="kecil" style="cursor:pointer;margin-bottom:6px">Senarai perkara untuk disemak (${hasil.amaran.length})</summary>
          <div class="skrol-x" style="max-height:320px;overflow:auto"><table class="jadual"><thead><tr><th>Baris</th><th>Nama</th><th>Perkara</th></tr></thead><tbody>
          ${hasil.amaran.slice(0, 300).map((a) => `<tr><td>${a.baris}</td><td>${e(a.nama)}</td><td style="color:var(--${a.tahap === 'ralat' ? 'bahaya' : 'amaran'})">${e(a.mesej)}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
        <p class="kecil pudar" style="margin-top:12px">Amaran seperti MyKad belum sah tidak menghalang import. Murid tersebut akan disenaraikan di dashboard untuk disemak kemudian.</p>
        <div class="baris-btn"><button class="btn utama" data-act="jalankan-import">Import ${m.length} murid</button><button class="btn" data-act="batal-import">Batal</button></div>
        <div id="import-kemajuan" style="margin-top:12px"></div>`;
    } catch (err) {
      papar.innerHTML = `<div class="mesej ralat">${e(err.message)}</div>`;
    }
  }

  async function jalankanImport(btn) {
    const h = S.importSedia; if (!h) return;
    btn.disabled = true;
    const kem = $('#import-kemajuan');
    const baris = h.murid.map(({ baris: _b, ...r }) => r);
    try {
      const hasil = await S.db.importMurid(baris, (n, j) => { kem.innerHTML = `<div class="kemajuan"><div style="width:${(n / j) * 100}%"></div></div><p class="kecil pudar">${n} / ${j}</p>`; });
      S.importHasil = hasil; S.importSedia = null;
      await muatData();
      pergi('#/tetapan/import');
      roti('Import selesai');
    } catch (err) { btn.disabled = false; gagal(err); }
  }

  async function isiLog() {
    const el = $('#log-isi'); if (!el) return;
    try {
      const log = await S.db.log(200);
      el.innerHTML = `<h2>Log perubahan</h2><p class="pudar kecil">200 perubahan terkini: siapa mengubah apa dan bila.</p>
        ${log.length ? `<div class="skrol-x"><table class="jadual"><thead><tr><th>Masa</th><th>Oleh</th><th>Tindakan</th><th>Perkara</th></tr></thead><tbody>
        ${log.map((x) => `<tr><td class="kecil">${tarikh(x.masa)}</td><td class="kecil">${e(x.oleh_email || '—')}</td><td class="kecil">${e(({ INSERT: 'Tambah', UPDATE: 'Ubah', DELETE: 'Padam', IMPORT: 'Import' })[x.tindakan] || x.tindakan)} ${e(x.jadual)}</td><td>${e(x.ringkasan)}</td></tr>`).join('')}
        </tbody></table></div>` : '<p>Belum ada perubahan direkodkan.</p>'}`;
    } catch (err) { el.innerHTML = `<div class="mesej ralat">${e(err.message)}</div>`; }
  }

  // ------------------------------------------------------------------ peristiwa
  document.addEventListener('click', async (ev) => {
    const el = ev.target.closest('[data-act],[data-murid]');
    if (!el) return;
    if (el.dataset.murid && !el.dataset.act) { bukaMurid(el.dataset.murid); return; }
    const act = el.dataset.act, dlg = $('#dlg');
    try {
      switch (act) {
        case 'ke': return skrinMasuk(el.dataset.mod);
        case 'keluar': await S.db.keluar(); S.user = null; S.data = null; return skrinMasuk('masuk');
        case 'semak-semula': return selepasMasuk(S.user);
        case 'muat-semula': await muatData(); return roti('Data dimuat semula');
        case 'tutup': dlg.close(); return;
        case 'lompat': { const s = document.getElementById(el.dataset.sasaran); if (s) s.scrollIntoView({ behavior: 'smooth' }); return; }
        case 'lagi': S.had += 100; return isiSenaraiMurid();
        case 'murid-baru': return bukaMurid(null);
        case 'simpan-murid': return simpanMurid();
        case 'padam-murid': {
          const m = S.data.murid.find((x) => x.id === dlg.dataset.id);
          if (!(await sahkan(`Padam ${m.nama} dan semua keahliannya secara kekal?\n\nJika murid berpindah, lebih baik tukar status kepada Keluar.`, { ok: 'Padam', bahaya: true }))) return;
          await S.db.padamMurid(m.id);
          S.data.murid = S.data.murid.filter((x) => x.id !== m.id);
          dlg.close(); roti('Murid dipadam'); return render();
        }
        case 'eksport-semua': return eksportSemua();
        case 'eksport-unit': {
          const u = S.unitPeta.get(el.dataset.kod), k = u.kategori.toLowerCase(), t = S.data.tetapan || {};
          return eksport(`${u.kod}-${t.tahun || ''}.xlsx`, [[u.kod, [[`${t.nama_sekolah} · ${u.kod}, ${u.nama_penuh} · ${t.tahun}`], [],
            ['BIL', 'NAMA', 'TINGKATAN', 'KELAS', 'JANTINA', 'NO MYKAD', 'JAWATAN'],
            ...ahliUnit(u).map((m, i) => [i + 1, m.nama, m.tingkatan, m.kelas, m.jantina || '', m.mykad || '', m[k + '_jawatan'] || ''])]]]).catch(gagal);
        }
        case 'tambah-ahli': return bukaTambahAhli(el.dataset.kod);
        case 'sahkan-tambah': return sahkanTambah(el.dataset.kod, el);
        case 'keluar-unit': {
          const m = S.data.murid.find((x) => x.id === el.dataset.id), u = S.unitPeta.get(el.dataset.kod);
          if (!(await sahkan(`Keluarkan ${m.nama} daripada ${u.kod}?`, { ok: 'Keluarkan', bahaya: true }))) return;
          await setAhli(m, u.kategori, null); roti(`${m.nama} dikeluarkan daripada ${u.kod}`); S.kekalSkrol = true; return render();
        }
        case 'cetak': return window.print();
        case 'eksport-cetak': {
          const c = S.cetak, t = S.data.tetapan || {}, guna = new Set();
          const namaHelaian = (n) => { let x = n.replace(/[\\/?*[\]:]/g, ' ').slice(0, 28); while (guna.has(x)) x = x.slice(0, 26) + '_' + guna.size; guna.add(x); return x; };
          const helaian = kumpulanCetak().map((g) => {
            const k = g.u ? g.u.kategori.toLowerCase() : null;
            const tajuk = g.u ? ['BIL', 'NAMA MURID', 'KELAS', 'JANTINA', ...(c.mykad ? ['NO MYKAD'] : []), 'JAWATAN']
              : ['BIL', 'NAMA MURID', 'JANTINA', ...(c.mykad ? ['NO MYKAD'] : []), 'UB', 'JAWATAN', 'KP', 'JAWATAN', 'SP', 'JAWATAN'];
            const baris = g.ahli.map((m, i) => g.u
              ? [i + 1, m.nama, m.kelas, m.jantina || '', ...(c.mykad ? [m.mykad || ''] : []), m[k + '_jawatan'] || '']
              : [i + 1, m.nama, m.jantina || '', ...(c.mykad ? [m.mykad || ''] : []), m.ub || '', m.ub_jawatan || '', m.kp || '', m.kp_jawatan || '', m.sp || '', m.sp_jawatan || '']);
            return [namaHelaian(g.u ? g.u.kod : g.tajuk.replace(/^Kelas /, '')), [[`${t.nama_sekolah} (${t.kod_sekolah})`], [g.tajuk], g.info, [], tajuk, ...baris]];
          });
          if (!helaian.length) return roti('Tiada data untuk dimuat turun.', true);
          const nama = c.mod === 'unit' ? `SENARAI-AHLI-${c.pilih.replace('*', 'SEMUA-')}` : `KEGIATAN-${c.pilih.replace('*', 'TINGKATAN-')}`;
          if (await eksport(`${nama.replace(/\s+/g, '-')}-${t.tahun || ''}.xlsx`, helaian)) roti('Fail Excel disediakan');
          return;
        }
        case 'unit-baru': return bukaUnit(null);
        case 'unit-ubah': return bukaUnit(el.dataset.kod);
        case 'simpan-unit': {
          const f = $('#borang-unit'); if (!f.reportValidity()) return;
          const d = Object.fromEntries(new FormData(f)), kodAsal = dlg.dataset.kod || null;
          const lama = kodAsal ? S.unitPeta.get(kodAsal) : null;
          const u = { kod: d.kod.trim().toUpperCase(), kategori: lama ? lama.kategori : d.kategori, nama_penuh: d.nama_penuh.trim().toUpperCase(),
            guru_penasihat: d.guru_penasihat.trim().toUpperCase() || null, bilik_operasi: d.bilik_operasi.trim().toUpperCase() || null,
            jantina: d.jantina || null, had_ahli: d.had_ahli ? +d.had_ahli : null, aktif: !!d.aktif };
          if (!lama) u.susunan = S.data.units.filter((x) => x.kategori === u.kategori).length + 1;
          await S.db.simpanUnit(u, kodAsal);
          dlg.close(); await muatData(); return roti('Unit disimpan');
        }
        case 'padam-unit': {
          const kod = dlg.dataset.kod, n = (bilanganUnit().get(kod) || {}).j || 0;
          const semua = S.data.murid.filter((m) => KATS.some((k) => m[k.toLowerCase()] === kod)).length;
          if (semua) return roti(`${kod} masih mempunyai ${semua} ahli${semua !== n ? ' (termasuk murid keluar)' : ''}. Pindahkan ahli atau tandakan unit tidak aktif.`, true);
          if (!(await sahkan(`Padam unit ${kod}?`, { ok: 'Padam', bahaya: true }))) return;
          await S.db.padamUnit(kod); dlg.close(); await muatData(); return roti('Unit dipadam');
        }
        case 'sahkan-akaun': {
          const p = S.data.profiles.find((x) => x.id === el.dataset.id);
          await S.db.simpanProfil({ id: p.id, nama: p.nama, aktif: true }); await muatData();
          roti(`${p.nama} disahkan. Tugaskan unit melalui Ubah.`); return;
        }
        case 'akaun-ubah': return bukaAkaun(el.dataset.id);
        case 'simpan-akaun': {
          const f = $('#borang-akaun'), d = new FormData(f), id = el.dataset.id;
          await S.db.simpanProfil({ id, nama: String(d.get('nama')).trim().toUpperCase(), peranan: d.get('peranan'), aktif: d.get('aktif') === '1' });
          await S.db.setGuruUnit(id, d.getAll('unit'));
          dlg.close(); await muatData(); return roti('Akaun dikemas kini');
        }
        case 'jalankan-import': return jalankanImport(el);
        case 'batal-import': S.importSedia = null; $('#import-papar').innerHTML = ''; return;
        case 'pasang': if (S.pasang) { S.pasang.prompt(); S.pasang = null; } return;
        case 'isi-contoh': S.db.isiContoh(); await muatData(); return roti('Data contoh dimuatkan');
        case 'reset-demo': if (await sahkan('Padam semua data dalam pelayar ini? Anda boleh import semula fail Excel selepas ini.', { ok: 'Padam data', bahaya: true })) { S.db.reset(); await muatData(); roti('Data demo dipadam'); } return;
        default:
      }
    } catch (err) { gagal(err); }
  });

  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.closest('#penapis')) {
      S.f[t.name] = t.value; S.had = 60;
      if (t.name === 'ting') { S.f.kelas = ''; const k = $('#penapis select[name=kelas]'); k.innerHTML = `<option value="">Semua kelas</option>${kelasSenarai(t.value).map((x) => `<option>${e(x)}</option>`).join('')}`; }
      tetapLokasi('#/murid');
      isiSenaraiMurid();
    } else if (t.name === 'keluar' && t.closest('.kiraan')) {
      S.f.status = t.checked ? 'semua' : 'aktif'; isiSenaraiMurid();
    } else if (t.closest('#pilihan-cetak')) {
      const f = new FormData(t.closest('#pilihan-cetak'));
      const modBaru = f.get('mod');
      S.cetak = { mod: modBaru, pilih: modBaru === S.cetak.mod ? f.get('pilih') : '', mykad: f.get('mykad') === 'on' };
      tetapLokasi('#/cetak'); S.kekalSkrol = true; render();
    }
  });

  document.addEventListener('change', async (ev) => {
    const t = ev.target, dlg = $('#dlg');
    try {
      if (t.id === 'fail-import' && t.files[0]) return bacaFailImport(t.files[0]);
      if (t.dataset.ahli) { // slot keahlian dalam dialog murid
        const m = S.data.murid.find((x) => x.id === dlg.dataset.id), kat = t.dataset.ahli;
        const lama = m[kat.toLowerCase()];
        if (lama && t.value && !bolehUrus(lama)) { t.value = lama; return roti('Hanya penyelaras boleh memindahkan murid daripada unit ini.', true); }
        const u = S.unitPeta.get(t.value);
        if (u && u.jantina && m.jantina && u.jantina !== m.jantina && !(await sahkan(`${u.kod} untuk murid ${u.jantina === 'P' ? 'perempuan' : 'lelaki'} sahaja. Teruskan juga?`))) { t.value = lama || ''; return; }
        t.disabled = true;
        await setAhli(m, kat, t.value, t.value === lama ? m[kat.toLowerCase() + '_jawatan'] : null);
        dlg.dataset.ubah = '1';
        roti(t.value ? `${kat}: ${t.value} disimpan` : `${kat} dikosongkan`);
        bukaMurid(m.id);
        return;
      }
      if (t.dataset.jawKat) { // jawatan dalam dialog murid
        const m = S.data.murid.find((x) => x.id === dlg.dataset.id), kat = t.dataset.jawKat, k = kat.toLowerCase();
        await setAhli(m, kat, m[k], t.value.trim().toUpperCase()); t.value = m[k + '_jawatan'] || '';
        dlg.dataset.ubah = '1'; return roti('Jawatan disimpan');
      }
      if (t.dataset.jaw) { // jawatan dalam jadual unit
        const m = S.data.murid.find((x) => x.id === t.dataset.jaw), u = S.unitPeta.get(t.dataset.kod);
        await setAhli(m, u.kategori, u.kod, t.value.trim().toUpperCase()); t.value = m[u.kategori.toLowerCase() + '_jawatan'] || '';
        return roti(`Jawatan ${m.nama.split(' ')[0]} disimpan`);
      }
    } catch (err) {
      gagal(err);
      if (dlg.open && dlg.dataset.id) bukaMurid(dlg.dataset.id);
    }
  });

  document.addEventListener('submit', async (ev) => {
    const f = ev.target;
    if (!['borang-profil', 'borang-kata', 'borang-sekolah', 'borang-murid'].includes(f.id)) return;
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    try {
      if (f.id === 'borang-murid') return simpanMurid();
      if (f.id === 'borang-profil') { S.profil = { ...S.profil, ...(await S.db.simpanProfil({ id: S.profil.id, nama: d.nama.trim().toUpperCase() })) }; roti('Nama disimpan'); return render(); }
      if (f.id === 'borang-kata') { await S.db.tukarKataLaluan(d.pw); f.reset(); return roti('Kata laluan ditukar'); }
      if (f.id === 'borang-sekolah') {
        const rumah = d.senarai_rumah.split(',').map((x) => x.trim().toUpperCase()).filter(Boolean);
        S.data.tetapan = await S.db.simpanTetapan({ nama_sekolah: d.nama_sekolah.trim(), kod_sekolah: d.kod_sekolah.trim(), alamat: d.alamat.trim(), tahun: +d.tahun, senarai_rumah: rumah });
        roti('Maklumat sekolah disimpan'); return render();
      }
    } catch (err) { gagal(err); }
  });

  document.addEventListener('close', (ev) => {
    if (ev.target.id === 'dlg' && ev.target.dataset.ubah) { S.kekalSkrol = true; render(); }
  }, true);

  window.addEventListener('beforeinstallprompt', (ev) => { ev.preventDefault(); S.pasang = ev; });
  if (!BINGKAI && !window.KOKUM_TANPA_SW && 'serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

  mula();
})();

</script>
</body>
</html>
