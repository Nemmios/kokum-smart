      if (a.rasmi && pencatat()) btn.push(`<button class="btn" data-act="ais-sahkan" data-acara="${a.id}" data-rasmi="0">Batal pengesahan</button>`);
      const cetak = `<div class="baris-btn"><a class="btn kecil" href="#/olahraga/cetak?doc=mula&acara=${a.id}">${IKON.cetak} Senarai mula</a><a class="btn kecil" href="#/olahraga/cetak?doc=hakim&acara=${a.id}">${IKON.cetak} Borang hakim</a><a class="btn kecil" href="#/olahraga/cetak?doc=keputusan&acara=${a.id}">${IKON.cetak} Keputusan</a>${a.rasmi ? `<a class="btn kecil" href="#/olahraga/cetak?doc=sijil&acara=${a.id}">${IKON.cetak} Sijil</a>` : ''}</div>`;
      const nota = perlu ? `${n} peserta melebihi ${bilLorong()} lorong: saringan ${Math.ceil(n / bilLorong())} siri. ${petuaQ(Math.ceil(n / bilLorong()))}` : (berlorong(a) && a.no_saringan ? `${n} ${a.jenis === 'gandaan' ? 'rumah' : 'peserta'}: terus akhir.` : `${n} ${a.jenis === 'gandaan' ? 'rumah' : 'peserta'}.`);
      return `<p style="margin:-4px 0 12px"><a href="#/olahraga/jadual">← Jadual</a></p>
        <div class="panel" style="margin-bottom:14px">
          <div class="kepala-acara"><div><span class="no-acara">${e(a.no_acara || '–')}</span></div><div style="min-width:0;flex:1">
            <h2 style="margin:0">${e(a.acara)} <span class="pudar" style="font-weight:500">${e(LABEL_KAT[a.kategori] || a.kategori)}</span></h2>
            <p class="pudar kecil" style="margin:2px 0 0">Akhir: ${e(hariPendek(a.hari))}, ${e(fmtJam(a.masa))}${a.no_saringan ? ` · Saringan no ${e(a.no_saringan)}: ${e(hariPendek(a.hari_saringan))}, ${e(fmtJam(a.masa_saringan))}` : ''}</p></div>${cipStatus(a)}</div>
          <table class="kecil rekod-mini"><tbody><tr><td>Rekod SMKUSR</td><td>${e(rekodTeks(a, 'SEKOLAH'))}</td></tr><tr><td>Rekod MSSD</td><td>${e(rekodTeks(a, 'MSSD'))}</td></tr></tbody></table>
          <p class="kecil" style="margin:8px 0">${e(nota)}</p>
          ${btn.length ? `<div class="baris-btn" style="margin-bottom:8px">${btn.join('')}</div>` : ''}${cetak}
          ${!pencatat() ? '<p class="pudar kecil" style="margin:8px 0 0">Hanya penyelaras dan pencatat keputusan boleh mengisi keputusan.</p>' : ''}
          ${a.rasmi ? '<p class="kecil" style="margin:8px 0 0;color:var(--hijau)"><b>Keputusan ini sudah disahkan.</b> Batalkan pengesahan untuk membuat pembetulan.</p>' : ''}</div>
        ${sar.length ? borangKep(a, 'saringan', sar, boleh && !adaHasil(ak)) : ''}
        ${ak.length ? borangKep(a, 'akhir', ak, boleh) : ''}
        ${!sar.length && !ak.length ? `<div class="panel kosong-isi"><h3>Senarai mula belum dijana</h3><p>${n ? (pencatat() ? 'Tutup pendaftaran dahulu, kemudian tekan Jana senarai mula. Lorong dan giliran diundi secara rawak; atlet rumah yang sama diasingkan ke siri berbeza.' : 'Senarai mula akan dijana oleh pencatat keputusan.') : 'Belum ada peserta berdaftar.'}</p></div>` : ''}`;
    }
    function petuaQ(H) { const L = bilLorong(), Qn = Math.max(1, Math.floor(L / H) - 1), qn = Math.max(0, L - H * Qn); return `${Qn} tempat teratas setiap siri (Q)${qn ? ` dan ${qn} masa terbaik (q)` : ''} layak ke akhir.`; }

    function borangKep(a, pus, rows, boleh) {
      const bib = bibPeta(), peta = muridPeta();
      const siri = Array.from(new Set(rows.map((x) => x.siri || 1))).sort((p, q) => p - q);
      const labelLor = a.jenis === 'padang' || a.jenis === 'tinggi' ? 'Gil' : berlorong(a) ? 'Lor' : 'No';
      const tinggi = a.jenis === 'tinggi' ? Array.from(new Set(rows.flatMap((x) => Object.keys(x.cubaan || {})))).sort((p, q) => p - q) : [];
      const pilihStatus = (x) => `<select name="s_${x.id}" aria-label="Status" class="status-pilih">${['', ...STATUS.filter((s) => (a.jenis === 'padang' || a.jenis === 'tinggi' ? s !== 'DNF' : s !== 'NM'))].map((s) => `<option value="${s}" ${x.status === s || (!x.status && !s) ? 'selected' : ''}>${s || '—'}</option>`).join('')}</select>`;
      const siapa = (x) => {
        if (a.jenis === 'gandaan') return `<b>${e(x.rumah)}</b><small>${(x.ahli || []).map((id) => `${e(bib.get(id) || '')} ${e(namaMurid(id, peta))}`).join(' · ') || 'Pelari belum dipilih'}</small>`;
        return `<b>${e(namaMurid(x.murid_id, peta))}</b><small>${e(bib.get(x.murid_id) || 'Tiada BIB')} · ${cipRumah(x.rumah)}</small>`;
      };
      const hasil = (x) => `<span class="ked">${x.status ? `<b class="pudar">${e(x.status)}</b>` : x.kedudukan ? (pus === 'akhir' ? lencanaPingat(x.kedudukan) : `<b>${x.kedudukan}</b>`) : ''}${x.catatan ? ` <b class="catatan-kep">${e(x.catatan)}</b>` : ''}</span>`;
      const baris = (x) => {
        let isi = '';
        if (boleh) {
          if (a.jenis === 'padang') isi = `<div class="cubaan">${[0, 1, 2, 3, 4, 5].map((i) => `<input name="c_${x.id}_${i}" value="${e((x.cubaan || [])[i] || '')}" inputmode="decimal" aria-label="Cubaan ${i + 1}" placeholder="${i + 1}" autocomplete="off">`).join('')}</div>`;
          else if (a.jenis === 'tinggi') isi = tinggi.length ? `<div class="cubaan tinggi">${tinggi.map((hh) => `<label><span>${e(hh)}</span><input name="t_${x.id}_${hh}" value="${e((x.cubaan || {})[hh] || '')}" autocapitalize="characters" autocomplete="off" aria-label="${e(hh)} m"></label>`).join('')}</div>` : '';
          else isi = `<input class="masa" name="p_${x.id}" value="${e(x.prestasi || '')}" inputmode="decimal" placeholder="${formatMinit(a) ? 'm.ss.s' : 'saat'}" autocomplete="off" aria-label="Masa">`;
          if (a.jenis === 'gandaan') {
            const calon = A().penyertaan.filter((p) => p.acara_id === a.id && p.rumah === x.rumah).map((p) => p.murid_id);
            isi += `<div class="ahli-pilih">${[0, 1, 2, 3].map((j) => `<select name="a_${x.id}_${j}" aria-label="Pelari ${j + 1}"><option value="">Pelari ${j + 1}</option>${calon.map((id) => `<option value="${e(id)}" ${(x.ahli || [])[j] === id ? 'selected' : ''}>${e(bib.get(id) || '')} ${e(namaMurid(id, peta))}</option>`).join('')}</select>`).join('')}</div>`;
          }
        } else {
          if (a.jenis === 'padang') isi = `<span class="cubaan-teks">${(x.cubaan || []).map((v) => e(v || '·')).join('  ')}</span>`;
          if (a.jenis === 'tinggi') isi = `<span class="cubaan-teks">${Object.entries(x.cubaan || {}).filter(([, v]) => v).sort((p, q) => p[0] - q[0]).map(([hh, v]) => `${e(hh)}: ${e(v)}`).join(' · ')}</span>`;
        }
        return `<div class="kep-baris ${a.jenis}"><span class="lor" title="${labelLor}">${e(x.lorong || '')}</span><div class="siapa">${siapa(x)}</div>
          <div class="prestasi">${(a.jenis === 'padang' || a.jenis === 'tinggi' || !boleh) ? `<b>${e(denganUnit(a, x.prestasi) || '')}</b>` : ''}${boleh ? pilihStatus(x) : ''}${hasil(x)}</div>${isi ? `<div class="kep-isi">${isi}</div>` : ''}</div>`;
      };
      const tajuk = pus === 'saringan' ? 'Saringan' : 'Akhir';
      const panduan = a.jenis === 'padang' ? 'Taip jarak setiap cubaan (contoh 4.35). Taip X atau 0 untuk cubaan batal, - untuk lepas giliran.'
        : a.jenis === 'tinggi' ? 'Senaraikan ketinggian palang, kemudian isi O (lepas), XO, XXO, XXX (gagal) atau - (lepas giliran) bagi setiap ketinggian.'
          : 'Taip masa dalam saat (contoh 12.4). Untuk minit, taip 4.32.5 atau 4:32.5.';
      const isiSiri = siri.map((s) => `${siri.length > 1 || pus === 'saringan' ? `<h3 class="siri">Siri ${s} / ${siri.length}</h3>` : ''}
        <div class="kep-senarai">${rows.filter((x) => (x.siri || 1) === s).sort((p, q) => (boleh ? (p.lorong || 99) - (q.lorong || 99) : (p.kedudukan || 99) - (q.kedudukan || 99) || (p.lorong || 99) - (q.lorong || 99))).map(baris).join('')}</div>`).join('');
      return `<form class="panel borang-kep" id="borang-ais-kep-${pus}" data-acara="${a.id}" data-pusingan="${pus}" style="margin-bottom:14px">
        <div class="dk-kep"><h2 style="margin:0">${tajuk}</h2>${boleh ? `<span class="pudar kecil">${panduan}</span>` : ''}</div>
        ${boleh && a.jenis === 'tinggi' ? `<label class="medan" style="margin:10px 0">Ketinggian palang (m), dipisah dengan ruang<input name="ketinggian" value="${e(tinggi.join(' '))}" inputmode="decimal" placeholder="1.10 1.15 1.20 1.25"></label>` : ''}
        ${isiSiri}
        ${boleh ? `<div class="baris-btn" style="margin-top:12px"><button class="btn utama" type="submit">Simpan ${tajuk.toLowerCase()} dan kira kedudukan</button></div>` : ''}</form>`;
    }

    async function simpanKep(f) {
      const a = A().acara.find((x) => x.id === +f.dataset.acara), pus = f.dataset.pusingan, d = new FormData(f);
      if (a.rasmi) { roti('Keputusan sudah disahkan. Batalkan pengesahan dahulu.', true); return; }
      const rows = kepAcara(a.id, pus).map((x) => ({ ...x })), salah = [], peta = muridPeta();
      let tinggi = [];
      if (a.jenis === 'tinggi') {
        const t = String(d.get('ketinggian') || '').replace(/,/g, ' ').split(/\s+/).filter(Boolean);
        if (t.some((v) => !/^\d(\.\d{1,2})?$/.test(v))) { roti('Ketinggian mesti dalam meter, contoh 1.20', true); return; }
        tinggi = Array.from(new Set(t.map((v) => (+v).toFixed(2)))).sort((p, q) => p - q);
      }
      rows.forEach((x) => {
        const nama = x.murid_id ? namaMurid(x.murid_id, peta) : x.rumah;
        x.status = d.get('s_' + x.id) || null;
        if (a.jenis === 'balapan' || a.jenis === 'gandaan') {
          const r = bacaMasa(d.get('p_' + x.id), formatMinit(a));
          if (x.status) { x.nilai = null; x.prestasi = null; } else if (r === false) salah.push(nama); else if (r) { x.nilai = r.nilai; x.prestasi = r.prestasi; } else { x.nilai = null; x.prestasi = null; }
        }
        if (a.jenis === 'gandaan') {
          const ahli = [0, 1, 2, 3].map((j) => d.get(`a_${x.id}_${j}`)).filter(Boolean);
          if (new Set(ahli).size !== ahli.length) salah.push(`${x.rumah} (pelari berulang)`);
          x.ahli = ahli;
        }
        if (a.jenis === 'padang') {
          const c = [0, 1, 2, 3, 4, 5].map((i) => normCubaan(d.get(`c_${x.id}_${i}`)));
          if (c.includes(false)) salah.push(nama);
          x.cubaan = c.map((v) => v || '');
        }
        if (a.jenis === 'tinggi') {
          const c = {};
          tinggi.forEach((hh) => { const v = normTinggi(d.get(`t_${x.id}_${hh}`) ?? (x.cubaan || {})[hh]); if (v === false) salah.push(`${nama} (${hh})`); c[hh] = v || ''; });
          x.cubaan = c;
        }
      });
      if (salah.length) { roti(`Semak catatan: ${salah.slice(0, 3).join(', ')}${salah.length > 3 ? '…' : ''}`, true); return; }
      kira(a, rows, pus);
      const btn = f.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
      try {
        const hasil = await S.db.aisSimpanKeputusan(rows);
        hasil.forEach((x) => { const i = A().keputusan.findIndex((y) => y.id === x.id); if (i >= 0) A().keputusan[i] = x; });
        const rb = rows.find((x) => /RB/.test(x.catatan || ''));
        roti(`Keputusan disimpan${rb ? '. Rekod baharu: ' + (x2nama(rb)) + ' ' + denganUnit(a, rb.prestasi) : ''}`);
        S.kekalSkrol = true; render();
      } finally { if (btn) btn.disabled = false; }
    }
    const x2nama = (x) => (x.murid_id ? namaMurid(x.murid_id) : x.rumah);

    async function janaMula(a) {
      const sar = kepAcara(a.id, 'saringan'), ak = kepAcara(a.id, 'akhir');
      if ((sar.length || ak.length) && !(await sahkan('Jana semula senarai mula? Lorong dan giliran akan diundi semula.', { ok: 'Jana semula' }))) return;
      if (!K().pendaftaran_dibuka || await sahkan('Pendaftaran masih dibuka. Guru rumah boleh menukar atlet selepas senarai mula dijana. Jana juga?', { ok: 'Jana juga' })) {
        const pus = perluSaringan(a) ? 'saringan' : 'akhir';
        if (pus === 'saringan' && ak.length) { await S.db.aisGantiKeputusan(a.id, 'akhir', []); A().keputusan = A().keputusan.filter((x) => !(x.acara_id === a.id && x.pusingan === 'akhir')); }
        if (pus === 'akhir' && sar.length) { await S.db.aisGantiKeputusan(a.id, 'saringan', []); A().keputusan = A().keputusan.filter((x) => !(x.acara_id === a.id && x.pusingan === 'saringan')); }
        const baru = await S.db.aisGantiKeputusan(a.id, pus, barisMula(a, pus));
        A().keputusan = A().keputusan.filter((x) => !(x.acara_id === a.id && x.pusingan === pus)).concat(baru);
        roti(`Senarai mula ${pus} dijana (${baru.length})`); S.kekalSkrol = true; render();
      }
    }
    async function janaAkhir(a) {
      const rows = barisAkhirDariSaringan(a);
      if (!rows.length) { roti('Tiada atlet layak. Semak keputusan saringan.', true); return; }
      const baru = await S.db.aisGantiKeputusan(a.id, 'akhir', rows);
      A().keputusan = A().keputusan.filter((x) => !(x.acara_id === a.id && x.pusingan === 'akhir')).concat(baru);
      roti(`Senarai akhir dijana: ${baru.length} atlet`); S.kekalSkrol = true; render();
    }
    async function sahAcara(a, rasmi) {
      const ak = kepAcara(a.id, 'akhir');
      if (rasmi && !lengkap(ak) && !(await sahkan('Ada peserta tanpa keputusan atau status. Sahkan juga?', { ok: 'Sahkan juga' }))) return;
      if (!rasmi && !(await sahkan('Batalkan pengesahan? Rekod baharu daripada acara ini akan dipadam sehingga disahkan semula.', { ok: 'Batal pengesahan' }))) return;
      const r = await S.db.aisSahkan(a.id, rasmi);
      a.rasmi = rasmi;
      A().rekod = await S.db.aisMuatRekod();
      roti(rasmi ? (r && r.rekod_baharu ? 'Keputusan disahkan. Rekod sekolah baharu dicatat!' : 'Keputusan disahkan') : 'Pengesahan dibatalkan');
      S.kekalSkrol = true; render();
    }

    /* ============================================================ BIB */
    function rancangBib(semula) {
      const ada = semula ? [] : A().bib.slice(), sudah = new Set(ada.map((b) => b.murid_id)), guna = new Set(ada.map((b) => b.bib));
      const peta = muridPeta(), atlet = new Map();
      A().penyertaan.forEach((p) => { if (!sudah.has(p.murid_id) && !atlet.has(p.murid_id)) atlet.set(p.murid_id, p.rumah); });
      const urut = ['P15', 'L15', 'P18', 'L18'];
      const senarai = Array.from(atlet.entries()).map(([id, r]) => ({ id, r, m: peta.get(id) })).filter((x) => x.m)
        .sort((p, q) => senaraiRumah().indexOf(p.r) - senaraiRumah().indexOf(q.r) || (urut.indexOf(katAtlet(p.m).kod) + 9) % 9 - (urut.indexOf(katAtlet(q.m).kod) + 9) % 9 || p.m.nama.localeCompare(q.m.nama));
      const seq = new Map();
      return senarai.map((x) => {
        const aw = awalanBib(x.r); let n = seq.get(x.r) || 0, b;
        do { b = aw + String(n).padStart(2, '0'); n++; } while (guna.has(b));
        seq.set(x.r, n); guna.add(b);
        return { murid_id: x.id, bib: b, rumah: x.r };
      });
    }
    async function janaBib(semula) {
      const baru = rancangBib(semula);
      if (!baru.length) { roti(semula ? 'Belum ada atlet berdaftar.' : 'Semua atlet sudah ada nombor BIB.'); return; }
      if (semula && A().bib.length && !(await sahkan(`Susun semula semua nombor BIB (${baru.length} atlet)? Kad BIB yang sudah dicetak perlu dicetak semula.`, { ok: 'Susun semula', bahaya: true }))) return;
      if (semula) A().bib = await S.db.aisGantiBib(K().id, baru);
      else A().bib = A().bib.concat(await S.db.aisTambahBib(K().id, baru));
      roti(`${baru.length} nombor BIB diberikan`); S.kekalSkrol = true; render();
    }

    /* ============================================================ PINGAT */
    function kiraPingat(semua) {
      const rumah = senaraiRumah(), peta = muridPeta();
      const kosong = () => ({ E: 0, P: 0, G: 0 });
      const ikutRumah = new Map(rumah.map((r) => [r, { ...kosong(), kat: Object.fromEntries(KUMP.map(([k]) => [k, kosong()])) }]));
      const atlet = new Map();
      let dikira = 0;
      A().acara.forEach((a) => {
        if (!a.rasmi && !semua) return;
        const ak = kepAcara(a.id, 'akhir');
        if (!ak.some((x) => x.kedudukan)) return;
        dikira++;
        ak.forEach((x) => {
          if (x.status || !x.kedudukan || x.kedudukan > 3) return;
          const kk = 'EPG'[x.kedudukan - 1];
          if (!ikutRumah.has(x.rumah)) ikutRumah.set(x.rumah, { ...kosong(), kat: Object.fromEntries(KUMP.map(([k]) => [k, kosong()])) });
          const r = ikutRumah.get(x.rumah); r[kk]++; r.kat[kumpKat(a.kategori)][kk]++;
          if (a.jenis !== 'gandaan' && x.murid_id && peta.get(x.murid_id)) {
            if (!atlet.has(x.murid_id)) atlet.set(x.murid_id, { m: peta.get(x.murid_id), rumah: x.rumah, ...kosong(), RB: 0, rekodTertua: null, acara: [] });
            const t = atlet.get(x.murid_id); t[kk]++; t.acara.push({ a, x });
            if (/RB/.test(x.catatan || '')) {
              t.RB++;
              const lama = rekodLama(a);
              if (lama && lama.tahun && (t.rekodTertua == null || +lama.tahun < t.rekodTertua)) t.rekodTertua = +lama.tahun;
            }
          }
        });
      });
      const susunP = (p, q) => q.E - p.E || q.P - p.P || q.G - p.G;
      const jadual = Array.from(ikutRumah.entries()).map(([r, v]) => ({ r, ...v })).sort((p, q) => susunP(p, q) || p.r.localeCompare(q.r));
      // Keputusan SU Kokum: emas, rekod baharu, perak, gangsa; jika masih seri, rekod paling lama yang dipecahkan
      const susunA = (p, q) => q.E - p.E || q.RB - p.RB || q.P - p.P || q.G - p.G || (p.rekodTertua ?? 9999) - (q.rekodTertua ?? 9999);
      const calon = (f) => Array.from(atlet.values()).filter(f).sort(susunA);
      const olah = [
        ['Olahragawan Keseluruhan', calon((t) => t.m.jantina === 'L')], ['Olahragawati Keseluruhan', calon((t) => t.m.jantina === 'P')],
        ['Olahragawan Bawah 18 Tahun', calon((t) => katAtlet(t.m).kod === 'L18')], ['Olahragawati Bawah 18 Tahun', calon((t) => katAtlet(t.m).kod === 'P18')],
        ['Olahragawan Bawah 15 Tahun', calon((t) => katAtlet(t.m).kod === 'L15')], ['Olahragawati Bawah 15 Tahun', calon((t) => katAtlet(t.m).kod === 'P15')],
      ];
      return { jadual, olah, dikira, seri: (l) => l.length > 1 && susunA(l[0], l[1]) === 0 };
    }
    const rekodBaharu = () => A().rekod.filter((r) => r.acara_id && A().acara.some((a) => a.id === r.acara_id));

    function pPingat(q) {

    }

    /* ============================================================ CETAK */
    const DOK = [['mula', 'Senarai mula'], ['hakim', 'Borang hakim / pencatat'], ['keputusan', 'Keputusan acara'], ['pingat', 'Kutipan pingat dan olahragawan'],
      ['laporan', 'Laporan penuh kejohanan'], ['sijil', 'Sijil'], ['bib', 'Kad nombor BIB'], ['atlet', 'Senarai atlet ikut rumah'], ['mssd', 'Calon wakil MSSD'], ['jadual', 'Jadual acara']];

    function kepalaDok(tajuk, sub) {
      const t = S.data.tetapan || {}, k = K();
      return `<div class="kepala-cetak"><img src="${LOGO}" alt="Lencana sekolah"><div><h3>${e(k.nama)}${TK().kali_ke ? ` KALI KE-${e(TK().kali_ke)}` : ''} ${e(k.tahun)}</h3>

    }
    const ttd = (l) => `<div class="tandatangan ttd-${l.length}">${l.map((x) => `<div>${e(x)}</div>`).join('')}</div>`;
    const kepalaAcara = (a, pus, s, H) => `<div class="kepala-acara-cetak"><div><b>No ${e(pus === 'saringan' ? a.no_saringan || '' : a.no_acara || '')}</b> · ${e(a.acara)} · ${e(LABEL_KAT[a.kategori] || a.kategori)}</div>
      <div>${pus === 'saringan' ? `SARINGAN ${s ? `SIRI ${s} / ${H}` : ''}` : 'AKHIR'} · ${e(tarikhHari(pus === 'saringan' ? a.hari_saringan : a.hari))}, ${e(fmtJam(pus === 'saringan' ? a.masa_saringan : a.masa))}</div></div>
      <div class="rekod-cetak">Rekod SMKUSR: ${e(rekodTeks(a, 'SEKOLAH'))}<br>Rekod MSSD: ${e(rekodTeks(a, 'MSSD'))}${pus === 'saringan' ? `<br>${e(petuaQ(H || 1))}` : ''}</div>`;

    function pilihAcaraCetak(q) {
      const id = q.get('acara'), hari = q.get('hari') || '';
      if (id) return A().acara.filter((a) => String(a.id) === id);

    // kumpulan senarai mula/keputusan ikut slot (saringan dan akhir) supaya susunan ikut nombor acara
    function slotCetak(q, perluBaris) {
      const hari = q.get('hari') || '', id = q.get('acara');

    }

    function jadualMula(a, rows) {
      const bib = bibPeta(), peta = muridPeta();

      return `<table><thead><tr><th style="width:52px">${lbl}</th><th style="width:60px">BIB</th><th>Nama</th><th style="width:96px">Rumah</th></tr></thead><tbody>${rows.map((x) => `<tr><td>${e(x.lorong || '')}</td><td>${e(bib.get(x.murid_id) || '')}</td><td>${e(namaMurid(x.murid_id, peta))}</td><td>${e(x.rumah)}</td></tr>`).join('')}</tbody></table>`;
    }
    function dokMula(q) {
      const slot = slotCetak(q, false);
      const blok = slot.map((s) => {
        const a = s.a, rows = kepAcara(a.id, s.pus);
        if (s.pus === 'saringan' && !rows.length && !perluSaringan(a)) return '';
        if (s.pus === 'akhir' && !rows.length && kepAcara(a.id, 'saringan').length) return `<div class="blok-acara">${kepalaAcara(a, 'akhir')}<p class="kecil"><i>Peserta akhir ditentukan selepas saringan.</i></p></div>`;
        if (!rows.length) {
          const p = a.jenis === 'gandaan' ? rumahGandaan(a).map((r) => ({ rumah: r, ahli: A().penyertaan.filter((x) => x.acara_id === a.id && x.rumah === r).map((x) => x.murid_id) })) : pesertaIndividu(a).map((x) => ({ murid_id: x.murid_id, rumah: x.rumah }));
          return `<div class="blok-acara">${kepalaAcara(a, s.pus)}<p class="kecil"><i>Senarai mula belum dijana. Senarai peserta berdaftar:</i></p>${jadualMula(a, p)}</div>`;
        }

        return siri.map((si) => `<div class="blok-acara">${kepalaAcara(a, s.pus, s.pus === 'saringan' ? si : null, siri.length)}${jadualMula(a, rows.filter((x) => (x.siri || 1) === si))}</div>`).join('');
      }).join('');
      return `<section class="halaman dok">${kepalaDok('SENARAI MULA', q.get('hari') ? e(tarikhHari(+q.get('hari'))) : '')}${blok || '<p>Tiada acara.</p>'}</section>`;
    }

    function borangHakimSatu(a, pus, si, H, rows) {
      const bib = bibPeta(), peta = muridPeta();
      const n = Math.max(rows.length, a.jenis === 'gandaan' ? 5 : rows.length ? rows.length : 8);
      const isi = rows.slice(); while (isi.length < n) isi.push({});
      const nama = (x) => (x.murid_id ? namaMurid(x.murid_id, peta) : '');
      let jad;
      if (a.jenis === 'padang') {
        jad = `<table class="borang"><thead><tr><th>Gil</th><th>BIB</th><th class="nama">Nama</th><th>Rumah</th><th>1</th><th>2</th><th>3</th><th class="gelap">Terbaik 3</th><th>4</th><th>5</th><th>6</th><th class="gelap">Terbaik</th><th>Ked</th></tr></thead>
          <tbody>${isi.map((x) => `<tr><td>${e(x.lorong || '')}</td><td>${e(bib.get(x.murid_id) || '')}</td><td class="nama">${e(nama(x))}</td><td>${e(x.rumah || '')}</td>${'<td class="kotak"></td>'.repeat(3)}<td class="gelap"></td>${'<td class="kotak"></td>'.repeat(3)}<td class="gelap"></td><td></td></tr>`).join('')}</tbody></table>
          <p class="nota-borang">Catat jarak dalam meter (contoh 4.35). X = batal, – = lepas giliran. Lapan terbaik selepas tiga cubaan mendapat tiga cubaan tambahan.</p>`;
      } else if (a.jenis === 'tinggi') {
        jad = `<table class="borang tinggi"><thead><tr><th>Gil</th><th>BIB</th><th class="nama">Nama</th><th>Rumah</th>${'<th class="ting"></th>'.repeat(12)}<th>Terbaik</th><th>Ked</th></tr></thead>
          <tbody>${isi.map((x) => `<tr><td>${e(x.lorong || '')}</td><td>${e(bib.get(x.murid_id) || '')}</td><td class="nama">${e(nama(x))}</td><td>${e(x.rumah || '')}</td>${'<td class="ting"></td>'.repeat(12)}<td></td><td></td></tr>`).join('')}</tbody></table>
          <p class="nota-borang">Tulis ketinggian palang (m) di kepala lajur. O = lepas, X = gagal, – = lepas giliran. Tiga kegagalan berturut-turut: tersingkir.</p>`;
      } else if (a.jenis === 'gandaan') {
        jad = `<table class="borang"><thead><tr><th>Lor</th><th>Rumah</th><th>Pelari 1</th><th>Pelari 2</th><th>Pelari 3</th><th>Pelari 4</th><th>Jam 1</th><th>Jam 2</th><th>Jam 3</th><th class="gelap">Masa rasmi</th><th>Ked</th></tr></thead>
          <tbody>${isi.map((x) => `<tr class="tinggi-baris"><td>${e(x.lorong || '')}</td><td><b>${e(x.rumah || '')}</b></td>${[0, 1, 2, 3].map((j) => { const id = (x.ahli || [])[j]; return `<td class="kecil-sel">${id ? `${e(bib.get(id) || '')}<br>${e(namaMurid(id, peta))}` : ''}</td>`; }).join('')}<td></td><td></td><td></td><td class="gelap"></td><td></td></tr>`).join('')}</tbody></table>`;
      } else if (!berlorong(a)) {
        const pus2 = Math.ceil(jarak(a) / 400);
        jad = `<table class="borang"><thead><tr><th>No</th><th>BIB</th><th class="nama">Nama</th><th>Rumah</th><th>Kiraan pusingan (${pus2})</th><th>Jam 1</th><th>Jam 2</th><th class="gelap">Masa rasmi</th><th>Ked</th></tr></thead>
          <tbody>${isi.map((x) => `<tr><td>${e(x.lorong || '')}</td><td>${e(bib.get(x.murid_id) || '')}</td><td class="nama">${e(nama(x))}</td><td>${e(x.rumah || '')}</td><td><span class="pusingan">${'<i></i>'.repeat(Math.min(pus2, 13))}</span></td><td></td><td></td><td class="gelap"></td><td></td></tr>`).join('')}</tbody></table>
          ${/JALAN/.test(a.acara) ? '<p class="nota-borang">Jalan kaki: catat amaran (~ angkat kaki, &lt; lutut bengkok) di ruangan nama. Tiga kad merah = DQ.</p>' : ''}`;
      } else {
        jad = `<table class="borang"><thead><tr><th>Lor</th><th>BIB</th><th class="nama">Nama</th><th>Rumah</th><th>Jam 1</th><th>Jam 2</th><th>Jam 3</th><th class="gelap">Masa rasmi</th><th>Ked</th></tr></thead>
          <tbody>${isi.map((x) => `<tr><td>${e(x.lorong || '')}</td><td>${e(bib.get(x.murid_id) || '')}</td><td class="nama">${e(nama(x))}</td><td>${e(x.rumah || '')}</td><td></td><td></td><td></td><td class="gelap"></td><td></td></tr>`).join('')}</tbody></table>
          <p class="nota-borang">Masa rasmi = masa tengah jika tiga jam; masa lebih perlahan jika dua jam. Bundarkan ke atas kepada 0.1 saat.</p>`;

      return `<section class="halaman dok borang-hakim">${kepalaDok('BORANG HAKIM DAN PENCATAT')}${kepalaAcara(a, pus, si, H)}${jad}
        <div class="info"><span>Bil peserta: ${rows.length || '……'}</span><span>Angin (jika ada): ……… m/s</span><span>Masa mula: …………</span></div>${ttd(pegawai)}</section>`;
    }
    function dokHakim(q) {
      const slot = slotCetak(q, false), out = [];
      slot.forEach((s) => {
        const a = s.a, rows = kepAcara(a.id, s.pus);
        if (s.pus === 'saringan' && !rows.length && !perluSaringan(a)) return;
        if (!rows.length) {
          if (s.pus === 'akhir' && kepAcara(a.id, 'saringan').length) return out.push(borangHakimSatu(a, 'akhir', null, 1, []));
          const n = bilPeserta(a), H = s.pus === 'saringan' ? Math.ceil(n / bilLorong()) : 1;
          if (H === 1) {  // senarai mula belum dijana: senaraikan peserta berdaftar tanpa lorong
            const p = a.jenis === 'gandaan' ? rumahGandaan(a).map((r) => ({ rumah: r })) : pesertaIndividu(a).map((x) => ({ murid_id: x.murid_id, rumah: x.rumah }));
            return out.push(borangHakimSatu(a, s.pus, null, 1, p));
          }

          return;
        }
        const siri = Array.from(new Set(rows.map((x) => x.siri || 1))).sort();
        siri.forEach((si) => out.push(borangHakimSatu(a, s.pus, s.pus === 'saringan' ? si : null, siri.length, rows.filter((x) => (x.siri || 1) === si))));
      });

    function jadualKeputusan(a, rows, pus) {
      const bib = bibPeta(), peta = muridPeta();

      const lbl = a.jenis === 'padang' || a.jenis === 'tinggi' ? 'Gil' : berlorong(a) ? 'Lor' : 'No';
      const cub = (x) => (a.jenis === 'padang' ? (x.cubaan || []).map((v) => e(v || '')).join(' &nbsp;') : a.jenis === 'tinggi' ? Object.entries(x.cubaan || {}).filter(([, v]) => v).sort((p, q) => p[0] - q[0]).map(([hh, v]) => `${e(hh)} ${e(v)}`).join(' · ') : '');
      return `<table><thead><tr><th style="width:40px">Ked</th><th style="width:40px">${lbl}</th>${a.jenis === 'gandaan' ? '<th>Rumah</th><th>Pelari</th>' : '<th style="width:56px">BIB</th><th>Nama</th><th>Rumah</th>'}<th style="width:80px">${a.unit === 'm' ? 'Jarak' : 'Masa'}</th><th style="width:56px"></th></tr></thead><tbody>
        ${urut.map((x) => `<tr><td>${x.kedudukan || '–'}</td><td>${e(x.lorong || '')}</td>${a.jenis === 'gandaan' ? `<td><b>${e(x.rumah)}</b></td><td class="kecil-sel">${(x.ahli || []).map((id) => `${e(bib.get(id) || '')} ${e(namaMurid(id, peta))}`).join('<br>')}</td>` : `<td>${e(bib.get(x.murid_id) || '')}</td><td>${e(namaMurid(x.murid_id, peta))}${cub(x) ? `<br><span class="cubaan-cetak">${cub(x)}</span>` : ''}</td><td>${e(x.rumah)}</td>`}
          <td>${e(x.status || denganUnit(a, x.prestasi) || '')}</td><td><b>${e(x.catatan || '')}</b></td></tr>`).join('')}</tbody></table>`;
    }
    function blokKeputusan(a, pus) {
      const rows = kepAcara(a.id, pus);
      if (!rows.length) return '';
      const siri = Array.from(new Set(rows.map((x) => x.siri || 1))).sort();
      return siri.map((si) => `<div class="blok-acara">${kepalaAcara(a, pus, pus === 'saringan' ? si : null, siri.length)}
        ${pus === 'akhir' ? `<p class="cop ${a.rasmi ? 'rasmi' : ''}">${a.rasmi ? 'KEPUTUSAN RASMI' : 'BELUM DISAHKAN'}</p>` : ''}${jadualKeputusan(a, rows.filter((x) => (x.siri || 1) === si), pus)}</div>`).join('');
    }
    function dokKeputusan(q) {
      const blok = slotCetak(q, true).map((s) => blokKeputusan(s.a, s.pus)).join('');
      return `<section class="halaman dok">${kepalaDok('KEPUTUSAN', q.get('hari') ? e(tarikhHari(+q.get('hari'))) : '')}${blok || '<p>Belum ada keputusan untuk dicetak.</p>'}
        <p class="nota-borang">Q = layak (kedudukan), q = layak (masa terbaik), RB = rekod baharu sekolah, DNS = tidak hadir, DNF = tidak tamat, DQ = dibatalkan, NM = tiada ukuran sah.</p>${ttd(['Pencatat Keputusan', 'Setiausaha Sukan'])}</section>`;
    }
    function bahagianPingat(semua) {
      const P = kiraPingat(semua);
      return `<table><thead><tr><th>#</th><th>Rumah</th><th>Emas</th><th>Perak</th><th>Gangsa</th><th>Jumlah</th>${KUMP.map(([, l]) => `<th class="kecil-sel">${e(l)}<br>E-P-G</th>`).join('')}</tr></thead><tbody>
        ${P.jadual.map((r, i) => `<tr><td>${i + 1}</td><td><b>${e(r.r)}</b></td><td>${r.E}</td><td>${r.P}</td><td>${r.G}</td><td>${r.E + r.P + r.G}</td>${KUMP.map(([k]) => `<td>${r.kat[k].E}-${r.kat[k].P}-${r.kat[k].G}</td>`).join('')}</tr>`).join('')}</tbody></table>
        <p class="kecil">${P.dikira} acara dikira${semua ? ' (termasuk keputusan belum disahkan)' : ' (keputusan rasmi sahaja)'}.</p>

    function papar(tab, q) {
      return { jadual: pJadual, acara: pAcara, pingat: pPingat, cetak: pCetak }[tab](q);

    async function tindakan(act, el) {
      const a = el.dataset.acara ? A().acara.find((x) => x.id === +el.dataset.acara) : null;
      switch (act) {
        case 'ais-jana-mula': await janaMula(a); return true;
        case 'ais-jana-akhir': await janaAkhir(a); return true;
        case 'ais-sahkan': await sahAcara(a, el.dataset.rasmi === '1'); return true;
        case 'ais-bib-jana': await janaBib(false); return true;
        case 'ais-bib-semula': await janaBib(true); return true;
        case 'ais-eksport-kep': await eksportKep(); return true;
        case 'ais-pingat-semua': { tetapLokasi('#/olahraga/pingat' + (el.checked ? '?semua=1' : '')); S.kekalSkrol = true; render(); return true; }

          if (!(await sahkan(`Pindahkan keputusan akhir ${n} acara yang disahkan ke "Keputusan lalu" (${K().tahun})? Data lama bagi kejohanan dan tahun yang sama akan diganti.`, { ok: 'Pindahkan' }))) return true;

          roti(`${bil} keputusan dipindahkan ke Keputusan lalu`); S.kekalSkrol = true; render(); return true;

        default: return false;
      }

    function ubah(ev) {
      const t = ev.target;
      if (t.closest('#ais-cetak-pilih')) {
        const f = t.closest('form'), d = new FormData(f), qs = new URLSearchParams();
        for (const [kk, vv] of d.entries()) if (vv) qs.set(kk, vv);
        if (t.name === 'doc') ['acara', 'hari', 'rumah', 'jenis', 'ked'].forEach((x) => qs.delete(x));
        tetapLokasi('#/olahraga/cetak?' + qs.toString()); S.kekalSkrol = true; render();

      }
      return false;
    }
    async function hantar(f) {
      if (f.id === 'borang-ais-jadual') { await simpanJadual(f); return true; }
      if (f.id.startsWith('borang-ais-kep')) { await simpanKep(f); return true; }

      }
      return false;
    }

    return { papar, tindakan, ubah, hantar, kiraPingat, statusAcara, awalanBib, bibPeta, pencatat, slotJadual, bilPeserta,
      _uji: { bacaMasa, normCubaan, normTinggi, kira, lorongTengah, barisMula, fmtJam } };
  };
})();

        jawatan: skor(sk.JAWATAN[kat], jaw), hadir: skorHadir(hadir),
        komitmen: Math.min(10, kom.reduce((s, k) => s + skor(sk.KOMITMEN, k), 0)),
        khidmat: d.khidmat ? skor(sk.KHIDMAT, d.khidmat) : 0,
        libat: skLibat(d.libat_per, d.libat_jenis), capai: skCapai(d.capai_per, d.capai_ked),
      };
      // aktiviti tambahan: pelibatan dan pencapaian tertinggi antara utama dan tambahan
      let bestL = { per: d.libat_per || '', jenis: d.libat_jenis || '', sumber: 'utama' }, bestC = { per: d.capai_per || '', ked: d.capai_ked || '', sumber: 'utama' };
      const tambahan = tambahanMurid(m.id, kat);
      tambahan.forEach((x) => {
        const l = skLibat(x.peringkat, x.jenis_libat), cc = skCapai(x.peringkat, x.kedudukan);
        if (l > c.libat) { c.libat = l; bestL = { per: x.peringkat, jenis: x.jenis_libat, sumber: x.aktiviti }; }
        if (cc > c.capai) { c.capai = cc; bestC = { per: x.peringkat, ked: x.kedudukan, sumber: x.aktiviti }; }
      });
      const jumlah = r2(c.jawatan + c.hadir + c.komitmen + c.khidmat + c.libat + c.capai);
      return { ...c, jaw, hadirN: hadir, jumlah, markah: r2(jumlah / 110 * 100), lengkap: hadir != null && kom.length > 0, bestL, bestC, tambahan };
    }
    const KM_MATA = 2;
    function kiraEkstra(d) {
      const sk = SK(); d = d || {};
      // SPPB: tanda bilangan aktiviti (maksimum 5 aktiviti), 2 markah setiap aktiviti, maksimum 10
      const km = Math.min(10, KM_MATA * Math.min(5, Object.values(d.km || {}).reduce((s, n) => s + (+n || 0), 0)));
      return Math.min(10, Math.max(0, d.perkhidmatan ? skor(sk.PERKHIDMATAN, d.perkhidmatan) : 0, d.anugerah ? skor(sk.ANUGERAH, d.anugerah) : 0,
        km, d.nilam ? skor(sk.NILAM, d.nilam) : 0, d.timss ? skor(sk.TIMSS, d.timss) : 0));
    }
    function kiraMurid(m) {
      const ek = (rekPajsk(m.id, 'EKSTRA') || {}).data || {};
      const b = {}; BIDANG.forEach((k) => { if (m[k.toLowerCase()]) b[k] = kiraBidang(m, k); });
      const ms = Object.values(b).map((x) => x.markah).sort((p, q) => q - p);
      const ekstra = kiraEkstra(ek);
      if (ek.tl) return { b, ekstra, gpa: 'TL', gred: 'TL' };
      if (!ms.length) return { b, ekstra, gpa: null, gred: '' };
      const g = Math.min(100, r2(r2((ms[0] + (ms[1] || 0)) / 2) + ekstra));
      return { b, ekstra, gpa: g, gred: g >= 80 ? 'A' : g >= 60 ? 'B' : g >= 40 ? 'C' : g >= 20 ? 'D' : 'E' };
    }
    // data untuk Excel PAJSK (Robot): dipanggil oleh KokumPAJSK.janaTemplat bagi setiap murid

    function entri() {

    /* ------------------------------------------------------------ format sekolah (BIL, BULAN, M, HARI, TARIKH, PROGRAM SEKOLAH, KOKUM, TINDAKAN) */
    const mingguIso = (s) => { const d = tk(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const j = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - j) / 864e5 - 3 + (j.getDay() + 6) % 7) / 7); };
    const tarikhSlash = (s) => `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(2, 4)}`;
    const tarikhDM = (a) => (a.tarikh_tamat && a.tarikh_tamat !== a.tarikh_mula ? `${a.tarikh_mula.slice(8, 10)}/${a.tarikh_mula.slice(5, 7)} – ${a.tarikh_tamat.slice(8, 10)}/${a.tarikh_tamat.slice(5, 7)}` : `${a.tarikh_mula.slice(8, 10)}/${a.tarikh_mula.slice(5, 7)}`);
    function barisSekolah() {

      (F().kejohanan || []).forEach((k) => { if (k.tarikh_mula) ambil(k.tarikh_mula).ol.push(k); });

      while (i < cuti.length) out.push({ cuti: cuti[i++] });

    const kodP = (l) => l.map((p) => `${p.kategori}${p.bil}`).join(' / ');

    function bukaBaris(tarikh) {

    const besar = (v) => ((v || '').trim().toUpperCase() || null);
    async function selesaiTakwim(teks) {

    async function simpanBaris(f) {
      const d = new FormData(f), asal = f.dataset.tarikh || null, t = d.get('tarikh'), tahun = F().tahun;
      if (!t || +t.slice(0, 4) !== tahun) { roti(`Pilih tarikh dalam tahun ${tahun}.`, true); return; }
      if (t !== asal && F().perjumpaan.some((p) => p.tarikh === t)) { roti(`${fmtT(t)} sudah ada perjumpaan. Ubah baris tarikh itu.`, true); return; }
      const dipilih = URUT_S.filter((k) => d.get('ada_' + k));
      if (!dipilih.length) { roti('Tanda sekurang-kurangnya satu bidang. Aktiviti tanpa perjumpaan dimasukkan melalui Aktiviti & cuti.', true); return; }
      const ps = asal ? F().perjumpaan.filter((p) => p.tarikh === asal) : [];
      const temaAsas = dipilih.map((k) => besar(d.get('tema_' + k))).find(Boolean) || null;
      const sama = { tarikh: t, program: besar(d.get('program')), tindakan: besar(d.get('tindakan')), tentatif: !!d.get('tentatif'), masa_mula: (d.get('masa_mula') || '').trim() || null };
      const kemas = [], baru = [], padam = [];
      for (const k of URUT_S) {
        const p = ps.find((x) => x.kategori === k), tema = besar(d.get('tema_' + k)) || temaAsas;
        if (dipilih.includes(k) && p) kemas.push({ id: p.id, ...sama, tema });
        else if (dipilih.includes(k)) {
          const l = perjumpaanKat(k);
          if (l.length >= 40) { roti(`${KAT[k]} sudah ada 40 perjumpaan.`, true); return; }
          baru.push({ tahun, kategori: k, bil: Math.max(0, ...l.map((x) => x.bil)) + 1, ...sama, tema });
        } else if (p) padam.push(p);
      }
      const cuti = cutiPada(t);
      if (cuti.length && !(await sahkan(`${fmtT(t, true)} bertembung dengan ${cuti[0].tajuk}. Simpan juga?`, { ok: 'Simpan' }))) return;
      if (padam.length && !(await sahkan(`Buang perjumpaan ${padam.map((p) => `${p.kategori} ke-${p.bil}`).join(', ')} daripada tarikh ini?\n\nRekod kehadiran dan rancangan unit bagi perjumpaan itu turut dipadam.`, { ok: 'Buang', bahaya: true }))) return;
      if (kemas.length) await S.db.f2KemasPerjumpaan(kemas);
      if (baru.length) await S.db.f2SimpanPerjumpaan(baru);
      if (padam.length) await S.db.f2PadamPerjumpaan(padam.map((p) => p.id));
      await selesaiTakwim(asal ? 'Baris takwim dikemas kini' : 'Baris takwim ditambah');

    async function padamBaris(tarikh) {

    async function muatDraf() {

      if (!(await sahkan(`Muat draf Takwim Kokum ${tahun}?\n\n• ${rows.length} perjumpaan: ${URUT_S.map((k) => `${k} ${per[k].length}`).join(', ')}\n• ${aktBaru.length} aktiviti sekolah (semua unit menyokong)\n• ${kpm.length} tarikh Kalendar Akademik KPM (cuti)${ada ? `\n\n${ada} perjumpaan sedia ada akan dikemas kini ikut nombor perjumpaan. Kehadiran yang sudah direkod kekal pada nombor yang sama.${lebih.length ? ` ${lebih.length} perjumpaan berlebihan dipadam.` : ''}${aktLama.length ? ` ${aktLama.length} aktiviti draf lama dibuang.` : ''}` : ''}\n\nSemua tarikh boleh diubah selepas ini.`, { ok: 'Muat draf' }))) return;
      await S.db.f2SimpanPerjumpaan(rows);
      if (lebih.length) await S.db.f2PadamPerjumpaan(lebih.map((p) => p.id));
      for (const [m, t2, t, j, c] of kpm) await S.db.f2SimpanAktiviti({ tahun, tarikh_mula: m, tarikh_tamat: t2, tajuk: t, jenis: j, unit_kod: null, peringkat: null, tempat: null, catatan: c || null });
      for (const a of aktBaru) await S.db.f2SimpanAktiviti(a);
      for (const a of aktLama) await S.db.f2PadamAktiviti(a.id);
      await muat(tahun, true);
      roti(`Draf Takwim Kokum ${tahun} dimuatkan`); tetapLokasi(`#/takwim/senarai?tahun=${tahun}`); render();
    }

    function pPerjumpaan(q) {

        : `<div class="panel" style="padding:0">${isi}</div>${penyelaras() ? '<div class="baris-btn" style="margin-top:12px"><a class="btn" href="#/takwim/perjumpaan?ubah=1">Ubah tarikh satu per satu</a><a class="btn" href="#/takwim/jana">Jana semula</a></div>' : ''}

    function pJana() {

      const t = F().tahun;
      const asal = (k, i) => { const p = perjumpaanKat(k)[0]; return p ? p.tarikh : ''; };
      const cuti = F().aktiviti.filter((a) => a.jenis === 'cuti' || a.jenis === 'peperiksaan');
      return `${amaranFormat()}${DRAF_TAKWIM[t] ? `<div class="panel" style="margin-bottom:14px"><h2>Draf Takwim Kokum ${t}</h2>
          <p class="kecil" style="margin:0">Draf format sekolah (berdasarkan Takwim Kokum 2024 dan Kalendar Akademik KPM ${t}): ${DRAF_TAKWIM[t].length} baris, termasuk tema, program sekolah, tindakan dan perjumpaan gabungan. Kalendar KPM turut dimasukkan.</p>
          <div class="baris-btn" style="margin-top:10px">${butangDraf()}</div></div>` : ''}
        <form class="panel borang" id="borang-f2-jana">
        <p class="kecil" style="margin:0">Tetapkan tarikh perjumpaan pertama setiap bidang. Aplikasi menjana tarikh seterusnya ikut selang minggu dan melangkau minggu cuti atau peperiksaan yang sudah dimasukkan (${cuti.length} julat).</p>
        ${BIDANG.map((k, i) => `<fieldset class="jana-baris"><legend><label class="cek"><input type="checkbox" name="ada_${k}" checked> ${KAT[k]}</label></legend>
          <div class="grid-jana"><label class="medan">Perjumpaan pertama<input type="date" name="mula_${k}" value="${e(asal(k) || '')}" min="${t}-01-01" max="${t}-12-31"></label>
          <label class="medan">Selang<select name="selang_${k}">${[1, 2, 3, 4].map((n) => `<option value="${n}" ${n === 2 ? 'selected' : ''}>Setiap ${n === 1 ? 'minggu' : n + ' minggu'}</option>`).join('')}</select></label>
          <label class="medan">Bilangan<input type="number" name="bil_${k}" value="12" min="1" max="40"></label>
          <label class="medan">Masa<input type="text" name="masa_${k}" value="${e((perjumpaanKat(k)[0] || {}).masa_mula || '2.30 ptg')}" placeholder="2.30 ptg"></label></div></fieldset>`).join('')}
        <label class="cek"><input type="checkbox" name="langkau" checked> Langkau minggu cuti dan peperiksaan</label>
        <div id="jana-pratonton"></div>
        <div class="baris-btn"><button class="btn utama" type="submit">Simpan tarikh perjumpaan ${t}</button></div>
        <p class="pudar kecil">Tarikh yang sudah ada dikemas kini mengikut nombor perjumpaan. Rekod kehadiran yang sudah diisi kekal.</p></form>
        <div class="panel"><h2>Cuti dan peperiksaan ${t}</h2>${cuti.length ? `<ul class="kecil" style="margin:0;padding-left:18px">${cuti.map((a) => `<li>${e(fmtJulat(a.tarikh_mula, a.tarikh_tamat))}: ${e(a.tajuk)}</li>`).join('')}</ul>` : '<p class="pudar kecil">Belum ada. Tambah cuti penggal dan minggu peperiksaan dahulu supaya tarikh tidak bertembung.</p>'}
          <div class="baris-btn" style="margin-top:10px">${butangKpm()}<button class="btn" data-act="f2-aktiviti" data-jenis="cuti">${IKON.tambah} Tambah cuti / peperiksaan</button></div></div>`;
    }
    function janaTarikh(d) {
      const out = {};
      // Giliran mingguan (contoh UB minggu 1, KP minggu 2, SP minggu 3): minggu cuti dilangkau dan giliran diteruskan
      const ada = BIDANG.filter((k) => d.get('ada_' + k) && d.get('mula_' + k)).sort((a, b) => d.get('mula_' + a).localeCompare(d.get('mula_' + b)));
      const giliran = ada.length > 1 && ada.every((k) => +d.get('selang_' + k) === ada.length)
        && ada.every((k, i) => i === 0 || d.get('mula_' + k) === tambahHari(d.get('mula_' + ada[i - 1]), 7));
      if (giliran) {
        const perlu = Object.fromEntries(ada.map((k) => [k, Math.max(1, Math.min(40, +d.get('bil_' + k) || 12))]));
        ada.forEach((k) => { out[k] = []; });
        let t = d.get('mula_' + ada[0]), i = 0, cuba = 0;
        while (ada.some((k) => out[k].length < perlu[k]) && cuba < 300) {
          cuba++;
          if (!(d.get('langkau') && cutiPada(t).length)) { const k = ada[i % ada.length]; if (out[k].length < perlu[k]) out[k].push(t); i++; }
          t = tambahHari(t, 7);
        }
        return out;
      }
      BIDANG.forEach((k) => {
        if (!d.get('ada_' + k) || !d.get('mula_' + k)) return;
        const n = Math.max(1, Math.min(40, +d.get('bil_' + k) || 12)), selang = +d.get('selang_' + k) || 2;
        let t = d.get('mula_' + k), cuba = 0; const l = [];
        while (l.length < n && cuba < 200) {
          cuba++;
          if (d.get('langkau') && cutiPada(t).length) { t = tambahHari(t, 7); continue; }
          l.push(t); t = tambahHari(t, selang * 7);
        }
        out[k] = l;
      });
      return out;
    }
    function pratontonJana() {
      const f = $('#borang-f2-jana'); if (!f) return;
      const j = janaTarikh(new FormData(f)), t = F().tahun;

    }
    async function simpanJana(f) {
      const d = new FormData(f), j = janaTarikh(d), t = F().tahun;
      if (!Object.keys(j).length) { roti('Isi tarikh perjumpaan pertama sekurang-kurangnya satu bidang.', true); return; }
      if (Object.values(j).some((l) => l.some((x) => x.slice(0, 4) !== String(t)))) { roti(`Ada tarikh di luar tahun ${t}. Kurangkan bilangan atau ubah tarikh pertama.`, true); return; }
      const padam = [];
      Object.keys(j).forEach((k) => perjumpaanKat(k).filter((p) => p.bil > j[k].length).forEach((p) => padam.push(p)));
      if (!(await sahkan(`Simpan ${Object.values(j).reduce((s, l) => s + l.length, 0)} tarikh perjumpaan ${t}?${padam.length ? `\n\n${padam.length} perjumpaan berlebihan akan dipadam bersama rekod kehadirannya.` : ''}`, { ok: 'Simpan' }))) return;
      const rows = [];
      Object.entries(j).forEach(([k, l]) => l.forEach((x, i) => rows.push({ tahun: t, kategori: k, bil: i + 1, tarikh: x, masa_mula: (d.get('masa_' + k) || '').trim() || null })));
      await S.db.f2SimpanPerjumpaan(rows);
      if (padam.length) await S.db.f2PadamPerjumpaan(padam.map((p) => p.id));
      await muat(t, true);
      roti('Tarikh perjumpaan disimpan'); tetapLokasi('#/takwim/perjumpaan'); render();
    }
    async function simpanTarikh(f) {
      const d = new FormData(f), rows = [];
      F().perjumpaan.forEach((p) => { const v = d.get('t_' + p.id); if (v && v !== p.tarikh) rows.push({ id: p.id, tarikh: v }); });
      if (rows.length) { await S.db.f2KemasPerjumpaan(rows); await S.db.f2SusunPerjumpaan(F().tahun); }

    }

    /* ------------------------------------------------------------ aktiviti & cuti */
    const bolehUbahAktiviti = (a) => penyelaras() || ((a.jenis === 'unit' || a.jenis === 'luar') && a.unit_kod && bolehUrus(a.unit_kod));
    function pAktiviti(q) {

        <p class="pudar kecil" style="margin:8px 0 0">${penyelaras() ? 'Penyelaras boleh menambah semua jenis aktiviti.' : 'Guru penasihat boleh menambah aktiviti dan pertandingan bagi unit sendiri.'}</p></div>
        <div class="panel" style="padding:0">${l.length ? `<ul class="senarai">${l.map((a) => `<li><div class="baris" style="cursor:default">
          <span><span class="nama">${e(a.tajuk)}</span><br><span class="meta">${e(fmtJulat(a.tarikh_mula, a.tarikh_tamat))} · ${e(JENIS[a.jenis])}${a.unit_kod ? ' · ' + e(a.unit_kod) : ''}${a.peringkat ? ' · ' + e(a.peringkat) : ''}${a.tempat ? ' · ' + e(a.tempat) : ''}</span></span>
          ${bolehUbahAktiviti(a) ? `<button class="btn kecil" data-act="f2-aktiviti" data-id="${a.id}">Ubah</button>` : ''}</div></li>`).join('')}</ul>` : '<div class="kosong-isi">Tiada aktiviti.</div>'}</div>`;
    }
    const kpmBaki = () => (KALENDAR_KPM[F().tahun] || []).filter(([m, , t]) => !F().aktiviti.some((a) => a.tajuk === t && a.tarikh_mula === m));
    const butangKpm = () => (penyelaras() && kpmBaki().length ? `<button class="btn" data-act="f2-kpm">Masukkan Kalendar Akademik KPM ${F().tahun} (Sabah, ${kpmBaki().length} tarikh)</button>` : '');
    async function masukKpm() {

      for (const [m, t2, t, j, c] of l) F().aktiviti.push(await S.db.f2SimpanAktiviti({ tahun: F().tahun, tarikh_mula: m, tarikh_tamat: t2, tajuk: t, jenis: j, unit_kod: null, peringkat: null, tempat: null, catatan: c || null }));

    }
    function bukaAktiviti(id, pra) {
      const a = id ? F().aktiviti.find((x) => x.id === +id) : { jenis: pra.jenis || (penyelaras() ? 'sekolah' : 'unit'), unit_kod: pra.unit || '', tarikh_mula: '', tahun: F().tahun };
      const unitSaya = penyelaras() ? S.data.units : S.data.units.filter((u) => bolehUrus(u.kod));
      const jenisBoleh = penyelaras() ? Object.keys(JENIS) : ['unit', 'luar'];
      if (!penyelaras() && !unitSaya.length) { roti('Anda belum ditugaskan sebagai guru penasihat mana-mana unit.', true); return; }
      const dlg = $('#dlg');
      dlg.innerHTML = `<div class="dk"><div><h2>${id ? 'Ubah' : 'Tambah'} aktiviti</h2></div><button class="btn kosong kecil" data-act="tutup" aria-label="Tutup">${IKON.tutup}</button></div>
        <div class="db"><form class="borang" id="borang-f2-aktiviti" data-id="${id || ''}">
          <label class="medan">Tajuk<input type="text" name="tajuk" value="${e(a.tajuk || '')}" required placeholder="Contoh: Cuti Penggal 1, Hari Kokurikulum, Perkhemahan Unit"></label>
          <div class="dua"><label class="medan">Jenis<select name="jenis">${jenisBoleh.map((k) => `<option value="${k}" ${a.jenis === k ? 'selected' : ''}>${JENIS[k]}</option>`).join('')}</select></label>
            <label class="medan">Unit<select name="unit_kod">${penyelaras() ? '<option value="">Semua / sekolah</option>' : ''}${unitSaya.map((u) => `<option ${a.unit_kod === u.kod ? 'selected' : ''}>${e(u.kod)}</option>`).join('')}</select></label></div>
          <div class="dua"><label class="medan">Tarikh mula<input type="date" name="tarikh_mula" value="${e(a.tarikh_mula || '')}" required></label>
            <label class="medan">Tarikh tamat<input type="date" name="tarikh_tamat" value="${e(a.tarikh_tamat || '')}"><span class="bantu">Kosongkan jika sehari.</span></label></div>
          <div class="dua"><label class="medan">Peringkat<select name="peringkat"><option value="">—</option>${SK().PERINGKAT.map((p) => `<option ${a.peringkat === p ? 'selected' : ''}>${e(p)}</option>`).join('')}</select></label>
            <label class="medan">Tempat<input type="text" name="tempat" value="${e(a.tempat || '')}"></label></div>
          <label class="medan">Catatan<input type="text" name="catatan" value="${e(a.catatan || '')}"></label>
          ${F().adaFormat !== false ? `<label class="medan">Tindakan<input type="text" name="tindakan" value="${e(a.tindakan || '')}" placeholder="Contoh: PENYELARAS PAJSK & GURU-GURU KELAS"><span class="bantu">Dipaparkan dalam takwim format sekolah.</span></label>` : ''}
        </form></div>
        <div class="dt">${id ? '<button class="btn bahaya" data-act="f2-padam-aktiviti" data-id="' + id + '">Padam</button>' : ''}<button class="btn" data-act="tutup">Batal</button><button class="btn utama" type="submit" form="borang-f2-aktiviti">Simpan</button></div>`;
      dlg.dataset.id = ''; dlg.dataset.ubah = '';
      if (!dlg.open) dlg.showModal();
    }
    async function simpanAktiviti(f) {
      const d = Object.fromEntries(new FormData(f));
      if (d.tarikh_tamat && d.tarikh_tamat < d.tarikh_mula) { roti('Tarikh tamat sebelum tarikh mula.', true); return; }
      if ((d.jenis === 'unit' || d.jenis === 'luar') && !d.unit_kod && !penyelaras()) { roti('Pilih unit.', true); return; }
      const rec = await S.db.f2SimpanAktiviti({ id: f.dataset.id ? +f.dataset.id : null, tahun: +d.tarikh_mula.slice(0, 4), tajuk: d.tajuk.trim(), jenis: d.jenis,
        unit_kod: d.unit_kod || null, tarikh_mula: d.tarikh_mula, tarikh_tamat: d.tarikh_tamat || null, peringkat: d.peringkat || null, tempat: d.tempat.trim() || null, catatan: d.catatan.trim() || null,
        ...('tindakan' in d ? { tindakan: d.tindakan.trim().toUpperCase() || null } : {}) });
      const i = F().aktiviti.findIndex((x) => x.id === rec.id);
      if (rec.tahun !== F().tahun) { if (i >= 0) F().aktiviti.splice(i, 1); roti(`Disimpan dalam takwim ${rec.tahun}`); }
      else { if (i >= 0) F().aktiviti[i] = rec; else F().aktiviti.push(rec); roti('Aktiviti disimpan'); }
      $('#dlg').close(); S.kekalSkrol = true; render();
    }

    /* ============================================================ TAB UNIT */
    const TAB_UNIT = [['ahli', 'Ahli'], ['takwim', 'Takwim'], ['kehadiran', 'Kehadiran'], ['opr', 'OPR'], ['pajsk', 'PAJSK'], ['laporan', 'Laporan']];
    const navUnit = (u, tab) => `<nav class="tab tanpa-cetak">${TAB_UNIT.map(([k, l]) => `<a href="#/unit/${encodeURIComponent(u.kod)}${k === 'ahli' ? '' : '/' + k}" ${k === tab ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>`;
    function paparUnit(tab, u, q) {
      const tahun = pilihTahun(q);
      const x = sedia(tahun); if (x) return x;
      const pilihTh = `<div class="cip-set tanpa-cetak" style="margin-bottom:12px">${[tahunAsal() - 1, tahunAsal(), tahunAsal() + 1].map((t) => `<a class="cip ${t === tahun ? 'pilih' : ''}" href="#/unit/${encodeURIComponent(u.kod)}/${tab}?tahun=${t}">${t}</a>`).join('')}</div>`;
      return pilihTh + { takwim: uTakwim, kehadiran: uKehadiran, opr: uOpr, pajsk: uPajsk, laporan: uLaporan }[tab](u, q);
    }

    /* ------------------------------------------------------------ takwim unit (rancangan tahunan) */
    function uTakwim(u) {
      const ps = perjumpaanKat(u.kategori), boleh = bolehUrus(u.kod);
      const akt = F().aktiviti.filter((a) => a.unit_kod === u.kod).sort((p, q) => p.tarikh_mula.localeCompare(q.tarikh_mula));
      return `${ps.length ? `<form class="panel" id="borang-f2-rancangan" data-unit="${e(u.kod)}" style="padding:0">
          <div style="padding:14px 16px 4px"><h2 style="margin:0">Rancangan perjumpaan ${F().tahun}</h2><p class="pudar kecil" style="margin:4px 0 0">${ps.length} perjumpaan ${KAT[u.kategori]}. ${boleh ? 'Isi tajuk aktiviti setiap perjumpaan. Tajuk ini digunakan dalam OPR dan Buku Laporan.' : ''}</p></div>
          <div class="rancangan-senarai">${ps.map((p) => { const r = rancangan(p.id, u.kod) || {}; const lepas = p.tarikh < hariIniIso();
            return `<div class="rancangan-baris ${lepas ? 'lepas' : ''}"><span class="bil">${p.bil}</span><div class="bila"><b>${e(fmtT(p.tarikh))}</b><small>${HARI[tk(p.tarikh).getDay()]}${p.masa_mula ? ', ' + e(p.masa_mula) : ''}</small>${p.tema ? `<small class="tema">${e(p.tema)}</small>` : ''}</div>
              ${boleh ? `<input type="text" name="tajuk_${p.id}" value="${e(r.tajuk || '')}" placeholder="${e(p.tema ? 'Tema takwim: ' + p.tema : 'Tajuk aktiviti')}" aria-label="Tajuk perjumpaan ${p.bil}">
                <input type="text" name="tempat_${p.id}" value="${e(r.tempat || '')}" placeholder="Tempat" aria-label="Tempat">
                <select name="status_${p.id}" aria-label="Status">${Object.entries(STATUS_R).map(([k, v]) => `<option value="${k}" ${(r.status || 'dirancang') === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`
                : `<span class="teks">${e(r.tajuk || p.tema || '—')}${r.tempat ? `<small>${e(r.tempat)}</small>` : ''}</span><span class="pudar kecil">${STATUS_R[r.status || 'dirancang']}</span>`}</div>`; }).join('')}</div>
          ${boleh ? '<div class="baris-btn" style="padding:12px 16px"><button class="btn utama" type="submit">Simpan rancangan</button></div>' : ''}</form>`
        : `<div class="panel kosong-isi"><h3>Tarikh perjumpaan ${KAT[u.kategori]} ${F().tahun} belum ditetapkan</h3><p>${penyelaras() ? '<a class="btn utama" href="#/takwim/jana">Jana tarikh perjumpaan</a>' : 'Penyelaras akan menetapkan tarikh perjumpaan dalam Takwim.'}</p></div>`}
        <div class="panel" style="margin-top:14px"><h2>Aktiviti dan pertandingan ${e(u.kod)}</h2>
          ${akt.length ? `<ul class="kecil" style="margin:0;padding-left:18px">${akt.map((a) => `<li>${e(fmtJulat(a.tarikh_mula, a.tarikh_tamat))}: <b>${e(a.tajuk)}</b>${a.peringkat ? ` · ${e(a.peringkat)}` : ''}${a.tempat ? ` · ${e(a.tempat)}` : ''} ${boleh ? `<button class="pautan kecil" data-act="f2-aktiviti" data-id="${a.id}">ubah</button>` : ''}</li>`).join('')}</ul>` : '<p class="pudar kecil">Belum ada aktiviti tambahan.</p>'}
          <div class="baris-btn" style="margin-top:10px">${boleh ? `<button class="btn" data-act="f2-aktiviti" data-unit="${e(u.kod)}" data-jenis="unit">${IKON.tambah} Tambah aktiviti</button>` : ''}
            <a class="btn" href="#/takwim/cetak?doc=rancangan&unit=${encodeURIComponent(u.kod)}&tahun=${F().tahun}">${IKON.cetak} Cetak rancangan tahunan</a></div></div>`;
    }
    async function simpanRancangan(f) {
      const kod = f.dataset.unit, d = new FormData(f), rows = [];
      perjumpaanKat(S.unitPeta.get(kod).kategori).forEach((p) => {
        const r = rancangan(p.id, kod) || {}, baru = { perjumpaan_id: p.id, unit_kod: kod, tajuk: (d.get('tajuk_' + p.id) || '').trim() || null, tempat: (d.get('tempat_' + p.id) || '').trim() || null, status: d.get('status_' + p.id) || 'dirancang', catatan: r.catatan || null };
        if ((r.tajuk || null) !== baru.tajuk || (r.tempat || null) !== baru.tempat || (r.status || 'dirancang') !== baru.status) rows.push(baru);
      });
      if (!rows.length) { roti('Tiada perubahan'); return; }
      const hasil = await S.db.f2SimpanRancangan(rows);
      hasil.forEach((r) => { const i = F().rancangan.findIndex((x) => x.perjumpaan_id === r.perjumpaan_id && x.unit_kod === r.unit_kod); if (i >= 0) F().rancangan[i] = r; else F().rancangan.push(r); });
      roti(`${rows.length} perjumpaan dikemas kini`); S.kekalSkrol = true; render();
    }

    /* ------------------------------------------------------------ kehadiran */
    function perjumpaanSemasa(ps) {
      const hi = hariIniIso(), lepas = ps.filter((p) => p.tarikh <= hi);
      return lepas.length ? lepas[lepas.length - 1] : ps[0];
    }
    function uKehadiran(u, q) {
      const ps = perjumpaanKat(u.kategori);
      if (!ps.length) return `<div class="panel kosong-isi"><h3>Tiada tarikh perjumpaan ${F().tahun}</h3><p>Kehadiran direkod mengikut tarikh perjumpaan dalam Takwim.</p></div>`;
      const x = sediaKeh(u.kod); if (x) return x;
      const keh = F().kehUnit[u.kod], ahli = ahliUnit(u), boleh = bolehUrus(u.kod);
      const p = ps.find((y) => String(y.id) === q.get('p')) || perjumpaanSemasa(ps);
      const rekP = new Map(keh.filter((k) => k.perjumpaan_id === p.id).map((k) => [k.murid_id, k]));
      const direkod = new Set(keh.map((k) => k.perjumpaan_id));
      const lagi = p.tarikh > hariIniIso();
      const r = rancangan(p.id, u.kod);
      const hadirN = (mid) => keh.filter((k) => k.murid_id === mid && k.status === 'H').length;
      return `<div class="panel" style="margin-bottom:14px"><div class="cip-set">${ps.map((y) => `<a class="cip ${y.id === p.id ? 'pilih' : ''} ${direkod.has(y.id) ? 'siap' : ''}" href="#/unit/${encodeURIComponent(u.kod)}/kehadiran?p=${y.id}" title="${e(fmtT(y.tarikh))}">${y.bil}<small>${tk(y.tarikh).getDate()}/${tk(y.tarikh).getMonth() + 1}</small></a>`).join('')}</div>
          <p class="pudar kecil" style="margin:8px 0 0">Nombor bertanda hijau sudah direkod. ${direkod.size}/${ps.length} perjumpaan direkod.</p></div>
        <form class="panel" id="borang-f2-hadir" data-unit="${e(u.kod)}" data-p="${p.id}">
          <div class="dk-kep"><h2 style="margin:0">Perjumpaan ${p.bil}: ${e(fmtT(p.tarikh, true))}</h2>${(r && r.tajuk) || p.tema ? `<span class="pudar kecil">${e((r && r.tajuk) || p.tema)}</span>` : ''}</div>
          ${lagi ? '<div class="mesej amaran" style="margin:8px 0">Perjumpaan ini belum berlangsung.</div>' : ''}
          ${!rekP.size && boleh ? '<p class="kecil" style="margin:6px 0">Belum direkod. Semua ahli ditanda <b>Hadir</b>; tukar yang tidak hadir sahaja, kemudian tekan Simpan.</p>' : ''}
          ${boleh ? `<div class="baris-btn" style="margin:8px 0"><button type="button" class="btn kecil" data-act="f2-semua" data-v="H">Semua hadir</button><button type="button" class="btn kecil" data-act="f2-semua" data-v="T">Semua tidak hadir</button><span class="kecil" id="kiraan-hadir"></span></div>` : ''}
          <div class="hadir-senarai">${ahli.map((m, i) => { const st = (rekP.get(m.id) || {}).status || (boleh ? 'H' : ''); return `<div class="hadir-baris"><span class="bil">${i + 1}</span><span class="siapa"><b>${e(m.nama)}</b><small>${e(m.kelas)} · ${hadirN(m.id)} kali hadir</small></span>
            ${boleh ? `<span class="seg" role="radiogroup" aria-label="Kehadiran ${e(m.nama)}">${Object.keys(STATUS_H).map((k) => `<label class="s-${k}"><input type="radio" name="h_${e(m.id)}" value="${k}" ${st === k ? 'checked' : ''}><span>${k === 'H' ? 'Hadir' : k === 'T' ? 'Tidak' : 'Sebab'}</span></label>`).join('')}</span>`
              : `<span class="status-h s-${st}">${st ? STATUS_H[st] : '—'}</span>`}</div>`; }).join('') || '<div class="kosong-isi">Unit ini belum ada ahli.</div>'}</div>
          ${boleh && ahli.length ? `<div class="baris-btn" style="margin-top:12px"><button class="btn utama" type="submit">Simpan kehadiran perjumpaan ${p.bil}</button></div>` : ''}</form>
        <div class="panel" style="margin-top:14px"><h2>Ringkasan kehadiran ${F().tahun}</h2>
          <div class="skrol-x"><table class="jadual kecil grid-hadir"><thead><tr><th>Nama</th>${ps.map((y) => `<th class="n" title="${e(fmtT(y.tarikh))}">${y.bil}</th>`).join('')}<th class="n">Hadir</th><th class="n">Skor</th></tr></thead><tbody>
          ${ahli.map((m) => { const n = hadirN(m.id); return `<tr><td>${e(m.nama)}</td>${ps.map((y) => { const k = keh.find((z) => z.perjumpaan_id === y.id && z.murid_id === m.id); return `<td class="n s-${k ? k.status : 'x'}">${k ? (k.status === 'H' ? '✓' : k.status === 'B' ? 'B' : '✗') : ''}</td>`; }).join('')}<td class="n"><b>${n}</b></td><td class="n">${skorHadir(n)}</td></tr>`; }).join('')}
          </tbody></table></div>
          <p class="pudar kecil">✓ hadir · ✗ tidak hadir · B bersebab (tidak dikira hadir). Skor kehadiran PAJSK: 12 kali = 40.</p>
          <a class="btn" href="#/takwim/cetak?doc=kehadiran&unit=${encodeURIComponent(u.kod)}&tahun=${F().tahun}">${IKON.cetak} Cetak rekod kehadiran</a></div>`;
    }
    function kiraHadirBorang() {
      const f = $('#borang-f2-hadir'), out = $('#kiraan-hadir'); if (!f || !out) return;
      const v = $$('#borang-f2-hadir input[type=radio]:checked').map((x) => x.value);
      out.textContent = `${v.filter((x) => x === 'H').length} hadir · ${v.filter((x) => x === 'T').length} tidak · ${v.filter((x) => x === 'B').length} bersebab`;
    }
    async function simpanHadir(f) {
      const kod = f.dataset.unit, pid = +f.dataset.p, rows = [];
      $$('#borang-f2-hadir input[type=radio]:checked').forEach((x) => rows.push({ perjumpaan_id: pid, murid_id: x.name.slice(2), unit_kod: kod, status: x.value }));
      if (!rows.length) return;
      const btn = f.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
      try {
        const hasil = await S.db.f2SimpanKehadiran(rows);
        const keh = F().kehUnit[kod];
        hasil.forEach((r) => { const i = keh.findIndex((k) => k.perjumpaan_id === r.perjumpaan_id && k.murid_id === r.murid_id); if (i >= 0) keh[i] = r; else keh.push(r); });
        try { S.f2.hadir = await S.db.f2HadirRingkas(F().tahun); } catch (err) { S.f2.hadir = S.f2.hadir || []; }
        // kemas kini kiraan hadir unit ini daripada rekod tempatan (tepat walaupun luar talian)
        const kat = S.unitPeta.get(kod).kategori, kira = new Map();
        keh.forEach((k) => { const x = kira.get(k.murid_id) || { murid_id: k.murid_id, kategori: kat, hadir: 0, direkod: 0 }; x.direkod++; if (k.status === 'H') x.hadir++; kira.set(k.murid_id, x); });
        S.f2.hadir = S.f2.hadir.filter((x) => !(x.kategori === kat && kira.has(x.murid_id))).concat([...kira.values()]);
        S.f2.hadirMap = new Map(S.f2.hadir.map((x) => [x.murid_id + '|' + x.kategori, x]));
        roti(`Kehadiran disimpan: ${rows.filter((r) => r.status === 'H').length}/${rows.length} hadir`);
        S.kekalSkrol = true; render();
      } finally { if (btn) btn.disabled = false; }
    }

    /* ------------------------------------------------------------ OPR */
    function uOpr(u, q) {
      const boleh = bolehUrus(u.kod), id = q.get('id');
      if (id && boleh) { const x = sediaKeh(u.kod); return x || borangOpr(u, id === 'baru' ? null : F().opr.find((o) => o.id === id), q); }
      const l = F().opr.filter((o) => o.unit_kod === u.kod).sort((p, q2) => q2.tarikh.localeCompare(p.tarikh));
      const tanpaOpr = perjumpaanKat(u.kategori).filter((p) => p.tarikh <= hariIniIso() && !l.some((o) => o.perjumpaan_id === p.id));
      return `<div class="panel" style="margin-bottom:14px"><p class="kecil" style="margin:0">OPR (One Page Report) ialah laporan satu muka surat bagi setiap perjumpaan atau aktiviti, dengan sehingga 4 gambar. Tarikh, tajuk dan bilangan hadir diisi automatik daripada takwim dan kehadiran.</p>
          <div class="baris-btn" style="margin-top:10px">${boleh ? `<a class="btn utama" href="#/unit/${encodeURIComponent(u.kod)}/opr?id=baru">${IKON.tambah} OPR baharu</a>` : ''}${l.length ? `<a class="btn" href="#/takwim/cetak?doc=opr&unit=${encodeURIComponent(u.kod)}&tahun=${F().tahun}">${IKON.cetak} Cetak semua OPR (${l.length})</a>` : ''}</div>
          ${boleh && tanpaOpr.length ? `<p class="pudar kecil" style="margin:10px 0 0">Perjumpaan yang sudah berlangsung tanpa OPR: ${tanpaOpr.map((p) => `<a href="#/unit/${encodeURIComponent(u.kod)}/opr?id=baru&p=${p.id}">${p.bil}</a>`).join(', ')}</p>` : ''}</div>
        ${l.length ? `<div class="grid-opr">${l.map((o) => `<div class="panel kad-opr"><div class="kecil pudar">${e(fmtT(o.tarikh, true))}${o.perjumpaan_id ? ` · Perjumpaan ${(F().perjumpaan.find((p) => p.id === o.perjumpaan_id) || {}).bil || ''}` : ''}</div>
            <h3>${e(o.tajuk)}</h3><div class="kecil pudar">${(o.gambar || []).length} gambar${o.bil_hadir != null ? ` · ${o.bil_hadir} hadir` : ''}</div>
            <div class="baris-btn" style="margin-top:10px"><a class="btn kecil" href="#/takwim/cetak?doc=opr&id=${o.id}&tahun=${F().tahun}">${IKON.cetak} Lihat / cetak</a>${boleh ? `<a class="btn kecil" href="#/unit/${encodeURIComponent(u.kod)}/opr?id=${o.id}">Ubah</a>` : ''}</div></div>`).join('')}</div>`
          : '<div class="panel kosong-isi"><h3>Belum ada OPR</h3></div>'}`;
    }
    function borangOpr(u, o, q) {
      const ps = perjumpaanKat(u.kategori);
      const pid = o ? o.perjumpaan_id : (+q.get('p') || null);
      const p = ps.find((x) => x.id === pid);
      const r = p ? rancangan(p.id, u.kod) || {} : {};
      const hadirP = p ? F().kehUnit[u.kod].filter((k) => k.perjumpaan_id === p.id && k.status === 'H').length : null;
      const v = o || { tarikh: p ? p.tarikh : hariIniIso(), masa: p ? p.masa_mula || '' : '', tajuk: r.tajuk || (p && p.tema) || '', tempat: r.tempat || u.bilik_operasi || '', sasaran: `Ahli ${u.nama_penuh}`,
        bil_hadir: hadirP || null, disediakan: S.profil.nama || '', gambar: [] };
      const gambar = v.gambar || [];
      const ta = (n, l, ph, baris) => `<label class="medan">${l}<textarea name="${n}" rows="${baris || 3}" placeholder="${e(ph || '')}">${e(v[n] || '')}</textarea></label>`;
      if (gambar.length) pastikanUrl(gambar.map((g) => g.path));
      return `<p style="margin:0 0 12px"><a href="#/unit/${encodeURIComponent(u.kod)}/opr">← Senarai OPR</a></p>
        <form class="panel borang" id="borang-f2-opr" data-unit="${e(u.kod)}" data-id="${o ? o.id : ''}">
          <h2 style="margin:0">${o ? 'Ubah' : 'OPR baharu'} · ${e(u.kod)}</h2>
          <label class="medan">Perjumpaan<select name="perjumpaan_id"><option value="">Aktiviti lain (bukan perjumpaan)</option>${ps.map((x) => `<option value="${x.id}" ${x.id === pid ? 'selected' : ''}>Perjumpaan ${x.bil} · ${e(fmtT(x.tarikh))}${(rancangan(x.id, u.kod) || {}).tajuk ? ' · ' + e(rancangan(x.id, u.kod).tajuk) : ''}</option>`).join('')}</select>
            <span class="bantu">Pilih perjumpaan untuk mengisi tarikh, tajuk dan bilangan hadir secara automatik.</span></label>

      const s = Math.min(1, maks / Math.max(img.naturalWidth, img.naturalHeight));

    }
    async function simpanLaporan(f) {
      const kod = f.dataset.unit, d = Object.fromEntries(new FormData(f));
      Object.keys(d).forEach((k) => { d[k] = String(d[k]).trim(); });

      const i = F().laporan.findIndex((x) => x.unit_kod === kod); if (i >= 0) F().laporan[i] = rec; else F().laporan.push(rec);
      roti('Laporan disimpan'); S.kekalSkrol = true; render();

    /* ============================================================ PAJSK sekolah */
    function pPajsk(tab, q) {
      const tahun = pilihTahun(q);
      const tabs = [['ringkasan', 'Ringkasan unit'], ['rumusan', 'Rumusan murid'], ['pencapaian', 'Pencapaian & tambahan'], ['ekstra', 'Ekstra kurikulum'], ['murid', 'Profil murid']];
      if (!tabs.some((t) => t[0] === tab)) tab = 'ringkasan';
      const kepala = `<div class="kepala tanpa-cetak"><div><h1>PAJSK ${tahun}</h1><p>Markah kokurikulum (Pentaksiran Aktiviti Jasmani, Sukan dan Kokurikulum) daripada data aplikasi.</p></div>
        <div class="baris-btn">${[tahunAsal() - 1, tahunAsal(), tahunAsal() + 1].map((t) => `<a class="cip ${t === tahun ? 'pilih' : ''}" href="#/pajsk/${tab}?tahun=${t}">${t}</a>`).join('')}</div></div>
        <nav class="tab tanpa-cetak">${tabs.map(([k, l]) => `<a href="#/pajsk/${k}?tahun=${tahun}" ${k === tab ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>`;
      const x = sedia(tahun); if (x) return kepala + x;
      return kepala + { ringkasan: pjRingkasan, rumusan: pjRumusan, ekstra: pjEkstra, pencapaian: pjPencapaian, murid: pjMurid }[tab](q);
    }
    function pjRingkasan() {
      return BIDANG.map((kat) => `<section class="kategori ${kat}"><div class="kategori-kepala"><h2>${KAT[kat]}</h2></div>
        <div class="panel skrol-x" style="padding:0"><table class="jadual"><thead><tr><th>Unit</th><th class="n">Ahli</th><th class="n">Diisi</th><th class="n">Hadir direkod</th><th class="n">Purata</th><th></th></tr></thead><tbody>
        ${unitKat(kat).map((u) => { const ahli = ahliUnit(u), diisi = ahli.filter((m) => rekPajsk(m.id, kat)).length, hd = ahli.filter((m) => F().hadirMap.get(m.id + '|' + kat)).length;
          const pur = ahli.length ? r2(ahli.reduce((s, m) => s + kiraBidang(m, kat).markah, 0) / ahli.length) : 0;
          return `<tr><td><b>${e(u.kod)}</b><br><span class="pudar kecil">${e(u.nama_penuh)}</span></td><td class="n">${ahli.length}</td><td class="n ${diisi === ahli.length && ahli.length ? 'ok' : ''}">${diisi}</td><td class="n">${hd}</td><td class="n">${pur}</td><td><a class="btn kecil" href="#/unit/${encodeURIComponent(u.kod)}/pajsk">Buka</a></td></tr>`; }).join('')}
        </tbody></table></div></section>`).join('');
    }
    function pjRumusan(q) {
      const kelasL = Array.from(new Set(aktif().map((m) => m.kelas))).sort((a, b) => a.localeCompare(b, 'ms', { numeric: true }));
      const kelas = q.get('kelas') || '';
      const murid = kelas ? aktif().filter((m) => m.kelas === kelas).sort(susunMurid) : [];
      const baris = murid.map((m) => ({ m, k: kiraMurid(m) }));
      const gredK = {}; baris.forEach(({ k }) => { if (k.gred) gredK[k.gred] = (gredK[k.gred] || 0) + 1; });
      return `<div class="panel" style="margin-bottom:14px"><form class="penapis" id="f2-pj-kelas" style="grid-template-columns:1fr"><select name="kelas" aria-label="Kelas"><option value="">Pilih kelas</option>${kelasL.map((k) => `<option ${k === kelas ? 'selected' : ''}>${e(k)}</option>`).join('')}</select></form>
          <div class="baris-btn" style="margin-top:10px"><button class="btn" data-act="f2-excel-kelas" data-kelas="${e(kelas)}" ${kelas ? '' : 'disabled'}>${IKON.muat} Excel kelas ini untuk Robot PAJSK</button>
            ${penyelaras() ? `<button class="btn" data-act="f2-excel-semua">${IKON.muat} Excel semua murid</button>` : ''}
            ${kelas ? `<a class="btn" href="#/takwim/cetak?doc=pajskkelas&kelas=${encodeURIComponent(kelas)}&tahun=${F().tahun}">${IKON.cetak} Cetak</a>` : ''}</div>
          <p class="pudar kecil" style="margin:8px 0 0">GPA = purata 2 markah terbaik (KP, UB, SP) + Ekstra (maksimum 10), had 100. Gred: A 80+, B 60+, C 40+, D 20+, E.</p></div>
        ${kelas ? `<div class="panel skrol-x" style="padding:0"><table class="jadual"><thead><tr><th>Nama</th><th class="n">KP</th><th class="n">UB</th><th class="n">SP</th><th class="n">Ekstra</th><th class="n">GPA</th><th class="n">Gred</th></tr></thead><tbody>
          ${baris.map(({ m, k }) => `<tr><td><a href="#/pajsk/murid?tahun=${F().tahun}&id=${e(m.id)}">${e(m.nama)}</a></td>${BIDANG.map((b) => `<td class="n">${k.b[b] ? k.b[b].markah : '—'}</td>`).join('')}<td class="n">${k.ekstra}</td><td class="n"><b>${k.gpa == null ? '—' : k.gpa}</b></td><td class="n"><b>${e(k.gred)}</b></td></tr>`).join('')}
          </tbody></table></div><p class="kecil">${Object.entries(gredK).sort().map(([g, n]) => `Gred ${g}: ${n}`).join(' · ')}</p>` : '<p class="pudar">Pilih kelas untuk melihat GPA setiap murid.</p>'}`;
    }
    function pjEkstra(q) {
      const cari = (q.get('q') || '').toUpperCase(), kelasL = Array.from(new Set(aktif().map((m) => m.kelas))).sort((a, b) => a.localeCompare(b, 'ms', { numeric: true }));
      const kelas = q.get('kelas') || '';
      const l = (cari || kelas) ? aktif().filter((m) => (!kelas || m.kelas === kelas) && (!cari || m.nama.includes(cari))).sort(susunMurid).slice(0, 200) : [];
      const ada = F().pajsk.filter((x) => x.bidang === 'EKSTRA');
      return `<div class="panel" style="margin-bottom:14px"><form class="penapis" id="f2-pj-ekstra" style="grid-template-columns:2fr 1fr"><input class="cari" type="search" name="q" value="${e(q.get('q') || '')}" placeholder="Cari nama murid" aria-label="Cari"><select name="kelas" aria-label="Kelas"><option value="">Semua kelas</option>${kelasL.map((k) => `<option ${k === kelas ? 'selected' : ''}>${e(k)}</option>`).join('')}</select></form>
          <p class="pudar kecil" style="margin:8px 0 0">Ekstra kurikulum: perkhidmatan (pengawas, ketua kelas), anugerah, khidmat masyarakat, NILAM dan TIMSS. Skor tertinggi diambil, maksimum 10. ${penyelaras() ? 'Penyelaras boleh mengisi.' : 'Hanya penyelaras boleh mengisi.'} ${ada.length} murid sudah ada rekod.</p></div>
        ${l.length ? `<div class="panel" style="padding:0"><ul class="senarai">${l.map((m) => { const d = (rekPajsk(m.id, 'EKSTRA') || {}).data; return `<li><button class="baris" data-act="f2-ekstra" data-murid="${e(m.id)}" ${penyelaras() ? '' : 'disabled'}>
            <span><span class="nama">${e(m.nama)}</span><br><span class="meta">${e(m.kelas)}${d ? ` · ${[d.perkhidmatan, d.anugerah, d.nilam && 'NILAM ' + d.nilam, d.timss && 'TIMSS', d.tl && 'TL'].filter(Boolean).map((x) => e(String(x).slice(0, 40))).join(' · ')}` : ''}</span></span>
            <span class="markah-pajsk ${d ? '' : 'belum'}"><b>${kiraEkstra(d)}</b><small>ekstra</small></span></button></li>`; }).join('')}</ul></div>` : '<p class="pudar">Cari nama atau pilih kelas.</p>'}`;
    }
    // Susunan dan istilah sama seperti SPPB / IdMe (Pentaksiran PAJSK, tab Ekstra Kurikulum)
    const ARP = 'ANUGERAH REMAJA PERDANA';
    function bukaEkstra(mid, kembali) {
      const m = S.data.murid.find((x) => x.id === mid), sk = SK(), d = (rekPajsk(mid, 'EKSTRA') || {}).data || {};
      const anugLain = sk.ANUGERAH.map(([t]) => t).filter((t) => !t.startsWith(ARP));
      const arp = (d.anugerah || '').startsWith(ARP) ? d.anugerah.split(' - ')[1] : '';
      const dlg = $('#dlg');
      dlg.innerHTML = `<div class="dk"><div><h2>${e(m.nama)}</h2><p class="pudar kecil" style="margin:2px 0 0">${e(m.kelas)} · Ekstra Kurikulum ${F().tahun}</p></div><button class="btn kosong kecil" data-act="tutup" aria-label="Tutup">${IKON.tutup}</button></div>
        <div class="db"><form class="borang borang-ekstra" id="borang-f2-ekstra" data-mid="${e(mid)}" data-kembali="${e(kembali || '')}">
          <label class="cek ditaksir"><input type="checkbox" name="ditaksir" ${d.tl ? '' : 'checked'}> <b>DITAKSIR</b> <span class="pudar kecil">(matikan jika murid tidak ditaksir PAJSK)</span></label>
          <section><h3>Perkhidmatan</h3><select name="perkhidmatan">${pilihan(sk.PERKHIDMATAN, d.perkhidmatan, 'Sila pilih perkhidmatan')}</select><p class="sama">= <b data-skor="perkhidmatan">0</b></p></section>
          <section><h3>Anugerah khas <span class="pudar kecil">(maksimum pilihan 1)</span></h3>
            <table class="jadual kecil ekstra-anug"><thead><tr><th>Perkara</th><th class="n">Penerima</th></tr></thead><tbody>
              <tr><td>${ARP}<div class="arp">${['EMAS', 'PERAK', 'GANGSA'].map((g) => `<label><input type="radio" name="anugerah" value="${ARP} - ${g}" ${arp === g ? 'checked' : ''}> ${g}</label>`).join('')}</div></td><td></td></tr>
              ${anugLain.map((t) => `<tr><td>${e(t)}</td><td class="n"><input type="radio" name="anugerah" value="${e(t)}" ${d.anugerah === t ? 'checked' : ''} aria-label="${e(t)}"></td></tr>`).join('')}
            </tbody></table>
            <button type="button" class="pautan kecil" data-act="f2-ekstra-kosong" data-nama="anugerah">Kosongkan pilihan anugerah</button><p class="sama">= <b data-skor="anugerah">0</b></p></section>
          <section><h3>Khidmat masyarakat <span class="pudar kecil">(tanda mengikut bilangan aktiviti, maksimum 5)</span></h3>
            <div class="ekstra-km">${sk.KHIDMAT_MASY.map((j, i) => { const n = +((d.km || {})[j] || 0); return `<div class="km-baris"><span>AKTIVITI ${e(j)}</span><span class="km-kotak">${[1, 2, 3, 4, 5].map((k) => `<button type="button" class="${k <= n ? 'aktif' : ''}" data-act="f2-km" data-i="${i}" data-n="${k}" aria-label="${e(j)}: ${k} aktiviti">${k}</button>`).join('')}</span><input type="hidden" name="km_${i}" value="${n || ''}"></div>`; }).join('')}</div>
            <p class="sama">= <b data-skor="km">0</b></p></section>
          <section><h3>Program NILAM <span class="pudar kecil">(maksimum pilihan 1)</span></h3>
            <div class="ekstra-nilam">${sk.NILAM.map(([t]) => `<label><input type="radio" name="nilam" value="${e(t)}" ${d.nilam === t ? 'checked' : ''}> ${e(t)}</label>`).join('')}<label><input type="radio" name="nilam" value="" ${d.nilam ? '' : 'checked'}> Tiada</label></div>
            <p class="sama">= <b data-skor="nilam">0</b></p></section>
          <section><h3>TIMSS dan PISA</h3><select name="timss">${pilihan(sk.TIMSS, d.timss, 'Sila pilih TIMSS / PISA')}</select><p class="sama">= <b data-skor="timss">0</b></p></section>
          <p class="ekstra-jumlah">Skor Aktiviti Ekstra Kurikulum = <b data-skor="jumlah">0</b> <span class="pudar kecil">(skor tertinggi, maksimum 10)</span></p>
        </form></div>
        <div class="dt"><button class="btn" data-act="tutup">Tutup</button><button class="btn utama" type="submit" form="borang-f2-ekstra">Simpan</button></div>`;
      dlg.dataset.id = ''; dlg.dataset.ubah = '';
      if (!dlg.open) dlg.showModal();
      kiraEkstraBorang();
    }
    function dataEkstraBorang(f) {
      const d = new FormData(f), sk = SK(), km = {};
      sk.KHIDMAT_MASY.forEach((j, i) => { const v = +d.get('km_' + i); if (v > 0) km[j] = Math.min(5, v); });
      return { perkhidmatan: d.get('perkhidmatan') || '', anugerah: d.get('anugerah') || '', km, nilam: d.get('nilam') || '', timss: d.get('timss') || '', tl: !d.get('ditaksir') };
    }
    function kiraEkstraBorang() {
      const f = $('#borang-f2-ekstra'); if (!f) return;
      const x = dataEkstraBorang(f), sk = SK();
      const n = { perkhidmatan: x.perkhidmatan ? skor(sk.PERKHIDMATAN, x.perkhidmatan) : 0, anugerah: x.anugerah ? skor(sk.ANUGERAH, x.anugerah) : 0,
        km: kiraEkstra({ km: x.km }), nilam: x.nilam ? skor(sk.NILAM, x.nilam) : 0, timss: x.timss ? skor(sk.TIMSS, x.timss) : 0, jumlah: x.tl ? 'TL' : kiraEkstra(x) };
      Object.entries(n).forEach(([k, v]) => { const el = f.querySelector(`[data-skor="${k}"]`); if (el) el.textContent = v; });
      f.classList.toggle('tidak-ditaksir', x.tl);
    }
    async function simpanEkstra(f) {
      const data = dataEkstraBorang(f);
      const [rec] = await S.db.f2SimpanPajsk([{ murid_id: f.dataset.mid, tahun: F().tahun, bidang: 'EKSTRA', unit_kod: null, data, markah: kiraEkstra(data) }]);
      const i = F().pajsk.findIndex((y) => y.murid_id === rec.murid_id && y.bidang === 'EKSTRA'); if (i >= 0) F().pajsk[i] = rec; else F().pajsk.push(rec);
