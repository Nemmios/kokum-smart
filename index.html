<script>
/* KOKUM SMART · Kepala surat rasmi sekolah dan Surat Lantikan Guru Penasihat
   window.KokumSurat: kepala dan kaki surat (Jata Negara, nama Jawi, logo sekolah) untuk semua surat dalam aplikasi.
   window.KokumLantikan: senarai lantikan guru (UB, KP, SP, rumah sukan) dan cetakan surat lantikan + lampiran tanggungjawab. */
(function () {
  'use strict';

  const BULAN = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const PEGAWAI_ASAS = { nama_rasmi: 'SEKOLAH MENENGAH KEBANGSAAN ULU SUGUT', alamat: 'PETI SURAT 234,\n89308 RANAU, SABAH.', telefon: '', emel: '', slogan: 'TEKAD BERAPI',
    pengetua: '', pk_kokum: '', su_kokum: '', su_data: '' };
  const pegawai = (t) => ({ ...PEGAWAI_ASAS, ...((t && t.pegawai) || {}) });

  window.KokumSurat = {
    pegawai,
    kepala(t, logo) {
      const P = pegawai(t), A = window.KOKUM_SURAT_ASET || {};
      return `<div class="ks-kepala">${A.jata ? `<img class="ks-jata" src="${A.jata}" alt="Jata Negara">` : '<span></span>'}
        <div class="ks-tengah">${A.jawi ? `<img class="ks-jawi" src="${A.jawi}" alt="">` : ''}<b>${esc(P.nama_rasmi)}</b>${String(P.alamat || '').split('\n').map((x) => `<span>${esc(x)}</span>`).join('')}</div>
        <img class="ks-logo" src="${logo}" alt="Lencana sekolah"></div><hr class="ks-garis">`;
    },
    kaki(t) {
      const P = pegawai(t);
      return `<div class="ks-kaki"><span>(Sila catatkan rujukan apabila berurusan dengan kami)</span>${P.slogan ? `<b>"${esc(P.slogan)}"</b>` : ''}
        ${P.telefon ? `<span>(Tel. No. : ${esc(P.telefon)})</span>` : ''}${P.emel ? `<span>e-Mail : ${esc(P.emel)}</span>` : ''}</div>`;
    },
  };

  const PERANAN_UNIT = ['KETUA GURU PENASIHAT', 'PENOLONG KETUA GURU PENASIHAT', 'GURU PENASIHAT'];
  const PERANAN_RUMAH = ['KETUA GURU RUMAH SUKAN', 'PENOLONG KETUA GURU RUMAH SUKAN', 'GURU RUMAH SUKAN'];
  const BIDANG = [['ub', 'UB'], ['kp', 'KP'], ['sp', 'SP']];
  const TANGGUNGJAWAB = [
    'Memastikan Mesyuarat Agung diadakan bagi tujuan melantik Ahli Jawatankuasa.',
    'Memastikan ada Perlembagaan dan Peraturan.',
    'Memastikan aktiviti selaras dengan objektif sekolah.',
    'Memastikan Jawatankuasa menjalankan tugas seperti terkandung dalam Perlembagaan.',
    'Merancang aktiviti tahunan dengan kerjasama murid.',
    'Memastikan aktiviti berjalan mengikut jadual yang ditetapkan.',
    'Merancang strategi untuk peningkatan kecemerlangan Pasukan Pakaian Seragam, Kelab/Persatuan dan Kelab Sukan/Permainan.',
    'Memastikan pengurusan kewangan dan harta benda/peralatan diurus dengan baik.',
    'Memastikan Minit Mesyuarat dan Laporan Aktiviti disediakan dan difailkan.',
    'Mendaftarkan Pasukan Pakaian Seragam, Kelab/Persatuan dan Kelab Sukan/Permainan kepada Pengetua/Guru Besar atau Badan Induk.',
    'Bertanggungjawab memberi bimbingan dan tunjuk ajar serta galakan kepada ahli-ahli.',
    'Mengurus penyertaan ahli-ahli dalam kegiatan di peringkat sekolah/zon/daerah/negeri dan kebangsaan dengan baik.',
    'Mengiringi ahli dalam lawatan atau projek yang dijalankan.',
    'Bertanggungjawab mencatat penglibatan dan pencapaian ahli.',
    'Menandatangani Buku Kehadiran Ahli.',
    'Menghadiri perjumpaan atau mesyuarat yang berkaitan dengan unit yang diwakili.',
    'Menentukan Papan Kenyataan digunakan dengan sepenuhnya.',
    'Memastikan tidak ada unsur subversif tersebar dalam kalangan ahli.',
    'Mencadangkan nama ahli yang layak menerima Sijil Penghargaan kepada Jawatankuasa Kokurikulum Sekolah.',
    'Bekerjasama dengan pihak sekolah dalam menjayakan sesuatu program.',
    'Menjalankan tugas-tugas lain yang diarahkan oleh Pengetua/Guru Besar dari semasa ke semasa.',
  ];
  const AKRONIM = /^(STEM|ICT|KRS|TKRS|PBSM|PPIM|KBPM|KPAM|SPBT|PPKI|1M1S|TVET|RBT|UB|KP|SP|II|III)$/;
  const tajukKata = (s) => String(s || '').toLowerCase().replace(/(^|[\s(/-])([a-zÀ-ɏ])/g, (m, a, b) => a + b.toUpperCase())
    .split(' ').map((w) => (AKRONIM.test(w.toUpperCase()) ? w.toUpperCase() : w)).join(' ');
  const norm = (s) => String(s || '').toUpperCase().replace(/\b(BIN|BINTI|BT|BTE|B|A\/L|A\/P)\b\.?/g, ' ').replace(/[^A-Z@ ]/g, ' ').replace(/\s+/g, ' ').trim();
  const gelaranAuto = (nama) => (/\b(BINTI|BTE|BT)\b/i.test(nama) ? 'Puan' : /\b(BIN|B\.)\b/i.test(nama) ? 'Tuan' : 'Tuan/Puan');
  const tarikhPanjang = (s) => { if (!s) return '……………'; const d = new Date(s + 'T00:00:00'); return `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; };

  window.KokumLantikan = function (ctx) {
    const { S, e, $, IKON, roti, sahkan, render, penyelaras, eksport, tetapLokasi, hariIni, LOGO, BINGKAI, unitKat } = ctx;
    const T = () => S.data.tetapan || {};
    const P = () => pegawai(T());
    const tahunAsal = () => +T().tahun || new Date().getFullYear();
    const tetapanSurat = () => ({ rujukan: 'SMKUSR/800-1/11', tarikh: '', mula: '', tamat: '', lampiran: true, ...(P().lantikan || {}) });
    const L = () => S.lg;
    const renderLatar = () => { const d = $('#dlg'); if (d && d.open) return; S.kekalSkrol = true; render(); };
    let memuat = null;
    function muat(tahun, paksa) {
      if (!paksa && S.lg && S.lg.tahun === tahun) return Promise.resolve();
      if (memuat && memuat.tahun === tahun) return memuat.p;
      const p = S.db.lgMuat(tahun).then((baris) => { S.lg = { tahun, baris, ralat: null }; }, (err) => { S.lg = { tahun, baris: [], ralat: err.message || String(err) }; }).finally(() => { memuat = null; });
      memuat = { tahun, p };
      return p;
    }
    const namaUnit = (kod) => { const u = S.unitPeta.get(kod); return u ? u.nama_penuh : kod || ''; };
    const gelaran = (r) => r.gelaran || gelaranAuto(r.nama);
    function barisLantikan(r) {
      const l = BIDANG.filter(([k]) => r[k]).map(([k, K]) => `${tajukKata(r[k + '_peranan'] || 'GURU PENASIHAT')} ${tajukKata(namaUnit(r[k]))} ( ${K} )`);
      if (r.rumah) l.push(`${tajukKata(r.rumah_peranan || 'GURU RUMAH SUKAN')} ${tajukKata(r.rumah)}`);
      String(r.lain || '').split('\n').map((x) => x.trim()).filter(Boolean).forEach((x) => l.push(x));
      return l;
    }

    /* ============================================================ halaman */
    function papar(a1, q) {
      const tahun = +(q.get('tahun')) || S.lgTahun || tahunAsal(); S.lgTahun = tahun;
      if (!L() || L().tahun !== tahun) { muat(tahun).then(renderLatar); return '<p class="pudar">Memuatkan senarai lantikan…</p>'; }
      if (L().ralat) return `<div class="mesej ralat">${e(L().ralat)}. Pastikan fail <b>lantikan.sql</b> sudah dijalankan di Supabase.</div><button class="btn" data-act="lg-muat">${IKON.segar} Cuba lagi</button>`;
      if (a1 === 'cetak') return pCetak(q);
      return pSenarai(tahun);
    }
    function pSenarai(tahun) {
      const l = L().baris, ts = tetapanSurat(), boleh = penyelaras();
      const chip = (t) => `<a class="cip ${t === tahun ? 'pilih' : ''}" href="#/lantikan?tahun=${t}">${t}</a>`;
      const sel = (r, k) => (r[k] ? `<b>${e(r[k])}</b><br><span class="pudar kecil">${e(tajukKata(r[k + '_peranan'] || (k === 'rumah' ? 'GURU RUMAH SUKAN' : 'GURU PENASIHAT')))}</span>` : '<span class="pudar">—</span>');
      return `<p class="tanpa-cetak" style="margin-bottom:12px"><a href="#/unit">← Unit kokurikulum</a></p>
        <div class="kepala"><div><h1>Surat lantikan guru penasihat ${tahun}</h1><p>Satu surat bagi setiap guru, dengan kepala surat sekolah dan lampiran tanggungjawab. Ditandatangani oleh Pengetua${P().pengetua ? `, ${e(P().pengetua)}` : ''}.</p></div></div>
        <div class="cip-set" style="margin-bottom:12px">${[tahunAsal() - 1, tahunAsal(), tahunAsal() + 1].map(chip).join('')}</div>
        ${boleh ? `<form class="panel borang" id="borang-lg-tetapan" style="margin-bottom:14px"><h2 style="margin:0">Butiran surat</h2>
          <div class="dua"><label class="medan">Rujukan kami<input type="text" name="rujukan" value="${e(ts.rujukan)}"></label><label class="medan">Tarikh surat<input type="date" name="tarikh" value="${e(ts.tarikh)}"></label></div>
          <div class="dua"><label class="medan">Berkuat kuasa mulai<input type="date" name="mula" value="${e(ts.mula)}"></label><label class="medan">Hingga<input type="date" name="tamat" value="${e(ts.tamat)}"></label></div>
          <label class="cek"><input type="checkbox" name="lampiran" ${ts.lampiran ? 'checked' : ''}> Sertakan lampiran Tanggungjawab Guru Pemimpin/Penasihat</label>
          <div class="baris-btn"><button class="btn" type="submit">Simpan butiran</button><span class="pudar kecil">Nama Pengetua, alamat dan telefon sekolah ditetapkan dalam Tetapan, Sekolah.</span></div></form>` : ''}
        <div class="panel" style="margin-bottom:14px"><div class="baris-btn">
          ${boleh ? `<button class="btn ${l.length ? '' : 'utama'}" data-act="lg-jana">Isi daripada senarai unit</button><button class="btn" data-act="lg-ubah">${IKON.tambah} Tambah guru</button>` : ''}
          ${l.length ? `<a class="btn utama" href="#/lantikan/cetak?doc=surat&tahun=${tahun}">${IKON.cetak} Cetak semua surat (${l.length})</a><a class="btn" href="#/lantikan/cetak?doc=senarai&tahun=${tahun}">${IKON.cetak} Senarai lantikan</a><button class="btn" data-act="lg-excel">${IKON.muat} Excel</button>` : ''}</div>
          ${boleh ? '<p class="pudar kecil" style="margin:8px 0 0">"Isi daripada senarai unit" mengambil Ketua Guru Penasihat setiap unit (Tetapan, Unit), guru yang ditugaskan kepada unit dalam akaun aplikasi, dan rumah sukan guru. Maklumat yang sudah diisi tidak ditimpa.</p>' : ''}</div>
        ${l.length ? `<div class="panel" style="padding:0"><div class="skrol-x"><table class="jadual"><thead><tr><th>Bil</th><th>Nama guru</th><th>UB</th><th>KP</th><th>SP</th><th>Rumah sukan</th><th></th></tr></thead><tbody>
          ${l.map((r, i) => `<tr><td>${i + 1}</td><td><b>${e(r.nama)}</b>${r.lain ? `<br><span class="pudar kecil">+ ${String(r.lain).split('\n').filter((x) => x.trim()).length} jawatan lain</span>` : ''}</td><td>${sel(r, 'ub')}</td><td>${sel(r, 'kp')}</td><td>${sel(r, 'sp')}</td><td>${sel(r, 'rumah')}</td>
            <td style="white-space:nowrap"><a class="btn kecil" href="#/lantikan/cetak?doc=surat&id=${r.id}&tahun=${tahun}">Surat</a>${boleh ? ` <button class="btn kosong kecil" data-act="lg-ubah" data-id="${r.id}">Ubah</button>` : ''}</td></tr>`).join('')}</tbody></table></div></div>`
          : `<div class="panel kosong-isi"><h3>Belum ada senarai lantikan ${tahun}</h3><p>${boleh ? 'Tekan "Isi daripada senarai unit" untuk memulakan, kemudian semak dan lengkapkan setiap guru.' : 'Penyelaras belum menyediakan senarai lantikan.'}</p></div>`}`;
    }

    function bukaUbah(id) {
      const r = id ? L().baris.find((x) => x.id === +id) : { nama: '' };
      const rumah = T().senarai_rumah || [], dlg = $('#dlg');
      const pilihUnit = (k, K) => `<option value="">—</option>${unitKat(K).map((u) => `<option value="${e(u.kod)}" ${r[k] === u.kod ? 'selected' : ''}>${e(u.kod)} · ${e(u.nama_penuh)}</option>`).join('')}`;
      const pilihPeranan = (senarai, v) => senarai.map((x) => `<option ${(v || senarai[senarai.length - 1]) === x ? 'selected' : ''}>${x}</option>`).join('');
      dlg.innerHTML = `<div class="dk"><div><h2>${id ? 'Ubah lantikan' : 'Tambah guru'}</h2></div><button class="btn kosong kecil" data-act="tutup" aria-label="Tutup">${IKON.tutup}</button></div>
        <div class="db"><form class="borang" id="borang-lg" data-id="${id || ''}">
          <div class="dua"><label class="medan">Nama guru<input type="text" name="nama" value="${e(r.nama || '')}" required placeholder="Nama penuh seperti dalam surat"></label>
            <label class="medan">Panggilan dalam surat<select name="gelaran"><option value="">Automatik ikut nama</option>${['Tuan', 'Puan', 'Tuan/Puan'].map((x) => `<option ${r.gelaran === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label></div>
          ${BIDANG.map(([k, K]) => `<div class="dua"><label class="medan">${K}<select name="${k}">${pilihUnit(k, K)}</select></label><label class="medan">Peranan ${K}<select name="${k}_peranan">${pilihPeranan(PERANAN_UNIT, r[k + '_peranan'])}</select></label></div>`).join('')}
          <div class="dua"><label class="medan">Rumah sukan<input type="text" name="rumah" value="${e(r.rumah || '')}" list="lg-rumah" placeholder="Contoh: LEO"></label><label class="medan">Peranan rumah sukan<select name="rumah_peranan">${pilihPeranan(PERANAN_RUMAH, r.rumah_peranan)}</select></label></div>
          <datalist id="lg-rumah">${rumah.map((x) => `<option value="${e(x)}">`).join('')}</datalist>
          <label class="medan">Jawatan lain<textarea name="lain" rows="2" placeholder="Satu jawatan setiap baris, contoh: Setiausaha Sukan Sekolah">${e(r.lain || '')}</textarea><span class="bantu">Dicetak dalam surat di bawah jawatan unit.</span></label>
        </form></div>
        <div class="dt">${id ? `<button class="btn bahaya" data-act="lg-padam" data-id="${id}">Padam</button>` : ''}<button class="btn" data-act="tutup">Batal</button><button class="btn utama" type="submit" form="borang-lg">Simpan</button></div>`;
      dlg.dataset.id = ''; dlg.dataset.ubah = '';
      if (!dlg.open) dlg.showModal();
    }
    async function simpanUbah(f) {
      const d = new FormData(f), g = (x) => String(d.get(x) || '').trim();
      const r = { tahun: L().tahun, nama: g('nama').toUpperCase().replace(/\s+/g, ' '), gelaran: g('gelaran') || null, rumah: g('rumah').toUpperCase() || null, lain: g('lain') || null };
      if (!r.nama) return;
      BIDANG.forEach(([k]) => { r[k] = g(k) || null; r[k + '_peranan'] = r[k] ? g(k + '_peranan') : null; });
      r.rumah_peranan = r.rumah ? g('rumah_peranan') : null;
      const id = f.dataset.id ? +f.dataset.id : null;
      if (!id && L().baris.some((x) => norm(x.nama) === norm(r.nama))) { roti('Guru ini sudah ada dalam senarai.', true); return; }
      const rec = id ? await S.db.lgKemas({ ...r, id }) : (await S.db.lgSimpan([r]))[0];
      const i = L().baris.findIndex((x) => x.id === rec.id); if (i >= 0) L().baris[i] = rec; else L().baris.push(rec);
      L().baris.sort((a, b) => a.nama.localeCompare(b.nama));
      $('#dlg').close(); roti('Lantikan disimpan'); S.kekalSkrol = true; render();
    }
    async function simpanTetapanSurat(f) {
      const d = new FormData(f), g = (x) => String(d.get(x) || '').trim();
      const peg = { ...P(), lantikan: { rujukan: g('rujukan'), tarikh: g('tarikh'), mula: g('mula'), tamat: g('tamat'), lampiran: !!d.get('lampiran') } };
      if (!('pegawai' in T()) && !S.demo) { roti('Jalankan lantikan.sql di Supabase dahulu.', true); return; }
      S.data.tetapan = await S.db.simpanTetapan({ ...T(), pegawai: peg });
      roti('Butiran surat disimpan'); S.kekalSkrol = true; render();
    }
    async function jana() {
      const peta = new Map(L().baris.map((r) => [norm(r.nama), { ...r }])), ubah = new Set();
      const ambil = (nama) => { const n = norm(nama); if (!n) return null; if (!peta.has(n)) peta.set(n, { tahun: L().tahun, nama: String(nama).toUpperCase().replace(/\s+/g, ' ').trim(), baru: true }); return peta.get(n); };
      const isi = (r, k, nilai, peranan) => { if (!r || r[k]) return; r[k] = nilai; r[k + '_peranan'] = peranan; ubah.add(norm(r.nama)); };
      BIDANG.forEach(([k, K]) => unitKat(K).forEach((u) => {
        String(u.guru_penasihat || '').split(/\s*[/,;&]\s*|\s+DAN\s+/i).map((x) => x.trim()).filter((x) => x.length > 3).forEach((nama, i) => isi(ambil(nama), k, u.kod, i ? 'GURU PENASIHAT' : 'KETUA GURU PENASIHAT'));
      }));
      const profil = (S.data.profiles || []).filter((p) => p.aktif && p.nama);
      profil.forEach((p) => (S.data.guruUnit || []).filter((g) => g.user_id === p.id).forEach((g) => { const u = S.unitPeta.get(g.unit_kod); if (u) isi(ambil(p.nama), u.kategori.toLowerCase(), u.kod, 'GURU PENASIHAT'); }));
      profil.filter((p) => p.rumah_sukan).forEach((p) => { const r = ambil(p.nama); if (r && !r.rumah) { r.rumah = p.rumah_sukan; r.rumah_peranan = 'GURU RUMAH SUKAN'; ubah.add(norm(r.nama)); } });
      const rows = Array.from(peta.values()).filter((r) => ubah.has(norm(r.nama)));
      if (!rows.length) { roti('Tiada maklumat baharu daripada senarai unit.'); return; }
      const baru = rows.filter((r) => r.baru).length;
      if (!(await sahkan(`Isi senarai lantikan ${L().tahun}?\n\n• ${baru} guru baharu\n• ${rows.length - baru} guru sedia ada dilengkapkan\n\nSemak nama guru selepas ini: nama dalam senarai unit dan akaun aplikasi mungkin ditulis berbeza.`, { ok: 'Isi' }))) return;
      const MEDAN = ['tahun', 'nama', 'gelaran', 'ub', 'ub_peranan', 'kp', 'kp_peranan', 'sp', 'sp_peranan', 'rumah', 'rumah_peranan', 'lain'];
      const hasil = await S.db.lgSimpan(rows.map((r) => Object.fromEntries(MEDAN.map((k) => [k, r[k] == null ? null : r[k]]))));
      hasil.forEach((r) => { const i = L().baris.findIndex((x) => x.id === r.id); if (i >= 0) L().baris[i] = r; else L().baris.push(r); });
      L().baris.sort((a, b) => a.nama.localeCompare(b.nama));
      roti(`${hasil.length} guru dikemas kini`); S.kekalSkrol = true; render();
    }

    /* ============================================================ cetak */
    function suratGuru(r, ts) {
      const t = T(), p = P(), g = gelaran(r), gk = g.toLowerCase();
      return `<section class="halaman dok surat-rasmi">${window.KokumSurat.kepala(t, LOGO)}
        <div class="sr-alamat"><div>SMK Ulu Sugut (Malinsau),<br>Peti Surat 234,<br>89308 Ranau,<br>SABAH.</div>
          <table class="ruj"><tbody><tr><td>Rujukan Tuan</td><td>:</td></tr><tr><td>Rujukan Kami</td><td>: ${e(ts.rujukan)}</td></tr><tr><td>Tarikh</td><td>: ${e(tarikhPanjang(ts.tarikh || hariIni()))}</td></tr></tbody></table></div>
        <p class="sr-penerima"><b>${e(r.nama)},<br>SMK. ULU SUGUT,<br>RANAU.</b></p>
        <p class="sr-jawatan">${barisLantikan(r).map((x) => `<b>${e(x)}</b>`).join('<br>')}</p>
        <p>${e(g)},</p>
        <p class="sr-tajuk">PERLANTIKAN SEBAGAI GURU PENASIHAT DALAM JAWATANKUASA KOKURIKULUM</p>
        <p>Berhubung perkara di atas, dimaklumkan bahawa dengan kuasa yang diberikan kepada saya oleh Seksyen 130 Akta Pendidikan 1996 seperti termaktub dalam Peraturan (4) Warta Kerajaan bertarikh 21hb. Mei 1998 P.U.(A) 196, bahawa ${e(gk)} telah dilantik sebagai Guru Penasihat seperti di atas, Sekolah Menengah Kebangsaan Ulu Sugut berkuat kuasa mulai ${e(tarikhPanjang(ts.mula))} hingga ${e(tarikhPanjang(ts.tamat))}.</p>
        ${ts.lampiran ? `<p><span class="sr-no">2.</span>Bersama-sama ini disertakan senarai tanggungjawab yang perlu dilaksanakan oleh ${e(gk)}.</p>` : ''}
        <p><span class="sr-no">${ts.lampiran ? 3 : 2}.</span>Semoga dengan pelantikan ini ${e(gk)} dapat menjalankan tanggungjawab untuk meninggikan prestasi perkhidmatan pendidikan.</p>
        <p>Sekian, terima kasih.</p>
        <p><b>"BERKHIDMAT UNTUK NEGARA"</b></p>
        <p>Saya yang menurut perintah,</p><div class="sr-ruang"></div>
        <p class="sr-ttd"><b>${e(p.pengetua || '……………………………………')}</b><br>Pengetua,<br>SMK Ulu Sugut (Malinsau),<br>89308 Ranau, Sabah.<br>Merangkap PENOLONG PENDAFTAR PERSATUAN SEKOLAH</p>
        <p class="sr-sk">s.k.&nbsp;&nbsp;1. Fail PBPPP<br><span>2. Jawatankuasa Pengurusan Kokurikulum Sekolah</span><br><span>3. Fail Persatuan</span></p>
        ${window.KokumSurat.kaki(t)}</section>
        ${ts.lampiran ? `<section class="halaman dok surat-rasmi lampiran-lg"><p class="sr-lampiran">Lampiran</p><p class="sr-tajuk" style="text-align:center">TANGGUNGJAWAB GURU PEMIMPIN / PENASIHAT</p>
          <p class="pudar-cetak">${e(r.nama)}</p><ol>${TANGGUNGJAWAB.map((x) => `<li>${e(x)}</li>`).join('')}</ol></section>` : ''}`;
    }
    function pCetak(q) {
      const ts = tetapanSurat(), doc = q.get('doc') || 'surat', id = q.get('id');
      const l = id ? L().baris.filter((r) => r.id === +id) : L().baris;
      let isi;
      if (doc === 'senarai') {
        isi = `<section class="halaman dok landskap">${window.KokumSurat.kepala(T(), LOGO)}<h4 class="tajuk-dok">SENARAI LANTIKAN GURU PENASIHAT KOKURIKULUM ${L().tahun}</h4>
          <table><thead><tr><th>Bil</th><th>Nama guru</th><th>Unit Beruniform</th><th>Kelab & Persatuan</th><th>Sukan & Permainan</th><th>Rumah sukan</th></tr></thead><tbody>
          ${l.map((r, i) => `<tr><td>${i + 1}</td><td>${e(r.nama)}</td>${['ub', 'kp', 'sp'].map((k) => `<td>${r[k] ? `${e(tajukKata(namaUnit(r[k])))}<br><small>${e(tajukKata(r[k + '_peranan'] || ''))}</small>` : ''}</td>`).join('')}<td>${r.rumah ? `${e(tajukKata(r.rumah))}<br><small>${e(tajukKata(r.rumah_peranan || ''))}</small>` : ''}</td></tr>`).join('')}</tbody></table>
          <div class="tandatangan ttd-2"><div>Disediakan oleh,<br><b>${e(P().su_kokum ? '(' + P().su_kokum + ')' : '')}</b><br>Setiausaha Kokurikulum</div><div>Disahkan oleh,<br><b>${e(P().pengetua ? '(' + P().pengetua + ')' : '')}</b><br>Pengetua</div></div></section>`;
      } else isi = l.map((r) => suratGuru(r, ts)).join('') || '<section class="halaman dok"><p>Tiada guru dalam senarai.</p></section>';
      const bil = (isi.match(/<section class="halaman/g) || []).length;
      const kurang = doc === 'surat' && (!ts.mula || !ts.tamat || !P().pengetua);
      return `<div class="panel tanpa-cetak" style="margin-bottom:14px"><p style="margin:0 0 10px"><a href="#/lantikan?tahun=${L().tahun}">← Kembali</a></p>
          ${kurang ? `<div class="mesej amaran" style="margin-bottom:10px">${!P().pengetua ? 'Nama Pengetua belum diisi (Tetapan, Sekolah). ' : ''}${!ts.mula || !ts.tamat ? 'Tarikh berkuat kuasa belum diisi.' : ''}</div>` : ''}
          <div class="baris-btn">${BINGKAI ? '' : `<button class="btn utama" data-act="cetak">${IKON.cetak} Cetak (${bil} halaman)</button>`}</div>
          <p class="pudar kecil" style="margin:8px 0 0">${doc === 'senarai' ? 'A4 melintang.' : 'A4. Setiap surat diikuti lampiran tanggungjawab.'} Matikan "Headers and footers" dalam tetapan cetak.</p></div>
        <div class="kertas-cetak">${isi}</div>`;
    }
    async function eksportExcel() {
      const rows = [['BIL', 'NAMA GURU', 'UB', 'PERANAN UB', 'KP', 'PERANAN KP', 'SP', 'PERANAN SP', 'RUMAH SUKAN', 'PERANAN RUMAH', 'JAWATAN LAIN']]
        .concat(L().baris.map((r, i) => [i + 1, r.nama, r.ub || '', r.ub_peranan || '', r.kp || '', r.kp_peranan || '', r.sp || '', r.sp_peranan || '', r.rumah || '', r.rumah_peranan || '', (r.lain || '').replace(/\n/g, '; ')]));
      if (await eksport(`LANTIKAN-GURU-${L().tahun}.xlsx`, [['Lantikan', [[`SENARAI LANTIKAN GURU PENASIHAT KOKURIKULUM ${L().tahun}`], [T().nama_sekolah || ''], []].concat(rows)]])) roti('Fail Excel disediakan');
    }

    /* ============================================================ peristiwa */
    async function tindakan(act, el) {
      switch (act) {
        case 'lg-muat': S.lg = null; render(); return true;
        case 'lg-jana': await jana(); return true;
        case 'lg-ubah': bukaUbah(el.dataset.id); return true;
        case 'lg-excel': await eksportExcel(); return true;
        case 'lg-padam': {
          const r = L().baris.find((x) => x.id === +el.dataset.id);
          if (!(await sahkan(`Padam ${r.nama} daripada senarai lantikan ${L().tahun}?`, { ok: 'Padam', bahaya: true }))) return true;
          await S.db.lgPadam(r.id); L().baris = L().baris.filter((x) => x.id !== r.id); $('#dlg').close(); roti('Dipadam'); S.kekalSkrol = true; render(); return true;
        }
        default: return false;
      }
    }
    async function hantar(f) {
      if (f.id === 'borang-lg') { await simpanUbah(f); return true; }
      if (f.id === 'borang-lg-tetapan') { await simpanTetapanSurat(f); return true; }
      return false;
    }
    return { papar, tindakan, hantar, _uji: { tajukKata, norm, gelaranAuto, barisLantikan } };
  };
})();

</script>
<script>
/* KOKUM SMART · Mesyuarat Kokurikulum
   Memo jemputan, kehadiran guru, minit ikut agenda (format minit sekolah), tindakan susulan yang dibawa ke mesyuarat
   berikutnya, dan Laporan Data untuk dibentangkan (keahlian, kehadiran perjumpaan, OPR, PAJSK, aktiviti, takwim). */
(function () {
  'use strict';

  const BULAN = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
  const HARI = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
  const AGENDA_ASAS = ['UCAPAN PENGERUSI', 'PENGESAHAN MINIT DAN PERKARA BERBANGKIT', 'PENGISIAN MARKAH PAJSK', 'LAPORAN AKTIVITI', 'HAL-HAL LAIN'];
  const JENIS = { makluman: 'Makluman', tindakan: 'Tindakan', keputusan: 'Keputusan' };
  const STATUS = { belum: 'Belum', dalam: 'Dalam tindakan', selesai: 'Selesai' };
  const KATS = ['UB', 'KP', 'SP'];
  const GRED = ['A', 'B', 'C', 'D', 'E'];

  window.KokumMesyuarat = function (ctx) {
    const { S, e, $, $$, IKON, roti, sahkan, render, penyelaras, aktif, tetapLokasi, hariIni, LOGO, BINGKAI, unitKat, KAT, kiraMurid, muatF2, entri, teksEntri } = ctx;
    const T = () => S.data.tetapan || {};
    const P = () => (window.KokumSurat ? window.KokumSurat.pegawai(T()) : {});
    const tahunAsal = () => +T().tahun || new Date().getFullYear();
    const M = () => S.msy;
    const renderLatar = () => { const d = $('#dlg'); if (d && d.open) return; S.kekalSkrol = true; render(); };
    let memuat = null;
    function muat(tahun, paksa) {
      if (!paksa && S.msy && S.msy.tahun === tahun) return Promise.resolve();
      if (memuat && memuat.tahun === tahun) return memuat.p;
      const p = Promise.all([S.db.msyMuat(tahun), S.db.lgMuat ? S.db.lgMuat(tahun).catch(() => []) : []])
        .then(([d, lg]) => { S.msy = { ...d, tahun, lg, ralat: null }; }, (err) => { S.msy = { tahun, mesyuarat: [], perkara: [], lg: [], ralat: err.message || String(err) }; })
        .finally(() => { memuat = null; });
      memuat = { tahun, p };
      return p;
    }

    /* ============================================================ bantuan */
    const tk = (s) => (s ? new Date(s + 'T00:00:00') : null);
    const fmtT = (s, hari) => { const d = tk(s); if (!d) return '—'; return `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}${hari ? ` (${HARI[d.getDay()]})` : ''}`; };
    const bilTeks = (m) => `${String(m.bil).padStart(2, '0')}/${m.tahun}`;
    const msyId = (id) => M().mesyuarat.find((x) => x.id === +id);
    const perkaraM = (m) => M().perkara.filter((p) => p.mesyuarat_id === m.id);
    const sebelum = (m) => M().mesyuarat.filter((x) => x.bil < m.bil).sort((a, b) => b.bil - a.bil)[0] || null;
    const selepas = (m) => M().mesyuarat.filter((x) => x.bil > m.bil).sort((a, b) => a.bil - b.bil)[0] || null;
    const adalahBerbangkit = (t) => /BERBANGKIT|PENGESAHAN MINIT/i.test(t || '');
    const norm = (s) => String(s || '').toUpperCase().replace(/\b(BIN|BINTI|BT|BTE|B)\b\.?/g, ' ').replace(/[^A-Z@ ]/g, ' ').replace(/\s+/g, ' ').trim();
    const AKRONIM = /^(PAJSK|SEGAK|MSS|MSSD|MSSS|UB|KP|SP|PK|SU|PPD|JPN|KPM|OPR|AJK|BPL|PIBG|IDME|MOEIS|STEM|ICT|KRS|PBSM|PPIM|KBPM|KPAM|SPBT|PPKI|UASA|PAT|PPT|SPM|PT3|II|III|IV)$/;
    const tajukKata = (s) => String(s || '').toLowerCase().replace(/(^|[\s(@-])([a-z])/g, (x, a, b) => a + b.toUpperCase())
      .split(' ').map((w) => (AKRONIM.test(w.replace(/[^A-Za-z0-9]/g, '').toUpperCase()) ? w.toUpperCase() : w)).join(' ');
    function senaraiGuru() {
      const out = [], ada = new Set(), tambah = (n) => { const k = norm(n); if (k && !ada.has(k)) { ada.add(k); out.push(String(n).toUpperCase().trim()); } };
      const p = P();
      [p.pengetua, p.pk_kokum, p.su_kokum, p.su_data].forEach((x) => x && tambah(x));
      (M().lg || []).forEach((r) => tambah(r.nama));
      (S.data.profiles || []).filter((x) => x.aktif && x.nama).forEach((x) => tambah(x.nama));
      return out;
    }
    const tindakanTerbuka = () => M().perkara.filter((p) => p.jenis === 'tindakan' && p.status !== 'selesai');

    /* ============================================================ halaman */
    function papar(a1, a2, q) {
      const tahun = +(q.get('tahun')) || (a1 && S.msy && S.msy.tahun) || S.msyTahun || tahunAsal(); S.msyTahun = tahun;
      if (!M() || M().tahun !== tahun) { muat(tahun).then(renderLatar); return '<p class="pudar">Memuatkan mesyuarat…</p>'; }
      if (M().ralat) return `<div class="mesej ralat">${e(M().ralat)}. Pastikan fail <b>mesyuarat.sql</b> sudah dijalankan di Supabase.</div><button class="btn" data-act="msy-muat">${IKON.segar} Cuba lagi</button>`;
      if (a1) {
        const m = msyId(a1);
        if (!m) return `<div class="mesej ralat">Mesyuarat tidak dijumpai.</div><a class="btn" href="#/mesyuarat">Kembali</a>`;
        if (a2 === 'cetak') return pCetak(m, q);
        return pMesyuarat(m, q.get('tab') || 'minit');
      }
      return pSenarai(tahun);
    }

    function pSenarai(tahun) {
      const l = M().mesyuarat, terbuka = tindakanTerbuka(), chip = (t) => `<a class="cip ${t === tahun ? 'pilih' : ''}" href="#/mesyuarat?tahun=${t}">${t}</a>`;
      return `<div class="kepala"><div><h1>Mesyuarat Kokurikulum ${tahun}</h1><p>Memo jemputan, kehadiran, minit, tindakan susulan dan laporan data untuk dibentangkan.</p></div>
          ${penyelaras() ? `<div class="baris-btn"><button class="btn utama" data-act="msy-baru">${IKON.tambah} Mesyuarat baharu</button></div>` : ''}</div>
        <div class="cip-set" style="margin-bottom:12px">${[tahunAsal() - 1, tahunAsal(), tahunAsal() + 1].map(chip).join('')}</div>
        ${l.length ? `<div class="grid-opr" style="margin-bottom:14px">${l.map((m) => { const pk = perkaraM(m), tb = pk.filter((p) => p.jenis === 'tindakan');
          return `<a class="panel kad-kem" href="#/mesyuarat/${m.id}?tahun=${tahun}"><b>Mesyuarat Kokurikulum Bil ${e(bilTeks(m))}</b>
            <span class="kecil">${e(fmtT(m.tarikh, true))}${m.masa ? ' · ' + e(m.masa) : ''}</span><span class="kecil pudar">${pk.length} perkara · ${tb.filter((p) => p.status !== 'selesai').length}/${tb.length} tindakan belum selesai</span>
            <span class="status-kem ${m.status === 'selesai' ? 'buka' : ''}">${m.status === 'selesai' ? 'Selesai' : 'Dirancang'}</span></a>`; }).join('')}</div>`
          : `<div class="panel kosong-isi"><h3>Belum ada mesyuarat ${tahun}</h3><p>${penyelaras() ? 'Tekan Mesyuarat baharu untuk menyediakan memo jemputan dan minit.' : 'Penyelaras belum merekod mesyuarat.'}</p></div>`}
        ${terbuka.length ? `<div class="panel"><h2>Tindakan belum selesai (${terbuka.length})</h2>${senaraiTindakan(terbuka)}</div>` : ''}`;
    }
    function senaraiTindakan(l) {
      return `<div class="msy-tindakan">${l.map((p) => { const m = M().mesyuarat.find((x) => x.id === p.mesyuarat_id);
        return `<div class="msy-tb"><div><span class="pudar kecil">Bil ${e(bilTeks(m))} · ${e(m.agenda[p.bahagian] || '')}</span><div>${e(p.teks)}</div>
          <span class="kecil"><b>Tindakan:</b> ${e(p.oleh || '—')}${p.tarikh_akhir ? ` · sebelum ${e(fmtT(p.tarikh_akhir))}` : ''}${p.susulan ? ` · <i>${e(p.susulan)}</i>` : ''}</span></div>
          ${penyelaras() ? `<div class="seg-status">${Object.entries(STATUS).map(([k, v]) => `<button type="button" class="btn kecil ${p.status === k ? 'utama' : ''}" data-act="mp-status" data-id="${p.id}" data-s="${k}">${v}</button>`).join('')}</div>` : `<span class="lencana-status s-${p.status}">${STATUS[p.status]}</span>`}</div>`; }).join('')}</div>`;
    }

    function pMesyuarat(m, tab) {
      const tabs = [['minit', 'Minit'], ['butiran', 'Butiran & kehadiran'], ['data', 'Laporan data']];
      const h = m.kehadiran || {};
      return `<p class="tanpa-cetak" style="margin-bottom:12px"><a href="#/mesyuarat?tahun=${m.tahun}">← Mesyuarat ${m.tahun}</a></p>
        <div class="kepala"><div><h1>Mesyuarat Kokurikulum Bil ${e(bilTeks(m))}</h1><p>${e(fmtT(m.tarikh, true))}${m.masa ? ' · ' + e(m.masa) : ''}${m.tempat ? ' · ' + e(m.tempat) : ''} · ${(h.hadir || []).length} hadir</p></div>
          <div class="baris-btn"><a class="btn" href="#/mesyuarat/${m.id}/cetak?doc=memo&tahun=${m.tahun}">${IKON.cetak} Memo jemputan</a><a class="btn" href="#/mesyuarat/${m.id}/cetak?doc=minit&tahun=${m.tahun}">${IKON.cetak} Minit</a><a class="btn" href="#/mesyuarat/${m.id}/cetak?doc=data&tahun=${m.tahun}">${IKON.cetak} Laporan data</a></div></div>
        <nav class="tab tanpa-cetak">${tabs.map(([k, l]) => `<a href="#/mesyuarat/${m.id}?tahun=${m.tahun}&tab=${k}" ${k === tab ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>
        ${{ minit: tMinit, butiran: tButiran, data: tData }[tab] ? { minit: tMinit, butiran: tButiran, data: tData }[tab](m) : tMinit(m)}`;
    }

    /* ------------------------------------------------------------ butiran & kehadiran */
    function tButiran(m) {
      const boleh = penyelaras(), me = m.memo || {}, h = m.kehadiran || {};
      if (!boleh) return `<div class="panel"><p>Agenda:</p><ol>${(m.agenda || []).map((a) => `<li>${e(a)}</li>`).join('')}</ol></div>`;
      const hadir = new Set((h.hadir || []).map(norm)), guru = senaraiGuru();
      (h.hadir || []).concat(h.tidak || []).forEach((n) => { if (!guru.some((g) => norm(g) === norm(n))) guru.push(n); });
      return `<form class="panel borang" id="borang-msy" data-id="${m.id}" style="margin-bottom:14px"><h2 style="margin:0">Butiran mesyuarat</h2>
          <div class="tiga"><label class="medan">Bil<input type="number" name="bil" value="${e(m.bil)}" min="1" max="99" required></label><label class="medan">Tarikh<input type="date" name="tarikh" value="${e(m.tarikh || '')}"></label>
            <label class="medan">Status<select name="status"><option value="dirancang" ${m.status !== 'selesai' ? 'selected' : ''}>Dirancang</option><option value="selesai" ${m.status === 'selesai' ? 'selected' : ''}>Selesai</option></select></label></div>
          <div class="tiga"><label class="medan">Masa mula<input type="text" name="masa" value="${e(m.masa || '')}" placeholder="11.30 pagi"></label><label class="medan">Masa ditangguhkan<input type="text" name="masa_tamat" value="${e(m.masa_tamat || '')}" placeholder="1.00 petang"></label>
            <label class="medan">Tempat<input type="text" name="tempat" value="${e(m.tempat || '')}"></label></div>
          <label class="medan">Agenda<textarea name="agenda" rows="6">${e((m.agenda || []).join('\n'))}</textarea><span class="bantu">Satu agenda setiap baris, ikut susunan. Agenda bertajuk "Pengesahan minit dan perkara berbangkit" memaparkan tindakan daripada mesyuarat lepas.</span></label>
          <fieldset class="bidang-set"><legend>Memo jemputan</legend>
            <div class="dua"><label class="medan">Tarikh memo<input type="date" name="memo_tarikh" value="${e(me.tarikh || '')}"></label><label class="medan">Daripada<input type="text" name="memo_daripada" value="${e(me.daripada || 'Penolong Kanan Kokurikulum')}"></label></div>
            <label class="medan">Kepada<input type="text" name="memo_kepada" value="${e(me.kepada || 'Semua Guru SMK Ulu Sugut (Malinsau), Ranau')}"></label>
            <label class="medan">Salinan kepada<input type="text" name="memo_salinan" value="${e(me.salinan || 'Pengurusan Fail Setiausaha Kokurikulum')}"></label></fieldset>
          <div class="baris-btn"><button class="btn utama" type="submit">Simpan</button><button type="button" class="btn bahaya kosong" data-act="msy-padam" data-id="${m.id}">Padam mesyuarat</button></div></form>
        <form class="panel" id="borang-msy-hadir" data-id="${m.id}"><h2 style="margin:0 0 4px">Kehadiran (${hadir.size}/${guru.length})</h2>
          <p class="pudar kecil" style="margin:0 0 10px">Senarai daripada pegawai sekolah, senarai lantikan guru ${m.tahun} dan akaun aplikasi. Tanda yang hadir; yang tidak ditanda dicatat sebagai tidak hadir.</p>
          <div class="baris-btn" style="margin-bottom:8px"><button type="button" class="btn kecil" data-act="msy-semua" data-v="1">Tanda semua</button><button type="button" class="btn kecil" data-act="msy-semua" data-v="0">Kosongkan</button></div>
          <div class="msy-hadir">${guru.map((g) => `<label class="cek"><input type="checkbox" name="hadir" value="${e(g)}" ${hadir.has(norm(g)) ? 'checked' : ''}> ${e(g)}</label>`).join('')}</div>
          <label class="medan" style="margin-top:10px">Nama lain yang hadir<textarea name="lain" rows="2" placeholder="Satu nama setiap baris"></textarea></label>
          <label class="medan">Catatan tidak hadir<input type="text" name="catatan" value="${e(h.catatan || '')}" placeholder="Contoh: Pn. X (kursus), En. Y (cuti sakit)"></label>
          <div class="baris-btn" style="margin-top:10px"><button class="btn utama" type="submit">Simpan kehadiran</button></div></form>`;
    }
    async function simpanButiran(f) {
      const d = new FormData(f), g = (x) => String(d.get(x) || '').trim(), m = msyId(f.dataset.id);
      const bil = +g('bil');
      if (M().mesyuarat.some((x) => x.id !== m.id && x.bil === bil)) { roti(`Bil ${bil} sudah digunakan.`, true); return; }
      const agenda = g('agenda').split('\n').map((x) => x.trim().toUpperCase()).filter(Boolean);
      if (agenda.length < (m.agenda || []).length && perkaraM(m).some((p) => p.bahagian >= agenda.length) && !(await sahkan('Ada perkara minit di bawah agenda yang dibuang. Perkara itu akan dipindahkan ke agenda terakhir.', { ok: 'Teruskan' }))) return;
      const rec = await S.db.msySimpan({ id: m.id, bil, tarikh: g('tarikh') || null, masa: g('masa') || null, masa_tamat: g('masa_tamat') || null, tempat: g('tempat') || null, agenda, status: g('status'),
        memo: { tarikh: g('memo_tarikh'), kepada: g('memo_kepada'), daripada: g('memo_daripada'), salinan: g('memo_salinan') } });
      for (const p of perkaraM(m).filter((x) => x.bahagian >= agenda.length)) Object.assign(p, await S.db.msySimpanPerkara({ ...p, bahagian: Math.max(0, agenda.length - 1) }));
      Object.assign(m, rec); roti('Butiran disimpan'); S.kekalSkrol = true; render();
    }
    async function simpanHadir(f) {
      const d = new FormData(f), m = msyId(f.dataset.id), guru = senaraiGuru();
      const hadir = d.getAll('hadir').concat(String(d.get('lain') || '').split('\n').map((x) => x.trim().toUpperCase()).filter(Boolean));
      const hs = new Set(hadir.map(norm));
      const semua = guru.concat((m.kehadiran.hadir || []), (m.kehadiran.tidak || []));
      const tidak = []; const t2 = new Set();
      semua.forEach((n) => { const k = norm(n); if (!hs.has(k) && !t2.has(k)) { t2.add(k); tidak.push(n); } });
      const rec = await S.db.msySimpan({ id: m.id, kehadiran: { hadir: Array.from(new Map(hadir.map((n) => [norm(n), n])).values()), tidak, catatan: String(d.get('catatan') || '').trim() } });
      Object.assign(m, rec); roti(`Kehadiran disimpan: ${rec.kehadiran.hadir.length} hadir`); S.kekalSkrol = true; render();
    }

    /* ------------------------------------------------------------ minit */
    function itemHtml(p, no, boleh) {
      return `<div class="msy-item"><span class="no">${no}</span><div class="isi-item"><div>${e(p.teks).replace(/\n/g, '<br>')}</div>
        <span class="kecil ${p.jenis === 'tindakan' ? '' : 'pudar'}">${p.jenis === 'tindakan' ? `<b>Tindakan:</b> ${e(p.oleh || '—')}${p.tarikh_akhir ? ` · sebelum ${e(fmtT(p.tarikh_akhir))}` : ''} · <span class="lencana-status s-${p.status}">${STATUS[p.status]}</span>` : JENIS[p.jenis]}</span></div>
        ${boleh ? `<button type="button" class="btn kosong kecil" data-act="mp-ubah" data-id="${p.id}">Ubah</button>` : ''}</div>`;
    }
    function tMinit(m) {
      const boleh = penyelaras(), pk = perkaraM(m), lepas = sebelum(m);
      const oleh = ['Semua guru', 'Penyelaras UB/KP/SP', 'Penyelaras UB', 'Penyelaras KP', 'Penyelaras SP', 'SU Sukan Sekolah', 'SU Kokurikulum', 'SU Data Kokurikulum', 'Penyelaras PAJSK', 'Guru penasihat unit'];
      return `${!(m.agenda || []).length ? '<div class="mesej amaran">Belum ada agenda. Isi agenda dalam tab Butiran & kehadiran.</div>' : ''}
        <datalist id="msy-oleh">${oleh.map((x) => `<option value="${x}">`).join('')}</datalist>
        ${(m.agenda || []).map((a, i) => { const l = pk.filter((p) => p.bahagian === i);
          const bangkit = adalahBerbangkit(a) && lepas ? perkaraM(lepas).filter((p) => p.jenis === 'tindakan') : [];
          return `<section class="panel msy-bahagian"><h2>${i + 1}.0 ${e(a)}</h2>
            ${adalahBerbangkit(a) ? (lepas ? `<p class="kecil pudar" style="margin:0 0 8px">Minit Mesyuarat Bil ${e(bilTeks(lepas))} (${e(fmtT(lepas.tarikh))}) dibentangkan untuk pengesahan. Tindakan daripada mesyuarat itu:</p>${bangkit.length ? senaraiTindakan(bangkit) : '<p class="pudar kecil">Tiada tindakan direkod.</p>'}` : '<p class="pudar kecil" style="margin:0">Tiada mesyuarat sebelum ini dalam tahun yang sama.</p>') : ''}
            ${l.map((p, j) => itemHtml(p, `${i + 1}.${j + 1}`, boleh)).join('')}
            ${boleh ? `<form class="msy-tambah" id="borang-mp-${i}" data-m="${m.id}" data-b="${i}"><textarea name="teks" rows="2" placeholder="Perkara ${i + 1}.${l.length + 1}" aria-label="Perkara baharu" required></textarea>
              <div class="baris-btn"><select name="jenis" aria-label="Jenis">${Object.entries(JENIS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
              <input type="text" name="oleh" list="msy-oleh" placeholder="Tindakan oleh" aria-label="Tindakan oleh"><input type="date" name="tarikh_akhir" aria-label="Tarikh akhir">
              <button class="btn utama kecil" type="submit">${IKON.tambah} Tambah</button></div></form>` : ''}</section>`; }).join('')}
        <section class="panel msy-bahagian"><h2>${(m.agenda || []).length + 1}.0 PENUTUP</h2><p style="margin:0">Mesyuarat ditangguhkan pada jam ${e(m.masa_tamat || '……………')}.${boleh && !m.masa_tamat ? ' <span class="pudar kecil">(isi masa dalam tab Butiran)</span>' : ''}</p></section>`;
    }
    async function tambahPerkara(f) {
      const d = new FormData(f), m = msyId(f.dataset.m), b = +f.dataset.b, teks = String(d.get('teks') || '').trim();
      if (!teks) return;
      const jenis = d.get('jenis'), oleh = String(d.get('oleh') || '').trim();

          const p = M().perkara.find((x) => x.id === +el.dataset.id);
          Object.assign(p, await S.db.msySimpanPerkara({ ...p, status: el.dataset.s }));
          roti(`Status: ${STATUS[p.status]}`); S.kekalSkrol = true; render(); return true;
        }
        default: return false;
      }
    }
    async function hantar(f) {
      if (f.id === 'borang-msy') { await simpanButiran(f); return true; }
      if (f.id === 'borang-msy-hadir') { await simpanHadir(f); return true; }
      if (f.id === 'borang-mp-ubah') { await simpanPerkara(f); return true; }
      if (/^borang-mp-\d+$/.test(f.id)) { await tambahPerkara(f); return true; }
      return false;
    }
    return { papar, tindakan, hantar };
  };
})();

<script>

    unit: P('<path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'),

    kem: P('<path d="M12 4L3 20h18z"/><path d="M12 4v16M9 20l3-6 3 6"/>'),
    juruhebah: P('<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>'),
    papan: P('<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 13v-3M11 13V8M15 13v-5"/>'),
    hs: P('<rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M2 19h20M9 8h6M9 11h4"/>'),
    takwim: P('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7.5 14h2M11 14h2M14.5 14h2M7.5 17.5h2M11 17.5h2"/>'),
  };

  // ------------------------------------------------------------------ bantuan
  let rotiTimer, rotiMenunggu = 0;
  function roti(teks, ralat) {
    let el = $('#roti');
    if (!el) { el = document.createElement('div'); el.id = 'roti'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.className = 'roti' + (ralat ? ' ralat' : '');
    // simpanan luar talian baru sahaja beratur: beritahu guru
    const st = S.db && S.db.luar ? S.db.luar.status() : null;
    if (!/…$/.test(teks)) {
      if (st && !ralat && st.menunggu > rotiMenunggu) teks += S.hs ? ' · disimpan dalam telefon, akan dihantar ke laptop apabila sambungan pulih' : ' · disimpan dalam peranti, akan dihantar apabila ada internet';
      rotiMenunggu = st ? st.menunggu : 0;
    }
    el.textContent = teks;
    el.hidden = false;
    clearTimeout(rotiTimer);
    rotiTimer = setTimeout(() => { el.hidden = true; }, ralat ? 6000 : 2600);
  }
  // Pengesahan dalam halaman (confirm() tidak berfungsi dalam semua paparan)
  function sahkan(teks, { ok = 'Teruskan', bahaya = false } = {}) {
    return new Promise((selesai) => {
      let d = document.getElementById('dlg-sah');
      if (!d) { d = document.createElement('dialog'); d.id = 'dlg-sah'; document.body.appendChild(d); }
      d.innerHTML = `<div class="db" style="padding-top:20px"><p style="white-space:pre-line;margin:0">${e(teks)}</p></div>
        <div class="dt"><button class="btn" value="0" id="sah-batal">Batal</button><button class="btn ${bahaya ? 'bahaya' : 'utama'}" id="sah-ok">${e(ok)}</button></div>`;
      const tamat = (v) => { d.onclose = null; if (d.open) d.close(); selesai(v); };
      d.querySelector('#sah-batal').onclick = () => tamat(false);
      d.querySelector('#sah-ok').onclick = () => tamat(true);
      d.onclose = () => selesai(false);
      d.showModal();
      d.querySelector('#sah-ok').focus();
    });
  }
  const gagal = (err) => { console.error(err); roti(err && err.message ? err.message : String(err), true); };

  const skripDimuat = {};
  function muatSkrip(url) {
    if (!skripDimuat[url]) skripDimuat[url] = new Promise((ok, tolak) => {
      const s = document.createElement('script');
      s.src = url; s.onload = ok;
      s.onerror = () => { delete skripDimuat[url]; tolak(new Error('Tidak dapat memuat turun komponen. Semak sambungan internet.')); };
      document.head.appendChild(s);
    });
    return skripDimuat[url];
  }
  const muatXLSX = () => (window.XLSX ? Promise.resolve() : muatSkrip(URL_XLSX));

  const penyelaras = () => S.profil && S.profil.peranan === 'penyelaras';
  const bolehUrus = (kod) => penyelaras() || S.unitSaya.has(kod);
  const aktif = () => S.data.murid.filter((m) => m.status !== 'keluar');
  const unitKat = (kat, semua) => S.data.units.filter((u) => u.kategori === kat && (semua || u.aktif !== false)).sort((a, b) => (a.susunan || 0) - (b.susunan || 0) || a.kod.localeCompare(b.kod));
  const susunTing = (t) => { const i = TING.indexOf(t); return i < 0 ? 99 : i; };
  const susunMurid = (a, b) => susunTing(a.tingkatan) - susunTing(b.tingkatan) || a.kelas.localeCompare(b.kelas) || a.nama.localeCompare(b.nama);
  const labelTing = (t) => (t === 'PPKI' ? 'PPKI' : 'Tingkatan ' + t);
  const kadRingkas = (k) => (!k ? 'tiada MyKad' : KI.mykadSah(k) ? 'MyKad …' + k.slice(-4) : 'MyKad belum sah');
  const hariIni = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const tarikh = (s) => { try { return new Date(s).toLocaleString('ms-MY', { dateStyle: 'medium', timeStyle: 'short' }); } catch (x) { return s; } };

  function kelasSenarai(ting) {
    const set = new Set(S.data.murid.filter((m) => !ting || m.tingkatan === ting).map((m) => m.kelas));
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'ms', { numeric: true }));
  }

  function bilanganUnit() {
    const peta = new Map(S.data.units.map((u) => [u.kod, { L: 0, P: 0, j: 0 }]));
    aktif().forEach((m) => KATS.forEach((k) => {
      const kod = m[k.toLowerCase()];
      if (!kod) return;
      if (!peta.has(kod)) peta.set(kod, { L: 0, P: 0, j: 0 });
      const c = peta.get(kod); c.j++; if (m.jantina === 'L') c.L++; else if (m.jantina === 'P') c.P++;
    }));
    return peta;
  }

  function lencanaSet(m) {
    return '<span class="lencana-set">' + KATS.map((k) => {
      const kod = m[k.toLowerCase()];
      return kod ? `<span class="lencana ${k}" title="${e(KAT[k])}: ${e(kod)}">${e(kod)}</span>`
        : `<span class="lencana kosong" title="${e(KAT[k])} belum ditetapkan">${k} —</span>`;
    }).join('') + '</span>';
  }

  function kelengkapan(m) {
    const item = [
      ['No. MyKad sah', KI.mykadSah(m.mykad)],
      ['Unit beruniform', !!m.ub], ['Kelab & persatuan', !!m.kp], ['Sukan & permainan', !!m.sp],
      ['Rumah sukan', !!m.rumah_sukan],
    ];
    return { peratus: Math.round((item.filter((x) => x[1]).length / item.length) * 100), kurang: item.filter((x) => !x[1]).map((x) => x[0]) };
  }

  function isuMurid(m) {
    return KI.semakMurid(m, S.unitPeta).map((x) => x.mesej);
  }

  const kunciIsu = {
    tiadaUB: (m) => !m.ub, tiadaKP: (m) => !m.kp, tiadaSP: (m) => !m.sp,
    belum: (m) => !m.ub || !m.kp || !m.sp, lengkap: (m) => m.ub && m.kp && m.sp,
    isuKad: (m) => !KI.mykadSah(m.mykad), tiadaRumah: (m) => !m.rumah_sukan,
    jantinaUnit: (m) => KATS.some((k) => { const u = S.unitPeta.get(m[k.toLowerCase()]); return u && u.jantina && m.jantina && u.jantina !== m.jantina; }),
    berganda: (m) => S.bergandaId && S.bergandaId.has(m.id),

  };
  const LABEL_KEG = {
    '': 'Semua kegiatan', belum: 'Belum lengkap', lengkap: 'Lengkap 3 kegiatan', tiadaUB: 'Tiada UB', tiadaKP: 'Tiada KP', tiadaSP: 'Tiada SP',
    isuKad: 'MyKad belum sah', tiadaRumah: 'Tiada rumah sukan', jantinaUnit: 'Jantina tidak sesuai dengan unit', berganda: 'Kemungkinan berganda',
    jawatanMoeis: 'Jawatan tiada dalam MOEIS',
  };

  function lokasiKini() { return BINGKAI ? (S.lokasi || '') : location.hash; }
  function pergi(hash) { if (BINGKAI) { S.lokasi = hash; render(); } else location.hash = hash; }
  function tetapLokasi(hash) { if (BINGKAI) S.lokasi = hash; else history.replaceState(null, '', hash); }
  function hashBahagian() {
    const [laluan, qs] = lokasiKini().replace(/^#\/?/, '').split('?');

  }

  // ------------------------------------------------------------------ eksport Excel
  async function eksport(namaFail, helaian) {
    await muatXLSX();
    const wb = window.XLSX.utils.book_new();
    helaian.forEach(([nama, aoa]) => {
      const ws = window.XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = (aoa[aoa.length - 1] || []).map((_, i) => ({ wch: i === 1 ? 42 : 14 }));
      window.XLSX.utils.book_append_sheet(wb, ws, nama.slice(0, 31));
    });
    if (!BINGKAI) { window.XLSX.writeFile(wb, namaFail); return true; }
    const dl = await muatTurun();
    if (!dl) throw new Error('Muat turun fail tidak tersedia dalam paparan ini.');
    const buf = window.XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    try { await dl.save({ filename: namaFail, data: new Blob([buf]) }); return true; } catch (err) {
      if (err && err.code === 'declined') return false;
      throw new Error(err && err.code === 'rate_limited' ? 'Tunggu sebentar, kemudian cuba muat turun lagi.' : 'Fail tidak dapat dimuat turun di sini.');
    }
  }
  let dlJanji = null;
  function muatTurun() {
    if (!dlJanji) dlJanji = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
    return dlJanji;
  }

  function baris_eksport(senarai) {
    return senarai.map((m, i) => [i + 1, m.nama, m.tingkatan === 'PPKI' ? 'X' : m.tingkatan, m.kelas, m.mykad || '', m.jantina || '',
      m.ub || '', m.ub_jawatan || '', m.kp || '', m.kp_jawatan || '', m.sp || '', m.sp_jawatan || '', m.rumah_sukan || '', m.status === 'keluar' ? 'K' : '']);
  }
  const TAJUK_EKSPORT = ['BIL', 'NAMA PELAJAR', 'TINGKATAN', 'KELAS', 'NO MYKAD', 'GENDER', 'UNIT BERUNIFORM (UB)', 'JAWATAN',
    'KELAB DAN PERSATUAN (KP)', 'JAWATAN', 'SUKAN PERMAINAN (SP)', 'JAWATAN', 'RUMAH SUKAN', 'MURID KELUAR (K)'];

  function eksportSemua() {
    const t = S.data.tetapan || {};
    const senarai = S.data.murid.slice().sort(susunMurid);
    const tarikhHari = hariIni();
    return eksport(`KOKUM-SMART-${t.tahun || ''}-${tarikhHari}.xlsx`, [['DAFTAR KOKUM', [
      [`${t.nama_sekolah || ''} (${t.kod_sekolah || ''}), ${t.alamat || ''}`],
      ['PEMBAHAGIAN & PENDAFTARAN KEGIATAN KOKURIKULUM MURID'],
      ['TAHUN:', t.tahun || ''], ['DIEKSPORT:', tarikhHari], TAJUK_EKSPORT, ...baris_eksport(senarai)]]]).then((ok) => { if (ok) roti('Fail Excel disediakan'); }, gagal);
  }

  // ------------------------------------------------------------------ permulaan
  async function mula() {
    const qs = new URLSearchParams(location.search);
    const adaKonfig = C.supabaseUrl && C.supabaseAnonKey && !/GANTI/i.test(C.supabaseUrl + C.supabaseAnonKey);
    S.demo = qs.has('demo') || !adaKonfig;
    S.tiadaKonfig = !adaKonfig;
    app().innerHTML = '<div class="pemuat">Memuatkan KOKUM SMART…</div>';
    try {
      if (HS) {
        S.hs = true; S.demo = false;
        S.db = window.KokumLuarTalian.balut(HS.DB(), { teks: {
          tiadaData: 'Tiada sambungan ke laptop TIC, dan data ini belum pernah dibuka pada telefon ini. Dekatkan telefon ke WiFi hari sukan dan cuba lagi.',
          perluTalian: 'Tiada sambungan ke laptop TIC. Tindakan ini perlu sambungan ke laptop. (Keputusan acara boleh disimpan dahulu dan dihantar sendiri apabila sambungan pulih.)' } });
        S.db.luar.dengar(kemasTalian);
      } else if (S.demo) S.db = window.KokumDB.DemoDB();
      else {
        await muatSkrip(URL_SB);
        const asal = window.KokumDB.SupabaseDB(C.supabaseUrl, C.supabaseAnonKey);
        S.db = window.KokumLuarTalian ? window.KokumLuarTalian.balut(asal) : asal;
        if (S.db.luar) S.db.luar.dengar(kemasTalian);
      }
    } catch (err) {
      app().innerHTML = `<div class="skrin-masuk"><div class="panel kad-masuk"><h2>Tidak dapat dimulakan</h2><p>${e(err.message)}</p><button class="btn utama" onclick="location.reload()">Cuba lagi</button></div></div>`;
      return;
    }
    S.db.onAuth((ev) => {
      if (ev === 'PASSWORD_RECOVERY') skrinMasuk('baharu');
      if (ev === 'SIGNED_OUT') { S.user = null; S.profil = null; S.data = null; skrinMasuk('masuk'); }
    });
    window.addEventListener('hashchange', () => { if (S.data && !BINGKAI) render(); });
    if (BINGKAI) document.addEventListener('click', (ev) => {
      const a = ev.target.closest('a[href^="#/"]');
      if (a) { ev.preventDefault(); pergi(a.getAttribute('href')); }
    }, true);
    const pulih = /type=recovery/.test(location.hash + location.search);
    const user = await S.db.sesi().catch(() => null);
    if (pulih && user) { S.user = user; return skrinMasuk('baharu'); }
    if (S.hs && !user) return HS.skrinMasuk(app(), (u) => selepasMasuk(u));
    if (!user) return skrinMasuk('masuk');
    await selepasMasuk(user);
  }

  async function selepasMasuk(user) {
    S.user = user;
    try { S.profil = await S.db.profilSaya(user.id); } catch (err) { gagal(err); }
    if (!S.profil || !S.profil.aktif) return skrinMenunggu();
    await muatData(true);
  }

  async function muatData(pertama) {
    if (pertama) app().innerHTML = '<div class="pemuat">Memuatkan data murid…</div>';
    try {
      S.data = await S.db.muatSemua(penyelaras());
    } catch (err) {
      app().innerHTML = `<div class="skrin-masuk"><div class="panel kad-masuk"><h2>Data tidak dapat dimuatkan</h2><p>${e(err.message)}</p><div class="baris-btn"><button class="btn utama" data-act="muat-semula">Cuba lagi</button><button class="btn" data-act="keluar">Log keluar</button></div></div></div>`;
      return;
    }
    S.data.murid.sort(susunMurid);
    S.unitPeta = new Map(S.data.units.map((u) => [u.kod, u]));
    S.unitSaya = new Set(S.data.guruUnit.filter((g) => g.user_id === S.user.id).map((g) => g.unit_kod));
    S.berganda = KI.cariBerganda(aktif());
    S.bergandaId = new Set(S.berganda.flat().filter((x) => x && x.id).map((x) => x.id));
    S.dimuatPada = new Date();
    if (S.hs) HS.mulaDenyut(segarHS);
    render();
  }

  // ------------------------------------------------------------------ skrin log masuk
  function skrinMasuk(mod, mesej) {
    const t = {
      masuk: ['Log masuk', 'Gunakan e-mel dan kata laluan akaun guru anda.'],
      daftar: ['Daftar akaun guru', 'Selepas mendaftar, penyelaras kokurikulum perlu mengesahkan akaun anda.'],
      lupa: ['Set semula kata laluan', 'Kami akan menghantar pautan ke e-mel anda.'],
      baharu: ['Kata laluan baharu', 'Masukkan kata laluan baharu untuk akaun anda.'],
    }[mod];
    app().innerHTML = `
      <main class="skrin-masuk">
        <div class="masuk-bungkus">
        <img class="slogan" src="${SLOGAN}" alt="SMKUSR Tekad Berapi">
        <div class="panel kad-masuk">
          <div class="jenama"><img src="${LOGO}" alt=""><div><b>KOKUM SMART</b><span>SMK Ulu Sugut, Ranau</span></div></div>
          <h2>${t[0]}</h2><p class="pudar kecil">${t[1]}</p>
          ${mesej ? `<div class="mesej ${mesej[0]}">${e(mesej[1])}</div>` : ''}
          <form class="borang" id="borang-masuk" data-mod="${mod}">
            ${mod === 'daftar' ? '<label class="medan">Nama penuh<input type="text" name="nama" required autocomplete="name"></label>' : ''}
            ${mod !== 'baharu' ? '<label class="medan">E-mel<input type="email" name="email" required autocomplete="email"></label>' : ''}
            ${mod !== 'lupa' ? `<label class="medan">Kata laluan<input type="password" name="pw" required minlength="6" autocomplete="${mod === 'masuk' ? 'current-password' : 'new-password'}"></label>` : ''}

            ${mod === 'daftar' || mod === 'lupa' ? '<button data-act="ke" data-mod="masuk">Kembali ke log masuk</button>' : ''}
          </div>
        </div>
        </div>
      </main>`;
    const f = $('#borang-masuk');
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      const btn = f.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        if (mod === 'masuk') { await S.db.masuk(d.email.trim(), d.pw); await selepasMasuk(await S.db.sesi()); return; }
        if (mod === 'daftar') {
          const r = await S.db.daftar(d.email.trim(), d.pw, d.nama.trim().toUpperCase());

        if (mod === 'baharu') { await S.db.tukarKataLaluan(d.pw); roti('Kata laluan dikemas kini'); history.replaceState(null, '', location.pathname); return selepasMasuk(await S.db.sesi()); }

    const masa = (t) => new Date(t).toLocaleString('ms-MY', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    let kelas = '', teks = '';
    if (st.luar) { kelas = 'luar'; teks = `${S.hs ? 'Terputus dari laptop' : 'Luar talian'}${st.menunggu ? ` · ${st.menunggu} menunggu` : ''}`; }
    else if (st.menghantar && st.menunggu) { kelas = 'hantar'; teks = `Menghantar ${st.menunggu} rekod…`; }
    else if (st.menunggu) { kelas = 'hantar'; teks = `${st.menunggu} rekod menunggu`; }

        <p class="kecil">${S.hs ? 'Keputusan acara yang disimpan semasa terputus disimpan dalam telefon dan dihantar sendiri ke laptop TIC apabila telefon kembali dalam liputan WiFi. Pengesahan keputusan perlu sambungan ke laptop.' : 'Kehadiran, rancangan, OPR (termasuk gambar), PAJSK, pencapaian, buku laporan, keputusan olahraga dan pendaftaran perkhemahan boleh disimpan tanpa internet.'} Rekod disimpan dalam peranti dan dihantar sendiri apabila talian pulih. <b>Jangan padam data pelayar (clear data)</b> sebelum rekod dihantar.</p>

          ${x.ralat ? `<button class="btn kecil bahaya" data-act="talian-buang" data-n="${x.n}">Buang</button>` : ''}</li>`).join('')}</ul>`

    let html, menu = laluan;

      if (laluan === 'murid') {

  function paparUtama() {
    const t = S.data.tetapan || {};

      return `<div class="kepala"><div><h1>Selamat datang, ${e(S.profil.nama || '')}</h1><p>${e(t.nama_sekolah)} · Tahun ${e(t.tahun)}</p></div></div>
