<style>
/* KOKUM SMART · gaya
   Warna kategori: UB = khaki pakaian seragam, KP = biru papan kenyataan, SP = kuning gelanggang. */
:root {
  --kertas: #f4f6f3;
  --permukaan: #ffffff;
  --dakwat: #17231e;
  --kabus: #5b6862;
  --garis: #d8dfda;
  --garis-kuat: #b9c4bd;
  --hijau: #1f5c45;          /* aksi utama: hijau hutan Kinabalu */
  --hijau-tekan: #174836;
  --hijau-latar: #e2eee8;
  --ub: #55632b; --ub-latar: #e9edd9; --ub-pudar: #a9b57f;
  --kp: #285d8c; --kp-latar: #dfe9f4; --kp-pudar: #8fb0d0;
  --sp: #9a6f0c; --sp-latar: #f6ecd0; --sp-pudar: #ddbd6c;
  --bahaya: #b3261e; --bahaya-latar: #fbe9e7;
  --amaran: #8a5a00; --amaran-latar: #fff2d6;
  /* warna rumah sukan (ikut susunan senarai rumah) dan pingat */
  --r1: #b3261e; --r1-latar: #fbe6e3; --r2: #2e7d32; --r2-latar: #e3f1e4; --r3: #a86400; --r3-latar: #fbefd9;
  --r4: #6a3d9a; --r4-latar: #efe6f7; --r5: #1f5f99; --r5-latar: #e1ecf7; --r6: #5b6862; --r6-latar: #eceeec;
  --emas: #b8860b; --perak: #7d8790; --gangsa: #9c5a2c;
  --bayang: 0 1px 2px rgba(23, 35, 30, .06), 0 4px 14px rgba(23, 35, 30, .05);
  --atas-hijau: #ffffff;  /* teks di atas butang hijau */
  --jejari: 10px;
  --fon: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --kertas: #101814; --permukaan: #17211c; --dakwat: #e6ece8; --kabus: #9aa8a1;
    --garis: #2a3731; --garis-kuat: #3c4b44;
    --hijau: #5fb08c; --hijau-tekan: #4c9877; --hijau-latar: #1c3329;
    --ub: #b7c47f; --ub-latar: #2a311a; --ub-pudar: #6d7744;
    --kp: #8db8e2; --kp-latar: #1a2c3e; --kp-pudar: #4f7396;
    --sp: #e3be5e; --sp-latar: #3a2f12; --sp-pudar: #9a7a2a;
    --bahaya: #f08a80; --bahaya-latar: #3a1c19; --amaran: #f0c060; --amaran-latar: #352a12;
    --r1: #f08a80; --r1-latar: #3a1c19; --r2: #7cc883; --r2-latar: #17301a; --r3: #e9b85c; --r3-latar: #35280f;
    --r4: #c3a3e8; --r4-latar: #2a1f38; --r5: #8dbbea; --r5-latar: #172a3d; --r6: #9aa8a1; --r6-latar: #222b27;
    --emas: #e6c15a; --perak: #b8c2ca; --gangsa: #d79464;
    --bayang: none; color-scheme: dark;
  --atas-hijau: #0c1a13;
  }
}
:root[data-theme="dark"] {
    --kertas: #101814; --permukaan: #17211c; --dakwat: #e6ece8; --kabus: #9aa8a1;
    --garis: #2a3731; --garis-kuat: #3c4b44;
    --hijau: #5fb08c; --hijau-tekan: #4c9877; --hijau-latar: #1c3329;
    --ub: #b7c47f; --ub-latar: #2a311a; --ub-pudar: #6d7744;
    --kp: #8db8e2; --kp-latar: #1a2c3e; --kp-pudar: #4f7396;
    --sp: #e3be5e; --sp-latar: #3a2f12; --sp-pudar: #9a7a2a;
    --bahaya: #f08a80; --bahaya-latar: #3a1c19; --amaran: #f0c060; --amaran-latar: #352a12;
    --r1: #f08a80; --r1-latar: #3a1c19; --r2: #7cc883; --r2-latar: #17301a; --r3: #e9b85c; --r3-latar: #35280f;
    --r4: #c3a3e8; --r4-latar: #2a1f38; --r5: #8dbbea; --r5-latar: #172a3d; --r6: #9aa8a1; --r6-latar: #222b27;
    --emas: #e6c15a; --perak: #b8c2ca; --gangsa: #d79464;
    --bayang: none; color-scheme: dark;
  --atas-hijau: #0c1a13;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--fon); font-size: 15px; line-height: 1.5; color: var(--dakwat); background: var(--kertas);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--hijau); }
h1, h2, h3 { line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -.01em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .75rem; }
.kecil { font-size: .85rem; }
.pudar { color: var(--kabus); }
.tersembunyi { display: none !important; }
:focus-visible { outline: 3px solid var(--hijau); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Rangka ---------- */
.rangka { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.rel {
  position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--garis);
  background: var(--permukaan); display: flex; flex-direction: column; gap: 4px;
}
.jenama { display: flex; gap: 10px; align-items: center; padding: 0 8px 18px; }
.jenama img { width: auto; height: 40px; object-fit: contain; }
.slogan-rel { display: block; width: 150px; max-width: 100%; margin: auto auto 14px; }
.jenama b { display: block; font-size: 1rem; }
.jenama span { font-size: .78rem; color: var(--kabus); }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none;
  color: var(--dakwat); font-weight: 500;
}
.nav a svg { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; }
.nav a:hover { background: var(--kertas); }
.nav a[aria-current="page"] { background: var(--hijau-latar); color: var(--hijau); font-weight: 700; }
.rel .bawah { padding: 12px 8px 0; border-top: 1px solid var(--garis); font-size: .85rem; }
.isi { padding: 28px clamp(16px, 4vw, 44px) 80px; max-width: 1180px; width: 100%; min-width: 0; }
.atas-mudah { display: none; }

@media (max-width: 860px) {
  .rangka { grid-template-columns: minmax(0, 1fr); }
  .rel { display: none; }
  .atas-mudah {
    display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding: 10px 16px;
    background: var(--permukaan); border-bottom: 1px solid var(--garis);
  }
  .atas-mudah img { width: auto; height: 32px; object-fit: contain; }
  .atas-mudah b { font-size: .98rem; }
  .isi { padding: 18px 16px 96px; }
  .nav-bawah {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
    background: var(--permukaan); border-top: 1px solid var(--garis); padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .nav-bawah a { flex-direction: column; gap: 2px; padding: 6px 0; font-size: .66rem; justify-content: center; text-align: center; min-width: 0; }
  .nav-bawah a svg { width: 22px; height: 22px; }
}
@media (min-width: 861px) { .nav-bawah { display: none; } }

/* ---------- Komponen asas ---------- */
.kepala { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.kepala p { margin: 4px 0 0; color: var(--kabus); }
.panel { background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--jejari); padding: 18px; box-shadow: var(--bayang); }
.panel + .panel, .bahagian + .bahagian { margin-top: 18px; }
.panel > h2 { margin-bottom: 12px; }
.grid2 > .panel { margin-top: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px;
  border-radius: 8px; border: 1px solid var(--garis-kuat); background: var(--permukaan); cursor: pointer; font-weight: 600;
  text-decoration: none; color: var(--dakwat); white-space: nowrap;
}
.btn:hover { background: var(--kertas); }
.btn.utama { background: var(--hijau); border-color: var(--hijau); color: var(--atas-hijau); }
.btn.utama:hover { background: var(--hijau-tekan); }
.btn.bahaya { color: var(--bahaya); border-color: var(--bahaya); }
.btn.kosong { border-color: transparent; background: transparent; }
.btn.kecil { min-height: 32px; padding: 4px 10px; font-size: .85rem; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.baris-btn { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

label.medan { display: grid; gap: 4px; font-size: .85rem; font-weight: 600; }
label.medan span.bantu { font-weight: 400; color: var(--kabus); font-size: .8rem; }
input[type="text"], input[type="email"], input[type="password"], input[type="search"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; min-height: 42px; padding: 8px 11px; border: 1px solid var(--garis-kuat); border-radius: 8px;
  background: var(--permukaan); font-size: .95rem; font-weight: 400;
}
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--hijau); outline-offset: -1px; border-color: var(--hijau); }
.borang { display: grid; gap: 14px; }
.borang .dua { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
label.medan { align-content: start; }
@media (max-width: 520px) { .borang .dua { grid-template-columns: 1fr; } }
.cek { display: flex; gap: 8px; align-items: center; font-size: .9rem; cursor: pointer; }
.cek input { width: 18px; height: 18px; accent-color: var(--hijau); }

.mesej { padding: 10px 14px; border-radius: 8px; font-size: .9rem; margin-bottom: 12px; }
.mesej.ralat { background: var(--bahaya-latar); color: var(--bahaya); }
.mesej.amaran { background: var(--amaran-latar); color: var(--amaran); }
.mesej.ok { background: var(--hijau-latar); color: var(--hijau); }

/* ---------- Lencana kategori: tanda khas aplikasi ---------- */
.lencana-set { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.lencana {
  display: inline-flex; align-items: center; gap: 4px; min-width: 48px; justify-content: center; height: 24px; padding: 0 8px;
  border-radius: 6px; font-size: .74rem; font-weight: 700; letter-spacing: .02em; border: 1.5px solid transparent;
}
.lencana.UB { background: var(--ub-latar); color: var(--ub); border-color: var(--ub-pudar); }
.lencana.KP { background: var(--kp-latar); color: var(--kp); border-color: var(--kp-pudar); }
.lencana.SP { background: var(--sp-latar); color: var(--sp); border-color: var(--sp-pudar); }
.lencana.kosong { background: transparent; border: 1.5px dashed var(--garis-kuat); color: var(--kabus); font-weight: 500; }
.lencana .j { font-weight: 500; opacity: .85; }
.tag-kat { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: .72rem; font-weight: 700; }
.tag-kat.UB { background: var(--ub); color: var(--permukaan); }
.tag-kat.KP { background: var(--kp); color: var(--permukaan); }
.tag-kat.SP { background: var(--sp); color: var(--permukaan); }

/* ---------- Dashboard ---------- */
.ringkas { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
.ringkas .kotak { background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--jejari); padding: 14px 16px; }
.ringkas .kotak b { display: block; font-size: 1.7rem; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; }
.ringkas .kotak span { font-size: .85rem; color: var(--kabus); }
.ringkas .kotak.isyarat b { color: var(--amaran); }
a.kotak, button.kotak { text-decoration: none; color: inherit; text-align: left; font: inherit; cursor: pointer; }
a.kotak:hover, button.kotak:hover { border-color: var(--garis-kuat); }

.kategori { margin-top: 26px; }
.kategori-kepala { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  border-bottom: 3px solid var(--warna); padding-bottom: 8px; margin-bottom: 6px; }
.kategori-kepala h2 { color: var(--warna); }
.kategori.UB { --warna: var(--ub); --pudar: var(--ub-pudar); --latar: var(--ub-latar); }
.kategori.KP { --warna: var(--kp); --pudar: var(--kp-pudar); --latar: var(--kp-latar); }
.kategori.SP { --warna: var(--sp); --pudar: var(--sp-pudar); --latar: var(--sp-latar); }
.petunjuk { display: flex; gap: 14px; font-size: .8rem; color: var(--kabus); align-items: center; flex-wrap: wrap; }
.petunjuk i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.petunjuk i.L { background: var(--warna); }
.petunjuk i.P { background: var(--pudar); }
.petunjuk i.garis-p { width: 2px; height: 14px; border-radius: 0; background: var(--dakwat); }

.palang {
  display: grid; grid-template-columns: 58px 1fr 92px; gap: 10px; align-items: center; padding: 7px 4px; border-radius: 6px;
  text-decoration: none; color: inherit;
}
.palang:hover { background: var(--latar); }
.palang .kod { font-weight: 800; font-size: .85rem; color: var(--warna); }
.palang .trek { position: relative; height: 18px; background: var(--kertas); border-radius: 4px; }
.palang .isi-L, .palang .isi-P { position: absolute; top: 0; bottom: 0; }
.palang .isi-L { left: 0; background: var(--warna); border-radius: 4px 0 0 4px; }
.palang .isi-P { background: var(--pudar); }
.palang .purata { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--dakwat); opacity: .6; }
.palang .had { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--bahaya); }
.palang .angka { text-align: right; font-size: .85rem; }
.palang .angka b { font-size: .98rem; }
.palang .angka small { color: var(--kabus); }
.palang.lebih .angka b { color: var(--bahaya); }

.semakan a { display: flex; justify-content: space-between; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--garis);
  text-decoration: none; color: inherit; }
.semakan a:last-child { border-bottom: 0; }
.semakan a:hover { color: var(--hijau); }
.semakan b.ada { color: var(--amaran); }
.semakan b.sifar { color: var(--hijau); }

table { border-collapse: collapse; width: 100%; }
.jadual th, .jadual td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--garis); vertical-align: middle; }
.jadual th { font-size: .78rem; color: var(--kabus); font-weight: 600; background: var(--kertas); position: sticky; top: 0; }
.jadual td.n, .jadual th.n { text-align: right; }
.jadual tr:hover td { background: color-mix(in srgb, var(--kertas) 60%, transparent); }
.skrol-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* ---------- Senarai murid ---------- */
.penapis { display: grid; grid-template-columns: 2fr repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
@media (max-width: 860px) { .penapis { grid-template-columns: 1fr 1fr; } .penapis .cari { grid-column: 1 / -1; } }
.kiraan { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0 10px; font-size: .88rem; color: var(--kabus); flex-wrap: wrap; }
.senarai { list-style: none; margin: 0; padding: 0; background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--jejari); }
.senarai li + li { border-top: 1px solid var(--garis); }
.senarai button.baris {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; width: 100%; text-align: left; padding: 11px 14px;
  background: none; border: 0; cursor: pointer; align-items: center;
}
.senarai button.baris:hover { background: var(--kertas); }
.senarai .nama { font-weight: 600; }
.senarai .meta { font-size: .82rem; color: var(--kabus); }
.senarai .keluar .nama { text-decoration: line-through; color: var(--kabus); }
@media (max-width: 600px) { .senarai button.baris { grid-template-columns: 1fr; } }
.kosong-isi { padding: 36px 16px; text-align: center; color: var(--kabus); }
.kosong-isi h3 { color: var(--dakwat); margin-bottom: 6px; }

/* ---------- Unit ---------- */
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 10px; }
.kad-unit {
  display: block; padding: 13px 14px; border-radius: var(--jejari); border: 1px solid var(--garis); background: var(--permukaan);
  text-decoration: none; color: inherit; border-left: 5px solid var(--warna);
}
.kad-unit:hover { border-color: var(--garis-kuat); border-left-color: var(--warna); }
.kad-unit .atas { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.kad-unit .atas b { color: var(--warna); font-size: .95rem; }
.kad-unit .atas span { font-weight: 800; font-size: 1.2rem; }
.kad-unit .nama-penuh { font-size: .85rem; margin: 2px 0 6px; }
.kad-unit .bawah { font-size: .78rem; color: var(--kabus); display: flex; justify-content: space-between; gap: 6px; }
.kad-unit .saya { color: var(--hijau); font-weight: 700; }
.unit-kepala { border-left: 6px solid var(--warna); padding-left: 14px; }
.unit-kepala .kod-besar { font-size: 2.2rem; font-weight: 800; color: var(--warna); line-height: 1; letter-spacing: -.02em; }
.stat-baris { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; font-size: .9rem; }
.stat-baris b { font-size: 1.25rem; display: block; }
input.jawatan { min-height: 34px; padding: 4px 8px; font-size: .85rem; max-width: 210px; }
input.jawatan.tak-moeis { border-color: var(--amaran); box-shadow: inset 3px 0 0 var(--amaran); }

/* ---------- Dialog ---------- */
dialog {
  border: 0; padding: 0; border-radius: 14px; width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 32px);
  background: var(--permukaan); color: var(--dakwat); box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
}
dialog::backdrop { background: rgba(16, 24, 20, .45); }
dialog .dk { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 18px 20px 12px; border-bottom: 1px solid var(--garis); position: sticky; top: 0; background: var(--permukaan); z-index: 1; }
dialog .db { padding: 16px 20px 20px; }
dialog .dt { padding: 12px 20px; border-top: 1px solid var(--garis); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--permukaan); }
@media (max-width: 600px) {
  dialog { width: 100vw; max-width: 100vw; max-height: 92vh; margin: auto 0 0; border-radius: 16px 16px 0 0; }
}
.slot { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--garis); }
.slot:last-child { border-bottom: 0; }
@media (max-width: 520px) { .slot { grid-template-columns: 52px 1fr; } .slot .jaw { grid-column: 2; } }
.meter { height: 8px; background: var(--kertas); border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
.meter > div { height: 100%; background: var(--hijau); }
.isu { list-style: none; padding: 0; margin: 8px 0 0; font-size: .85rem; }
.isu li { padding: 3px 0; color: var(--amaran); }
.isu li::before { content: "! "; font-weight: 800; }

/* ---------- Log masuk ---------- */
.skrin-masuk { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: linear-gradient(180deg, var(--hijau-latar), var(--kertas) 55%); }
.kad-masuk { width: min(420px, 100%); }
.kad-masuk .jenama { padding: 0 0 18px; }
.kad-masuk .jenama img { width: auto; height: 56px; }
.masuk-bungkus { width: min(420px, 100%); display: grid; gap: 14px; justify-items: center; }
.masuk-bungkus .kad-masuk { width: 100%; }
.slogan { width: min(220px, 60vw); height: auto; }
.kad-masuk .jenama b { font-size: 1.3rem; }
.tukar { text-align: center; margin-top: 14px; font-size: .9rem; }
.tukar button { background: none; border: 0; color: var(--hijau); font-weight: 600; cursor: pointer; padding: 4px; }

/* ---------- Tab ---------- */
.tab { display: flex; gap: 4px; border-bottom: 1px solid var(--garis); margin-bottom: 16px; overflow-x: auto; }
.tab a { padding: 10px 14px; text-decoration: none; color: var(--kabus); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab a[aria-current="page"] { color: var(--hijau); border-bottom-color: var(--hijau); }
.cip-set { display: flex; flex-wrap: wrap; gap: 6px; }
.cip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--garis-kuat); font-size: .8rem; cursor: pointer; background: var(--permukaan); }
.cip input { display: none; }
.cip:has(input:checked) { background: var(--hijau); border-color: var(--hijau); color: var(--atas-hijau); }

.roti { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 100; background: var(--dakwat); color: var(--kertas);
  padding: 10px 18px; border-radius: 8px; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
/* status luar talian */
.cip-talian { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 40; display: inline-flex; align-items: center; gap: 7px;
  font: 600 .78rem var(--fon); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--garis-kuat); background: var(--permukaan); color: var(--dakwat);
  box-shadow: var(--bayang); cursor: pointer; max-width: calc(100vw - 150px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cip-talian[hidden] { display: none; }
.cip-talian .titik { width: 8px; height: 8px; border-radius: 50%; background: var(--kabus); flex: none; }
.cip-talian.luar { background: var(--amaran-latar); border-color: var(--amaran); color: var(--amaran); }
.cip-talian.luar .titik { background: var(--amaran); }
.cip-talian.hantar .titik { background: var(--hijau); animation: denyut 1.2s ease-in-out infinite; }
.cip-talian.gagal { background: var(--bahaya-latar); border-color: var(--bahaya); color: var(--bahaya); }
.cip-talian.gagal .titik { background: var(--bahaya); }
@keyframes denyut { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .cip-talian .titik { animation: none !important; } }
.senarai-talian li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; }
.senarai-talian li > div { display: flex; flex-direction: column; min-width: 0; }
.senarai-talian small { display: block; }
.teks-ralat { color: var(--bahaya); }
.roti.ralat { background: var(--bahaya); color: var(--kertas); }
.pemuat { display: grid; place-items: center; min-height: 50vh; color: var(--kabus); }
.kemajuan { height: 10px; background: var(--kertas); border-radius: 5px; overflow: hidden; border: 1px solid var(--garis); }
.kemajuan > div { height: 100%; background: var(--hijau); transition: width .2s; }
.lencana-demo { display: inline-block; background: var(--amaran-latar); color: var(--amaran); font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 5px; }

/* ---------- Mod Hari Sukan ---------- */
.lencana-hs { background: var(--hijau-latar); color: var(--hijau); margin-left: 6px; }
@media (max-width: 860px) { .nav-bawah[style*="--bil"] { grid-template-columns: repeat(var(--bil), minmax(0, 1fr)); } }
.hs-rumah { color: var(--w); background: color-mix(in srgb, var(--w) 14%, var(--permukaan)); }
.hs-url { font: 800 clamp(1.3rem, 3vw, 2rem) var(--fon); letter-spacing: .01em; padding: 10px 14px; margin: 6px 0; border-radius: 8px; background: var(--hijau-latar); color: var(--hijau); word-break: break-all; }
.hs-url.kecil { font-size: 1rem; background: transparent; padding: 2px 14px; }
.hs-pin { display: flex; align-items: center; gap: 12px; margin: 14px 0 8px; flex-wrap: wrap; }
.hs-pin span { color: var(--kabus); font-size: .85rem; }
.hs-pin b { font-size: 2rem; letter-spacing: .2em; }
.hs-kad { margin-bottom: 12px; }
.hs-kad.siap { opacity: .6; }
.hs-kad-atas { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.hs-pemenang { list-style: none; margin: 0 0 10px; padding: 0; }
.hs-pemenang li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--garis); flex-wrap: wrap; font-size: 1.05rem; }
.hs-pemenang .n { font-weight: 700; flex: 1 1 140px; min-width: 0; }
.hs-pemenang .p { font-variant-numeric: tabular-nums; font-weight: 700; }
.rb { display: inline-block; background: var(--bahaya); color: #fff; font-size: .7rem; font-weight: 800; padding: 2px 7px; border-radius: 5px; letter-spacing: .04em; }

/* papan markah untuk TV / projektor */
.papan { min-height: 100vh; display: flex; flex-direction: column; background: #0d1512; color: #f3f6f4; padding: 2.2vh 2.4vw; gap: 2vh; font-size: clamp(14px, 1.25vw, 30px); position: relative; }
.papan .pemuat { color: #cfd8d3; }
.papan-atas { display: flex; align-items: center; gap: 1.4vw; }
.papan-atas img { height: 9vh; width: auto; }
.papan-atas h1 { margin: 0; font-size: 2.1em; line-height: 1.1; letter-spacing: -.01em; }
.papan-atas p { margin: .3em 0 0; color: #9fb2a9; font-size: .95em; }
.papan-jam { margin-left: auto; font-size: 2.6em; font-weight: 800; font-variant-numeric: tabular-nums; }
.papan-isi { flex: 1; display: grid; grid-template-columns: 1.25fr 1fr; gap: 2vw; min-height: 0; }
.papan-kedudukan { display: flex; flex-direction: column; gap: 1.4vh; justify-content: center; }
.papan-baris { display: grid; grid-template-columns: 2.4em 1fr repeat(4, 4.6em); grid-template-rows: auto 6px; align-items: center; column-gap: .8em;
  background: #16211c; border-left: .5em solid var(--w); border-radius: 10px; padding: 1.4vh 1.2vw .9vh; }
.papan-baris .tempat { font-size: 2.2em; font-weight: 800; color: #9fb2a9; }
.papan-baris .nama { font-size: 1.9em; font-weight: 800; letter-spacing: .02em; color: var(--w); filter: brightness(1.25); }
.papan-baris .kira { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.papan-baris .kira b { font-size: 2.3em; font-variant-numeric: tabular-nums; }
.papan-baris .kira small { font-size: .62em; color: #9fb2a9; text-transform: uppercase; letter-spacing: .08em; margin-top: .35em; }
.papan-baris .kira.emas b { color: #f2c94c; } .papan-baris .kira.perak b { color: #d5dce1; } .papan-baris .kira.gangsa b { color: #e09a63; }
.papan-baris .bar { grid-column: 1 / -1; height: 6px; background: #22302a; border-radius: 3px; overflow: hidden; margin-top: .8vh; }
.papan-baris .bar i { display: block; height: 100%; background: var(--w); }
.papan-terkini h2 { margin: 0 0 1.2vh; font-size: 1.35em; color: #9fb2a9; text-transform: uppercase; letter-spacing: .08em; }
.papan-acara { background: #16211c; border-radius: 10px; padding: 1.2vh 1vw; margin-bottom: 1.2vh; }
.papan-acara .tajuk { font-weight: 800; font-size: 1.1em; margin-bottom: .5vh; }
.papan-acara .tajuk span { color: #9fb2a9; font-weight: 600; margin-right: .3em; }
.papan-acara .pemenang { display: flex; align-items: center; gap: .6em; padding: .35vh 0; }
.papan-acara .pemenang .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.papan-acara .pemenang .p { font-variant-numeric: tabular-nums; font-weight: 700; }
.papan .pingat { width: 1.6em; height: 1.6em; font-size: .85em; }
.papan .rumah { font-size: .7em; }
.papan .hs-rumah { color: #fff; background: var(--w); border-color: var(--w); }
.papan-bawah { display: flex; flex-wrap: wrap; align-items: center; gap: .6em 1.6em; background: #16211c; border-radius: 10px; padding: 1.2vh 1.2vw; font-size: .95em; }
.papan-bawah b { color: #f2c94c; text-transform: uppercase; letter-spacing: .06em; }
.papan-bawah .rb-jumlah { margin-left: auto; background: var(--bahaya); color: #fff; padding: .2em .7em; border-radius: 6px; font-weight: 800; }
.papan-keluar { position: absolute; top: 8px; right: 10px; color: #4b5b54; text-decoration: none; font-size: 1.2rem; opacity: 0; }
.papan:hover .papan-keluar { opacity: 1; }
@media (max-width: 900px) { .papan-isi { grid-template-columns: 1fr; } .papan-baris { grid-template-columns: 2em 1fr repeat(4, 3.4em); } }

/* ---------- Cetak ---------- */
.kertas-cetak { background: #fff; color: #000; padding: 24px; border: 1px solid var(--garis); border-radius: 8px; overflow-x: auto; }
@media (max-width: 600px) { .kertas-cetak { padding: 14px; } .kertas-cetak table { font-size: 8.5pt; } }
.kertas-cetak .halaman + .halaman { margin-top: 40px; padding-top: 30px; border-top: 2px dashed #ccc; }
.kepala-cetak { display: flex; align-items: center; justify-content: center; gap: 14px; }
.kepala-cetak img { width: 58px; height: auto; flex: none; }
.kertas-cetak h3 { text-align: center; font-size: 13pt; }
.kertas-cetak .sub { text-align: center; font-size: 10pt; margin: 2px 0; }
.kertas-cetak .info { display: flex; justify-content: space-between; font-size: 10pt; margin: 12px 0 6px; flex-wrap: wrap; gap: 6px; }

.status-kem { font-size: .78rem; font-weight: 700; }
.status-kem.buka { color: var(--hijau); } .status-kem.tutup { color: var(--bahaya); }
.info-kem { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.info-kem span { display: grid; gap: 2px; }
.info-kem small, .meter-kem small { font-size: .72rem; color: var(--kabus); }
.jadual-kem td.n small { color: var(--kabus); font-size: .72rem; }
.jadual-kem td.lebih { color: var(--bahaya); font-weight: 700; }
.jadual-kem tr.unit-saya td { background: var(--hijau-latar); }
.jadual-kem tr.jumlah-baris td { border-top: 2px solid var(--garis-kuat); }
.lencana-penganjur { font-size: .66rem; font-weight: 800; padding: 1px 6px; border-radius: 5px; background: var(--ub-latar); color: var(--ub); vertical-align: 1px; }
.meter-set { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.meter-kem { display: grid; gap: 1px; }
.meter-kem b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.meter-kem b i { font-style: normal; font-size: .85rem; color: var(--kabus); font-weight: 600; }
.meter-kem.lebih b { color: var(--bahaya); }
.borang-sebaris { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.kem-senarai { display: grid; }
.kem-baris { display: grid; grid-template-columns: 28px minmax(160px, 1.4fr) minmax(200px, 1.2fr) auto auto; gap: 8px 12px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--garis); }
.kem-baris .bil { color: var(--kabus); font-size: .8rem; font-variant-numeric: tabular-nums; }
.kem-baris .siapa { display: grid; min-width: 0; } .kem-baris .siapa small { color: var(--kabus); font-size: .76rem; }
.kem-peranan { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.kem-peranan select, .kem-peranan input { min-height: 36px; padding: 4px 8px; font-size: .84rem; }
.kem-tanda { display: flex; gap: 12px; flex-wrap: wrap; font-size: .84rem; }
.kem-pilih { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); max-height: 460px; overflow: auto; border-top: 1px solid var(--garis); }
.kem-calon { display: flex; gap: 10px; align-items: flex-start; padding: 8px 16px; border-bottom: 1px solid var(--garis); cursor: pointer; }
.kem-calon input { margin-top: 4px; width: 18px; height: 18px; flex: none; }
.kem-calon span { display: grid; } .kem-calon small { color: var(--kabus); font-size: .76rem; }
.kem-calon:has(input:checked) { background: var(--hijau-latar); }
@media (max-width: 760px) {
  .kem-baris { grid-template-columns: 24px 1fr auto; }
  .kem-baris .kem-peranan, .kem-baris .kem-tanda { grid-column: 2 / -1; }
  .kem-baris > button { grid-row: 1; grid-column: 3; }
}
.surat-kem { font-size: 10.5pt; line-height: 1.45; }
.surat-kem p { margin: 0 0 7px; }
.surat-kem hr { border: 0; border-top: 2px solid #000; margin: 6px 0 10px; }
.surat-kem table.ruj, .surat-kem table.butiran { width: auto; margin: 0 0 8px; border: 0; }
.kertas-cetak .surat-kem table.ruj td, .kertas-cetak .surat-kem table.butiran td { border: 0; padding: 0 10px 1px 0; }
.surat-kem table.ruj { margin-left: auto; }
.surat-kem table.butiran { margin-left: 22px; }
.surat-kem .tajuk-surat { font-weight: 700; text-decoration: underline; text-transform: uppercase; }
.surat-kem .no-para { display: inline-block; width: 22px; }
.surat-kem .barang { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; margin: 3px 0 0 22px; }
.surat-kem .barang span::before { content: "• "; }
.surat-kem .ruang-ttd { height: 26px; }
.surat-kem .keratan { border-top: 1.5px dashed #000; margin-top: 12px; padding-top: 10px; position: relative; }
.surat-kem .gunting { position: absolute; top: -10px; left: 0; background: #fff; font-size: 8pt; padding-right: 6px; }
.surat-kem .ttd-keratan { display: flex; justify-content: space-between; margin-top: 14px; }
.kertas-cetak .jadual-daftar td { height: 26px; }
@media print { .surat-kem { break-after: page; } }
.borang .tiga { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: start; }
@media (max-width: 520px) { .borang .tiga { grid-template-columns: 1fr 1fr; } }

/* ---------------- Kepala surat rasmi & surat lantikan */
.ks-kepala { display: grid; grid-template-columns: 70px 1fr 64px; align-items: center; gap: 10px; }
.ks-jata { width: 70px; height: auto; } .ks-logo { width: 60px; height: auto; justify-self: end; }
.ks-tengah { display: grid; justify-items: center; text-align: center; font-family: Arial, Helvetica, sans-serif; line-height: 1.2; }
.ks-tengah b { font-size: 11.5pt; } .ks-tengah span { font-size: 10.5pt; font-weight: 700; }
.ks-jawi { height: 20px; width: auto; margin-bottom: 3px; }
.ks-garis { border: 0; border-top: 1.5px solid #000; margin: 6px 0 10px; }
.ks-kaki { margin-top: auto; padding-top: 10px; display: grid; justify-items: center; text-align: center; font-family: Arial, Helvetica, sans-serif; font-size: 7.5pt; line-height: 1.3; border-top: 1px solid #999; }
.ks-kaki b { font-size: 8pt; }
.surat-rasmi { font-family: Arial, Helvetica, sans-serif; font-size: 10.5pt; line-height: 1.4; display: flex; flex-direction: column; min-height: 265mm; box-sizing: border-box; }
.surat-rasmi p { margin: 0 0 8px; text-align: justify; }
.sr-alamat { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.kertas-cetak .surat-rasmi table.ruj { width: auto; border: 0; margin: 0; font-size: 10.5pt; }
.kertas-cetak .surat-rasmi table.ruj td { border: 0; padding: 0 8px 0 0; }
.sr-penerima, .sr-jawatan { text-align: left !important; }
.sr-tajuk { font-weight: 700; text-transform: uppercase; }
.sr-no { display: inline-block; width: 26px; }
.sr-ruang { height: 34px; }
.sr-ttd { text-align: left !important; }
.sr-sk { font-size: 9pt; text-align: left !important; } .sr-sk span { padding-left: 30px; }
.sr-lampiran { text-align: right !important; font-weight: 700; }
.lampiran-lg ol { margin: 6px 0 0; padding-left: 24px; display: grid; gap: 6px; }
.lampiran-lg .pudar-cetak { text-align: center !important; color: #555; font-size: 9.5pt; }
.surat-kem .ks-kepala { grid-template-columns: 58px 1fr 52px; } .surat-kem .ks-jata { width: 58px; } .surat-kem .ks-logo { width: 50px; } .surat-kem .ks-jawi { height: 16px; }
.surat-kem .ks-tengah b { font-size: 10.5pt; } .surat-kem .ks-tengah span { font-size: 9.5pt; }
@media print { .surat-rasmi { min-height: 272mm; } }

/* ---------------- Mesyuarat kokurikulum */
.msy-bahagian { margin-bottom: 12px; }
.msy-bahagian h2 { font-size: 1rem; margin: 0 0 8px; }
.msy-item { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; padding: 8px 0; border-top: 1px solid var(--garis); align-items: start; }
.msy-item .no { color: var(--kabus); font-variant-numeric: tabular-nums; font-size: .85rem; padding-top: 1px; }
.msy-item .isi-item { display: grid; gap: 3px; }
.msy-tambah { display: grid; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--garis-kuat); }
.msy-tambah textarea { width: 100%; }
.msy-tambah select, .msy-tambah input { width: auto; min-height: 36px; padding: 4px 8px; font-size: .85rem; }
.msy-tambah input[name=oleh] { flex: 1; min-width: 150px; }
.msy-tindakan { display: grid; }
.msy-tb { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--garis); flex-wrap: wrap; }
.msy-tb > div:first-child { flex: 1; min-width: 220px; display: grid; gap: 2px; }
.seg-status { display: flex; gap: 4px; flex-wrap: wrap; }
.lencana-status { font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--amaran-latar); color: var(--amaran); white-space: nowrap; }
.lencana-status.s-selesai { background: var(--hijau-latar); color: var(--hijau); } .lencana-status.s-belum { background: var(--bahaya-latar); color: var(--bahaya); }
.msy-hadir { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 14px; font-size: .86rem; max-height: 420px; overflow: auto; }
.msy-data h3 { font-size: .98rem; margin: 16px 0 6px; } .msy-data h3:first-child { margin-top: 0; }
.msy-data table { margin-bottom: 8px; }
.memo-dok, .minit-dok { font-family: "Times New Roman", Times, serif; font-size: 11.5pt; line-height: 1.4; }
.memo-dok p, .minit-dok p { margin: 0 0 9px; text-align: justify; }
.memo-kepala { display: grid; justify-items: center; text-align: center; gap: 1px; margin-bottom: 14px; }
.memo-kepala img { width: 92px; margin-bottom: 8px; } .memo-kepala b { font-size: 11pt; }
.memo-kotak { border: 1.5px solid #000; width: 46%; margin: 4px auto 16px; padding: 6px; text-align: center; font-weight: 700; }
.kertas-cetak .memo-dok table, .kertas-cetak .minit-dok table { width: auto; border: 0; margin: 0 0 10px; font-size: 11.5pt; }
.kertas-cetak .memo-dok td, .kertas-cetak .minit-dok td { border: 0; padding: 0 12px 0 0; vertical-align: top; }
.memo-info td:first-child, .memo-butiran td:first-child { font-weight: 700; white-space: nowrap; }
.kertas-cetak .memo-butiran, .kertas-cetak .memo-agenda { margin-left: 48px !important; }
.memo-tajuk, .minit-tajuk { font-weight: 700; text-decoration: underline; }
.minit-tajuk { text-align: center; font-size: 12pt; }
.memo-no { display: inline-block; width: 48px; }
.minit-nama { margin: 0 0 10px; padding-left: 28px; }
.minit-bahagian { font-size: 11.5pt; margin: 14px 0 6px; }
.minit-item { display: grid; grid-template-columns: 1fr 150px; gap: 12px; margin-bottom: 8px; break-inside: avoid; }
.minit-teks { display: grid; grid-template-columns: 42px 1fr; text-align: justify; }
.minit-tindakan { font-weight: 700; font-size: 10.5pt; }

  function bacaDaftar(rows, units) {
    const iT = cariTajuk(rows);
    if (iT < 0) throw new Error('Tajuk lajur "BIL" dan "NAMA" tidak dijumpai. Pastikan helaian ialah DAFTAR KOKUM.');
    const p = petaLajur(rows[iT]);
    if (p.nama == null) throw new Error('Lajur nama murid tidak dijumpai.');
    const unitPeta = new Map((units || []).map((u) => [u.kod, u]));
    const ambil = (r, k) => (p[k] == null ? '' : r[p[k]]);
    const murid = [];
    const amaran = [];

    for (let i = iT + 1; i < rows.length; i++) {
      const r = rows[i] || [];
      const nama = besar(ambil(r, 'nama'));
      if (!nama || nama === '0') continue;
      const bilMentah = bersih(ambil(r, 'bil'));
      if (p.bil != null && !/^\d+$/.test(bilMentah)) continue;
      const kelas = besar(ambil(r, 'kelas'));
      const rec = {
        baris: i + 1,
        bil_asal: bilMentah ? +bilMentah : null,
        nama,
        tingkatan: normalTingkatan(ambil(r, 'tingkatan'), kelas),
        kelas,
        mykad: normalMykad(ambil(r, 'mykad')),
        jantina: normalJantina(ambil(r, 'jantina')),
        rumah_sukan: besar(ambil(r, 'rumah_sukan')),
        status: besar(ambil(r, 'keluar')) ? 'keluar' : 'aktif',
        ub: normalKod(ambil(r, 'ub')), ub_jawatan: besar(ambil(r, 'ub_jawatan')),
        kp: normalKod(ambil(r, 'kp')), kp_jawatan: besar(ambil(r, 'kp_jawatan')),
        sp: normalKod(ambil(r, 'sp')), sp_jawatan: besar(ambil(r, 'sp_jawatan')),
      };
      const isu = semakMurid(rec, unitPeta);
      if (!rec.tingkatan) isu.unshift({ tahap: 'ralat', mesej: 'Tingkatan tidak dikenali' });
      if (!rec.kelas) isu.unshift({ tahap: 'ralat', mesej: 'Kelas kosong' });
      isu.forEach((x) => amaran.push({ baris: rec.baris, nama, ...x }));
      murid.push(rec);
    }

    // rekod berganda dalam fail
    const ikutKad = new Map(), ikutNama = new Map();
    murid.forEach((m) => {
      if (m.mykad) {
        if (ikutKad.has(m.mykad)) amaran.push({ baris: m.baris, nama: m.nama, tahap: 'ralat', mesej: `No. MyKad sama dengan baris ${ikutKad.get(m.mykad)}` });
        else ikutKad.set(m.mykad, m.baris);
      }
      if (ikutNama.has(m.nama)) amaran.push({ baris: m.baris, nama: m.nama, tahap: 'amaran', mesej: `Nama sama dengan baris ${ikutNama.get(m.nama)}` });
      else ikutNama.set(m.nama, m.baris);
    });

    const boleh = murid.filter((m) => m.tingkatan && m.kelas);
    return {
      lajur: p,
      murid: boleh,
      ditolak: murid.length - boleh.length,
      amaran: amaran.sort((a, b) => a.baris - b.baris),
    };
  }

  function semakMurid(m, unitPeta) {
    const isu = [];
    if (!m.mykad) isu.push({ tahap: 'amaran', mesej: 'Tiada No. MyKad' });
    else if (!mykadSah(m.mykad)) isu.push({ tahap: 'amaran', mesej: `No. MyKad tidak sah (${m.mykad})` });
    else if (m.jantina && jantinaMykad(m.mykad) !== m.jantina) isu.push({ tahap: 'amaran', mesej: 'Jantina tidak sepadan dengan digit akhir MyKad' });
    if (!m.jantina) isu.push({ tahap: 'amaran', mesej: 'Jantina kosong' });
    if (unitPeta && unitPeta.size) {
      for (const kat of ['ub', 'kp', 'sp']) {
        const kod = m[kat];
        if (!kod) continue;
        const u = unitPeta.get(kod);
        if (!u) isu.push({ tahap: 'ralat', mesej: `Kod ${kat.toUpperCase()} "${kod}" tiada dalam senarai unit` });
        else if (u.kategori !== kat.toUpperCase()) isu.push({ tahap: 'ralat', mesej: `${kod} bukan unit ${kat.toUpperCase()}` });
        else if (u.jantina && m.jantina && u.jantina !== m.jantina) isu.push({ tahap: 'amaran', mesej: `${kod} untuk murid ${u.jantina === 'P' ? 'perempuan' : 'lelaki'} sahaja` });
      }
    }
    return isu;
  }

  function jarak(a, b, had) {
    if (Math.abs(a.length - b.length) > had) return had + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let min = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (cur[j] < min) min = cur[j];
      }
      if (min > had) return had + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  /** Pasangan murid yang mungkin rekod berganda (nama hampir sama). */
  function cariBerganda(senarai) {
    const hasil = [];
    const kunci = (n) => besar(n).replace(/\b(BIN|BINTI|BT|B)\b\.?/g, '').replace(/[^A-Z]/g, '');
    const arr = senarai.map((m) => ({ m, k: kunci(m.nama) })).sort((x, y) => x.k.length - y.k.length);
    for (let i = 0; i < arr.length; i++) {
      for (let j = i + 1; j < arr.length; j++) {
        const a = arr[i], b = arr[j];
        if (b.k.length - a.k.length > 2) break;
        if (a.m.mykad && b.m.mykad && a.m.mykad === b.m.mykad) { hasil.push([a.m, b.m, 'No. MyKad sama']); continue; }
        // Dua MyKad sah yang berbeza = dua orang berbeza (adik-beradik, kembar).
        if (mykadSah(a.m.mykad) && mykadSah(b.m.mykad)) continue;
        if (a.k.length < 8) continue;
        const d = jarak(a.k, b.k, 2);
        if (d <= (a.k.length > 14 ? 2 : 1)) hasil.push([a.m, b.m, d === 0 ? 'Nama sama' : 'Nama hampir sama']);
      }
    }
    return hasil;
  }

  const api = { bacaDaftar, semakMurid, cariBerganda, normalMykad, mykadSah, jantinaMykad, tarikhLahir, normalTingkatan };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.KokumImport = api;
})(typeof window !== 'undefined' ? window : globalThis);

  // Data contoh: murid rekaan untuk mencuba aplikasi. Bukan murid sebenar.
  function janaContoh(units) {
    let benih = 20261011;
    const rawak = () => { benih = (benih * 1103515245 + 12345) % 2147483648; return benih / 2147483648; };
    const pilih = (a) => a[Math.floor(rawak() * a.length)];
    const L = ['ADRIAN', 'HAFIZ', 'JOVEN', 'RAYNOLD', 'AIMAN', 'DARREN', 'ELVIS', 'FIRDAUS', 'GERALD', 'IKHWAN', 'JASON', 'KELVIN', 'MARVIN', 'NAZRIN', 'RIZAL', 'SHAWN', 'TERENCE', 'WILFRED'];
    const P = ['AMIRA', 'BELINDA', 'CHRISTINA', 'DAYANG', 'ELVIRA', 'FARAH', 'GLORIA', 'HANNAH', 'IRENE', 'JESLYN', 'KATRINA', 'MELISA', 'NUR AINA', 'ROSALIND', 'SITI HAJAR', 'VALERIE', 'YVONNE', 'ZAHIRAH'];
    const BAPA = ['JAMIL', 'GANDING', 'SAPIN', 'LOJIUS', 'MAJIMBUN', 'TINGGANG', 'RAMLI', 'ODOI', 'SULAIMAN', 'GUNDA', 'KUNTOH', 'ABDULLAH', 'MOJINUN', 'SINDUN', 'JUANIS'];
    const KELAS = ['AMANAH', 'BESTARI', 'CEMERLANG'];
    const ikutKat = (k) => units.filter((u) => u.kategori === k);
    const murid = [];
    let n = 0;
    ['1', '2', '3', '4', '5'].forEach((ting) => KELAS.forEach((kls) => {
      for (let i = 0; i < 20; i++) {
        const jantina = rawak() < 0.52 ? 'P' : 'L';
        const islam = rawak() < 0.35;
        const nama = (jantina === 'L' ? pilih(L) : pilih(P)) + (islam ? (jantina === 'L' ? ' BIN ' : ' BINTI ') : ' ') + pilih(BAPA);
        const tahunLahir = 2026 - 12 - (+ting) + 1;
        const bb = 1 + Math.floor(rawak() * 12), hh = 1 + Math.floor(rawak() * 28);
        let akhir = Math.floor(rawak() * 9000) + 1000;
        if ((akhir % 2 === 1) !== (jantina === 'L')) akhir += 1;
        const mykad = String(tahunLahir).slice(2) + String(bb).padStart(2, '0') + String(hh).padStart(2, '0') + '99' + String(akhir % 10000).padStart(4, '0');
        const sesuai = (u) => !u.jantina || u.jantina === jantina;
        const m = { id: 'contoh-' + (++n), nama, tingkatan: ting, kelas: `${ting} ${kls}`, mykad, jantina, rumah_sukan: null, status: 'aktif', catatan: null, bil_asal: n };
        ['UB', 'KP', 'SP'].forEach((k) => {
          const calon = ikutKat(k).filter(sesuai).filter((u) => k !== 'UB' || u.kod !== 'PPIM' || islam);
          m[k.toLowerCase()] = rawak() < 0.06 ? null : pilih(calon).kod;
          m[k.toLowerCase() + '_jawatan'] = null;
        });
        murid.push(m);
      }
    }));
    return murid;
  }

      async f2KemasPerjumpaan(rows) {
        const F = baca().f2;
        const hasil = rows.map((r) => { const x = F.perjumpaan.find((p) => p.id === r.id); if (!x) throw new Error('Perjumpaan tidak dijumpai');
          Object.assign(x, pilih(r, MEDAN_PJ.filter((k) => k !== 'tahun' && k !== 'kategori' && k !== 'bil'))); return x; });
        tulis(); return salin(hasil);
      },
      async f2SusunPerjumpaan(tahun) {
        const F = baca().f2, kat = {};
        F.perjumpaan.filter((p) => p.tahun === tahun).sort((p, q) => p.tarikh.localeCompare(q.tarikh) || p.bil - q.bil)
          .forEach((p) => { kat[p.kategori] = (kat[p.kategori] || 0) + 1; p.bil = kat[p.kategori]; });
        tulis();
      },
      async f2PadamPerjumpaan(ids) { const F = baca().f2, s2 = new Set(ids); F.perjumpaan = F.perjumpaan.filter((p) => !s2.has(p.id)); F.kehadiran = F.kehadiran.filter((k) => !s2.has(k.perjumpaan_id)); F.rancangan = F.rancangan.filter((r) => !s2.has(r.perjumpaan_id)); tulis(); },
      async f2SimpanAktiviti(a) {
        const F = baca().f2, data = pilih(a, MEDAN_AK);
        let x = a.id && F.aktiviti.find((y) => y.id === a.id);
        if (!x) { x = { id: F.n++, dicipta: new Date().toISOString() }; F.aktiviti.push(x); }
        Object.assign(x, data); tulis(); return salin(x);
      },
      async f2PadamAktiviti(id) { const F = baca().f2; F.aktiviti = F.aktiviti.filter((a) => a.id !== id); tulis(); },
      async f2SimpanRancangan(rows) {
        const F = baca().f2;
        const hasil = rows.map((r) => { let x = F.rancangan.find((y) => y.perjumpaan_id === r.perjumpaan_id && y.unit_kod === r.unit_kod);
          if (!x) { x = { status: 'dirancang' }; F.rancangan.push(x); } Object.assign(x, pilih(r, ['perjumpaan_id', 'unit_kod', 'tajuk', 'tempat', 'catatan', 'status']), { dikemas: new Date().toISOString() }); return x; });
        tulis(); return salin(hasil);
      },
      async f2SimpanKehadiran(rows) {
        const F = baca().f2;
        const hasil = rows.map((r) => { let x = F.kehadiran.find((y) => y.perjumpaan_id === r.perjumpaan_id && y.murid_id === r.murid_id);
          if (!x) { x = {}; F.kehadiran.push(x); } Object.assign(x, pilih(r, ['perjumpaan_id', 'murid_id', 'unit_kod', 'status', 'catatan']), { dikemas: new Date().toISOString() }); return x; });
        tulis(); return salin(hasil);
      },
      async f2PadamKehadiran(pid, mids) { const F = baca().f2, s2 = new Set(mids); F.kehadiran = F.kehadiran.filter((k) => !(k.perjumpaan_id === pid && s2.has(k.murid_id))); tulis(); },
      async f2HadirRingkas(tahun) { return salin(this._hadir(baca().f2, tahun)); },
      async f2SimpanOpr(o) {
        const F = baca().f2; let x = o.id && F.opr.find((y) => y.id === o.id);
        if (!x) { x = { id: uuid(), dicipta: new Date().toISOString(), gambar: [] }; F.opr.push(x); }
        Object.assign(x, pilih(o, MEDAN_OPR), { dikemas: new Date().toISOString() }); tulis(); return salin(x);
      },
      async f2PadamOpr(o) { const F = baca().f2; (o.gambar || []).forEach((g) => { delete F.gambar[g.path]; }); F.opr = F.opr.filter((y) => y.id !== o.id); tulis(); },
      async f2MuatNaikGambar(path, blob) {
        const url = await new Promise((ok, x) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = x; r.readAsDataURL(blob); });
        baca().f2.gambar[path] = url; tulis(); return path;
      },
      async f2PadamGambar(paths) { const F = baca().f2; paths.forEach((p) => { delete F.gambar[p]; }); tulis(); },
      async f2UrlGambar(paths) { const G = baca().f2.gambar; return Object.fromEntries(paths.filter((p) => G[p]).map((p) => [p, G[p]])); },
      async f2SimpanPajsk(rows) {
        const F = baca().f2;
        const hasil = rows.map((r) => { let x = F.pajsk.find((y) => y.murid_id === r.murid_id && y.tahun === r.tahun && y.bidang === r.bidang);
          if (!x) { x = {}; F.pajsk.push(x); } Object.assign(x, pilih(r, ['murid_id', 'tahun', 'bidang', 'unit_kod', 'data', 'markah']), { dikemas: new Date().toISOString() }); return x; });
        tulis(); return salin(hasil);
      },
      async f2SimpanPencapaian(rows) {
        const F = baca().f2; if (!F.pencapaian) F.pencapaian = [];
        const baru = rows.map((r) => ({ ...pilih(r, MEDAN_PC), id: uuid(), oleh: 'demo', dicipta: new Date().toISOString() }));
        F.pencapaian.push(...baru); tulis(); return salin(baru);
      },
      async f2PadamPencapaian(id) { const F = baca().f2; F.pencapaian = (F.pencapaian || []).filter((x) => x.id !== id); tulis(); },
      async f2SimpanLaporan(r) {
        const F = baca().f2; let x = F.laporan.find((y) => y.unit_kod === r.unit_kod && y.tahun === r.tahun);
        if (!x) { x = {}; F.laporan.push(x); } Object.assign(x, pilih(r, ['unit_kod', 'tahun', 'data']), { dikemas: new Date().toISOString() }); tulis(); return salin(x);
      },
      async setRumahPukal(ids, rumah, kemajuan) {
        const d = baca(), set = new Set(ids);
        d.murid.forEach((m) => { if (set.has(m.id)) m.rumah_sukan = rumah || null; });
        catat('murid', 'UPDATE', `Rumah sukan ${rumah || '(kosong)'}: ${ids.length} murid`); tulis();
        if (kemajuan) kemajuan(ids.length, ids.length);
      },
      async setGuruUnit() {},
      async log(had) { return salin(baca().log.slice(0, had || 200)); },
      reset() { ingatan = null; try { localStorage.removeItem(KUNCI); } catch (e) { /* abai */ } const d = baca(); delete d.baharu; tulis(); },
      isiContoh() { const d = baca(); d.murid = janaContoh(d.units); d.contoh = true; d.log = []; catat('murid', 'IMPORT', 'Data contoh dimuatkan'); tulis(); },
    };
  }

  window.KokumDB = { SupabaseDB, DemoDB, terjemah, UNIT_ASAS };
})();

<script>
/* KOKUM SMART · mod luar talian
   - Bacaan: setiap data yang berjaya dimuat disimpan dalam peranti (IndexedDB). Jika tiada internet, salinan terakhir dipaparkan.
   - Tulisan penting (kehadiran, rancangan, OPR + gambar, PAJSK, pencapaian, laporan, keputusan olahraga, perkhemahan)
     dimasukkan ke "peti keluar" jika tiada internet, dan dihantar sendiri mengikut turutan apabila talian pulih.
   - Perubahan lain (murid, unit, tetapan, akaun) masih memerlukan internet. */
(function () {
  'use strict';
  const NAMA_DB = 'kokum-luar-talian', VERSI_DB = 1;
  const KUNCI_PENGGUNA = 'kokum_pengguna_terakhir';

  // ------------------------------------------------------------------ IndexedDB (dengan sandaran dalam ingatan)
  let dbJanji = null;
  const ingatan = { cache: new Map(), outbox: new Map() };
  let nIngatan = 0;
  function idb() {
    if (!dbJanji) {
      dbJanji = new Promise((ok, tolak) => {
        try {
          const r = indexedDB.open(NAMA_DB, VERSI_DB);
          r.onupgradeneeded = () => {
            const d = r.result;
            if (!d.objectStoreNames.contains('cache')) d.createObjectStore('cache');
            if (!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox', { keyPath: 'n', autoIncrement: true });
          };
          r.onsuccess = () => ok(r.result);
          r.onerror = () => tolak(r.error);
          r.onblocked = () => tolak(new Error('IndexedDB disekat'));
        } catch (err) { tolak(err); }
      }).catch((err) => { console.warn('IndexedDB tidak tersedia, guna ingatan sahaja', err); return null; });
    }
    return dbJanji;
  }
  // Jalankan op pada kedai IndexedDB; jika IndexedDB tiada, guna Map dalam ingatan
  async function kedai(nama, mod, fnIdb, fnIngatan) {
    let d = null;
    try { d = await idb(); } catch (err) { d = null; }
    if (!d) return fnIngatan(ingatan[nama]);
    try {
      return await new Promise((ok, tolak) => {
        const t = d.transaction(nama, mod), s = t.objectStore(nama);
        let hasil;
        const r = fnIdb(s);
        if (r) r.onsuccess = () => { hasil = r.result; };
        t.oncomplete = () => ok(hasil);
        t.onerror = () => tolak(t.error);
        t.onabort = () => tolak(t.error || new Error('Transaksi dibatalkan'));
      });
    } catch (err) { console.warn('IndexedDB', err); return fnIngatan(ingatan[nama]); }
  }
  const cacheAmbil = (k) => kedai('cache', 'readonly', (s) => s.get(k), (m) => m.get(k)).then((v) => v || null);
  const cacheLetak = (k, v) => kedai('cache', 'readwrite', (s) => s.put(v, k), (m) => { m.set(k, v); });
  const cacheKosong = () => kedai('cache', 'readwrite', (s) => s.clear(), (m) => { m.clear(); });
  const outboxSemua = () => kedai('outbox', 'readonly', (s) => s.getAll(), (m) => [...m.values()]).then((v) => v || []);
  const outboxTambah = (item) => kedai('outbox', 'readwrite', (s) => s.add(item), (m) => { item.n = ++nIngatan; m.set(item.n, item); });
  const outboxKemas = (item) => kedai('outbox', 'readwrite', (s) => s.put(item), (m) => { m.set(item.n, item); });
  const outboxPadam = (n) => kedai('outbox', 'readwrite', (s) => s.delete(n), (m) => { m.delete(n); });

  // ------------------------------------------------------------------ bantuan
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    const b = new Uint8Array(16); crypto.getRandomValues(b);
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }
  const kini = () => new Date().toISOString();
  const MESEJ_RANGKAIAN = /Tiada sambungan ke pelayan|Failed to fetch|NetworkError|Load failed|network|timeout|tamat masa|aborted/i;
  const rangkaian = (err) => !!err && (err.rangkaian || MESEJ_RANGKAIAN.test(err.message || String(err)) || (typeof navigator !== 'undefined' && navigator.onLine === false));
  const kodRalat = (err) => (err && ((err.asal && (err.asal.code || err.asal.statusCode)) || err.code)) || '';
  const pendua = (err) => String(kodRalat(err)) === '23505' || /duplicate key|already exists|sudah wujud/i.test((err && err.message) || '');
  const upsertKe = (senarai, baris, sama) => {
    baris.forEach((r) => { const i = senarai.findIndex((x) => sama(x, r)); if (i >= 0) senarai[i] = { ...senarai[i], ...r }; else senarai.push(r); });
  };

  // ------------------------------------------------------------------ jenis operasi
  const BACA = ['profilSaya', 'muatSemua', 'aisMuat', 'aisMuatRekod', 'aisMuatSejarah', 'f2Muat', 'f2KehadiranUnit', 'f2HadirRingkas', 'kemMuat', 'lgMuat', 'msyMuat'];

  // Setiap tulisan yang boleh beratur: sedia (beri id sebelah peranti), optimis (hasil segera), label, tampal (gabung ke data bacaan)
  const TULIS = {
    f2SimpanKehadiran: {
      label: ([rows]) => `Kehadiran ${rows[0] ? rows[0].unit_kod : ''} · ${rows.length} murid`,
      optimis: ([rows]) => rows.map((r) => ({ catatan: null, ...r, dikemas: kini() })),
      tampal: { f2KehadiranUnit: (data, [kod, ids], hasil) => { const s = new Set(ids); upsertKe(data, hasil.filter((r) => r.unit_kod === kod && s.has(r.perjumpaan_id)), (x, r) => x.perjumpaan_id === r.perjumpaan_id && x.murid_id === r.murid_id); } },
    },
    f2SimpanRancangan: {
      label: ([rows]) => `Rancangan perjumpaan ${rows[0] ? rows[0].unit_kod : ''}`,
      optimis: ([rows]) => rows.map((r) => ({ ...r, dikemas: kini() })),
      tampal: { f2Muat: (data, [tahun], hasil) => { const ids = new Set(data.perjumpaan.map((p) => p.id)); upsertKe(data.rancangan, hasil.filter((r) => ids.has(r.perjumpaan_id)), (x, r) => x.perjumpaan_id === r.perjumpaan_id && x.unit_kod === r.unit_kod); } },
    },
    f2SimpanPajsk: {
      label: ([rows]) => `PAJSK · ${rows.length} murid`,
      optimis: ([rows]) => rows.map((r) => ({ ...r, dikemas: kini() })),
      tampal: { f2Muat: (data, [tahun], hasil) => upsertKe(data.pajsk, hasil.filter((r) => +r.tahun === +tahun), (x, r) => x.murid_id === r.murid_id && x.bidang === r.bidang) },
    },
    f2SimpanPencapaian: {
      sedia: ([rows]) => [rows.map((r) => ({ ...r, id: r.id || uuid() }))],
      label: ([rows]) => `Pencapaian/penglibatan · ${rows.length} rekod`,
      optimis: ([rows], uid) => rows.map((r) => ({ ...r, oleh: uid, dicipta: kini() })),
      tampal: { f2Muat: (data, [tahun], hasil) => { if (data.pencapaian) upsertKe(data.pencapaian, hasil.filter((r) => +r.tahun === +tahun), (x, r) => x.id === r.id); } },
      penduaOk: true,
    },
    f2SimpanLaporan: {
      label: ([r]) => `Buku laporan ${r.unit_kod}`,
      optimis: ([r]) => ({ ...r, dikemas: kini() }),
      tampal: { f2Muat: (data, [tahun], hasil) => { if (+hasil.tahun === +tahun) upsertKe(data.laporan, [hasil], (x, r) => x.unit_kod === r.unit_kod); } },
    },
    f2SimpanOpr: {
      sedia: ([o]) => [o.id ? o : { ...o, id: uuid(), _baru: true }],
      label: ([o]) => `${o._baru ? 'OPR baharu' : 'Kemas kini OPR'} ${o.unit_kod}: ${o.tajuk || ''}`,
      optimis: ([o]) => { const r = { ...o, dikemas: kini() }; delete r._baru; return r; },
      tampal: { f2Muat: (data, [tahun], hasil) => { if (+hasil.tahun === +tahun) upsertKe(data.opr, [hasil], (x, r) => x.id === r.id); } },
    },
    f2MuatNaikGambar: {
      label: ([path]) => `Gambar OPR ${String(path).split('/')[0]}`,
      optimis: ([path]) => path,
    },
    aisSimpanKeputusan: {
      label: ([rows]) => `Keputusan olahraga · ${rows.length} baris`,
      optimis: ([rows]) => rows.map((r) => ({ ...r, dikemas: kini() })),
      tampal: { aisMuat: (data, args, hasil) => upsertKe(data.keputusan, hasil, (x, r) => x.id === r.id) },
    },
    aisGantiKeputusan: {
      sedia: ([acara, pus, rows]) => [acara, pus, rows.map((r) => ({ ...r, id: uuid() }))],
      label: ([, pus, rows]) => `Senarai ${pus} olahraga · ${rows.length} baris`,
      optimis: ([acara, pus, rows]) => rows.map((r) => ({ siri: 1, ...r, acara_id: acara, pusingan: pus, dikemas: kini() })),
      tampal: { aisMuat: (data, [acara, pus], hasil) => { data.keputusan = data.keputusan.filter((x) => !(x.acara_id === acara && x.pusingan === pus)).concat(hasil); } },
    },
    kemSimpanPeserta: {
      label: ([rows]) => `Peserta perkhemahan · ${rows.length} murid`,
      optimis: ([rows]) => rows.map((r) => ({ ...r, dikemas: kini() })),
      tampal: { kemMuat: (data, args, hasil) => { const ids = new Set(data.kem.map((k) => k.id)); upsertKe(data.peserta, hasil.filter((r) => ids.has(r.kem_id)), (x, r) => x.kem_id === r.kem_id && x.murid_id === r.murid_id); } },
    },
    kemSimpanUnit: {
      label: ([r]) => `Guru pengiring perkhemahan ${r.unit_kod}`,
      optimis: ([r]) => ({ ...r, dikemas: kini() }),
      tampal: { kemMuat: (data, args, hasil) => { if (data.kem.some((k) => k.id === hasil.kem_id)) upsertKe(data.unit, [hasil], (x, r) => x.kem_id === r.kem_id && x.unit_kod === r.unit_kod); } },
    },
  };

  // ------------------------------------------------------------------ pembalut
  function balut(asal, opsyen = {}) {
    const TEKS = { tiadaData: 'Tiada sambungan internet, dan data ini belum pernah dibuka pada peranti ini. Buka bahagian ini sekali semasa ada internet supaya ia tersimpan untuk kegunaan luar talian.',
      perluTalian: 'Tiada sambungan internet. Perubahan jenis ini perlu disimpan semasa ada internet. (Kehadiran, OPR, PAJSK dan keputusan olahraga boleh disimpan tanpa internet.)', ...(opsyen.teks || {}) };
    let uid = null;
    let luar = typeof navigator !== 'undefined' && navigator.onLine === false;
    let cacheDiguna = null; // masa data simpanan tertua yang sedang dipaparkan
    let menghantar = null;
    let bil = { menunggu: 0, gagal: 0 };
    const pendengar = new Set();
    const status = () => ({ luar, menghantar: !!menghantar, menunggu: bil.menunggu, gagal: bil.gagal, cacheDiguna });
    const umum = () => pendengar.forEach((f) => { try { f(status()); } catch (err) { console.error(err); } });
    const tandaLuar = () => { if (!luar) { luar = true; umum(); } };
    const tandaDalam = () => { if (luar || cacheDiguna) { luar = false; cacheDiguna = null; umum(); } };

    try { const p = JSON.parse(localStorage.getItem(KUNCI_PENGGUNA) || 'null'); if (p) uid = p.id; } catch (err) { /* abaikan */ }
    const kunci = (nama, args) => `${uid || '-'}|${nama}|${JSON.stringify(args)}`;

    async function itemSaya() { return (await outboxSemua()).filter((x) => x.uid === uid).sort((a, b) => a.n - b.n); }
    async function kiraSemula() {
      const l = await itemSaya();
      bil = { menunggu: l.filter((x) => !x.ralat).length, gagal: l.filter((x) => x.ralat).length };
      umum();
      return l;
    }

    async function tampalSemua(nama, args, data) {
      if (data == null) return data;
      const l = await itemSaya();
      l.forEach((it) => { const t = TULIS[it.nama] && TULIS[it.nama].tampal && TULIS[it.nama].tampal[nama]; if (t && it.hasil != null) { try { t(data, args, it.hasil); } catch (err) { console.warn('tampal', err); } } });
      return data;
    }

    async function baca(nama, args) {
      const k = kunci(nama, args);
      if (navigator.onLine === false) {
        let c = await cacheAmbil(k);
        if (!c && nama === 'f2HadirRingkas') { const m = await cacheAmbil(kunci('f2Muat', args)); if (m) c = { data: m.data.hadir, masa: m.masa }; }
        if (c) { luar = true; cacheDiguna = Math.min(cacheDiguna || Infinity, c.masa); umum(); return tampalSemua(nama, args, c.data); }
      } else if (bil.menunggu) {
        await hantar().catch(() => {});
      }
      try {
        const d = await asal[nama](...args);
        cacheLetak(k, { data: d, masa: Date.now() });
        tandaDalam();
        return tampalSemua(nama, args, d);
      } catch (err) {
        if (!rangkaian(err)) throw err;
        let c = await cacheAmbil(k);
        if (!c && nama === 'f2HadirRingkas') { const m = await cacheAmbil(kunci('f2Muat', args)); if (m) c = { data: m.data.hadir, masa: m.masa }; }
        luar = true;
        if (c) { cacheDiguna = Math.min(cacheDiguna || Infinity, c.masa); umum(); return tampalSemua(nama, args, c.data); }
        umum();
        const e2 = new Error(TEKS.tiadaData);
        e2.rangkaian = true;
        throw e2;
      }
    }

    async function tulis(nama, argsAsal) {
      const def = TULIS[nama];
      const args = def.sedia ? def.sedia(argsAsal) : argsAsal;
      const adaBaris = (await itemSaya()).length > 0;
      if (!adaBaris && navigator.onLine !== false) {
        try { const h = await asal[nama](...args); tandaDalam(); return h; } catch (err) { if (!rangkaian(err)) throw err; }
      }
      const hasil = def.optimis(args, uid);
      let label = nama; try { label = def.label(args); } catch (err) { /* abaikan */ }
      await outboxTambah({ uid, nama, args, hasil, label, masa: Date.now(), cubaan: 0, ralat: null });
      luar = luar || navigator.onLine === false || !adaBaris;
      await kiraSemula();
      if (adaBaris && navigator.onLine !== false) hantar();
      return hasil;
    }

    // Hantar peti keluar mengikut turutan. Item yang ditolak pelayan (bukan masalah talian) ditanda "gagal" dan dilangkau.
    function hantar(cubaGagal) {
      if (menghantar) return menghantar;
      menghantar = (async () => {
        umum();
        let berjaya = 0, putus = false, sampai = false;
        const l = await itemSaya();
        for (const it of l) {
          if (it.ralat && !cubaGagal) continue;
          try {
            await asal[it.nama](...it.args);
            await outboxPadam(it.n); berjaya++; sampai = true;
          } catch (err) {
            if (rangkaian(err)) { putus = true; break; }
            sampai = true;
            if (TULIS[it.nama] && TULIS[it.nama].penduaOk && pendua(err)) { await outboxPadam(it.n); berjaya++; continue; }
            it.ralat = err.message || String(err); it.cubaan = (it.cubaan || 0) + 1;
            await outboxKemas(it);
          }
        }
        if (putus) luar = true; else if (sampai) { luar = false; cacheDiguna = null; }
        return berjaya;
      })().finally(async () => { menghantar = null; await kiraSemula(); });
      return menghantar;
    }

    const balutan = {};
    Object.keys(asal).forEach((nama) => {
      const f = asal[nama];
      if (typeof f !== 'function') { balutan[nama] = f; return; }
      if (BACA.includes(nama)) balutan[nama] = (...args) => baca(nama, args);
      else if (TULIS[nama]) balutan[nama] = (...args) => tulis(nama, args);
      else balutan[nama] = async (...args) => {
        try { const h = await f(...args); return h; } catch (err) {
          if (rangkaian(err) && !['masuk', 'daftar', 'lupa', 'sesi', 'keluar', 'f2UrlGambar'].includes(nama)) {
            luar = true; umum();
            const e2 = new Error(TEKS.perluTalian);
            e2.rangkaian = true; e2.asal = err;
            throw e2;
          }
          throw err;
        }
      };
    });
    balutan.onAuth = asal.onAuth;

    balutan.sesi = async () => {
      let u = null, ralat = null;
      try { u = await asal.sesi(); } catch (err) { ralat = err; }
      if (u) {
        uid = u.id;
        try { localStorage.setItem(KUNCI_PENGGUNA, JSON.stringify({ id: u.id, email: u.email, user_metadata: u.user_metadata || {} })); } catch (err) { /* abaikan */ }
        kiraSemula();
        return u;
      }
      // Tiada internet: token mungkin tamat tetapi sesi masih tersimpan. Guna pengguna terakhir supaya data simpanan boleh dibuka.
      const adaToken = (() => { try { return Object.keys(localStorage).some((k) => /^sb-.*-auth-token$/.test(k)); } catch (err) { return false; } })();
      // (Supabase memadam token jika sesi benar-benar tidak sah; token yang masih ada bermakna gagal kerana talian.)
      if (adaToken) {
        try { const p = JSON.parse(localStorage.getItem(KUNCI_PENGGUNA) || 'null'); if (p) { uid = p.id; luar = true; kiraSemula(); return p; } } catch (err) { /* abaikan */ }
      }
      if (ralat) throw ralat;
      return null;
    };
    balutan.keluar = async () => {
      await asal.keluar().catch(() => {});
      try { localStorage.removeItem(KUNCI_PENGGUNA); } catch (err) { /* abaikan */ }
      await cacheKosong();
      uid = null; luar = false; cacheDiguna = null; bil = { menunggu: 0, gagal: 0 }; umum();
    };

    // API peti keluar untuk paparan
    balutan.luar = {
      status,
      dengar(f) { pendengar.add(f); f(status()); return () => pendengar.delete(f); },
      senarai: itemSaya,
      hantar: (cubaGagal) => hantar(cubaGagal),
      async buang(n) { await outboxPadam(n); await kiraSemula(); },
      kiraSemula,
      // isyarat daripada luar (contoh: denyutan ke laptop hari sukan)
      tandaTalian(ok) { if (ok) { const tadi = luar; tandaDalam(); if (tadi && bil.menunggu) hantar(); } else tandaLuar(); },
      // gambar OPR yang belum dimuat naik: papar daripada peranti
      async urlTempatan(paths) {
        const l = (await itemSaya()).filter((x) => x.nama === 'f2MuatNaikGambar' && paths.includes(x.args[0]));
        return Object.fromEntries(l.map((x) => [x.args[0], URL.createObjectURL(x.args[1])]));
      },
    };
    const urlAsal = balutan.f2UrlGambar;
    if (urlAsal) balutan.f2UrlGambar = async (paths) => {
      const tempatan = await balutan.luar.urlTempatan(paths).catch(() => ({}));
      const lain = paths.filter((p) => !tempatan[p]);
      let jauh = {};
      if (lain.length) { try { jauh = await urlAsal(lain); } catch (err) { if (!Object.keys(tempatan).length) throw err; } }
      return { ...jauh, ...tempatan };
    };

    window.addEventListener('online', () => { hantar(); });
    window.addEventListener('offline', () => { tandaLuar(); });
    setInterval(() => { if (bil.menunggu && navigator.onLine !== false) hantar(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && bil.menunggu) hantar(); });
    setTimeout(() => { kiraSemula().then(() => { if (bil.menunggu) hantar(); }); }, 1500);
    return balutan;
  }

  window.KokumLuarTalian = { balut, uuid, rangkaian };
})();

<script>
/* KOKUM SMART · Mod Hari Sukan (intranet di padang, tanpa internet)
   Laptop TIC menjalankan hari-sukan/pelayan.py. Telefon pencatat bersambung ke WiFi laptop dan membuka
   http://<ip-laptop>:8080. Semua data kejohanan disimpan di laptop; papan markah dan juruhebah dikemas kini langsung.
   Sebelum/selepas kejohanan, laptop memuat turun / menghantar data ke Supabase apabila ada internet. */
(function () {
  'use strict';
  if (!window.KOKUM_HARI_SUKAN) return;

  const LOKAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  const K_SESI = 'kokum_hs_sesi', K_UMUM = 'kokum_hs_diumum';
  const URL_SB = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
  const MEDAN_KEP = ['acara_id', 'pusingan', 'siri', 'lorong', 'murid_id', 'rumah', 'ahli', 'prestasi', 'nilai', 'cubaan', 'status', 'kedudukan', 'catatan'];
  const MEDAN_JADUAL = ['no_acara', 'hari', 'masa', 'no_saringan', 'hari_saringan', 'masa_saringan'];
  const LABEL_KAT = { P15: 'Perempuan 15', L15: 'Lelaki 15', P18: 'Perempuan 18', L18: 'Lelaki 18', PT: 'Perempuan Terbuka', LT: 'Lelaki Terbuka', P12: 'Perempuan 12', L12: 'Lelaki 12' };
  // warna rasmi rumah sukan SMK Ulu Sugut (kertas kerja olahraga)
  const WARNA_RUMAH = { ARIES: '#e8730c', CAPRICORN: '#1f6fb8', LEO: '#c62828', SCORPIO: '#e0b000', TAURUS: '#2e8b3e' };
  const pilih = (o, medan) => Object.fromEntries(medan.filter((k) => k in o).map((k) => [k, o[k] === '' ? null : o[k]]));
  const kini = () => new Date().toISOString();
  const uuid = () => window.KokumLuarTalian.uuid();
  const bacaJ = (k, lalai) => { try { return JSON.parse(localStorage.getItem(k) || 'null') ?? lalai; } catch (err) { return lalai; } };
  const tulisJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (err) { /* abaikan */ } };
  const sesiHS = () => bacaJ(K_SESI, null);

  // ------------------------------------------------------------------ panggilan ke laptop
  async function api(laluan, { kaedah = 'GET', badan, had = 12000 } = {}) {
    const s = sesiHS();
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), had);
    let res;
    try {
      res = await fetch(laluan, { method: kaedah, cache: 'no-store', signal: ac.signal,
        headers: { 'Content-Type': 'application/json', 'X-PIN': (s && s.pin) || '' }, body: badan ? JSON.stringify(badan) : undefined });
    } catch (err) {
      const e2 = new TypeError('Failed to fetch (laptop TIC)'); e2.rangkaian = true; throw e2;
    } finally { clearTimeout(t); }
    let d = null;
    try { d = await res.json(); } catch (err) { d = null; }
    if (!res.ok) { const e2 = new Error((d && d.ralat) || `Ralat laptop (${res.status})`); e2.kod = res.status; throw e2; }
    return d;
  }

  // ------------------------------------------------------------------ pangkalan data tempatan (laptop)
  const PROFIL_LAPTOP = { id: 'laptop-tic', email: 'laptop', nama: 'LAPTOP TIC', peranan: 'penyelaras', aktif: true, ais_pencatat: true };
  const namaSaya = () => (LOKAL ? 'LAPTOP TIC' : ((sesiHS() || {}).profil || {}).nama || '');

  function susunAis(d) {
    const kejohanan = d.ais_kejohanan || [];
    const k = kejohanan.find((x) => x.aktif) || kejohanan[0] || null;
    const acara = (d.ais_acara || []).filter((x) => !k || x.kejohanan_id === k.id).sort((p, q) => (p.susunan ?? 0) - (q.susunan ?? 0) || p.id - q.id);
    const ids = new Set(acara.map((x) => x.id));
    return {
      kejohanan, k, acara,
      penyertaan: (d.ais_penyertaan || []).filter((x) => ids.has(x.acara_id)),
      keputusan: (d.ais_keputusan || []).filter((x) => ids.has(x.acara_id)),
      bib: (d.ais_bib || []).filter((x) => !k || x.kejohanan_id === k.id),
      rekod: d.ais_rekod || [], sejarah: d.ais_sejarah || [], tetapan: (d.tetapan || [])[0] || null,
      fasaB: true, kotor: d.kotor || [], versi: d.versi,
    };
  }

  function DB() {
    const data = () => api('/api/data', { had: 20000 });
    const tulis = (ops) => api('/api/tulis', { kaedah: 'POST', badan: { ops, oleh: namaSaya() } });
    const tiada = (apa) => async () => { throw new Error(`${apa} tidak tersedia dalam Mod Hari Sukan. Gunakan KOKUM SMART biasa (dengan internet).`); };
    const db = {
      mod: 'harisukan',
      async sesi() { if (LOKAL) return { id: PROFIL_LAPTOP.id, email: 'laptop' }; const s = sesiHS(); return s && s.profil ? { id: s.profil.id, email: s.profil.email || '' } : null; },
      onAuth() {},
      async keluar() { try { localStorage.removeItem(K_SESI); } catch (err) { /* abaikan */ } },
      async profilSaya() { if (LOKAL) return { ...PROFIL_LAPTOP }; const s = sesiHS(); return s ? { ...s.profil } : null; },
      async muatSemua() {
        const d = await data();
        return { tetapan: (d.tetapan || [])[0] || { senarai_rumah: [] }, units: d.unit || [], murid: d.murid || [], profiles: d.profiles || [], guruUnit: [] };
      },
      async aisMuat() { return susunAis(await data()); },
      async aisMuatRekod() { return (await data()).ais_rekod || []; },
      async aisMuatSejarah() { return (await data()).ais_sejarah || []; },
      async aisSimpanKeputusan(rows) {
        if (!rows.length) return [];
        const r = await tulis([{ op: 'upsert', jadual: 'ais_keputusan', baris: rows.map((x) => ({ ...pilih(x, MEDAN_KEP), id: x.id, dikemas: kini() })) }]);
        return r.baris;
      },
      async aisGantiKeputusan(acara_id, pusingan, rows) {
        const baru = rows.map((r) => ({ siri: 1, lorong: null, murid_id: null, ahli: null, prestasi: null, nilai: null, cubaan: null, status: null, kedudukan: null, catatan: null,
          ...pilih(r, MEDAN_KEP), id: r.id || uuid(), acara_id, pusingan, dikemas: kini() }));
        await tulis([{ op: 'padam', jadual: 'ais_keputusan', tapis: { acara_id, pusingan } }].concat(baru.length ? [{ op: 'upsert', jadual: 'ais_keputusan', baris: baru }] : []));
        return baru;
      },
      // sama seperti fungsi ais_sahkan di Supabase; Supabase akan mengira semula rekod semasa keputusan dihantar
      async aisSahkan(acara_id, rasmi) {
        const d = await data();
        const a = (d.ais_acara || []).find((x) => x.id === acara_id);
        if (!a) throw new Error('Acara tidak wujud');
        const k = (d.ais_kejohanan || []).find((x) => x.id === a.kejohanan_id) || (d.ais_kejohanan || [])[0] || {};
        const ops = [{ op: 'padam', jadual: 'ais_rekod', tapis: { acara_id } }];
        let baru = false;
        if (rasmi) {
          const kp = (d.ais_keputusan || []).filter((x) => x.acara_id === acara_id);
          if (!kp.some((x) => x.pusingan === 'akhir' && x.kedudukan != null)) throw new Error(`Keputusan akhir ${a.acara} ${a.kategori} belum diisi`);
          const tinggi = a.unit === 'm';
          const t = kp.filter((x) => !x.status && +x.nilai > 0).sort((p, q) => (tinggi ? q.nilai - p.nilai : p.nilai - q.nilai) || (p.pusingan === 'akhir' ? -1 : 1))[0];
          const rs = (d.ais_rekod || []).filter((r) => r.acara_id !== acara_id && r.peringkat === 'SEKOLAH' && r.kategori === a.kategori && r.acara === a.acara && r.nilai != null).map((r) => +r.nilai);
          const rek = rs.length ? (tinggi ? Math.max(...rs) : Math.min(...rs)) : null;
          if (t && (rek == null || (tinggi ? +t.nilai > rek : +t.nilai < rek))) {
            const m = (d.murid || []).find((x) => x.id === t.murid_id);
            ops.push({ op: 'upsert', jadual: 'ais_rekod', baris: [{ id: 'hs-' + uuid(), peringkat: 'SEKOLAH', kategori: a.kategori, acara: a.acara, prestasi: t.prestasi, nilai: +t.nilai,
              nama: m ? m.nama : 'KUARTET ' + t.rumah, pasukan: t.rumah, tahun: k.tahun, acara_id, tempatan: true }] });
            baru = true;
          }
        }
        ops.push({ op: 'upsert', jadual: 'ais_acara', baris: [{ id: acara_id, rasmi, rasmi_pada: rasmi ? kini() : null }] });
        await tulis(ops);
        return { rekod_baharu: baru };
      },
      async aisSimpanJadual(rows) {
        if (!rows.length) return;
        await tulis([{ op: 'upsert', jadual: 'ais_acara', baris: rows.map((r) => ({ id: r.id, ...pilih(r, MEDAN_JADUAL) })) }]);
      },
      async aisSimpanKejohanan(k) {
        const medan = ['nama', 'tahun', 'tarikh_mula', 'tarikh_tamat', 'tempat', 'had_acara', 'kuota', 'kuota_gandaan', 'kira_gandaan', 'pendaftaran_dibuka', 'aktif', 'bil_lorong', 'tetapan'];
        const r = await tulis([{ op: 'upsert', jadual: 'ais_kejohanan', baris: [{ id: k.id, ...pilih(k, medan) }] }]);
        return r.baris[0];
      },
    };
    const lain = { masuk: 'Log masuk e-mel', daftar: 'Pendaftaran akaun', lupa: 'Set semula kata laluan', tukarKataLaluan: 'Tukar kata laluan',
      simpanMurid: 'Perubahan data murid', padamMurid: 'Padam murid', setAhli: 'Perubahan keahlian', importMurid: 'Import murid', simpanUnit: 'Perubahan unit', padamUnit: 'Padam unit',
      simpanTetapan: 'Tetapan sekolah', simpanProfil: 'Perubahan profil', aisGantiBib: 'Susun nombor BIB', aisTambahBib: 'Tambah nombor BIB', aisArkib: 'Pindah ke keputusan lalu',
      aisKejohananBaharu: 'Kejohanan baharu', aisDaftar: 'Pendaftaran atlet', aisBatal: 'Batal penyertaan', setRumahPukal: 'Agihan rumah sukan', setGuruUnit: 'Guru unit', log: 'Log perubahan' };
    Object.entries(lain).forEach(([n, l]) => { db[n] = tiada(l); });
    return db;
  }

  // ------------------------------------------------------------------ paparan (memerlukan konteks aplikasi)
  let X = null; // { S, e, $, IKON, roti, sahkan, gagal, render, AIS, LOGO }
  function pasang(ctx) { X = ctx; }

  /* ---------- log masuk telefon pencatat (nama + PIN) */
  async function skrinMasuk(el, selesai) {

    el.innerHTML = '<div class="pemuat">Menghubungi laptop TIC…</div>';

    try { info = await api('/api/info', { had: 8000 }); } catch (err) {
      el.innerHTML = `<div class="skrin-masuk"><div class="panel kad-masuk"><h2>Tidak dapat menghubungi laptop TIC</h2>

    const s = sesiHS();
    el.innerHTML = `<div class="skrin-masuk"><div class="panel kad-masuk">
      <img src="${X.LOGO}" alt="" class="logo-masuk" style="width:64px;height:auto">
      <h2>Mod Hari Sukan</h2><p class="pudar kecil" style="margin-top:0">${e(info.kejohanan || 'Kejohanan olahraga')} ${e(info.tahun || '')}</p>
      ${info.ada_data ? `<form class="borang" id="borang-hs-masuk">
        <label class="medan">Nama anda<select name="profil" required><option value="">Pilih nama…</option>${info.profiles.sort((p, q) => String(p.nama).localeCompare(String(q.nama)))
          .map((p) => `<option value="${e(p.id)}" ${s && s.profil && s.profil.id === p.id ? 'selected' : ''}>${e(p.nama)}</option>`).join('')}</select></label>
        <label class="medan">PIN hari sukan<input name="pin" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required placeholder="Dipaparkan di skrin laptop TIC"></label>
        <p class="mesej ralat" id="hs-masuk-ralat" hidden></p>
