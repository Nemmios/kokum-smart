<style>
/* KOKUM SMART · gaya
   Warna kategori: UB = khaki pakaian seragam, KP = biru papan kenyataan, SP = kuning gelanggang. */
:root {
  --kertas: #f4f6f3;
  --permukaan: #ffffff;
  --dakwat: #17231e;
  --kabus: #5b6862;
  --garis: #d8dfda;
  --garis-kuat: #b9c4bd;
  --hijau: #1f5c45;          /* aksi utama: hijau hutan Kinabalu */
  --hijau-tekan: #174836;
  --hijau-latar: #e2eee8;
  --ub: #55632b; --ub-latar: #e9edd9; --ub-pudar: #a9b57f;
  --kp: #285d8c; --kp-latar: #dfe9f4; --kp-pudar: #8fb0d0;
  --sp: #9a6f0c; --sp-latar: #f6ecd0; --sp-pudar: #ddbd6c;
  --bahaya: #b3261e; --bahaya-latar: #fbe9e7;
  --amaran: #8a5a00; --amaran-latar: #fff2d6;
  /* warna rumah sukan (ikut susunan senarai rumah) dan pingat */
  --r1: #b3261e; --r1-latar: #fbe6e3; --r2: #2e7d32; --r2-latar: #e3f1e4; --r3: #a86400; --r3-latar: #fbefd9;
  --r4: #6a3d9a; --r4-latar: #efe6f7; --r5: #1f5f99; --r5-latar: #e1ecf7; --r6: #5b6862; --r6-latar: #eceeec;
  --emas: #b8860b; --perak: #7d8790; --gangsa: #9c5a2c;
  --bayang: 0 1px 2px rgba(23, 35, 30, .06), 0 4px 14px rgba(23, 35, 30, .05);
  --atas-hijau: #ffffff;  /* teks di atas butang hijau */
  --jejari: 10px;
  --fon: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --kertas: #101814; --permukaan: #17211c; --dakwat: #e6ece8; --kabus: #9aa8a1;
    --garis: #2a3731; --garis-kuat: #3c4b44;
    --hijau: #5fb08c; --hijau-tekan: #4c9877; --hijau-latar: #1c3329;
    --ub: #b7c47f; --ub-latar: #2a311a; --ub-pudar: #6d7744;
    --kp: #8db8e2; --kp-latar: #1a2c3e; --kp-pudar: #4f7396;
    --sp: #e3be5e; --sp-latar: #3a2f12; --sp-pudar: #9a7a2a;
    --bahaya: #f08a80; --bahaya-latar: #3a1c19; --amaran: #f0c060; --amaran-latar: #352a12;
    --r1: #f08a80; --r1-latar: #3a1c19; --r2: #7cc883; --r2-latar: #17301a; --r3: #e9b85c; --r3-latar: #35280f;
    --r4: #c3a3e8; --r4-latar: #2a1f38; --r5: #8dbbea; --r5-latar: #172a3d; --r6: #9aa8a1; --r6-latar: #222b27;
    --emas: #e6c15a; --perak: #b8c2ca; --gangsa: #d79464;
    --bayang: none; color-scheme: dark;
  --atas-hijau: #0c1a13;
  }
}
:root[data-theme="dark"] {
    --kertas: #101814; --permukaan: #17211c; --dakwat: #e6ece8; --kabus: #9aa8a1;
    --garis: #2a3731; --garis-kuat: #3c4b44;
    --hijau: #5fb08c; --hijau-tekan: #4c9877; --hijau-latar: #1c3329;
    --ub: #b7c47f; --ub-latar: #2a311a; --ub-pudar: #6d7744;
    --kp: #8db8e2; --kp-latar: #1a2c3e; --kp-pudar: #4f7396;
    --sp: #e3be5e; --sp-latar: #3a2f12; --sp-pudar: #9a7a2a;
    --bahaya: #f08a80; --bahaya-latar: #3a1c19; --amaran: #f0c060; --amaran-latar: #352a12;
    --r1: #f08a80; --r1-latar: #3a1c19; --r2: #7cc883; --r2-latar: #17301a; --r3: #e9b85c; --r3-latar: #35280f;
    --r4: #c3a3e8; --r4-latar: #2a1f38; --r5: #8dbbea; --r5-latar: #172a3d; --r6: #9aa8a1; --r6-latar: #222b27;
    --emas: #e6c15a; --perak: #b8c2ca; --gangsa: #d79464;
    --bayang: none; color-scheme: dark;
  --atas-hijau: #0c1a13;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--fon); font-size: 15px; line-height: 1.5; color: var(--dakwat); background: var(--kertas);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--hijau); }
h1, h2, h3 { line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -.01em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .75rem; }
.kecil { font-size: .85rem; }
.pudar { color: var(--kabus); }
.tersembunyi { display: none !important; }
:focus-visible { outline: 3px solid var(--hijau); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Rangka ---------- */
.rangka { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.rel {
  position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--garis);
  background: var(--permukaan); display: flex; flex-direction: column; gap: 4px;
}
.jenama { display: flex; gap: 10px; align-items: center; padding: 0 8px 18px; }
.jenama img { width: auto; height: 40px; object-fit: contain; }
.slogan-rel { display: block; width: 150px; max-width: 100%; margin: auto auto 14px; }
.jenama b { display: block; font-size: 1rem; }
.jenama span { font-size: .78rem; color: var(--kabus); }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none;
  color: var(--dakwat); font-weight: 500;
}
.nav a svg { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; }
.nav a:hover { background: var(--kertas); }
.nav a[aria-current="page"] { background: var(--hijau-latar); color: var(--hijau); font-weight: 700; }
.rel .bawah { padding: 12px 8px 0; border-top: 1px solid var(--garis); font-size: .85rem; }
.isi { padding: 28px clamp(16px, 4vw, 44px) 80px; max-width: 1180px; width: 100%; min-width: 0; }
.atas-mudah { display: none; }

@media (max-width: 860px) {
  .rangka { grid-template-columns: minmax(0, 1fr); }
  .rel { display: none; }
  .atas-mudah {
    display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding: 10px 16px;
    background: var(--permukaan); border-bottom: 1px solid var(--garis);
  }
  .atas-mudah img { width: auto; height: 32px; object-fit: contain; }
  .atas-mudah b { font-size: .98rem; }
  .isi { padding: 18px 16px 96px; }
  .nav-bawah {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
    background: var(--permukaan); border-top: 1px solid var(--garis); padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .nav-bawah a { flex-direction: column; gap: 2px; padding: 6px 0; font-size: .66rem; justify-content: center; text-align: center; min-width: 0; }
  .nav-bawah a svg { width: 22px; height: 22px; }
}
@media (min-width: 861px) { .nav-bawah { display: none; } }

/* ---------- Komponen asas ---------- */
.kepala { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.kepala p { margin: 4px 0 0; color: var(--kabus); }
.panel { background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--jejari); padding: 18px; box-shadow: var(--bayang); }
.panel + .panel, .bahagian + .bahagian { margin-top: 18px; }
.panel > h2 { margin-bottom: 12px; }
.grid2 > .panel { margin-top: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px;
  border-radius: 8px; border: 1px solid var(--garis-kuat); background: var(--permukaan); cursor: pointer; font-weight: 600;
  text-decoration: none; color: var(--dakwat); white-space: nowrap;
}
.btn:hover { background: var(--kertas); }
.btn.utama { background: var(--hijau); border-color: var(--hijau); color: var(--atas-hijau); }
.btn.utama:hover { background: var(--hijau-tekan); }
.btn.bahaya { color: var(--bahaya); border-color: var(--bahaya); }
.btn.kosong { border-color: transparent; background: transparent; }
.btn.kecil { min-height: 32px; padding: 4px 10px; font-size: .85rem; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.baris-btn { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

label.medan { display: grid; gap: 4px; font-size: .85rem; font-weight: 600; }
label.medan span.bantu { font-weight: 400; color: var(--kabus); font-size: .8rem; }
input[type="text"], input[type="email"], input[type="password"], input[type="search"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; min-height: 42px; padding: 8px 11px; border: 1px solid var(--garis-kuat); border-radius: 8px;
  background: var(--permukaan); font-size: .95rem; font-weight: 400;
}
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--hijau); outline-offset: -1px; border-color: var(--hijau); }
.borang { display: grid; gap: 14px; }
.borang .dua { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
label.medan { align-content: start; }
@media (max-width: 520px) { .borang .dua { grid-template-columns: 1fr; } }
.cek { display: flex; gap: 8px; align-items: center; font-size: .9rem; cursor: pointer; }
.cek input { width: 18px; height: 18px; accent-color: var(--hijau); }

.mesej { padding: 10px 14px; border-radius: 8px; font-size: .9rem; margin-bottom: 12px; }
.mesej.ralat { background: var(--bahaya-latar); color: var(--bahaya); }
.mesej.amaran { background: var(--amaran-latar); color: var(--amaran); }
.mesej.ok { background: var(--hijau-latar); color: var(--hijau); }

/* ---------- Lencana kategori: tanda khas aplikasi ---------- */
.lencana-set { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.lencana {
  display: inline-flex; align-items: center; gap: 4px; min-width: 48px; justify-content: center; height: 24px; padding: 0 8px;
  border-radius: 6px; font-size: .74rem; font-weight: 700; letter-spacing: .02em; border: 1.5px solid transparent;
}
.lencana.UB { background: var(--ub-latar); color: var(--ub); border-color: var(--ub-pudar); }
.lencana.KP { background: var(--kp-latar); color: var(--kp); border-color: var(--kp-pudar); }
.lencana.SP { background: var(--sp-latar); color: var(--sp); border-color: var(--sp-pudar); }
.lencana.kosong { background: transparent; border: 1.5px dashed var(--garis-kuat); color: var(--kabus); font-weight: 500; }
.lencana .j { font-weight: 500; opacity: .85; }
.tag-kat { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: .72rem; font-weight: 700; }
.tag-kat.UB { background: var(--ub); color: var(--permukaan); }
.tag-kat.KP { background: var(--kp); color: var(--permukaan); }
.tag-kat.SP { background: var(--sp); color: var(--permukaan); }

/* ---------- Dashboard ---------- */
.ringkas { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
.ringkas .kotak { background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--jejari); padding: 14px 16px; }
.ringkas .kotak b { display: block; font-size: 1.7rem; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; }
.ringkas .kotak span { font-size: .85rem; color: var(--kabus); }
.ringkas .kotak.isyarat b { color: var(--amaran); }
a.kotak, button.kotak { text-decoration: none; color: inherit; text-align: left; font: inherit; cursor: pointer; }
a.kotak:hover, button.kotak:hover { border-color: var(--garis-kuat); }

.kategori { margin-top: 26px; }
.kategori-kepala { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  border-bottom: 3px solid var(--warna); padding-bottom: 8px; margin-bottom: 6px; }
.kategori-kepala h2 { color: var(--warna); }
.kategori.UB { --warna: var(--ub); --pudar: var(--ub-pudar); --latar: var(--ub-latar); }
.kategori.KP { --warna: var(--kp); --pudar: var(--kp-pudar); --latar: var(--kp-latar); }
.kategori.SP { --warna: var(--sp); --pudar: var(--sp-pudar); --latar: var(--sp-latar); }
.petunjuk { display: flex; gap: 14px; font-size: .8rem; color: var(--kabus); align-items: center; flex-wrap: wrap; }
.petunjuk i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.petunjuk i.L { background: var(--warna); }
.petunjuk i.P { background: var(--pudar); }
.petunjuk i.garis-p { width: 2px; height: 14px; border-radius: 0; background: var(--dakwat); }

.palang {
  display: grid; grid-template-columns: 58px 1fr 92px; gap: 10px; align-items: center; padding: 7px 4px; border-radius: 6px;
  text-decoration: none; color: inherit;
}
.palang:hover { background: var(--latar); }
.palang .kod { font-weight: 800; font-size: .85rem; color: var(--warna); }
.palang .trek { position: relative; height: 18px; background: var(--kertas); border-radius: 4px; }
.palang .isi-L, .palang .isi-P { position: absolute; top: 0; bottom: 0; }
.palang .isi-L { left: 0; background: var(--warna); border-radius: 4px 0 0 4px; }
.palang .isi-P { background: var(--pudar); }
.palang .purata { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--dakwat); opacity: .6; }
.palang .had { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--bahaya); }
.palang .angka { text-align: right; font-size: .85rem; }
.palang .angka b { font-size: .98rem; }
.palang .angka small { color: var(--kabus); }
.palang.lebih .angka b { color: var(--bahaya); }

.semakan a { display: flex; justify-content: space-between; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--garis);
  text-decoration: none; color: inherit; }
.semakan a:last-child { border-bottom: 0; }
.semakan a:hover { color: var(--hijau); }
.semakan b.ada { color: var(--amaran); }
.semakan b.sifar { color: var(--hijau); }

table { border-collapse: collapse; width: 100%; }
.jadual th, .jadual td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--garis); vertical-align: middle; }
.jadual th { font-size: .78rem; color: var(--kabus); font-weight: 600; background: var(--kertas); position: sticky; top: 0; }
.jadual td.n, .jadual th.n { text-align: right; }
.jadual tr:hover td { background: color-mix(in srgb, var(--kertas) 60%, transparent); }
.skrol-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* ---------- Senarai murid ---------- */
.penapis { display: grid; grid-template-columns: 2fr repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
@media (max-width: 860px) { .penapis { grid-template-columns: 1fr 1fr; } .penapis .cari { grid-column: 1 / -1; } }
.kiraan { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0 10px; font-size: .88rem; color: var(--kabus); flex-wrap: wrap; }
.senarai { list-style: none; margin: 0; padding: 0; background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--jejari); }
.senarai li + li { border-top: 1px solid var(--garis); }
.senarai button.baris {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; width: 100%; text-align: left; padding: 11px 14px;
  background: none; border: 0; cursor: pointer; align-items: center;
}
.senarai button.baris:hover { background: var(--kertas); }
.senarai .nama { font-weight: 600; }
.senarai .meta { font-size: .82rem; color: var(--kabus); }
.senarai .keluar .nama { text-decoration: line-through; color: var(--kabus); }
@media (max-width: 600px) { .senarai button.baris { grid-template-columns: 1fr; } }
.kosong-isi { padding: 36px 16px; text-align: center; color: var(--kabus); }
.kosong-isi h3 { color: var(--dakwat); margin-bottom: 6px; }

/* ---------- Unit ---------- */
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 10px; }
.kad-unit {
  display: block; padding: 13px 14px; border-radius: var(--jejari); border: 1px solid var(--garis); background: var(--permukaan);
  text-decoration: none; color: inherit; border-left: 5px solid var(--warna);
}
.kad-unit:hover { border-color: var(--garis-kuat); border-left-color: var(--warna); }
.kad-unit .atas { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.kad-unit .atas b { color: var(--warna); font-size: .95rem; }
.kad-unit .atas span { font-weight: 800; font-size: 1.2rem; }
.kad-unit .nama-penuh { font-size: .85rem; margin: 2px 0 6px; }
.kad-unit .bawah { font-size: .78rem; color: var(--kabus); display: flex; justify-content: space-between; gap: 6px; }
.kad-unit .saya { color: var(--hijau); font-weight: 700; }
.unit-kepala { border-left: 6px solid var(--warna); padding-left: 14px; }
.unit-kepala .kod-besar { font-size: 2.2rem; font-weight: 800; color: var(--warna); line-height: 1; letter-spacing: -.02em; }
.stat-baris { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; font-size: .9rem; }
.stat-baris b { font-size: 1.25rem; display: block; }
input.jawatan { min-height: 34px; padding: 4px 8px; font-size: .85rem; max-width: 210px; }
input.jawatan.tak-moeis { border-color: var(--amaran); box-shadow: inset 3px 0 0 var(--amaran); }

/* ---------- Dialog ---------- */
dialog {
  border: 0; padding: 0; border-radius: 14px; width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 32px);
  background: var(--permukaan); color: var(--dakwat); box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
}
dialog::backdrop { background: rgba(16, 24, 20, .45); }
dialog .dk { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 18px 20px 12px; border-bottom: 1px solid var(--garis); position: sticky; top: 0; background: var(--permukaan); z-index: 1; }
dialog .db { padding: 16px 20px 20px; }
dialog .dt { padding: 12px 20px; border-top: 1px solid var(--garis); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--permukaan); }
@media (max-width: 600px) {
  dialog { width: 100vw; max-width: 100vw; max-height: 92vh; margin: auto 0 0; border-radius: 16px 16px 0 0; }
}
.slot { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--garis); }
.slot:last-child { border-bottom: 0; }
@media (max-width: 520px) { .slot { grid-template-columns: 52px 1fr; } .slot .jaw { grid-column: 2; } }
.meter { height: 8px; background: var(--kertas); border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
.meter > div { height: 100%; background: var(--hijau); }
.isu { list-style: none; padding: 0; margin: 8px 0 0; font-size: .85rem; }
.isu li { padding: 3px 0; color: var(--amaran); }
.isu li::before { content: "! "; font-weight: 800; }

/* ---------- Log masuk ---------- */
.skrin-masuk { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: linear-gradient(180deg, var(--hijau-latar), var(--kertas) 55%); }
.kad-masuk { width: min(420px, 100%); }
.kad-masuk .jenama { padding: 0 0 18px; }
.kad-masuk .jenama img { width: auto; height: 56px; }
.masuk-bungkus { width: min(420px, 100%); display: grid; gap: 14px; justify-items: center; }
.masuk-bungkus .kad-masuk { width: 100%; }
.slogan { width: min(220px, 60vw); height: auto; }
.kad-masuk .jenama b { font-size: 1.3rem; }
.tukar { text-align: center; margin-top: 14px; font-size: .9rem; }
.tukar button { background: none; border: 0; color: var(--hijau); font-weight: 600; cursor: pointer; padding: 4px; }

/* ---------- Tab ---------- */
.tab { display: flex; gap: 4px; border-bottom: 1px solid var(--garis); margin-bottom: 16px; overflow-x: auto; }
.tab a { padding: 10px 14px; text-decoration: none; color: var(--kabus); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab a[aria-current="page"] { color: var(--hijau); border-bottom-color: var(--hijau); }
.cip-set { display: flex; flex-wrap: wrap; gap: 6px; }
.cip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--garis-kuat); font-size: .8rem; cursor: pointer; background: var(--permukaan); }
.cip input { display: none; }
.cip:has(input:checked) { background: var(--hijau); border-color: var(--hijau); color: var(--atas-hijau); }

.roti { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 100; background: var(--dakwat); color: var(--kertas);
  padding: 10px 18px; border-radius: 8px; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
.roti.ralat { background: var(--bahaya); color: var(--kertas); }
.pemuat { display: grid; place-items: center; min-height: 50vh; color: var(--kabus); }
.kemajuan { height: 10px; background: var(--kertas); border-radius: 5px; overflow: hidden; border: 1px solid var(--garis); }
.kemajuan > div { height: 100%; background: var(--hijau); transition: width .2s; }
.lencana-demo { display: inline-block; background: var(--amaran-latar); color: var(--amaran); font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 5px; }

/* ---------- Cetak ---------- */
.kertas-cetak { background: #fff; color: #000; padding: 24px; border: 1px solid var(--garis); border-radius: 8px; overflow-x: auto; }
@media (max-width: 600px) { .kertas-cetak { padding: 14px; } .kertas-cetak table { font-size: 8.5pt; } }
.kertas-cetak .halaman + .halaman { margin-top: 40px; padding-top: 30px; border-top: 2px dashed #ccc; }
.kepala-cetak { display: flex; align-items: center; justify-content: center; gap: 14px; }
.kepala-cetak img { width: 58px; height: auto; flex: none; }
.kertas-cetak h3 { text-align: center; font-size: 13pt; }
.kertas-cetak .sub { text-align: center; font-size: 10pt; margin: 2px 0; }
.kertas-cetak .info { display: flex; justify-content: space-between; font-size: 10pt; margin: 12px 0 6px; flex-wrap: wrap; gap: 6px; }
.kertas-cetak table { font-size: 9.5pt; }
.kertas-cetak th, .kertas-cetak td { border: 1px solid #555; padding: 4px 6px; text-align: left; }
.kertas-cetak th { background: #eee; }
.kertas-cetak .tandatangan { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 36px; font-size: 10pt; }
.kertas-cetak .tandatangan div { border-top: 1px solid #000; padding-top: 4px; margin-top: 36px; }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; }
  .rel, .atas-mudah, .nav-bawah, .tanpa-cetak, .roti { display: none !important; }
  .rangka { display: block; }
  .isi { padding: 0; max-width: none; }
  .kertas-cetak { border: 0; padding: 0; overflow: visible; }
  .kertas-cetak .halaman + .halaman { border-top: 0; margin-top: 0; padding-top: 0; break-before: page; }
  .kertas-cetak tr { break-inside: avoid; }
}

/* ---------------- Olahraga (AIS) */
.rumah { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .74rem; font-weight: 700; letter-spacing: .02em; border: 1px solid currentColor; white-space: nowrap; }
.rumah.r0 { color: var(--kabus); border-style: dashed; }
.rumah.r1 { color: var(--r1); background: var(--r1-latar); } .rumah.r2 { color: var(--r2); background: var(--r2-latar); }
.rumah.r3 { color: var(--r3); background: var(--r3-latar); } .rumah.r4 { color: var(--r4); background: var(--r4-latar); }
.rumah.r5 { color: var(--r5); background: var(--r5-latar); } .rumah.r6 { color: var(--r6); background: var(--r6-latar); }
.grid-rumah { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kad-rumah { display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--jejari); background: var(--permukaan); border: 1px solid var(--garis);
  border-top: 5px solid var(--r6); text-decoration: none; color: inherit; min-width: 0; }
.kad-rumah:hover { border-color: var(--garis-kuat); }
.kad-rumah.r1 { border-top-color: var(--r1); } .kad-rumah.r2 { border-top-color: var(--r2); } .kad-rumah.r3 { border-top-color: var(--r3); }
.kad-rumah.r4 { border-top-color: var(--r4); } .kad-rumah.r5 { border-top-color: var(--r5); }
.kad-rumah .atas { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.kad-rumah .atas b { font-size: 1.05rem; letter-spacing: .03em; }
.kad-rumah .saya { font-size: .72rem; font-weight: 700; color: var(--hijau); background: var(--hijau-latar); padding: 1px 7px; border-radius: 5px; }
.kad-rumah .stat { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--kabus); }
.kad-rumah .stat b { display: block; font-size: 1.2rem; color: var(--dakwat); }
.baris-pilih { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.baris-pilih + .baris-pilih { margin-top: 10px; }
.baris-pilih > span { width: 64px; flex: none; }
a.cip { text-decoration: none; color: inherit; }
.cip.pilih { background: var(--hijau); border-color: var(--hijau); color: var(--atas-hijau); font-weight: 700; }
.acara-baris { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 10px 16px; padding: 12px 16px; align-items: center; }
.acara-baris + .acara-baris { border-top: 1px solid var(--garis); }
.acara-nama { min-width: 0; }
.slot-atlet { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.atlet-cip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; border-radius: 8px; background: var(--hijau-latar); max-width: 100%; }
.atlet-cip small { color: var(--kabus); font-size: .74rem; white-space: nowrap; }
.atlet-cip .buang { border: 0; background: none; cursor: pointer; color: var(--kabus); padding: 2px; display: inline-flex; border-radius: 5px; }
.atlet-cip .buang:hover { color: var(--bahaya); background: var(--bahaya-latar); }
.atlet-cip .buang svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
button.pautan { border: 0; background: none; padding: 0; font-weight: 600; cursor: pointer; text-align: left; color: var(--dakwat); }
button.pautan:hover { text-decoration: underline; }
.penuh { font-size: .78rem; font-weight: 700; color: var(--amaran); }
.pingat { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-size: .75rem; font-weight: 800;
  background: var(--kertas); color: var(--kabus); border: 1px solid var(--garis); }
.pingat.emas { background: var(--emas); color: var(--permukaan); border-color: var(--emas); }
.pingat.perak { background: var(--perak); color: var(--permukaan); border-color: var(--perak); }
.pingat.gangsa { background: var(--gangsa); color: var(--permukaan); border-color: var(--gangsa); }
.senarai button.baris:disabled { opacity: .55; cursor: not-allowed; }
@media (max-width: 600px) {
  .acara-baris { grid-template-columns: minmax(0, 1fr); }
  .baris-pilih > span { width: auto; }
}

/* ---------------- Olahraga Fasa B: jadual, keputusan, pingat */
div.medan { display: grid; gap: 6px; font-size: .85rem; font-weight: 600; }
div.medan .bantu { font-weight: 400; color: var(--kabus); font-size: .8rem; }
.grid-awalan { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.grid-awalan label { display: flex; gap: 6px; align-items: center; justify-content: space-between; font-weight: 400; }
.grid-awalan input { width: 64px; text-transform: uppercase; }
.bib-cip { display: inline-block; font-size: .72rem; font-weight: 800; padding: 0 6px; border-radius: 5px; background: var(--dakwat); color: var(--permukaan); letter-spacing: .03em; vertical-align: 1px; }
.status-acara { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--garis); color: var(--kabus); background: var(--permukaan); }
.status-acara.rasmi { background: var(--hijau); color: var(--atas-hijau); border-color: var(--hijau); }
.status-acara.sedia { background: var(--amaran-latar); color: var(--amaran); border-color: var(--amaran); }
.status-acara.jalan { background: var(--kp-latar); color: var(--kp); border-color: var(--kp-pudar); }
.status-acara.mula { background: var(--hijau-latar); color: var(--hijau); border-color: var(--hijau-latar); }
.status-acara.terus { border-style: dashed; }
.jadual-hari { margin: 14px 16px 4px; font-size: 1rem; }
.jadual-sesi { margin: 8px 16px 2px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--kabus); }

.cip.siap { border-color: var(--hijau); color: var(--hijau); background: var(--hijau-latar); }

.hadir-senarai { display: grid; border: 1px solid var(--garis); border-radius: 8px; overflow: hidden; }

.jadual td.ok { color: var(--hijau); font-weight: 800; }

/* Fasa 2: cetakan */
.bulan-cetak { margin: 12px 0 4px; font-size: 11pt; border-bottom: 2px solid #000; padding-bottom: 2px; }
.grid-hadir-cetak { font-size: 8pt; }
.kertas-cetak .grid-hadir-cetak th, .kertas-cetak .grid-hadir-cetak td { padding: 2px 3px; text-align: center; }
.kertas-cetak .grid-hadir-cetak td.nama { text-align: left; white-space: nowrap; }
.opr-kepala { display: flex; gap: 12px; align-items: center; border-bottom: 3px double #1f5c45; padding-bottom: 8px; }
.opr-kepala img { width: 52px; }
.opr-kepala div { display: grid; line-height: 1.25; font-size: 9pt; }
.opr-kepala b { font-size: 14pt; letter-spacing: .06em; color: #1f5c45; }
.opr-tajuk { text-align: center; font-size: 13pt; margin: 10px 0 6px; text-transform: uppercase; }
.kertas-cetak .opr-info td { font-size: 9pt; padding: 3px 6px; }
.kertas-cetak .opr-info td:nth-child(odd) { background: #f1f4f2; font-weight: 700; width: 14%; }
.opr-dua { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.opr-blok { border: 1px solid #999; border-radius: 4px; padding: 5px 8px; font-size: 9pt; margin-top: 8px; break-inside: avoid; }
.opr-dua .opr-blok { margin-top: 0; }
.opr-blok b { display: block; font-size: 8.5pt; text-transform: uppercase; letter-spacing: .05em; color: #1f5c45; margin-bottom: 2px; }
.opr-gambar { display: grid; gap: 6px; margin-top: 8px; grid-template-columns: 1fr 1fr; }
.opr-gambar.n1 { grid-template-columns: 1fr; }
.opr-gambar div { aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid #bbb; display: grid; place-items: center; background: #f4f4f4; }
.opr-gambar.n1 div { aspect-ratio: 16 / 9; }
.opr-gambar img { width: 100%; height: 100%; object-fit: cover; }
.halaman.opr .tandatangan { margin-top: 18px; }
.halaman.opr .tandatangan div { margin-top: 26px; }
.kulit { min-height: 240mm; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; border: 3px double #1f5c45; padding: 20mm 12mm; }
.kulit img { width: 90px; }
.kulit h1 { font-size: 22pt; letter-spacing: .08em; color: #1f5c45; margin: 18px 0 4px; }
.kulit h2 { font-size: 15pt; margin: 0; }
.kulit .kod { font-size: 11pt; color: #444; }
.kulit .tahun { font-size: 34pt; font-weight: 800; color: #1f5c45; margin: 18px 0; }
.bab { display: flex; gap: 8px; align-items: baseline; font-size: 11pt; margin: 14px 0 6px; border-bottom: 1px solid #1f5c45; padding-bottom: 2px; color: #1f5c45; }
.bab span { font-weight: 800; }
.teks-laporan { font-size: 10pt; text-align: justify; margin: 4px 0; }
.pudar-cetak { color: #777; font-style: italic; }
.lampiran { font-size: 9pt; font-weight: 800; letter-spacing: .06em; margin: 0 0 6px; }
@media screen and (max-width: 700px) { .opr-dua { grid-template-columns: 1fr; } }
@media print {
  @page landskap { size: A4 landscape; margin: 10mm; }
  .halaman.landskap { page: landskap; }
  .kertas-cetak .opr-info td:nth-child(odd), .opr-gambar div { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .halaman.opr { break-inside: avoid; }
}
@media (max-width: 520px) { .hadir-baris { grid-template-columns: 24px minmax(0, 1fr); } .hadir-baris .seg, .hadir-baris .status-h { grid-column: 2; justify-self: start; } }
.bab { break-after: avoid; page-break-after: avoid; }
.kertas-cetak .grid-hadir-cetak tr { break-inside: avoid; }

</style>

   Bebas daripada pelayar supaya boleh diuji dengan Node. */
(function (root) {
  'use strict';

  const bersih = (v) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
  const besar = (v) => bersih(v).toUpperCase();

  // Lajur dikenal pasti melalui tajuk, bukan kedudukan, supaya tahan perubahan susun atur.
  const TAJUK = [
    ['bil', (t) => t === 'BIL' || t === 'BIL.'],
    ['nama', (t) => t.startsWith('NAMA')],
    ['tingkatan', (t) => t.startsWith('TINGKATAN') || t === 'TING'],
    ['kelas', (t) => t === 'KELAS'],
    ['mykad', (t) => /MYKAD|KAD PENGENALAN|^NO\.? ?KP|MYKID/.test(t)],
    ['jantina', (t) => /GENDER|JANTINA/.test(t)],
    ['rumah_sukan', (t) => t.includes('RUMAH')],
    ['keluar', (t) => t.includes('KELUAR')],
    ['ub', (t) => t.includes('BERUNIFORM') || t === 'UB'],
    ['kp', (t) => t.includes('KELAB') || t.includes('PERSATUAN') || t === 'KP'],
    ['sp', (t) => t.includes('SUKAN') || t.includes('PERMAINAN') || t === 'SP'],
  ];

  function cariTajuk(rows) {
    const had = Math.min(rows.length, 40);
    for (let i = 0; i < had; i++) {
      const sel = (rows[i] || []).map(besar);
      if (sel.some((t) => t === 'BIL' || t === 'BIL.') && sel.some((t) => t.startsWith('NAMA'))) return i;
    }
    return -1;
  }

  function petaLajur(rowTajuk) {
    const peta = {};
    let kategoriAkhir = null;
    rowTajuk.forEach((sel, i) => {
      const t = besar(sel);
      if (!t) return;
      if (t.startsWith('JAWATAN')) {
        if (kategoriAkhir && peta[kategoriAkhir + '_jawatan'] == null) peta[kategoriAkhir + '_jawatan'] = i;
        return;
      }
      for (const [kunci, uji] of TAJUK) {
        if (peta[kunci] == null && uji(t)) {
          peta[kunci] = i;
          kategoriAkhir = ['ub', 'kp', 'sp'].includes(kunci) ? kunci : null;
          return;
        }
      }
      kategoriAkhir = null;
    });
    return peta;
  }

  function normalMykad(v) {
    let s = bersih(v).replace(/[\s-]/g, '').toUpperCase();
    if (/^\d+(\.0+)?$/.test(s)) s = s.replace(/\.0+$/, '');
    if (/^\d{11}$/.test(s)) s = '0' + s; // sifar di hadapan hilang apabila Excel simpan sebagai nombor
    return s;
  }

  const mykadSah = (s) => /^\d{12}$/.test(s || '') && tarikhLahir(s) != null;

  function tarikhLahir(s) {
    if (!/^\d{12}$/.test(s || '')) return null;
    const bb = +s.slice(2, 4), hh = +s.slice(4, 6);
    if (bb < 1 || bb > 12 || hh < 1 || hh > 31) return null;
    return s.slice(0, 6);
  }

  const jantinaMykad = (s) => (/^\d{12}$/.test(s || '') ? (+s[11] % 2 ? 'L' : 'P') : null);

  function normalJantina(v) {
    const t = besar(v);
    if (t === 'L' || t.startsWith('LELAKI') || t === 'M') return 'L';
    if (t === 'P' || t.startsWith('PEREMPUAN') || t === 'F') return 'P';
    return '';
  }

  function normalTingkatan(t, kelas) {
    const a = besar(t), k = besar(kelas);
    if (a === 'X' || a.includes('PPKI') || k.startsWith('PPKI')) return 'PPKI';
    const m = (a.match(/[1-5]/) || k.match(/^[1-5]/) || [])[0];
    return m || '';
  }

  const normalKod = (v) => {
    const t = besar(v);
    return t === 'X' || t === '0' || t === '-' ? '' : t;
  };

  /**
   * rows: tatasusunan 2D (sheet_to_json header:1).
   * units: [{kod, kategori, jantina}] untuk semakan.
   */
  function bacaDaftar(rows, units) {
    const iT = cariTajuk(rows);
    if (iT < 0) throw new Error('Tajuk lajur "BIL" dan "NAMA" tidak dijumpai. Pastikan helaian ialah DAFTAR KOKUM.');
    const p = petaLajur(rows[iT]);
    if (p.nama == null) throw new Error('Lajur nama murid tidak dijumpai.');
    const unitPeta = new Map((units || []).map((u) => [u.kod, u]));
    const ambil = (r, k) => (p[k] == null ? '' : r[p[k]]);
    const murid = [];
    const amaran = [];

    for (let i = iT + 1; i < rows.length; i++) {
      const r = rows[i] || [];
      const nama = besar(ambil(r, 'nama'));
      if (!nama || nama === '0') continue;
      const bilMentah = bersih(ambil(r, 'bil'));
      if (p.bil != null && !/^\d+$/.test(bilMentah)) continue;
      const kelas = besar(ambil(r, 'kelas'));
      const rec = {
        baris: i + 1,
        bil_asal: bilMentah ? +bilMentah : null,
        nama,
        tingkatan: normalTingkatan(ambil(r, 'tingkatan'), kelas),
        kelas,
        mykad: normalMykad(ambil(r, 'mykad')),
        jantina: normalJantina(ambil(r, 'jantina')),
        rumah_sukan: besar(ambil(r, 'rumah_sukan')),
        status: besar(ambil(r, 'keluar')) ? 'keluar' : 'aktif',
        ub: normalKod(ambil(r, 'ub')), ub_jawatan: besar(ambil(r, 'ub_jawatan')),
        kp: normalKod(ambil(r, 'kp')), kp_jawatan: besar(ambil(r, 'kp_jawatan')),
        sp: normalKod(ambil(r, 'sp')), sp_jawatan: besar(ambil(r, 'sp_jawatan')),
      };
      const isu = semakMurid(rec, unitPeta);
      if (!rec.tingkatan) isu.unshift({ tahap: 'ralat', mesej: 'Tingkatan tidak dikenali' });
      if (!rec.kelas) isu.unshift({ tahap: 'ralat', mesej: 'Kelas kosong' });
      isu.forEach((x) => amaran.push({ baris: rec.baris, nama, ...x }));
      murid.push(rec);
    }

    // rekod berganda dalam fail
    const ikutKad = new Map(), ikutNama = new Map();
    murid.forEach((m) => {
      if (m.mykad) {
        if (ikutKad.has(m.mykad)) amaran.push({ baris: m.baris, nama: m.nama, tahap: 'ralat', mesej: `No. MyKad sama dengan baris ${ikutKad.get(m.mykad)}` });
        else ikutKad.set(m.mykad, m.baris);
      }
      if (ikutNama.has(m.nama)) amaran.push({ baris: m.baris, nama: m.nama, tahap: 'amaran', mesej: `Nama sama dengan baris ${ikutNama.get(m.nama)}` });
      else ikutNama.set(m.nama, m.baris);
    });

    const boleh = murid.filter((m) => m.tingkatan && m.kelas);
    return {
      lajur: p,
      murid: boleh,
      ditolak: murid.length - boleh.length,
      amaran: amaran.sort((a, b) => a.baris - b.baris),
    };
  }

  function semakMurid(m, unitPeta) {
    const isu = [];
    if (!m.mykad) isu.push({ tahap: 'amaran', mesej: 'Tiada No. MyKad' });
    else if (!mykadSah(m.mykad)) isu.push({ tahap: 'amaran', mesej: `No. MyKad tidak sah (${m.mykad})` });
    else if (m.jantina && jantinaMykad(m.mykad) !== m.jantina) isu.push({ tahap: 'amaran', mesej: 'Jantina tidak sepadan dengan digit akhir MyKad' });
    if (!m.jantina) isu.push({ tahap: 'amaran', mesej: 'Jantina kosong' });
    if (unitPeta && unitPeta.size) {
      for (const kat of ['ub', 'kp', 'sp']) {
        const kod = m[kat];
        if (!kod) continue;
        const u = unitPeta.get(kod);
        if (!u) isu.push({ tahap: 'ralat', mesej: `Kod ${kat.toUpperCase()} "${kod}" tiada dalam senarai unit` });
        else if (u.kategori !== kat.toUpperCase()) isu.push({ tahap: 'ralat', mesej: `${kod} bukan unit ${kat.toUpperCase()}` });
        else if (u.jantina && m.jantina && u.jantina !== m.jantina) isu.push({ tahap: 'amaran', mesej: `${kod} untuk murid ${u.jantina === 'P' ? 'perempuan' : 'lelaki'} sahaja` });
      }
    }
    return isu;
  }

  function jarak(a, b, had) {
    if (Math.abs(a.length - b.length) > had) return had + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let min = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (cur[j] < min) min = cur[j];
      }
      if (min > had) return had + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  /** Pasangan murid yang mungkin rekod berganda (nama hampir sama). */
  function cariBerganda(senarai) {
    const hasil = [];
    const kunci = (n) => besar(n).replace(/\b(BIN|BINTI|BT|B)\b\.?/g, '').replace(/[^A-Z]/g, '');
    const arr = senarai.map((m) => ({ m, k: kunci(m.nama) })).sort((x, y) => x.k.length - y.k.length);
    for (let i = 0; i < arr.length; i++) {
      for (let j = i + 1; j < arr.length; j++) {
        const a = arr[i], b = arr[j];
        if (b.k.length - a.k.length > 2) break;
        if (a.m.mykad && b.m.mykad && a.m.mykad === b.m.mykad) { hasil.push([a.m, b.m, 'No. MyKad sama']); continue; }
        // Dua MyKad sah yang berbeza = dua orang berbeza (adik-beradik, kembar).
        if (mykadSah(a.m.mykad) && mykadSah(b.m.mykad)) continue;
        if (a.k.length < 8) continue;
        const d = jarak(a.k, b.k, 2);
        if (d <= (a.k.length > 14 ? 2 : 1)) hasil.push([a.m, b.m, d === 0 ? 'Nama sama' : 'Nama hampir sama']);
      }
    }
    return hasil;
  }

  const api = { bacaDaftar, semakMurid, cariBerganda, normalMykad, mykadSah, jantinaMykad, tarikhLahir, normalTingkatan };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.KokumImport = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* KOKUM SMART · lapisan data.
   SupabaseDB untuk kegunaan sebenar; DemoDB (simpanan peranti) untuk mencuba tanpa pelayan. */
(function () {
  'use strict';

  const UNIT_ASAS = [
    ['KBPM','UB','KADET BOMBA DAN PENYELAMAT MALAYSIA','1C / 3R','NIBEN YANGGIT',null],
    ['KP','UB','KADET KOR POLIS','1Z / 4C','HASMADI BIN HAHIM',null],
    ['KPAM','UB','KADET PERTAHANAN AWAM MALAYSIA','1E / 4E','RAZI ROSLAN',null],
    ['KRS','UB','KADET REMAJA SEKOLAH','1D / 4D','LEMPISIK @ MARX GANDAWOI',null],
    ['PBSM','UB','PERSATUAN BULAN SABIT MERAH MALAYSIA','2Z / 5S','HILDA BINTI ADEH',null],
    ['PKP','UB','PERSEKUTUAN PENGAKAP','2C / 3S','NURFARAH AFIZA BINTI LORREN',null],
    ['PP','UB','PERSATUAN PANDU PUTERI','2E / 5E','AMBER ANDREA ANDREW','P'],
    ['PPIM','UB','PERSATUAN PUTERI ISLAM MALAYSIA','2D / 3C','SITI NOR FAZIRAH BINTI SAMIN','P'],
    ['BI','KP','KELAB BAHASA INGGERIS','1D / 4D','NUR ILYANI RAHMAT',null],
    ['BM','KP','KELAB BAHASA MELAYU','1S / 4S','HELDA FRANCIS',null],
    ['GEO','KP','KELAB GEOGRAFI','1E / 4E','JAMLIS KIDOT',null],
    ['KJA','KP','KELAB KERJAYA','1Z / 4C','HISMARINAH PETRUS',null],
    ['KMUZ','KP','KELAB MUZIK / KELAB BUDAYA','1T / 4R','DIDYMUS GIMI',null],
    ['KOP','KP','KELAB KOPERASI','2C / 3S','NOORAZIZAH BINTI KAUWASA',null],
    ['KPA','KP','KELAB PENCINTA ALAM / ALAM SEKITAR','1C / 3R','ROZELIA JOSEPH',null],
    ['PPK','KP','PERSATUAN PELAJAR KRISTIAN','2D / 3C','NIBEN YANGGIT',null],
    ['RN','KP','KELAB RUKUN NEGARA','2S / 3T','HASMADI HAHIM',null],
    ['SEJ','KP','KELAB SEJARAH','2E / 5E','AZMIE BIN ALI',null],
    ['SPBT','KP','KELAB SKIM PINJAMAN BUKU TEKS','2T / 5S','BONNY JOHN',null],
    ['STEM','KP','KELAB SAINS TEKNOLOGI DAN MATEMATIK','2Z / 5D','LILY MUJIN',null],
    ['BAD','SP','BADMINTON','1D / 4D','HILDA ALFRED',null],
    ['BB','SP','BOLA BALING','1S / 4S','SHAZSHUKRINIZAM BIN MARAL',null],
    ['BJ','SP','BOLA JARING','1E / 4E','SITI HAZIRAH WAHMIAN',null],
    ['BS','SP','BOLA SEPAK','1T / 4R','SOFFIAN @ SHOPY BIN SABDIN',null],
    ['BT','SP','BOLA TAMPAR','1Z / 4C','HASMADI HAHIM',null],
    ['CTR','SP','KELAB CATUR','1R / 3Z','KEPLE @ ZULKEPLE BIN ABAS',null],
    ['OLH','SP','KELAB OLAHRAGA','1C / 3R','RAZI ROSLAN',null],
    ['PPG','SP','PING PONG','2D / 3C','RAIMOND METIUS',null],
    ['SILAT','SP','P. SENI SILAT GERAK KILAT KEBANGSAAN','2E / 5E','GUSTIN AGOI',null],
    ['ST','SP','SEPAK TAKRAW','2S / 3T','JENOS LOMUNTUN',null],
  ].map(([kod, kategori, nama_penuh, bilik_operasi, guru_penasihat, jantina], i) =>
    ({ kod, kategori, nama_penuh, bilik_operasi, guru_penasihat, jantina, had_ahli: null, susunan: i, aktif: true }));

  const MEDAN_OPR = ['unit_kod', 'tahun', 'perjumpaan_id', 'tarikh', 'masa', 'tempat', 'tajuk', 'sasaran', 'bil_hadir', 'objektif', 'aktiviti',
    'kekuatan', 'penambahbaikan', 'rumusan', 'gambar', 'disediakan'];
  const MEDAN_KEP = ['acara_id', 'pusingan', 'siri', 'lorong', 'murid_id', 'rumah', 'ahli', 'prestasi', 'nilai', 'cubaan', 'status', 'kedudukan', 'catatan'];
  const MEDAN_MURID = ['nama', 'tingkatan', 'kelas', 'mykad', 'jantina', 'rumah_sukan', 'status', 'tarikh_keluar', 'catatan', 'bil_asal'];
  const MEDAN_UNIT = ['kod', 'kategori', 'nama_penuh', 'bilik_operasi', 'guru_penasihat', 'jantina', 'had_ahli', 'susunan', 'aktif'];
  const pilih = (o, medan) => Object.fromEntries(medan.filter((k) => k in o).map((k) => [k, o[k] === '' ? null : o[k]]));

  function terjemah(e) {
    const m = (e && (e.message || e.error_description || String(e))) || 'Ralat tidak diketahui';
    const kod = e && e.code;
    let teks = m;
    if (/Invalid login credentials/i.test(m)) teks = 'E-mel atau kata laluan salah.';
    else if (/Email not confirmed/i.test(m)) teks = 'E-mel belum disahkan. Buka pautan pengesahan dalam peti masuk anda.';
    else if (/already registered|already been registered/i.test(m)) teks = 'E-mel ini sudah mempunyai akaun. Sila log masuk.';
    else if (/Password should be at least/i.test(m)) teks = 'Kata laluan mesti sekurang-kurangnya 6 aksara.';
    else if (kod === '42501' || /row-level security|permission denied/i.test(m)) teks = 'Anda tiada kebenaran untuk perubahan ini. Hubungi penyelaras kokurikulum.';
    else if (kod === '23505' && /mykad/i.test(m)) teks = 'No. MyKad ini sudah digunakan oleh murid lain.';
    else if (kod === '23505') teks = 'Rekod ini sudah wujud.';
    else if (kod === '23503') teks = 'Kod unit tidak wujud atau masih digunakan.';
    else if (/Failed to fetch|NetworkError|Load failed/i.test(m)) teks = 'Tiada sambungan ke pelayan. Semak internet dan cuba lagi.';
    else if (/rate limit/i.test(m)) teks = 'Terlalu banyak cubaan. Tunggu sebentar dan cuba lagi.';
    const err = new Error(teks);
    err.asal = e;
    return err;
  }

  // ------------------------------------------------------------------ Supabase
  function SupabaseDB(url, key) {
    const sb = window.supabase.createClient(url, key, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
    const semak = ({ data, error }) => { if (error) throw terjemah(error); return data; };
    const pautanBalik = () => location.origin + location.pathname;

    async function semuaBaris(binaQuery) {
      let hasil = [];
      for (let mula = 0; ; mula += 1000) {
        const data = semak(await binaQuery().range(mula, mula + 999));
        hasil = hasil.concat(data);
        if (data.length < 1000) return hasil;
      }
    }

    return {
      mod: 'supabase',
      async sesi() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
      onAuth(cb) { sb.auth.onAuthStateChange((ev, s) => cb(ev, s ? s.user : null)); },
      async masuk(email, password) { semak(await sb.auth.signInWithPassword({ email, password })); },
      async daftar(email, password, nama) {
        const d = semak(await sb.auth.signUp({ email, password, options: { data: { nama }, emailRedirectTo: pautanBalik() } }));
        return { perluSahkan: !d.session };
      },
      async lupa(email) { semak(await sb.auth.resetPasswordForEmail(email, { redirectTo: pautanBalik() })); },
      async tukarKataLaluan(password) { semak(await sb.auth.updateUser({ password })); },
      async keluar() { await sb.auth.signOut(); },
      async profilSaya(uid) { return semak(await sb.from('profiles').select('*').eq('id', uid).maybeSingle()); },

      async muatSemua(penyelaras) {
        const [tetapan, units, murid, profiles, guruUnit] = await Promise.all([
          sb.from('tetapan').select('*').eq('id', 1).maybeSingle().then(semak),
          sb.from('unit').select('*').order('kategori').order('susunan').then(semak),
          semuaBaris(() => sb.from('v_murid').select('*').order('tingkatan').order('kelas').order('nama')),
          sb.from('profiles').select('*').order('nama').then(semak),
          sb.from('guru_unit').select('*').then(semak),
        ]);
        return { tetapan, units, murid, profiles, guruUnit };
      },

      async simpanMurid(m) {
        const data = pilih(m, MEDAN_MURID);
        if (m.id) return semak(await sb.from('murid').update(data).eq('id', m.id).select().single());
        return semak(await sb.from('murid').insert(data).select().single());
      },
      async padamMurid(id) { semak(await sb.from('murid').delete().eq('id', id)); },

      async setAhli(murid_id, kategori, unit_kod, jawatan) {
        if (!unit_kod) { semak(await sb.from('keahlian').delete().eq('murid_id', murid_id).eq('kategori', kategori)); return; }
        semak(await sb.from('keahlian').upsert({ murid_id, kategori, unit_kod, jawatan: jawatan || null }, { onConflict: 'murid_id,kategori' }));
      },

      async importMurid(rows, kemajuan) {
        const jumlah = { baru: 0, dikemas: 0, keahlian: 0, ralat: [] };
        for (let i = 0; i < rows.length; i += 150) {
          const r = semak(await sb.rpc('import_murid', { data: rows.slice(i, i + 150) }));
          jumlah.baru += r.baru; jumlah.dikemas += r.dikemas; jumlah.keahlian += r.keahlian;
          jumlah.ralat = jumlah.ralat.concat(r.ralat || []);
          if (kemajuan) kemajuan(Math.min(i + 150, rows.length), rows.length);
        }
        return jumlah;
      },

      async simpanUnit(u, kodAsal) {
        const data = pilih(u, MEDAN_UNIT);
        if (kodAsal) return semak(await sb.from('unit').update(data).eq('kod', kodAsal).select().single());
        return semak(await sb.from('unit').insert(data).select().single());
      },
      async padamUnit(kod) { semak(await sb.from('unit').delete().eq('kod', kod)); },
      async simpanTetapan(t) {
        const { nama_sekolah, kod_sekolah, alamat, tahun, senarai_rumah } = t;
        return semak(await sb.from('tetapan').update({ nama_sekolah, kod_sekolah, alamat, tahun, senarai_rumah }).eq('id', 1).select().single());
      },
      async simpanProfil(p) {
        const data = { nama: p.nama };
        if ('peranan' in p) data.peranan = p.peranan;
        if ('aktif' in p) data.aktif = p.aktif;
        if ('rumah_sukan' in p) data.rumah_sukan = p.rumah_sukan || null;
        if ('ais_pencatat' in p) data.ais_pencatat = !!p.ais_pencatat;
        return semak(await sb.from('profiles').update(data).eq('id', p.id).select().single());
      },

      // ---------------- AIS olahraga
      async aisMuat() {
        const kejohanan = semak(await sb.from('ais_kejohanan').select('*').order('tahun', { ascending: false }).order('id', { ascending: false }));
        const k = kejohanan.find((x) => x.aktif) || kejohanan[0] || null;
        const [acara, rekod, sejarah] = await Promise.all([
          k ? sb.from('ais_acara').select('*').eq('kejohanan_id', k.id).order('susunan').then(semak) : [],
          sb.from('ais_rekod').select('*').then(semak),
          semuaBaris(() => sb.from('ais_sejarah').select('*').order('tahun', { ascending: false }).order('id')),
        ]);
        const ids = acara.map((a) => a.id);
        const [penyertaan, keputusan, bib, tetapan] = await Promise.all([
          ids.length ? semuaBaris(() => sb.from('ais_penyertaan').select('*').in('acara_id', ids).order('dicipta')) : [],

  // Data contoh: murid rekaan untuk mencuba aplikasi. Bukan murid sebenar.
  function janaContoh(units) {
    let benih = 20261011;
    const rawak = () => { benih = (benih * 1103515245 + 12345) % 2147483648; return benih / 2147483648; };
    const pilih = (a) => a[Math.floor(rawak() * a.length)];
    const L = ['ADRIAN', 'HAFIZ', 'JOVEN', 'RAYNOLD', 'AIMAN', 'DARREN', 'ELVIS', 'FIRDAUS', 'GERALD', 'IKHWAN', 'JASON', 'KELVIN', 'MARVIN', 'NAZRIN', 'RIZAL', 'SHAWN', 'TERENCE', 'WILFRED'];
    const P = ['AMIRA', 'BELINDA', 'CHRISTINA', 'DAYANG', 'ELVIRA', 'FARAH', 'GLORIA', 'HANNAH', 'IRENE', 'JESLYN', 'KATRINA', 'MELISA', 'NUR AINA', 'ROSALIND', 'SITI HAJAR', 'VALERIE', 'YVONNE', 'ZAHIRAH'];
    const BAPA = ['JAMIL', 'GANDING', 'SAPIN', 'LOJIUS', 'MAJIMBUN', 'TINGGANG', 'RAMLI', 'ODOI', 'SULAIMAN', 'GUNDA', 'KUNTOH', 'ABDULLAH', 'MOJINUN', 'SINDUN', 'JUANIS'];
    const KELAS = ['AMANAH', 'BESTARI', 'CEMERLANG'];
    const ikutKat = (k) => units.filter((u) => u.kategori === k);
    const murid = [];
    let n = 0;
    ['1', '2', '3', '4', '5'].forEach((ting) => KELAS.forEach((kls) => {
      for (let i = 0; i < 20; i++) {
        const jantina = rawak() < 0.52 ? 'P' : 'L';
        const islam = rawak() < 0.35;
        const nama = (jantina === 'L' ? pilih(L) : pilih(P)) + (islam ? (jantina === 'L' ? ' BIN ' : ' BINTI ') : ' ') + pilih(BAPA);
        const tahunLahir = 2026 - 12 - (+ting) + 1;
        const bb = 1 + Math.floor(rawak() * 12), hh = 1 + Math.floor(rawak() * 28);
        let akhir = Math.floor(rawak() * 9000) + 1000;
        if ((akhir % 2 === 1) !== (jantina === 'L')) akhir += 1;
        const mykad = String(tahunLahir).slice(2) + String(bb).padStart(2, '0') + String(hh).padStart(2, '0') + '99' + String(akhir % 10000).padStart(4, '0');
        const sesuai = (u) => !u.jantina || u.jantina === jantina;
        const m = { id: 'contoh-' + (++n), nama, tingkatan: ting, kelas: `${ting} ${kls}`, mykad, jantina, rumah_sukan: null, status: 'aktif', catatan: null, bil_asal: n };
        ['UB', 'KP', 'SP'].forEach((k) => {
          const calon = ikutKat(k).filter(sesuai).filter((u) => k !== 'UB' || u.kod !== 'PPIM' || islam);
          m[k.toLowerCase()] = rawak() < 0.06 ? null : pilih(calon).kod;
          m[k.toLowerCase() + '_jawatan'] = null;
        });
        murid.push(m);
      }
    }));
    return murid;
  }

        let rec;

    'PENOLONG BENDAHARI': 'NAIB BENDAHARI', 'PEN. BENDAHARI': 'NAIB BENDAHARI', 'TIMBALAN BENDAHARI': 'NAIB BENDAHARI',
    'AHLI': 'AHLI BIASA', 'AHLI BERDAFTAR': 'AHLI BIASA', 'KAPTEN': 'KAPTEN PASUKAN',
  };
  const norm = (s) => String(s == null ? '' : s).toUpperCase().replace(/[–—]/g, '-').replace(/\s+/g, ' ')
    .replace(/\s*([/\-()])\s*/g, '$1').trim();

  /* Jawatan aplikasi -> teks MOEIS bagi kategori itu ('' jika tiada padanan) */
  function petaJawatan(kat, j) {
    if (!j) return '';
    const senarai = JAWATAN[kat] || [];
    const n = norm(j);
    const terus = senarai.find((x) => norm(x) === n);
    if (terus) return terus;
    const s = SINONIM[n];
    if (s && senarai.indexOf(s) >= 0) return s;
    if (kat === 'SP' && n === 'PENOLONG KETUA PASUKAN') return 'PENOLONG KAPTEN';
    if (kat === 'SP' && n === 'KETUA PASUKAN') return 'KAPTEN PASUKAN';
    return '';
  }

  /* ------------------------------------------------------------ zip (baca + tulis) */
  let jadualCrc = null;
  function crc32(u8) {
    if (!jadualCrc) {
      jadualCrc = new Uint32Array(256);
      for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; jadualCrc[n] = c >>> 0; }
    }
    let c = 0xffffffff;
    for (let i = 0; i < u8.length; i++) c = jadualCrc[(c ^ u8[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }
  const strim = async (data, alir) => new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(alir)).arrayBuffer());

  function bacaZip(buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf);
    let e = buf.byteLength - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error('Fail templat rosak.');
    const n = dv.getUint16(e + 10, true);
    let p = dv.getUint32(e + 16, true);
    const masukan = [];
    for (let i = 0; i < n; i++) {
      const ln = dv.getUint16(p + 28, true), le = dv.getUint16(p + 30, true), lk = dv.getUint16(p + 32, true);
      const off = dv.getUint32(p + 42, true);
      const mula = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
      const csize = dv.getUint32(p + 20, true);
      masukan.push({
        nama: new TextDecoder().decode(u8.subarray(p + 46, p + 46 + ln)), kaedah: dv.getUint16(p + 10, true),
        masa: dv.getUint16(p + 12, true), tarikh: dv.getUint16(p + 14, true), crc: dv.getUint32(p + 16, true),
        csize, usize: dv.getUint32(p + 24, true), data: u8.subarray(mula, mula + csize),
      });
      p += 46 + ln + le + lk;
    }
    return masukan;
  }
  async function teksMasukan(m) {
    if (m.kaedah === 0) return new TextDecoder().decode(m.data);
    return new TextDecoder().decode(await strim(m.data, new DecompressionStream('deflate-raw')));
  }
  async function gantiMasukan(m, teks) {
    const asal = new TextEncoder().encode(teks);
    const mampat = await strim(asal, new CompressionStream('deflate-raw'));
    Object.assign(m, { kaedah: 8, crc: crc32(asal), usize: asal.length, csize: mampat.length, data: mampat });
  }
  function tulisZip(masukan) {
    const enc = new TextEncoder(), bahagian = [], pusat = [];
    let off = 0;
    for (const m of masukan) {
      const nama = enc.encode(m.nama);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, m.kaedah, true);
      lh.setUint16(10, m.masa, true); lh.setUint16(12, m.tarikh, true); lh.setUint32(14, m.crc, true);
      lh.setUint32(18, m.csize, true); lh.setUint32(22, m.usize, true); lh.setUint16(26, nama.length, true); lh.setUint16(28, 0, true);
      bahagian.push(new Uint8Array(lh.buffer), nama, m.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, m.kaedah, true); ch.setUint16(12, m.masa, true); ch.setUint16(14, m.tarikh, true); ch.setUint32(16, m.crc, true);
      ch.setUint32(20, m.csize, true); ch.setUint32(24, m.usize, true); ch.setUint16(28, nama.length, true); ch.setUint32(42, off, true);
      pusat.push(new Uint8Array(ch.buffer), nama);
      off += 30 + nama.length + m.csize;
    }
    const saizPusat = pusat.reduce((s, x) => s + x.length, 0);
    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(8, masukan.length, true); eocd.setUint16(10, masukan.length, true);
    eocd.setUint32(12, saizPusat, true); eocd.setUint32(16, off, true);
    return new Blob([...bahagian, ...pusat, new Uint8Array(eocd.buffer)],
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  /* ------------------------------------------------------------ isi templat */
  const escXml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function isiSel(xml, nilai) {
    if (!nilai.size) return xml;
    return xml.replace(/<c r="([A-Z]+\d+)"([^>]*?)(\/>|>[\s\S]*?<\/c>)/g, (asal, ref, attr) => {
      if (!nilai.has(ref)) return asal;
      const v = nilai.get(ref);
      const a = attr.replace(/\s+t="[^"]*"/, '');
      if (typeof v === 'number') return `<c r="${ref}"${a}><v>${v}</v></c>`;
      return `<c r="${ref}"${a} t="inlineStr"><is><t xml:space="preserve">${escXml(v)}</t></is></c>`;
    });
  }

  /* pilihan: { templat: ArrayBuffer, murid: [...], kategori: ['KP','UB','SP'], unitNama: Map(kod->nama penuh), sekolah, tahun } */
  async function janaTemplat(pilihan) {
    if (typeof CompressionStream === 'undefined') throw new Error('Pelayar ini terlalu lama. Sila guna Google Chrome terkini.');
    const MULA = 5, HAD = 1000;
    const murid = pilihan.murid;
    if (murid.length > HAD) throw new Error(`Templat menampung ${HAD} murid sahaja. Pilih kelas atau unit yang lebih kecil.`);
    const masukan = bacaZip(pilihan.templat);
    const cari = (n) => masukan.find((m) => m.nama === n);
    const wb = await teksMasukan(cari('xl/workbook.xml'));
    const rel = await teksMasukan(cari('xl/_rels/workbook.xml.rels'));
    const fail = {};
    for (const m of wb.matchAll(/<sheet [^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)) {
      const t = (rel.match(new RegExp('Id="' + m[2] + '"[^>]*Target="([^"]+)"')) || rel.match(new RegExp('Target="([^"]+)"[^>]*Id="' + m[2] + '"')) || [])[1];
      if (t) fail[m[1]] = 'xl/' + t.replace(/^\/?xl\//, '').replace(/^\//, '');
    }
    const nilai = { Murid: new Map(), KP: new Map(), UB: new Map(), SP: new Map(), Ekstra: new Map() };
    const KOL_KOM = ['J', 'K', 'L', 'M'], KOL_KM = ['I', 'J', 'K', 'L', 'M', 'N', 'O'];
    murid.forEach((m, i) => {
      const r = MULA + i;
      nilai.Murid.set('B' + r, m.nama || '');
      if (m.mykad) nilai.Murid.set('C' + r, m.mykad);
      if (m.tingkatan) nilai.Murid.set('D' + r, m.tingkatan);
      if (m.kelas) nilai.Murid.set('E' + r, m.kelas);
      // pilihan.pajsk(m): data PAJSK daripada aplikasi (Fasa 2) untuk mengisi semua lajur yang dibaca Robot PAJSK
      const pj = pilihan.pajsk ? pilihan.pajsk(m) : null;
      if (pj && pj.tl) nilai.Murid.set('F' + r, 'TL');
      for (const kat of pilihan.kategori) {
        const kod = m[kat.toLowerCase()];
        if (!kod) continue;
        nilai[kat].set('E' + r, (pilihan.unitNama && pilihan.unitNama.get(kod)) || kod);
        const j = petaJawatan(kat, m[kat.toLowerCase() + '_jawatan']) || (pj ? 'AHLI BIASA' : '');
        if (j) nilai[kat].set('F' + r, j);
        const d = pj && pj[kat];
        if (!d) continue;
        if (d.hadir != null && d.hadir !== '') nilai[kat].set('H' + r, +d.hadir);
        (d.komitmen || []).slice(0, 4).forEach((k, i) => nilai[kat].set(KOL_KOM[i] + r, k));
        if (d.khidmat) nilai[kat].set('O' + r, d.khidmat);
        if (d.libat_per && d.libat_jenis) { nilai[kat].set('Q' + r, d.libat_per); nilai[kat].set('R' + r, d.libat_jenis); }
        if (d.capai_per && d.capai_ked) { nilai[kat].set('T' + r, d.capai_per); nilai[kat].set('U' + r, d.capai_ked); }
      }
      const ek = pj && pj.EKSTRA;
      if (ek) {
        if (ek.perkhidmatan) nilai.Ekstra.set('E' + r, ek.perkhidmatan);
        if (ek.anugerah) nilai.Ekstra.set('G' + r, ek.anugerah);
        (ek.kmSusun || []).forEach((n, i) => { if (+n > 0) nilai.Ekstra.set(KOL_KM[i] + r, +n); });
        if (ek.nilam) nilai.Ekstra.set('Q' + r, ek.nilam);
        if (ek.timss) nilai.Ekstra.set('S' + r, ek.timss);
      }
    });
    for (const nama of ['Murid', 'KP', 'UB', 'SP', 'Ekstra']) {
      const m = cari(fail[nama]);
      if (!m || !nilai[nama].size) continue;
      await gantiMasukan(m, isiSel(await teksMasukan(m), nilai[nama]));
    }
    const pand = cari(fail.Panduan);
    if (pand && (pilihan.sekolah || pilihan.tahun)) {
      const t = await teksMasukan(pand);
      await gantiMasukan(pand, t.replace(/TEMPLAT KIRAAN PAJSK \d{4} &#183; SEKOLAH MENENGAH/,
        escXml(`TEMPLAT KIRAAN PAJSK ${pilihan.tahun || ''} · ${pilihan.sekolah || 'SEKOLAH MENENGAH'}`)));
    }
    return tulisZip(masukan);
  }

  window.KokumPAJSK = { JAWATAN, petaJawatan, janaTemplat, _uji: { bacaZip, teksMasukan, crc32 } };
})();

(function () {

    function layakKat(m, a) {

    const unitAcara = (nama) => { const a = A().acara.find((x) => x.acara === nama); return a ? a.unit : (/^\d.* m$|BERPAGAR|JALAN| x /.test(nama) ? 's' : 'm'); };
