        const f = t.closest('form'), d = new FormData(f), qs = new URLSearchParams();
        for (const [kk, vv] of d.entries()) if (vv) qs.set(kk, vv);
        if (t.name === 'doc') ['acara', 'hari', 'rumah', 'jenis', 'ked'].forEach((x) => qs.delete(x));
        tetapLokasi('#/olahraga/cetak?' + qs.toString()); S.kekalSkrol = true; render();
        return true;
      }
      return false;
    }
    async function hantar(f) {
      if (f.id === 'borang-ais-jadual') { await simpanJadual(f); return true; }
      if (f.id.startsWith('borang-ais-kep')) { await simpanKep(f); return true; }
      if (f.id === 'borang-ais-baharu') {
        const d = Object.fromEntries(new FormData(f)), tahun = +d.tahun;
        if (!(await sahkan(`Buka ${d.nama.toUpperCase()} ${tahun}? Kejohanan ${K().tahun} akan diarkibkan (tidak aktif). Jadual dan senarai acara disalin; pendaftaran, BIB dan keputusan bermula kosong.`, { ok: 'Buka kejohanan baharu' }))) return true;
        await S.db.aisKejohananBaharu(d.nama.trim(), tahun);
        S.ais = null; await h.muat(true);
        roti(`Kejohanan ${tahun} dibuka`); tetapLokasi('#/olahraga/ringkasan'); render(); return true;
      }
      return false;
    }

    return { papar, tindakan, ubah, hantar, kiraPingat, statusAcara, awalanBib, bibPeta, pencatat, slotJadual, bilPeserta,
      _uji: { bacaMasa, normCubaan, normTinggi, kira, lorongTengah, barisMula, fmtJam } };
  };
})();

</script>
<script>
/* KOKUM SMART · Fasa 2
   Takwim (tarikh perjumpaan + aktiviti + cuti), Kehadiran setiap perjumpaan, OPR satu muka surat dengan gambar,
   PAJSK dalam aplikasi (markah, GPA, Excel siap isi untuk Robot PAJSK) dan Buku Laporan tahunan unit. */
(function () {
  'use strict';

  const BULAN = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
  const BLN = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];
  const HARI = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
  const JENIS = { sekolah: 'Aktiviti sekolah', cuti: 'Cuti', peperiksaan: 'Peperiksaan', unit: 'Aktiviti unit', luar: 'Pertandingan / program luar' };
  const STATUS_H = { H: 'Hadir', T: 'Tidak hadir', B: 'Bersebab' };
  const STATUS_R = { dirancang: 'Dirancang', diadakan: 'Diadakan', dibatalkan: 'Dibatalkan' };
  const KAT_PENDEK = { UB: 'UB', KP: 'KP', SP: 'SP' };
  const BIDANG = ['KP', 'UB', 'SP'];
  const MEDAN_LAPORAN = [
    ['pendahuluan', 'Pendahuluan', 'Latar belakang unit dan tujuan laporan.'],
    ['objektif', 'Objektif unit', 'Satu objektif setiap baris.'],
    ['pencapaian', 'Pencapaian dan aktiviti utama', 'Pertandingan, program dan kejayaan sepanjang tahun.'],
    ['masalah', 'Masalah dan cabaran', ''],
    ['cadangan', 'Cadangan penambahbaikan', ''],
    ['penutup', 'Penutup', ''],
  ];
  const SK = () => window.KOKUM_PAJSK_SKOR;

  window.KokumFasa2 = function (ctx) {
    const { S, e, $, $$, IKON, roti, sahkan, gagal, render, penyelaras, aktif, eksport, susunMurid, tetapLokasi, hariIni,
      LOGO, BINGKAI, KAT, bolehUrus, ahliUnit, unitKat, KP_, templatPajsk } = ctx;

    /* ============================================================ keadaan & muat */
    const T = () => S.data.tetapan || {};
    const tahunAsal = () => +T().tahun || new Date().getFullYear();
    const F = () => S.f2;
    // render selepas muat latar: jangan ganggu dialog yang sedang dibuka
    const renderLatar = () => { const d = $('#dlg'); if (d && d.open) return; S.kekalSkrol = true; render(); };
    let memuat = null;
    function muat(tahun, paksa) {
      if (!paksa && S.f2 && S.f2.tahun === tahun) return Promise.resolve();
      if (memuat && memuat.tahun === tahun) return memuat.p;
      const p = S.db.f2Muat(tahun).then((d) => {
        S.f2 = { ...d, tahun, kehUnit: {}, url: {}, ralat: null };
        S.f2.hadirMap = new Map(d.hadir.map((x) => [x.murid_id + '|' + x.kategori, x]));
      }, (err) => { S.f2 = { tahun, ralat: err.message || String(err) }; }).finally(() => { memuat = null; });
      memuat = { tahun, p };
      return p;
    }
    function sedia(tahun) {
      if (S.f2 && S.f2.tahun === tahun) return S.f2.ralat ? `<div class="mesej ralat">${e(S.f2.ralat)}. Pastikan fail <b>fasa2.sql</b> sudah dijalankan di Supabase.</div><button class="btn" data-act="f2-muat">${IKON.segar} Cuba lagi</button>` : '';
      muat(tahun).then(renderLatar);
      return '<p class="pudar">Memuatkan takwim dan rekod…</p>';
    }
    const pilihTahun = (q) => { const t = +(q && q.get('tahun')) || S.f2Tahun || tahunAsal(); S.f2Tahun = t; return t; };
    async function muatKehUnit(kod) {
      const ids = F().perjumpaan.filter((p) => p.kategori === S.unitPeta.get(kod).kategori).map((p) => p.id);
      F().kehUnit[kod] = await S.db.f2KehadiranUnit(kod, ids);
    }
    function sediaKeh(kod) {
      if (F().kehUnit[kod]) return '';
      muatKehUnit(kod).then(renderLatar, gagal);
      return '<p class="pudar">Memuatkan rekod kehadiran…</p>';
    }

    /* ============================================================ tarikh */
    const tk = (s) => (s ? new Date(s + 'T00:00:00') : null);
    const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const hariIniIso = () => iso(new Date());
    const fmtT = (s, panjang) => { const d = tk(s); if (!d) return '—'; return `${panjang ? HARI[d.getDay()] + ', ' : ''}${d.getDate()} ${(panjang ? BULAN : BLN)[d.getMonth()]} ${d.getFullYear()}`; };
    const fmtJulat = (a, b) => { if (!b || b === a) return fmtT(a); const x = tk(a), y = tk(b); return x.getMonth() === y.getMonth() ? `${x.getDate()}–${y.getDate()} ${BLN[y.getMonth()]} ${y.getFullYear()}` : `${fmtT(a)} – ${fmtT(b)}`; };
    const tambahHari = (s, n) => { const d = tk(s); d.setDate(d.getDate() + n); return iso(d); };
    const dalamJulat = (s, a, b) => s >= a && s <= (b || a);
    const cutiPada = (s) => F().aktiviti.filter((a) => (a.jenis === 'cuti' || a.jenis === 'peperiksaan') && dalamJulat(s, a.tarikh_mula, a.tarikh_tamat));
    const perjumpaanKat = (kat) => F().perjumpaan.filter((p) => p.kategori === kat).sort((p, q) => p.bil - q.bil);
    const rancangan = (pid, kod) => F().rancangan.find((r) => r.perjumpaan_id === pid && r.unit_kod === kod) || null;

    /* ============================================================ PAJSK: kiraan (sama seperti templat Excel) */
    const skor = (senarai, t) => { const x = (senarai || []).find(([a]) => a === t); return x ? x[1] : 0; };
    const r2 = (n) => Math.round(n * 100) / 100;
    const skorHadir = (h) => (h == null || h === '' ? 0 : +h >= 12 ? 40 : r2(+h * 3.33));
    const rekPajsk = (mid, bidang) => F().pajsk.find((x) => x.murid_id === mid && x.bidang === bidang) || null;
    const jawatanMoeis = (m, kat) => KP_.petaJawatan(kat, m[kat.toLowerCase() + '_jawatan']) || 'AHLI BIASA';
    function hadirMurid(m, kat) {
      const d = (rekPajsk(m.id, kat) || {}).data || {};
      if (d.hadir != null && d.hadir !== '') return { n: +d.hadir, sumber: 'manual' };
      const h = F().hadirMap.get(m.id + '|' + kat);
      return h ? { n: h.hadir, sumber: 'rekod', direkod: h.direkod } : { n: null, sumber: 'tiada' };
    }
    function kiraBidang(m, kat, dataGanti) {
      const sk = SK(), d = dataGanti || ((rekPajsk(m.id, kat) || {}).data) || {};
      const jaw = jawatanMoeis(m, kat);
      const hadir = dataGanti && dataGanti.hadir != null && dataGanti.hadir !== '' ? +dataGanti.hadir : hadirMurid(m, kat).n;
      const kom = Array.from(new Set(d.komitmen || [])).slice(0, 4);
      const c = {
        jawatan: skor(sk.JAWATAN[kat], jaw), hadir: skorHadir(hadir),
        komitmen: Math.min(10, kom.reduce((s, k) => s + skor(sk.KOMITMEN, k), 0)),
        khidmat: d.khidmat ? skor(sk.KHIDMAT, d.khidmat) : 0,
        libat: d.libat_per && d.libat_jenis ? ((sk.SKOR_LIBAT[sk.PERINGKAT.indexOf(d.libat_per)] || [])[sk.JENIS_LIBAT.indexOf(d.libat_jenis)] || 0) : 0,
        capai: d.capai_per && d.capai_ked ? ((sk.SKOR_CAPAI[sk.PERINGKAT.indexOf(d.capai_per)] || [])[sk.KEDUDUKAN.indexOf(d.capai_ked)] || 0) : 0,
      };
      const jumlah = r2(c.jawatan + c.hadir + c.komitmen + c.khidmat + c.libat + c.capai);
      return { ...c, jaw, hadirN: hadir, jumlah, markah: r2(jumlah / 110 * 100), lengkap: hadir != null && kom.length > 0 };
    }
    function kiraEkstra(d) {
      const sk = SK(); d = d || {};
      const km = Math.min(10, Object.values(d.km || {}).reduce((s, n) => s + (+n || 0), 0));
      return Math.min(10, Math.max(0, d.perkhidmatan ? skor(sk.PERKHIDMATAN, d.perkhidmatan) : 0, d.anugerah ? skor(sk.ANUGERAH, d.anugerah) : 0,
        km, d.nilam ? skor(sk.NILAM, d.nilam) : 0, d.timss ? skor(sk.TIMSS, d.timss) : 0));
    }
    function kiraMurid(m) {
      const ek = (rekPajsk(m.id, 'EKSTRA') || {}).data || {};
      const b = {}; BIDANG.forEach((k) => { if (m[k.toLowerCase()]) b[k] = kiraBidang(m, k); });
      const ms = Object.values(b).map((x) => x.markah).sort((p, q) => q - p);
      const ekstra = kiraEkstra(ek);
      if (ek.tl) return { b, ekstra, gpa: 'TL', gred: 'TL' };
      if (!ms.length) return { b, ekstra, gpa: null, gred: '' };
      const g = Math.min(100, r2(r2((ms[0] + (ms[1] || 0)) / 2) + ekstra));
      return { b, ekstra, gpa: g, gred: g >= 80 ? 'A' : g >= 60 ? 'B' : g >= 40 ? 'C' : g >= 20 ? 'D' : 'E' };
    }
    // data untuk Excel PAJSK (Robot): dipanggil oleh KokumPAJSK.janaTemplat bagi setiap murid
    function isiExcel(m) {
      const out = {};
      BIDANG.forEach((k) => {
        if (!m[k.toLowerCase()]) return;
        const d = (rekPajsk(m.id, k) || {}).data || {}, h = hadirMurid(m, k).n;
        out[k] = { jawatan: jawatanMoeis(m, k), hadir: h, komitmen: (d.komitmen || []).slice(0, 4), khidmat: d.khidmat || '', libat_per: d.libat_per || '',
          libat_jenis: d.libat_jenis || '', capai_per: d.capai_per || '', capai_ked: d.capai_ked || '' };
      });
      const ek = (rekPajsk(m.id, 'EKSTRA') || {}).data;
      if (ek) out.EKSTRA = { ...ek, kmSusun: SK().KHIDMAT_MASY.map((j) => (ek.km || {})[j] || '') };
      out.tl = !!(ek && ek.tl);
      return out;
    }

    /* ============================================================ kepala cetak */
    function kepalaDok(tajuk, sub) {
      const t = T();
      return `<div class="kepala-cetak"><img src="${LOGO}" alt="Lencana sekolah"><div><h3>${e(t.nama_sekolah || '')}${t.kod_sekolah ? ` (${e(t.kod_sekolah)})` : ''}</h3><p class="sub">${e(t.alamat || '')}</p></div></div>
        <h4 class="tajuk-dok">${e(tajuk)}</h4>${sub ? `<p class="sub">${sub}</p>` : ''}`;
    }
    const ttd = (l) => `<div class="tandatangan ttd-${l.length}">${l.map((x) => `<div>${x}</div>`).join('')}</div>`;
    const cipKat = (k) => `<span class="cip-kat ${k}">${KAT_PENDEK[k]}</span>`;

    /* ============================================================ TAKWIM (menu) */
    function pTakwim(tab, q) {
      const tahun = pilihTahun(q);
      const tabs = [['bulan', 'Ikut bulan'], ['perjumpaan', 'Tarikh perjumpaan'], ['aktiviti', 'Aktiviti & cuti']].concat(penyelaras() ? [['jana', 'Jana tarikh']] : []);
      const ta = tahunAsal();
      const kepala = `<div class="kepala tanpa-cetak"><div><h1>Takwim kokurikulum ${tahun}</h1><p>Tarikh perjumpaan UB, KP dan SP, aktiviti sekolah, cuti dan peperiksaan.</p></div>
        <div class="baris-btn">${[ta - 1, ta, ta + 1].map((t) => `<a class="cip ${t === tahun ? 'pilih' : ''}" href="#/takwim/${tab === 'cetak' ? 'bulan' : tab}?tahun=${t}">${t}</a>`).join('')}
        <a class="btn kecil" href="#/takwim/cetak?doc=takwim&tahun=${tahun}">${IKON.cetak} Cetak</a></div></div>`;
      if (tab === 'cetak') { const x = sedia(tahun); return x ? kepala + x : pCetak(q); }
      if (!tabs.some((t) => t[0] === tab)) tab = 'bulan';
      const nav = `<nav class="tab tanpa-cetak">${tabs.map(([k, l]) => `<a href="#/takwim/${k}?tahun=${tahun}" ${k === tab ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>`;
      const x = sedia(tahun); if (x) return kepala + nav + x;
      return kepala + nav + { bulan: pBulan, perjumpaan: pPerjumpaan, aktiviti: pAktiviti, jana: pJana }[tab](q);
    }

    function entri() {
      const out = [];
      const ikutTarikh = new Map();
      F().perjumpaan.forEach((p) => { if (!ikutTarikh.has(p.tarikh)) ikutTarikh.set(p.tarikh, []); ikutTarikh.get(p.tarikh).push(p); });
      ikutTarikh.forEach((ps, t) => out.push({ mula: t, jenis: 'perjumpaan', ps: ps.sort((a, b) => BIDANG.indexOf(a.kategori) - BIDANG.indexOf(b.kategori)) }));
      F().aktiviti.forEach((a) => out.push({ mula: a.tarikh_mula, tamat: a.tarikh_tamat, jenis: a.jenis, a }));
      (F().kejohanan || []).forEach((k) => { if (k.tarikh_mula) out.push({ mula: k.tarikh_mula, tamat: k.tarikh_tamat, jenis: 'sekolah', olahraga: k }); });
      const urut = ['cuti', 'peperiksaan', 'sekolah', 'perjumpaan', 'luar', 'unit'];
      return out.sort((p, q) => p.mula.localeCompare(q.mula) || urut.indexOf(p.jenis) - urut.indexOf(q.jenis));
    }
    function teksEntri(x, html) {
      if (x.jenis === 'perjumpaan') return html ? `Perjumpaan ${x.ps.map((p) => `${cipKat(p.kategori)} ke-${p.bil}`).join(' ')}${x.ps[0].masa_mula ? ` <span class="pudar">${e(x.ps[0].masa_mula)}${x.ps[0].masa_tamat ? '–' + e(x.ps[0].masa_tamat) : ''}</span>` : ''}`
        : `Perjumpaan ${x.ps.map((p) => `${p.kategori} ke-${p.bil}`).join(', ')}`;
      if (x.olahraga) return html ? `<b>${e(x.olahraga.nama)}</b>` : x.olahraga.nama;
      const a = x.a;
      return html ? `<b>${e(a.tajuk)}</b>${a.unit_kod ? ` <span class="pudar">(${e(a.unit_kod)})</span>` : ''}${a.peringkat ? ` <span class="pudar">· ${e(a.peringkat)}</span>` : ''}${a.tempat ? ` <span class="pudar">· ${e(a.tempat)}</span>` : ''}`
        : `${a.tajuk}${a.unit_kod ? ` (${a.unit_kod})` : ''}${a.tempat ? ` · ${a.tempat}` : ''}`;
    }
    function pBulan() {
      const sem = entri(), hi = hariIniIso();
      if (!sem.length) return `<div class="panel kosong-isi"><h3>Takwim ${F().tahun} masih kosong</h3><p>${penyelaras() ? 'Mulakan dengan <a href="#/takwim/jana">Jana tarikh perjumpaan</a>, kemudian tambah cuti dan aktiviti sekolah.' : 'Penyelaras belum menetapkan tarikh perjumpaan.'}</p></div>`;
      const ikut = new Map();
      sem.forEach((x) => { const b = x.mula.slice(0, 7); if (!ikut.has(b)) ikut.set(b, []); ikut.get(b).push(x); });
      return `<div class="petunjuk-takwim kecil">${['perjumpaan', 'sekolah', 'luar', 'unit', 'cuti', 'peperiksaan'].map((j) => `<span><i class="j-${j}"></i>${j === 'perjumpaan' ? 'Perjumpaan' : JENIS[j]}</span>`).join('')}</div>
        ${Array.from(ikut.entries()).map(([b, xs]) => { const [y, mo] = b.split('-').map(Number); return `<section class="panel bulan-takwim" ${y === new Date().getFullYear() && mo === new Date().getMonth() + 1 ? 'id="bulan-ini"' : ''}><h2>${BULAN[mo - 1]} ${y}</h2>
          ${xs.map((x) => { const d = tk(x.mula); return `<div class="baris-takwim j-${x.jenis} ${x.mula === hi ? 'hari-ini' : x.mula < hi && !(x.tamat && x.tamat >= hi) ? 'lepas' : ''}">
            <span class="tarikh-kotak"><b>${d.getDate()}</b><small>${HARI[d.getDay()].slice(0, 3)}</small></span>
            <span class="apa">${teksEntri(x, true)}${x.tamat && x.tamat !== x.mula ? `<small>${e(fmtJulat(x.mula, x.tamat))}</small>` : ''}${x.jenis !== 'perjumpaan' ? `<small>${x.olahraga ? 'Kejohanan olahraga' : JENIS[x.jenis]}</small>` : ''}</span>
            ${x.a && bolehUbahAktiviti(x.a) ? `<button class="btn kosong kecil" data-act="f2-aktiviti" data-id="${x.a.id}" aria-label="Ubah">Ubah</button>` : ''}</div>`; }).join('')}</section>`; }).join('')}`;
    }

    function pPerjumpaan(q) {
      const ubah = q.get('ubah') && penyelaras();
      const maks = Math.max(0, ...BIDANG.map((k) => perjumpaanKat(k).length));
      if (!maks) return `<div class="panel kosong-isi"><h3>Belum ada tarikh perjumpaan</h3><p>${penyelaras() ? '<a class="btn utama" href="#/takwim/jana">Jana tarikh perjumpaan</a>' : 'Penyelaras belum menetapkan tarikh perjumpaan.'}</p></div>`;
      const sel = (k, i) => {
        const p = perjumpaanKat(k)[i]; if (!p) return '<td class="pudar">—</td>';
        const units = unitKat(k).length, rancang = F().rancangan.filter((r) => r.perjumpaan_id === p.id && r.tajuk).length;
        const cuti = cutiPada(p.tarikh);
        if (ubah) return `<td><input type="date" name="t_${p.id}" value="${e(p.tarikh)}" aria-label="${k} ke-${p.bil}"></td>`;
        return `<td><b>${e(fmtT(p.tarikh))}</b><br><span class="pudar kecil">${HARI[tk(p.tarikh).getDay()]} · ${rancang}/${units} unit merancang</span>${cuti.length ? `<br><span class="kecil" style="color:var(--bahaya)">Bertembung: ${e(cuti[0].tajuk)}</span>` : ''}</td>`;
      };
      const isi = `<div class="skrol-x"><table class="jadual"><thead><tr><th>Bil</th>${BIDANG.map((k) => `<th>${KAT[k]}</th>`).join('')}</tr></thead><tbody>
        ${Array.from({ length: maks }, (_, i) => `<tr><td><b>${i + 1}</b></td>${BIDANG.map((k) => sel(k, i)).join('')}</tr>`).join('')}</tbody></table></div>`;
      return ubah ? `<form class="panel" id="borang-f2-tarikh" style="padding:0">${isi}<div class="baris-btn" style="padding:12px 16px"><button class="btn utama" type="submit">Simpan tarikh</button><a class="btn" href="#/takwim/perjumpaan">Batal</a></div></form>`
        : `<div class="panel" style="padding:0">${isi}</div>${penyelaras() ? '<div class="baris-btn" style="margin-top:12px"><a class="btn" href="#/takwim/perjumpaan?ubah=1">Ubah tarikh satu per satu</a><a class="btn" href="#/takwim/jana">Jana semula</a></div>' : ''}
        <p class="pudar kecil" style="margin-top:10px">Kehadiran setiap perjumpaan dikira untuk PAJSK: 12 kali hadir = 40 markah.</p>`;
    }

    function pJana() {
      if (!penyelaras()) return '<div class="mesej amaran">Hanya penyelaras boleh menjana tarikh perjumpaan.</div>';
      const t = F().tahun;
      const asal = (k, i) => { const p = perjumpaanKat(k)[0]; return p ? p.tarikh : ''; };
      const cuti = F().aktiviti.filter((a) => a.jenis === 'cuti' || a.jenis === 'peperiksaan');
      return `<form class="panel borang" id="borang-f2-jana">
        <p class="kecil" style="margin:0">Tetapkan tarikh perjumpaan pertama setiap bidang. Aplikasi menjana tarikh seterusnya ikut selang minggu dan melangkau minggu cuti atau peperiksaan yang sudah dimasukkan (${cuti.length} julat).</p>
        ${BIDANG.map((k, i) => `<fieldset class="jana-baris"><legend><label class="cek"><input type="checkbox" name="ada_${k}" checked> ${KAT[k]}</label></legend>
          <div class="grid-jana"><label class="medan">Perjumpaan pertama<input type="date" name="mula_${k}" value="${e(asal(k) || '')}" min="${t}-01-01" max="${t}-12-31"></label>
          <label class="medan">Selang<select name="selang_${k}">${[1, 2, 3, 4].map((n) => `<option value="${n}" ${n === 2 ? 'selected' : ''}>Setiap ${n === 1 ? 'minggu' : n + ' minggu'}</option>`).join('')}</select></label>
          <label class="medan">Bilangan<input type="number" name="bil_${k}" value="12" min="1" max="40"></label>
          <label class="medan">Masa<input type="text" name="masa_${k}" value="${e((perjumpaanKat(k)[0] || {}).masa_mula || '2.30 ptg')}" placeholder="2.30 ptg"></label></div></fieldset>`).join('')}
        <label class="cek"><input type="checkbox" name="langkau" checked> Langkau minggu cuti dan peperiksaan</label>
        <div id="jana-pratonton"></div>
        <div class="baris-btn"><button class="btn utama" type="submit">Simpan tarikh perjumpaan ${t}</button></div>
        <p class="pudar kecil">Tarikh yang sudah ada dikemas kini mengikut nombor perjumpaan. Rekod kehadiran yang sudah diisi kekal.</p></form>
        <div class="panel"><h2>Cuti dan peperiksaan ${t}</h2>${cuti.length ? `<ul class="kecil" style="margin:0;padding-left:18px">${cuti.map((a) => `<li>${e(fmtJulat(a.tarikh_mula, a.tarikh_tamat))}: ${e(a.tajuk)}</li>`).join('')}</ul>` : '<p class="pudar kecil">Belum ada. Tambah cuti penggal dan minggu peperiksaan dahulu supaya tarikh tidak bertembung.</p>'}
          <button class="btn" data-act="f2-aktiviti" data-jenis="cuti" style="margin-top:10px">${IKON.tambah} Tambah cuti / peperiksaan</button></div>`;
    }
    function janaTarikh(d) {
      const out = {};
      BIDANG.forEach((k) => {
        if (!d.get('ada_' + k) || !d.get('mula_' + k)) return;
        const n = Math.max(1, Math.min(40, +d.get('bil_' + k) || 12)), selang = +d.get('selang_' + k) || 2;
        let t = d.get('mula_' + k), cuba = 0; const l = [];
        while (l.length < n && cuba < 200) {
          cuba++;
          if (d.get('langkau') && cutiPada(t).length) { t = tambahHari(t, 7); continue; }
          l.push(t); t = tambahHari(t, selang * 7);
        }
        out[k] = l;
      });
      return out;
    }
    function pratontonJana() {
      const f = $('#borang-f2-jana'); if (!f) return;
      const j = janaTarikh(new FormData(f)), t = F().tahun;

        ${Array.from({ length: Math.max(...Object.values(j).map((x) => x.length)) }, (_, i) => `<tr><td>${i + 1}</td>${Object.keys(j).map((k) => { const x = j[k][i]; return `<td>${x ? `${e(fmtT(x))}${x.slice(0, 4) !== String(t) ? ' <b style="color:var(--bahaya)">tahun lain</b>' : ''}` : ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>` : '<p class="pudar kecil">Isi tarikh perjumpaan pertama untuk melihat pratonton.</p>';
    }
    async function simpanJana(f) {
      const d = new FormData(f), j = janaTarikh(d), t = F().tahun;
      if (!Object.keys(j).length) { roti('Isi tarikh perjumpaan pertama sekurang-kurangnya satu bidang.', true); return; }
      if (Object.values(j).some((l) => l.some((x) => x.slice(0, 4) !== String(t)))) { roti(`Ada tarikh di luar tahun ${t}. Kurangkan bilangan atau ubah tarikh pertama.`, true); return; }
      const padam = [];
      Object.keys(j).forEach((k) => perjumpaanKat(k).filter((p) => p.bil > j[k].length).forEach((p) => padam.push(p)));
      if (!(await sahkan(`Simpan ${Object.values(j).reduce((s, l) => s + l.length, 0)} tarikh perjumpaan ${t}?${padam.length ? `\n\n${padam.length} perjumpaan berlebihan akan dipadam bersama rekod kehadirannya.` : ''}`, { ok: 'Simpan' }))) return;
      const rows = [];
      Object.entries(j).forEach(([k, l]) => l.forEach((x, i) => rows.push({ tahun: t, kategori: k, bil: i + 1, tarikh: x, masa_mula: (d.get('masa_' + k) || '').trim() || null })));
      await S.db.f2SimpanPerjumpaan(rows);
      if (padam.length) await S.db.f2PadamPerjumpaan(padam.map((p) => p.id));
      await muat(t, true);
      roti('Tarikh perjumpaan disimpan'); tetapLokasi('#/takwim/perjumpaan'); render();
    }
    async function simpanTarikh(f) {
      const d = new FormData(f), rows = [];
      F().perjumpaan.forEach((p) => { const v = d.get('t_' + p.id); if (v && v !== p.tarikh) rows.push({ ...p, tarikh: v }); });
      if (rows.length) await S.db.f2SimpanPerjumpaan(rows);
      await muat(F().tahun, true);
      roti(rows.length ? `${rows.length} tarikh dikemas kini` : 'Tiada perubahan'); tetapLokasi('#/takwim/perjumpaan'); render();
    }

    /* ------------------------------------------------------------ aktiviti & cuti */
    const bolehUbahAktiviti = (a) => penyelaras() || ((a.jenis === 'unit' || a.jenis === 'luar') && a.unit_kod && bolehUrus(a.unit_kod));
    function pAktiviti(q) {

        <div class="baris-btn" style="margin-top:10px"><button class="btn utama" data-act="f2-aktiviti">${IKON.tambah} Tambah aktiviti</button></div>
        <p class="pudar kecil" style="margin:8px 0 0">${penyelaras() ? 'Penyelaras boleh menambah semua jenis aktiviti.' : 'Guru penasihat boleh menambah aktiviti dan pertandingan bagi unit sendiri.'}</p></div>
        <div class="panel" style="padding:0">${l.length ? `<ul class="senarai">${l.map((a) => `<li><div class="baris" style="cursor:default">
          <span><span class="nama">${e(a.tajuk)}</span><br><span class="meta">${e(fmtJulat(a.tarikh_mula, a.tarikh_tamat))} · ${e(JENIS[a.jenis])}${a.unit_kod ? ' · ' + e(a.unit_kod) : ''}${a.peringkat ? ' · ' + e(a.peringkat) : ''}${a.tempat ? ' · ' + e(a.tempat) : ''}</span></span>
          ${bolehUbahAktiviti(a) ? `<button class="btn kecil" data-act="f2-aktiviti" data-id="${a.id}">Ubah</button>` : ''}</div></li>`).join('')}</ul>` : '<div class="kosong-isi">Tiada aktiviti.</div>'}</div>`;
    }

      dlg.dataset.id = ''; dlg.dataset.ubah = '';
      if (!dlg.open) dlg.showModal();
    }
    async function simpanAktiviti(f) {
      const d = Object.fromEntries(new FormData(f));

      const rec = await S.db.f2SimpanAktiviti({ id: f.dataset.id ? +f.dataset.id : null, tahun: +d.tarikh_mula.slice(0, 4), tajuk: d.tajuk.trim(), jenis: d.jenis,

      const i = F().aktiviti.findIndex((x) => x.id === rec.id);
      if (rec.tahun !== F().tahun) { if (i >= 0) F().aktiviti.splice(i, 1); roti(`Disimpan dalam takwim ${rec.tahun}`); }

    /* ============================================================ TAB UNIT */
    const TAB_UNIT = [['ahli', 'Ahli'], ['takwim', 'Takwim'], ['kehadiran', 'Kehadiran'], ['opr', 'OPR'], ['pajsk', 'PAJSK'], ['laporan', 'Laporan']];

    /* ------------------------------------------------------------ takwim unit (rancangan tahunan) */

            return `<div class="rancangan-baris ${lepas ? 'lepas' : ''}"><span class="bil">${p.bil}</span><div class="bila"><b>${e(fmtT(p.tarikh))}</b><small>${HARI[tk(p.tarikh).getDay()]}${p.masa_mula ? ', ' + e(p.masa_mula) : ''}</small></div>
              ${boleh ? `<input type="text" name="tajuk_${p.id}" value="${e(r.tajuk || '')}" placeholder="Tajuk aktiviti" aria-label="Tajuk perjumpaan ${p.bil}">

        <div class="panel" style="margin-top:14px"><h2>Aktiviti dan pertandingan ${e(u.kod)}</h2>

          <div class="baris-btn" style="margin-top:10px">${boleh ? `<button class="btn" data-act="f2-aktiviti" data-unit="${e(u.kod)}" data-jenis="unit">${IKON.tambah} Tambah aktiviti</button>` : ''}
            <a class="btn" href="#/takwim/cetak?doc=rancangan&unit=${encodeURIComponent(u.kod)}&tahun=${F().tahun}">${IKON.cetak} Cetak rancangan tahunan</a></div></div>`;

    async function simpanRancangan(f) {
      const kod = f.dataset.unit, d = new FormData(f), rows = [];

        const r = rancangan(p.id, kod) || {}, baru = { perjumpaan_id: p.id, unit_kod: kod, tajuk: (d.get('tajuk_' + p.id) || '').trim() || null, tempat: (d.get('tempat_' + p.id) || '').trim() || null, status: d.get('status_' + p.id) || 'dirancang', catatan: r.catatan || null };

      });
      if (!rows.length) { roti('Tiada perubahan'); return; }

          <p class="pudar kecil" style="margin:8px 0 0">Nombor bertanda hijau sudah direkod. ${direkod.size}/${ps.length} perjumpaan direkod.</p></div>

          ${boleh ? `<div class="baris-btn" style="margin:8px 0"><button type="button" class="btn kecil" data-act="f2-semua" data-v="H">Semua hadir</button><button type="button" class="btn kecil" data-act="f2-semua" data-v="T">Semua tidak hadir</button><span class="kecil" id="kiraan-hadir"></span></div>` : ''}
          <div class="hadir-senarai">${ahli.map((m, i) => { const st = (rekP.get(m.id) || {}).status || (boleh ? 'H' : ''); return `<div class="hadir-baris"><span class="bil">${i + 1}</span><span class="siapa"><b>${e(m.nama)}</b><small>${e(m.kelas)} · ${hadirN(m.id)} kali hadir</small></span>
            ${boleh ? `<span class="seg" role="radiogroup" aria-label="Kehadiran ${e(m.nama)}">${Object.keys(STATUS_H).map((k) => `<label class="s-${k}"><input type="radio" name="h_${e(m.id)}" value="${k}" ${st === k ? 'checked' : ''}><span>${k === 'H' ? 'Hadir' : k === 'T' ? 'Tidak' : 'Sebab'}</span></label>`).join('')}</span>`
              : `<span class="status-h s-${st}">${st ? STATUS_H[st] : '—'}</span>`}</div>`; }).join('') || '<div class="kosong-isi">Unit ini belum ada ahli.</div>'}</div>
          ${boleh && ahli.length ? `<div class="baris-btn" style="margin-top:12px"><button class="btn utama" type="submit">Simpan kehadiran perjumpaan ${p.bil}</button></div>` : ''}</form>
        <div class="panel" style="margin-top:14px"><h2>Ringkasan kehadiran ${F().tahun}</h2>

          ${ahli.map((m) => { const n = hadirN(m.id); return `<tr><td>${e(m.nama)}</td>${ps.map((y) => { const k = keh.find((z) => z.perjumpaan_id === y.id && z.murid_id === m.id); return `<td class="n s-${k ? k.status : 'x'}">${k ? (k.status === 'H' ? '✓' : k.status === 'B' ? 'B' : '✗') : ''}</td>`; }).join('')}<td class="n"><b>${n}</b></td><td class="n">${skorHadir(n)}</td></tr>`; }).join('')}
          </tbody></table></div>
          <p class="pudar kecil">✓ hadir · ✗ tidak hadir · B bersebab (tidak dikira hadir). Skor kehadiran PAJSK: 12 kali = 40.</p>
          <a class="btn" href="#/takwim/cetak?doc=kehadiran&unit=${encodeURIComponent(u.kod)}&tahun=${F().tahun}">${IKON.cetak} Cetak rekod kehadiran</a></div>`;
    }
    function kiraHadirBorang() {

    async function mampat(fail, maks) {

      const s = Math.min(1, maks / Math.max(img.naturalWidth, img.naturalHeight));

          <div class="dua"><label class="medan">Pelibatan: peringkat<select name="libat_per">${pilihan(sk.PERINGKAT, null, '(tidak diubah)')}</select></label><label class="medan">Pelibatan: jenis<select name="libat_jenis">${pilihan(sk.JENIS_LIBAT, null, '(tidak diubah)')}</select></label></div>
          <div class="dua"><label class="medan">Pencapaian: peringkat<select name="capai_per">${pilihan(sk.PERINGKAT, null, '(tidak diubah)')}</select></label><label class="medan">Pencapaian: kedudukan<select name="capai_ked">${pilihan(sk.KEDUDUKAN, null, '(tidak diubah)')}</select></label></div>
          <div class="medan"><span>Murid</span><label class="cek kecil"><input type="checkbox" id="pukal-semua" checked> Pilih semua (${ahli.length})</label>
            <ul class="senarai" style="max-height:34vh;overflow:auto">${ahli.map((m) => `<li><label class="cek" style="padding:6px 10px"><input type="checkbox" name="murid" value="${e(m.id)}" checked> ${e(m.nama)} <span class="pudar kecil">${e(m.kelas)}</span></label></li>`).join('')}</ul></div>
        </form></div>
        <div class="dt"><button class="btn" data-act="tutup">Batal</button><button class="btn utama" type="submit" form="borang-f2-pukal">Gunakan</button></div>`;
      dlg.dataset.id = ''; dlg.dataset.ubah = '';
      if (!dlg.open) dlg.showModal();
    }
    async function simpanPukal(f) {
      const kod = f.dataset.unit, kat = S.unitPeta.get(kod).kategori, d = new FormData(f), ids = d.getAll('murid');
      const kom = d.getAll('komitmen');
      if (kom.length > 4) { roti('Komitmen maksimum 4.', true); return; }
      const ubah = {}; if (kom.length) ubah.komitmen = kom;
      ['khidmat', 'libat_per', 'libat_jenis', 'capai_per', 'capai_ked'].forEach((k) => { if (d.get(k)) ubah[k] = d.get(k); });
      if (!Object.keys(ubah).length) { roti('Tiada medan dipilih.', true); return; }
      if (!ids.length) { roti('Pilih sekurang-kurangnya seorang murid.', true); return; }
      const rows = ids.map((mid) => { const m = S.data.murid.find((x) => x.id === mid), data = { ...(((rekPajsk(mid, kat) || {}).data) || {}), ...ubah };
        return { murid_id: mid, tahun: F().tahun, bidang: kat, unit_kod: kod, data, markah: kiraBidang(m, kat, { ...data, hadir: data.hadir == null ? hadirMurid(m, kat).n : data.hadir }).markah }; });
      const hasil = await S.db.f2SimpanPajsk(rows);
      hasil.forEach((r) => { const i = F().pajsk.findIndex((y) => y.murid_id === r.murid_id && y.bidang === r.bidang); if (i >= 0) F().pajsk[i] = r; else F().pajsk.push(r); });
      roti(`${rows.length} murid dikemas kini`); $('#dlg').close(); S.kekalSkrol = true; render();
    }

    /* ------------------------------------------------------------ Laporan unit */
    function uLaporan(u) {
      const boleh = bolehUrus(u.kod), L = (F().laporan.find((x) => x.unit_kod === u.kod) || {}).data || {};
      const ps = perjumpaanKat(u.kategori), ahli = ahliUnit(u);

        ['Senarai ahli', ahli.length, `${ahli.length} ahli`],
        ['Ahli jawatankuasa', ahli.filter((m) => m[u.kategori.toLowerCase() + '_jawatan']).length, `${ahli.filter((m) => m[u.kategori.toLowerCase() + '_jawatan']).length} pemegang jawatan`],
        ['Rancangan perjumpaan', ps.filter((p) => (rancangan(p.id, u.kod) || {}).tajuk).length, `${ps.filter((p) => (rancangan(p.id, u.kod) || {}).tajuk).length}/${ps.length} perjumpaan bertajuk`],
        ['Kehadiran', ahli.some((m) => F().hadirMap.get(m.id + '|' + u.kategori)), ahli.some((m) => F().hadirMap.get(m.id + '|' + u.kategori)) ? 'ada rekod' : 'belum direkod'],
        ['OPR', F().opr.filter((o) => o.unit_kod === u.kod).length, `${F().opr.filter((o) => o.unit_kod === u.kod).length} laporan`],
        ['PAJSK', F().pajsk.filter((x) => x.unit_kod === u.kod && x.bidang === u.kategori).length, `${F().pajsk.filter((x) => x.unit_kod === u.kod && x.bidang === u.kategori).length}/${ahli.length} murid diisi`],
      ];
      return `<div class="panel" style="margin-bottom:14px"><h2>Buku Laporan ${e(u.kod)} ${F().tahun}</h2>
          <p class="kecil" style="margin:0 0 8px">Buku laporan dijana automatik daripada data aplikasi. Isi bahagian bertulis di bawah, kemudian cetak untuk fail meja.</p>
          <ul class="semak-laporan">${semak.map(([l, ok, t]) => `<li class="${ok ? 'ok' : ''}"><span>${ok ? '✓' : '○'}</span>${e(l)}: <span class="pudar">${e(t)}</span></li>`).join('')}</ul>
          <a class="btn utama" href="#/takwim/cetak?doc=laporan&unit=${encodeURIComponent(u.kod)}&tahun=${F().tahun}">${IKON.cetak} Lihat dan cetak Buku Laporan</a></div>
        <form class="panel borang" id="borang-f2-laporan" data-unit="${e(u.kod)}">
          <h2 style="margin:0">Bahagian bertulis</h2>
          ${MEDAN_LAPORAN.map(([k, l, ph]) => `<label class="medan">${l}<textarea name="${k}" rows="${k === 'pencapaian' ? 5 : 3}" placeholder="${e(ph)}" ${boleh ? '' : 'readonly'}>${e(L[k] || '')}</textarea></label>`).join('')}
          <div class="dua"><label class="medan">Disediakan oleh<input type="text" name="disediakan" value="${e(L.disediakan || u.guru_penasihat || '')}" ${boleh ? '' : 'readonly'}></label><label class="medan">Jawatan<input type="text" name="jawatan_penyedia" value="${e(L.jawatan_penyedia || 'Guru Penasihat')}" ${boleh ? '' : 'readonly'}></label></div>
          <div class="dua"><label class="medan">Disemak oleh<input type="text" name="disemak" value="${e(L.disemak || '')}" ${boleh ? '' : 'readonly'}></label><label class="medan">Jawatan<input type="text" name="jawatan_penyemak" value="${e(L.jawatan_penyemak || 'Penyelaras Kokurikulum')}" ${boleh ? '' : 'readonly'}></label></div>
          ${boleh ? '<div class="baris-btn"><button class="btn utama" type="submit">Simpan</button></div>' : ''}</form>`;
    }
    async function simpanLaporan(f) {
      const kod = f.dataset.unit, d = Object.fromEntries(new FormData(f));
      Object.keys(d).forEach((k) => { d[k] = String(d[k]).trim(); });
      const rec = await S.db.f2SimpanLaporan({ unit_kod: kod, tahun: F().tahun, data: d });
      const i = F().laporan.findIndex((x) => x.unit_kod === kod); if (i >= 0) F().laporan[i] = rec; else F().laporan.push(rec);
      roti('Laporan disimpan'); S.kekalSkrol = true; render();
    }

    /* ============================================================ PAJSK sekolah */
    function pPajsk(tab, q) {
      const tahun = pilihTahun(q);
      const tabs = [['ringkasan', 'Ringkasan unit'], ['rumusan', 'Rumusan murid'], ['ekstra', 'Ekstra kurikulum']];
      if (!tabs.some((t) => t[0] === tab)) tab = 'ringkasan';
      const kepala = `<div class="kepala tanpa-cetak"><div><h1>PAJSK ${tahun}</h1><p>Markah kokurikulum (Pentaksiran Aktiviti Jasmani, Sukan dan Kokurikulum) daripada data aplikasi.</p></div>
        <div class="baris-btn">${[tahunAsal() - 1, tahunAsal(), tahunAsal() + 1].map((t) => `<a class="cip ${t === tahun ? 'pilih' : ''}" href="#/pajsk/${tab}?tahun=${t}">${t}</a>`).join('')}</div></div>
        <nav class="tab tanpa-cetak">${tabs.map(([k, l]) => `<a href="#/pajsk/${k}?tahun=${tahun}" ${k === tab ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>`;
      const x = sedia(tahun); if (x) return kepala + x;
      return kepala + { ringkasan: pjRingkasan, rumusan: pjRumusan, ekstra: pjEkstra }[tab](q);
    }
    function pjRingkasan() {
      return BIDANG.map((kat) => `<section class="kategori ${kat}"><div class="kategori-kepala"><h2>${KAT[kat]}</h2></div>
        <div class="panel skrol-x" style="padding:0"><table class="jadual"><thead><tr><th>Unit</th><th class="n">Ahli</th><th class="n">Diisi</th><th class="n">Hadir direkod</th><th class="n">Purata</th><th></th></tr></thead><tbody>
        ${unitKat(kat).map((u) => { const ahli = ahliUnit(u), diisi = ahli.filter((m) => rekPajsk(m.id, kat)).length, hd = ahli.filter((m) => F().hadirMap.get(m.id + '|' + kat)).length;
          const pur = ahli.length ? r2(ahli.reduce((s, m) => s + kiraBidang(m, kat).markah, 0) / ahli.length) : 0;
          return `<tr><td><b>${e(u.kod)}</b><br><span class="pudar kecil">${e(u.nama_penuh)}</span></td><td class="n">${ahli.length}</td><td class="n ${diisi === ahli.length && ahli.length ? 'ok' : ''}">${diisi}</td><td class="n">${hd}</td><td class="n">${pur}</td><td><a class="btn kecil" href="#/unit/${encodeURIComponent(u.kod)}/pajsk">Buka</a></td></tr>`; }).join('')}
        </tbody></table></div></section>`).join('');
    }
    function pjRumusan(q) {
      const kelasL = Array.from(new Set(aktif().map((m) => m.kelas))).sort((a, b) => a.localeCompare(b, 'ms', { numeric: true }));
      const kelas = q.get('kelas') || '';
      const murid = kelas ? aktif().filter((m) => m.kelas === kelas).sort(susunMurid) : [];
      const baris = murid.map((m) => ({ m, k: kiraMurid(m) }));
      const gredK = {}; baris.forEach(({ k }) => { if (k.gred) gredK[k.gred] = (gredK[k.gred] || 0) + 1; });
      return `<div class="panel" style="margin-bottom:14px"><form class="penapis" id="f2-pj-kelas" style="grid-template-columns:1fr"><select name="kelas" aria-label="Kelas"><option value="">Pilih kelas</option>${kelasL.map((k) => `<option ${k === kelas ? 'selected' : ''}>${e(k)}</option>`).join('')}</select></form>
          <div class="baris-btn" style="margin-top:10px"><button class="btn" data-act="f2-excel-kelas" data-kelas="${e(kelas)}" ${kelas ? '' : 'disabled'}>${IKON.muat} Excel kelas ini untuk Robot PAJSK</button>
            ${penyelaras() ? `<button class="btn" data-act="f2-excel-semua">${IKON.muat} Excel semua murid</button>` : ''}
            ${kelas ? `<a class="btn" href="#/takwim/cetak?doc=pajskkelas&kelas=${encodeURIComponent(kelas)}&tahun=${F().tahun}">${IKON.cetak} Cetak</a>` : ''}</div>
          <p class="pudar kecil" style="margin:8px 0 0">GPA = purata 2 markah terbaik (KP, UB, SP) + Ekstra (maksimum 10), had 100. Gred: A 80+, B 60+, C 40+, D 20+, E.</p></div>
        ${kelas ? `<div class="panel skrol-x" style="padding:0"><table class="jadual"><thead><tr><th>Nama</th><th class="n">KP</th><th class="n">UB</th><th class="n">SP</th><th class="n">Ekstra</th><th class="n">GPA</th><th class="n">Gred</th></tr></thead><tbody>
          ${baris.map(({ m, k }) => `<tr><td>${e(m.nama)}</td>${BIDANG.map((b) => `<td class="n">${k.b[b] ? k.b[b].markah : '—'}</td>`).join('')}<td class="n">${k.ekstra}</td><td class="n"><b>${k.gpa == null ? '—' : k.gpa}</b></td><td class="n"><b>${e(k.gred)}</b></td></tr>`).join('')}
          </tbody></table></div><p class="kecil">${Object.entries(gredK).sort().map(([g, n]) => `Gred ${g}: ${n}`).join(' · ')}</p>` : '<p class="pudar">Pilih kelas untuk melihat GPA setiap murid.</p>'}`;
    }
    function pjEkstra(q) {
      const cari = (q.get('q') || '').toUpperCase(), kelasL = Array.from(new Set(aktif().map((m) => m.kelas))).sort((a, b) => a.localeCompare(b, 'ms', { numeric: true }));
      const kelas = q.get('kelas') || '';
      const l = (cari || kelas) ? aktif().filter((m) => (!kelas || m.kelas === kelas) && (!cari || m.nama.includes(cari))).sort(susunMurid).slice(0, 200) : [];
      const ada = F().pajsk.filter((x) => x.bidang === 'EKSTRA');
      return `<div class="panel" style="margin-bottom:14px"><form class="penapis" id="f2-pj-ekstra" style="grid-template-columns:2fr 1fr"><input class="cari" type="search" name="q" value="${e(q.get('q') || '')}" placeholder="Cari nama murid" aria-label="Cari"><select name="kelas" aria-label="Kelas"><option value="">Semua kelas</option>${kelasL.map((k) => `<option ${k === kelas ? 'selected' : ''}>${e(k)}</option>`).join('')}</select></form>
          <p class="pudar kecil" style="margin:8px 0 0">Ekstra kurikulum: perkhidmatan (pengawas, ketua kelas), anugerah, khidmat masyarakat, NILAM dan TIMSS. Skor tertinggi diambil, maksimum 10. ${penyelaras() ? 'Penyelaras boleh mengisi.' : 'Hanya penyelaras boleh mengisi.'} ${ada.length} murid sudah ada rekod.</p></div>
        ${l.length ? `<div class="panel" style="padding:0"><ul class="senarai">${l.map((m) => { const d = (rekPajsk(m.id, 'EKSTRA') || {}).data; return `<li><button class="baris" data-act="f2-ekstra" data-murid="${e(m.id)}" ${penyelaras() ? '' : 'disabled'}>
            <span><span class="nama">${e(m.nama)}</span><br><span class="meta">${e(m.kelas)}${d ? ` · ${[d.perkhidmatan, d.anugerah, d.nilam && 'NILAM ' + d.nilam, d.timss && 'TIMSS', d.tl && 'TL'].filter(Boolean).map((x) => e(String(x).slice(0, 40))).join(' · ')}` : ''}</span></span>
            <span class="markah-pajsk ${d ? '' : 'belum'}"><b>${kiraEkstra(d)}</b><small>ekstra</small></span></button></li>`; }).join('')}</ul></div>` : '<p class="pudar">Cari nama atau pilih kelas.</p>'}`;
    }
    function bukaEkstra(mid) {
      const m = S.data.murid.find((x) => x.id === mid), sk = SK(), d = (rekPajsk(mid, 'EKSTRA') || {}).data || {};
      const dlg = $('#dlg');
      dlg.innerHTML = `<div class="dk"><div><h2>${e(m.nama)}</h2><p class="pudar kecil" style="margin:2px 0 0">${e(m.kelas)} · Ekstra kurikulum ${F().tahun}</p></div><button class="btn kosong kecil" data-act="tutup" aria-label="Tutup">${IKON.tutup}</button></div>
        <div class="db"><form class="borang" id="borang-f2-ekstra" data-mid="${e(mid)}">
          <label class="medan">Perkhidmatan<select name="perkhidmatan">${pilihan(sk.PERKHIDMATAN, d.perkhidmatan)}</select></label>
          <label class="medan">Anugerah khas<select name="anugerah">${pilihan(sk.ANUGERAH, d.anugerah)}</select></label>
          <div class="medan"><span>Khidmat masyarakat (bilangan aktiviti, 0–5)</span><div class="grid-km">${sk.KHIDMAT_MASY.map((j, i) => `<label>${e(j)}<input type="number" name="km_${i}" min="0" max="5" value="${e((d.km || {})[j] || '')}"></label>`).join('')}</div></div>
          <div class="dua"><label class="medan">NILAM<select name="nilam">${pilihan(sk.NILAM, d.nilam)}</select></label><label class="medan">TIMSS / PISA<select name="timss">${pilihan(sk.TIMSS, d.timss)}</select></label></div>
          <label class="cek"><input type="checkbox" name="tl" ${d.tl ? 'checked' : ''}> Tidak laksana (TL): murid tidak ditaksir PAJSK</label>
        </form></div>
        <div class="dt"><button class="btn" data-act="tutup">Batal</button><button class="btn utama" type="submit" form="borang-f2-ekstra">Simpan</button></div>`;
      dlg.dataset.id = ''; dlg.dataset.ubah = '';
      if (!dlg.open) dlg.showModal();
    }
    async function simpanEkstra(f) {
      const d = new FormData(f), sk = SK(), km = {};
      sk.KHIDMAT_MASY.forEach((j, i) => { const v = +d.get('km_' + i); if (v > 0) km[j] = Math.min(5, v); });
      const data = { perkhidmatan: d.get('perkhidmatan') || '', anugerah: d.get('anugerah') || '', km, nilam: d.get('nilam') || '', timss: d.get('timss') || '', tl: !!d.get('tl') };
      const [rec] = await S.db.f2SimpanPajsk([{ murid_id: f.dataset.mid, tahun: F().tahun, bidang: 'EKSTRA', unit_kod: null, data, markah: kiraEkstra(data) }]);
      const i = F().pajsk.findIndex((y) => y.murid_id === rec.murid_id && y.bidang === 'EKSTRA'); if (i >= 0) F().pajsk[i] = rec; else F().pajsk.push(rec);
      roti('Ekstra kurikulum disimpan'); $('#dlg').close(); S.kekalSkrol = true; render();
    }
    async function excelPajsk(murid, kats, nama) {
      if (!SK()) throw new Error('Data skor PAJSK tiada.');
      await templatPajsk(murid, kats, nama, isiExcel);
    }

    /* ============================================================ CETAK (semua dokumen Fasa 2) */
    function pCetak(q) {
      const doc = q.get('doc') || 'takwim', u = q.get('unit') ? S.unitPeta.get(q.get('unit')) : null;
      const kembali = u ? `#/unit/${encodeURIComponent(u.kod)}/${{ rancangan: 'takwim', kehadiran: 'kehadiran', opr: 'opr', pajsk: 'pajsk', laporan: 'laporan' }[doc] || ''}` : doc === 'opr' && q.get('id') ? (() => { const o = F().opr.find((x) => x.id === q.get('id')); return o ? `#/unit/${encodeURIComponent(o.unit_kod)}/opr` : '#/takwim'; })() : doc === 'pajskkelas' ? '#/pajsk/rumusan' : '#/takwim/bulan';
      let isi = '', landskap = false;
      try {
        if (doc === 'takwim') isi = dokTakwim();
        else if (doc === 'rancangan' && u) isi = dokRancangan(u);
        else if (doc === 'kehadiran' && u) { isi = dokKehadiran(u); landskap = true; }
        else if (doc === 'opr') isi = dokOpr(q.get('id') ? F().opr.filter((o) => o.id === q.get('id')) : F().opr.filter((o) => u && o.unit_kod === u.kod).sort((a, b) => a.tarikh.localeCompare(b.tarikh)));
        else if (doc === 'pajsk' && u) { isi = dokPajskUnit(u); landskap = true; }
        else if (doc === 'pajskkelas') isi = dokPajskKelas(q.get('kelas'));
        else if (doc === 'laporan' && u) isi = dokLaporan(u);
        else isi = '<section class="halaman dok"><p>Dokumen tidak dijumpai.</p></section>';
      } catch (err) { return /^Memuatkan/.test(err.message) ? `<p class="pudar">${e(err.message)}</p>` : `<div class="mesej ralat">${e(err.message)}</div>`; }
      const bil = (isi.match(/<section class="halaman/g) || []).length;
      return `<div class="panel tanpa-cetak" style="margin-bottom:14px"><p style="margin:0 0 10px"><a href="${kembali}">← Kembali</a></p>
          <div class="baris-btn">${BINGKAI ? '' : `<button class="btn utama" data-act="cetak">${IKON.cetak} Cetak (${bil} halaman)</button>`}
            ${doc === 'takwim' ? `<button class="btn" data-act="f2-excel-takwim">${IKON.muat} Excel</button>` : ''}${doc === 'kehadiran' && u ? `<button class="btn" data-act="f2-excel-hadir" data-unit="${e(u.kod)}">${IKON.muat} Excel</button>` : ''}</div>
          <p class="pudar kecil" style="margin:8px 0 0">${landskap ? 'Cetak pada A4 melintang (landskap). ' : 'Saiz A4. '}Matikan "Headers and footers" dalam tetapan cetak.</p></div>
        <div class="kertas-cetak">${isi}</div>`;
    }
    function dokTakwim() {
      const sem = entri(), ikut = new Map();
      sem.forEach((x) => { const b = x.mula.slice(0, 7); if (!ikut.has(b)) ikut.set(b, []); ikut.get(b).push(x); });
      return `<section class="halaman dok">${kepalaDok(`TAKWIM KOKURIKULUM ${F().tahun}`)}
        ${Array.from(ikut.entries()).map(([b, xs]) => { const [y, mo] = b.split('-').map(Number); return `<div class="blok-acara"><h4 class="bulan-cetak">${BULAN[mo - 1].toUpperCase()} ${y}</h4>
          <table><thead><tr><th style="width:24%">Tarikh</th><th>Perkara</th><th style="width:20%">Jenis</th></tr></thead><tbody>${xs.map((x) => `<tr><td>${e(x.tamat && x.tamat !== x.mula ? fmtJulat(x.mula, x.tamat) : fmtT(x.mula, true))}</td><td>${e(teksEntri(x, false))}</td><td>${x.jenis === 'perjumpaan' ? 'Perjumpaan kokurikulum' : x.olahraga ? 'Kejohanan olahraga' : e(JENIS[x.jenis])}</td></tr>`).join('')}</tbody></table></div>`; }).join('') || '<p>Takwim kosong.</p>'}
        ${ttd(['Disediakan oleh (Penyelaras Kokurikulum)', 'Disahkan oleh (Pengetua)'])}</section>`;
    }
    function dokRancangan(u) {
      const ps = perjumpaanKat(u.kategori), akt = F().aktiviti.filter((a) => a.unit_kod === u.kod).sort((p, q) => p.tarikh_mula.localeCompare(q.tarikh_mula));
      return `<section class="halaman dok">${kepalaDok(`RANCANGAN TAHUNAN ${F().tahun}`, `${e(u.nama_penuh)} (${e(u.kod)})`)}
        <table><thead><tr><th>Bil</th><th>Tarikh</th><th>Hari</th><th>Aktiviti</th><th>Tempat</th><th>Status</th></tr></thead><tbody>
        ${ps.map((p) => { const r = rancangan(p.id, u.kod) || {}; return `<tr><td>${p.bil}</td><td>${e(fmtT(p.tarikh))}</td><td>${HARI[tk(p.tarikh).getDay()]}</td><td>${e(r.tajuk || '')}</td><td>${e(r.tempat || '')}</td><td>${STATUS_R[r.status || 'dirancang']}</td></tr>`; }).join('')}</tbody></table>

    /* ============================================================ Utama: panel ringkas */
    function panelUtama() {
      const tahun = tahunAsal();
      if (!S.f2 || S.f2.tahun !== tahun) { if (!S.f2 || !S.f2.ralat) muat(tahun).then(() => { if (/^#?\/?(utama)?$/.test(location.hash || '')) renderLatar(); }); return ''; }

        ${perluHadir.length ? `<p class="kecil" style="margin:10px 0 0">Unit anda: ${perluHadir.map(({ u }) => `<a href="#/unit/${encodeURIComponent(u.kod)}/kehadiran">${e(u.kod)}: rekod kehadiran</a>`).join(' · ')}</p>` : ''}</div>`;

    /* ============================================================ excel */

    function eksportHadir(kod) {

      const rows = [['BIL', 'NAMA', 'KELAS'].concat(ps.map((p) => `P${p.bil} ${p.tarikh}`), ['JUMLAH HADIR'])].concat(ahliUnit(u).map((m, i) => [i + 1, m.nama, m.kelas]
        .concat(ps.map((p) => (keh.find((k) => k.perjumpaan_id === p.id && k.murid_id === m.id) || {}).status || ''), [keh.filter((k) => k.murid_id === m.id && k.status === 'H').length])));
      return eksport(`KEHADIRAN-${kod}-${F().tahun}.xlsx`, [['Kehadiran', [[`REKOD KEHADIRAN ${u.nama_penuh} ${F().tahun}`], ['H = hadir, T = tidak hadir, B = bersebab'], []].concat(rows)]]).then((ok) => { if (ok) roti('Fail Excel disediakan'); });

    /* ============================================================ penghala dalaman */

    async function tindakan(act, el) {
      switch (act) {
        case 'f2-muat': S.f2 = null; render(); return true;
        case 'f2-aktiviti': bukaAktiviti(el.dataset.id, { jenis: el.dataset.jenis, unit: el.dataset.unit }); return true;
        case 'f2-padam-aktiviti': {
          if (!(await sahkan('Padam aktiviti ini?', { ok: 'Padam', bahaya: true }))) return true;
          await S.db.f2PadamAktiviti(+el.dataset.id); F().aktiviti = F().aktiviti.filter((a) => a.id !== +el.dataset.id);
          $('#dlg').close(); roti('Aktiviti dipadam'); S.kekalSkrol = true; render(); return true;
        }
        case 'f2-semua': $$('#borang-f2-hadir input[type=radio]').forEach((x) => { x.checked = x.value === el.dataset.v; }); kiraHadirBorang(); return true;
        case 'f2-padam-opr': {
          const o = F().opr.find((x) => x.id === el.dataset.id);
          if (!(await sahkan(`Padam OPR "${o.tajuk}" bersama ${(o.gambar || []).length} gambar?`, { ok: 'Padam', bahaya: true }))) return true;
          await S.db.f2PadamOpr(o); F().opr = F().opr.filter((x) => x.id !== o.id);
          roti('OPR dipadam'); tetapLokasi(`#/unit/${encodeURIComponent(o.unit_kod)}/opr`); render(); return true;
        }
        case 'f2-pajsk': bukaPajsk(el.dataset.murid, el.dataset.unit); return true;
        case 'f2-pukal': bukaPukal(el.dataset.unit); return true;
        case 'f2-ekstra': bukaEkstra(el.dataset.murid); return true;
        case 'f2-excel-unit': { const u = S.unitPeta.get(el.dataset.unit); await excelPajsk(ahliUnit(u), [u.kategori], u.kod); return true; }
        case 'f2-excel-kelas': await excelPajsk(aktif().filter((m) => m.kelas === el.dataset.kelas), BIDANG, 'KELAS-' + el.dataset.kelas); return true;
        case 'f2-excel-semua': await excelPajsk(aktif(), BIDANG, 'SEMUA'); return true;
        case 'f2-excel-takwim': await eksportTakwim(); return true;

    function ubah(ev) {

      if (t.closest('#borang-f2-pajsk')) { kiraPajskBorang(); return true; }
      if (t.id === 'pukal-semua') { $$('#borang-f2-pukal [name=murid]').forEach((x) => { x.checked = t.checked; }); return true; }
      if (t.closest('#borang-f2-opr') && t.name === 'perjumpaan_id') { isiDariPerjumpaan(t.closest('form')); return true; }
      if (t.closest('#f2-pj-kelas')) { tetapLokasi(`#/pajsk/rumusan?tahun=${F().tahun}&kelas=${encodeURIComponent(t.value)}`); S.kekalSkrol = true; render(); return true; }
      if (t.closest('#f2-pj-ekstra')) {
        const f = t.closest('form'), d = new FormData(f);
        tetapLokasi(`#/pajsk/ekstra?tahun=${F().tahun}&q=${encodeURIComponent(d.get('q') || '')}&kelas=${encodeURIComponent(d.get('kelas') || '')}`); S.kekalSkrol = true;
        clearTimeout(S.f2Timer); S.f2Timer = setTimeout(() => { render(); const c = $('#f2-pj-ekstra [name=q]'); if (c && t.name === 'q') { c.focus(); c.setSelectionRange(c.value.length, c.value.length); } }, t.name === 'q' ? 300 : 0);
        return true;
      }
      return false;
    }
    async function hantar(f, ev) {
      const lagi = ev && ev.submitter && ev.submitter.name === 'lagi';
      switch (f.id) {
        case 'borang-f2-jana': await simpanJana(f); return true;
        case 'borang-f2-tarikh': await simpanTarikh(f); return true;
        case 'borang-f2-aktiviti': await simpanAktiviti(f); return true;
        case 'borang-f2-rancangan': await simpanRancangan(f); return true;
        case 'borang-f2-hadir': await simpanHadir(f); return true;
        case 'borang-f2-opr': await simpanOpr(f); return true;
        case 'borang-f2-pajsk': await simpanPajsk(f, lagi); return true;
        case 'borang-f2-pukal': await simpanPukal(f); return true;
        case 'borang-f2-ekstra': await simpanEkstra(f); return true;
        case 'borang-f2-laporan': await simpanLaporan(f); return true;
        default: return false;
      }
    }
    function selepasRender() { if ($('#borang-f2-jana')) pratontonJana(); if ($('#borang-f2-hadir')) kiraHadirBorang(); }

    return { papar, paparUnit, navUnit, TAB_UNIT, tindakan, ubah, hantar, selepasRender, panelUtama, kiraMurid, isiExcel,
      _uji: { kiraBidang, kiraEkstra, skorHadir, janaTarikh, fmtT } };
  };
})();

<script>
/* KOKUM SMART 2026 · aplikasi utama (Fasa 1) */
(function () {
  'use strict';

  const C = window.KOKUM_CONFIG || {};

  const URL_XLSX = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  const BINGKAI = !!window.KOKUM_BINGKAI; // versi dalam Claude (artifact): tiada cetak, tiada service worker, laluan dalam ingatan

  const KATS = ['UB', 'KP', 'SP'];

  const KI = window.KokumImport;

  const JAWATAN = KP_.JAWATAN;              // { UB: [...], KP: [...], SP: [...] } ikut teks MOEIS
  const jawatanMoeis = (kat, j) => !j || !!KP_.petaJawatan(kat, j);

  const S = {
    db: null, user: null, profil: null, data: null, unitPeta: new Map(), unitSaya: new Set(),
    f: { q: '', ting: '', kelas: '', keg: '', unit: '', status: 'aktif' }, had: 60,
    cetak: { mod: 'unit', pilih: '', mykad: false }, importHasil: null, pasang: null,
  };

  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const e = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const app = () => $('#app');

  // ------------------------------------------------------------------ ikon
  const P = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const IKON = {
    utama: P('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
    murid: P('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.6c2.7-.3 4.8 1.3 5.5 4.4"/>'),
    unit: P('<path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'),
    cetak: P('<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>'),
    tetapan: P('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
    tambah: P('<path d="M12 5v14M5 12h14"/>'),
    muat: P('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
    naik: P('<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>'),
    segar: P('<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>'),
    tutup: P('<path d="M6 6l12 12M18 6L6 18"/>'),
    olahraga: P('<circle cx="14.5" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v5M6 11l3-3 4 1 3 3 3-1M11 15l2-6"/>'),
    takwim: P('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7.5 14h2M11 14h2M14.5 14h2M7.5 17.5h2M11 17.5h2"/>'),
  };

  // ------------------------------------------------------------------ bantuan
  let rotiTimer;
  function roti(teks, ralat) {
    let el = $('#roti');
    if (!el) { el = document.createElement('div'); el.id = 'roti'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.className = 'roti' + (ralat ? ' ralat' : '');
    el.textContent = teks;
    el.hidden = false;
    clearTimeout(rotiTimer);
    rotiTimer = setTimeout(() => { el.hidden = true; }, ralat ? 6000 : 2600);
  }
  // Pengesahan dalam halaman (confirm() tidak berfungsi dalam semua paparan)
  function sahkan(teks, { ok = 'Teruskan', bahaya = false } = {}) {
    return new Promise((selesai) => {
      let d = document.getElementById('dlg-sah');
      if (!d) { d = document.createElement('dialog'); d.id = 'dlg-sah'; document.body.appendChild(d); }
      d.innerHTML = `<div class="db" style="padding-top:20px"><p style="white-space:pre-line;margin:0">${e(teks)}</p></div>
        <div class="dt"><button class="btn" value="0" id="sah-batal">Batal</button><button class="btn ${bahaya ? 'bahaya' : 'utama'}" id="sah-ok">${e(ok)}</button></div>`;
      const tamat = (v) => { d.onclose = null; if (d.open) d.close(); selesai(v); };
      d.querySelector('#sah-batal').onclick = () => tamat(false);
      d.querySelector('#sah-ok').onclick = () => tamat(true);
      d.onclose = () => selesai(false);
      d.showModal();
      d.querySelector('#sah-ok').focus();
    });
  }
  const gagal = (err) => { console.error(err); roti(err && err.message ? err.message : String(err), true); };

  const skripDimuat = {};
  function muatSkrip(url) {
    if (!skripDimuat[url]) skripDimuat[url] = new Promise((ok, tolak) => {
      const s = document.createElement('script');
      s.src = url; s.onload = ok;
      s.onerror = () => { delete skripDimuat[url]; tolak(new Error('Tidak dapat memuat turun komponen. Semak sambungan internet.')); };
      document.head.appendChild(s);
    });
    return skripDimuat[url];
  }
  const muatXLSX = () => (window.XLSX ? Promise.resolve() : muatSkrip(URL_XLSX));

  const penyelaras = () => S.profil && S.profil.peranan === 'penyelaras';
  const bolehUrus = (kod) => penyelaras() || S.unitSaya.has(kod);
  const aktif = () => S.data.murid.filter((m) => m.status !== 'keluar');
  const unitKat = (kat, semua) => S.data.units.filter((u) => u.kategori === kat && (semua || u.aktif !== false)).sort((a, b) => (a.susunan || 0) - (b.susunan || 0) || a.kod.localeCompare(b.kod));
  const susunTing = (t) => { const i = TING.indexOf(t); return i < 0 ? 99 : i; };
  const susunMurid = (a, b) => susunTing(a.tingkatan) - susunTing(b.tingkatan) || a.kelas.localeCompare(b.kelas) || a.nama.localeCompare(b.nama);
  const labelTing = (t) => (t === 'PPKI' ? 'PPKI' : 'Tingkatan ' + t);
  const kadRingkas = (k) => (!k ? 'tiada MyKad' : KI.mykadSah(k) ? 'MyKad …' + k.slice(-4) : 'MyKad belum sah');
  const hariIni = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const tarikh = (s) => { try { return new Date(s).toLocaleString('ms-MY', { dateStyle: 'medium', timeStyle: 'short' }); } catch (x) { return s; } };

  function kelasSenarai(ting) {
    const set = new Set(S.data.murid.filter((m) => !ting || m.tingkatan === ting).map((m) => m.kelas));
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'ms', { numeric: true }));
  }

  function bilanganUnit() {
    const peta = new Map(S.data.units.map((u) => [u.kod, { L: 0, P: 0, j: 0 }]));
    aktif().forEach((m) => KATS.forEach((k) => {
      const kod = m[k.toLowerCase()];
      if (!kod) return;
      if (!peta.has(kod)) peta.set(kod, { L: 0, P: 0, j: 0 });
      const c = peta.get(kod); c.j++; if (m.jantina === 'L') c.L++; else if (m.jantina === 'P') c.P++;
    }));
    return peta;
  }

  function lencanaSet(m) {
    return '<span class="lencana-set">' + KATS.map((k) => {
      const kod = m[k.toLowerCase()];
      return kod ? `<span class="lencana ${k}" title="${e(KAT[k])}: ${e(kod)}">${e(kod)}</span>`
        : `<span class="lencana kosong" title="${e(KAT[k])} belum ditetapkan">${k} —</span>`;
    }).join('') + '</span>';
  }

  function kelengkapan(m) {
    const item = [
      ['No. MyKad sah', KI.mykadSah(m.mykad)],
      ['Unit beruniform', !!m.ub], ['Kelab & persatuan', !!m.kp], ['Sukan & permainan', !!m.sp],
      ['Rumah sukan', !!m.rumah_sukan],
    ];
    return { peratus: Math.round((item.filter((x) => x[1]).length / item.length) * 100), kurang: item.filter((x) => !x[1]).map((x) => x[0]) };
  }

  function isuMurid(m) {
    return KI.semakMurid(m, S.unitPeta).map((x) => x.mesej);
  }

  const kunciIsu = {
    tiadaUB: (m) => !m.ub, tiadaKP: (m) => !m.kp, tiadaSP: (m) => !m.sp,
    belum: (m) => !m.ub || !m.kp || !m.sp, lengkap: (m) => m.ub && m.kp && m.sp,
    isuKad: (m) => !KI.mykadSah(m.mykad), tiadaRumah: (m) => !m.rumah_sukan,
    jantinaUnit: (m) => KATS.some((k) => { const u = S.unitPeta.get(m[k.toLowerCase()]); return u && u.jantina && m.jantina && u.jantina !== m.jantina; }),
    berganda: (m) => S.bergandaId && S.bergandaId.has(m.id),
    jawatanMoeis: (m) => KATS.some((k) => m[k.toLowerCase()] && !jawatanMoeis(k, m[k.toLowerCase() + '_jawatan'])),
  };
  const LABEL_KEG = {
    '': 'Semua kegiatan', belum: 'Belum lengkap', lengkap: 'Lengkap 3 kegiatan', tiadaUB: 'Tiada UB', tiadaKP: 'Tiada KP', tiadaSP: 'Tiada SP',
    isuKad: 'MyKad belum sah', tiadaRumah: 'Tiada rumah sukan', jantinaUnit: 'Jantina tidak sesuai dengan unit', berganda: 'Kemungkinan berganda',
    jawatanMoeis: 'Jawatan tiada dalam MOEIS',
  };

  function lokasiKini() { return BINGKAI ? (S.lokasi || '') : location.hash; }
  function pergi(hash) { if (BINGKAI) { S.lokasi = hash; render(); } else location.hash = hash; }
  function tetapLokasi(hash) { if (BINGKAI) S.lokasi = hash; else history.replaceState(null, '', hash); }
  function hashBahagian() {
    const [laluan, qs] = lokasiKini().replace(/^#\/?/, '').split('?');

  }

  // ------------------------------------------------------------------ eksport Excel
  async function eksport(namaFail, helaian) {
    await muatXLSX();
    const wb = window.XLSX.utils.book_new();
    helaian.forEach(([nama, aoa]) => {
      const ws = window.XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = (aoa[aoa.length - 1] || []).map((_, i) => ({ wch: i === 1 ? 42 : 14 }));
      window.XLSX.utils.book_append_sheet(wb, ws, nama.slice(0, 31));
    });
    if (!BINGKAI) { window.XLSX.writeFile(wb, namaFail); return true; }
    const dl = await muatTurun();
    if (!dl) throw new Error('Muat turun fail tidak tersedia dalam paparan ini.');
    const buf = window.XLSX.write(wb, { type: 'array', bookType: 'xlsx' });

      if (err && err.code === 'declined') return false;

  let dlJanji = null;
  function muatTurun() {
    if (!dlJanji) dlJanji = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);

  function baris_eksport(senarai) {
    return senarai.map((m, i) => [i + 1, m.nama, m.tingkatan === 'PPKI' ? 'X' : m.tingkatan, m.kelas, m.mykad || '', m.jantina || '',
      m.ub || '', m.ub_jawatan || '', m.kp || '', m.kp_jawatan || '', m.sp || '', m.sp_jawatan || '', m.rumah_sukan || '', m.status === 'keluar' ? 'K' : '']);
  }
  const TAJUK_EKSPORT = ['BIL', 'NAMA PELAJAR', 'TINGKATAN', 'KELAS', 'NO MYKAD', 'GENDER', 'UNIT BERUNIFORM (UB)', 'JAWATAN',
    'KELAB DAN PERSATUAN (KP)', 'JAWATAN', 'SUKAN PERMAINAN (SP)', 'JAWATAN', 'RUMAH SUKAN', 'MURID KELUAR (K)'];

  function eksportSemua() {
    const t = S.data.tetapan || {};
    const senarai = S.data.murid.slice().sort(susunMurid);

      ['PEMBAHAGIAN & PENDAFTARAN KEGIATAN KOKURIKULUM MURID'],
      ['TAHUN:', t.tahun || ''], ['DIEKSPORT:', tarikhHari], TAJUK_EKSPORT, ...baris_eksport(senarai)]]]).then((ok) => { if (ok) roti('Fail Excel disediakan'); }, gagal);
  }

  // ------------------------------------------------------------------ permulaan
  async function mula() {
    const qs = new URLSearchParams(location.search);
    const adaKonfig = C.supabaseUrl && C.supabaseAnonKey && !/GANTI/i.test(C.supabaseUrl + C.supabaseAnonKey);
    S.demo = qs.has('demo') || !adaKonfig;
    S.tiadaKonfig = !adaKonfig;
    app().innerHTML = '<div class="pemuat">Memuatkan KOKUM SMART…</div>';
    try {
      if (S.demo) S.db = window.KokumDB.DemoDB();
      else { await muatSkrip(URL_SB); S.db = window.KokumDB.SupabaseDB(C.supabaseUrl, C.supabaseAnonKey); }
    } catch (err) {
      app().innerHTML = `<div class="skrin-masuk"><div class="panel kad-masuk"><h2>Tidak dapat dimulakan</h2><p>${e(err.message)}</p><button class="btn utama" onclick="location.reload()">Cuba lagi</button></div></div>`;
      return;
    }
    S.db.onAuth((ev) => {
      if (ev === 'PASSWORD_RECOVERY') skrinMasuk('baharu');
      if (ev === 'SIGNED_OUT') { S.user = null; S.profil = null; S.data = null; skrinMasuk('masuk'); }
    });
    window.addEventListener('hashchange', () => { if (S.data && !BINGKAI) render(); });
    if (BINGKAI) document.addEventListener('click', (ev) => {
      const a = ev.target.closest('a[href^="#/"]');
      if (a) { ev.preventDefault(); pergi(a.getAttribute('href')); }
    }, true);
    const pulih = /type=recovery/.test(location.hash + location.search);
    const user = await S.db.sesi().catch(() => null);
    if (pulih && user) { S.user = user; return skrinMasuk('baharu'); }
    if (!user) return skrinMasuk('masuk');
    await selepasMasuk(user);
  }

  async function selepasMasuk(user) {
    S.user = user;
    try { S.profil = await S.db.profilSaya(user.id); } catch (err) { gagal(err); }
    if (!S.profil || !S.profil.aktif) return skrinMenunggu();
    await muatData(true);
  }

  async function muatData(pertama) {
    if (pertama) app().innerHTML = '<div class="pemuat">Memuatkan data murid…</div>';
    try {
      S.data = await S.db.muatSemua(penyelaras());
    } catch (err) {
      app().innerHTML = `<div class="skrin-masuk"><div class="panel kad-masuk"><h2>Data tidak dapat dimuatkan</h2><p>${e(err.message)}</p><div class="baris-btn"><button class="btn utama" data-act="muat-semula">Cuba lagi</button><button class="btn" data-act="keluar">Log keluar</button></div></div></div>`;
      return;
    }
    S.data.murid.sort(susunMurid);
    S.unitPeta = new Map(S.data.units.map((u) => [u.kod, u]));
    S.unitSaya = new Set(S.data.guruUnit.filter((g) => g.user_id === S.user.id).map((g) => g.unit_kod));
    S.berganda = KI.cariBerganda(aktif());
    S.bergandaId = new Set(S.berganda.flat().filter((x) => x && x.id).map((x) => x.id));
    S.dimuatPada = new Date();
    render();
  }

  // ------------------------------------------------------------------ skrin log masuk
  function skrinMasuk(mod, mesej) {
    const t = {
      masuk: ['Log masuk', 'Gunakan e-mel dan kata laluan akaun guru anda.'],
      daftar: ['Daftar akaun guru', 'Selepas mendaftar, penyelaras kokurikulum perlu mengesahkan akaun anda.'],
      lupa: ['Set semula kata laluan', 'Kami akan menghantar pautan ke e-mel anda.'],
      baharu: ['Kata laluan baharu', 'Masukkan kata laluan baharu untuk akaun anda.'],
    }[mod];
    app().innerHTML = `
      <main class="skrin-masuk">
        <div class="masuk-bungkus">
        <img class="slogan" src="${SLOGAN}" alt="SMKUSR Tekad Berapi">
        <div class="panel kad-masuk">
          <div class="jenama"><img src="${LOGO}" alt=""><div><b>KOKUM SMART</b><span>SMK Ulu Sugut, Ranau</span></div></div>
          <h2>${t[0]}</h2><p class="pudar kecil">${t[1]}</p>
          ${mesej ? `<div class="mesej ${mesej[0]}">${e(mesej[1])}</div>` : ''}
          <form class="borang" id="borang-masuk" data-mod="${mod}">
            ${mod === 'daftar' ? '<label class="medan">Nama penuh<input type="text" name="nama" required autocomplete="name"></label>' : ''}
            ${mod !== 'baharu' ? '<label class="medan">E-mel<input type="email" name="email" required autocomplete="email"></label>' : ''}
            ${mod !== 'lupa' ? `<label class="medan">Kata laluan<input type="password" name="pw" required minlength="6" autocomplete="${mod === 'masuk' ? 'current-password' : 'new-password'}"></label>` : ''}
            <button class="btn utama" type="submit">${{ masuk: 'Log masuk', daftar: 'Daftar akaun', lupa: 'Hantar pautan', baharu: 'Simpan kata laluan' }[mod]}</button>
          </form>
          <div class="tukar">
            ${mod === 'masuk' ? '<button data-act="ke" data-mod="daftar">Daftar akaun guru baharu</button><br><button data-act="ke" data-mod="lupa">Lupa kata laluan?</button>' : ''}
            ${mod === 'daftar' || mod === 'lupa' ? '<button data-act="ke" data-mod="masuk">Kembali ke log masuk</button>' : ''}
          </div>
        </div>
        </div>
      </main>`;
    const f = $('#borang-masuk');
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      const btn = f.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        if (mod === 'masuk') { await S.db.masuk(d.email.trim(), d.pw); await selepasMasuk(await S.db.sesi()); return; }
        if (mod === 'daftar') {
          const r = await S.db.daftar(d.email.trim(), d.pw, d.nama.trim().toUpperCase());
          if (r.perluSahkan) return skrinMasuk('masuk', ['ok', 'Akaun didaftarkan. Buka pautan pengesahan dalam e-mel anda, kemudian log masuk.']);
          return selepasMasuk(await S.db.sesi());
        }
        if (mod === 'lupa') { await S.db.lupa(d.email.trim()); return skrinMasuk('masuk', ['ok', 'Pautan set semula telah dihantar jika e-mel ini berdaftar.']); }
        if (mod === 'baharu') { await S.db.tukarKataLaluan(d.pw); roti('Kata laluan dikemas kini'); history.replaceState(null, '', location.pathname); return selepasMasuk(await S.db.sesi()); }
      } catch (err) {
        skrinMasuk(mod, ['ralat', err.message]);
      } finally { btn.disabled = false; }
    });
  }

  function skrinMenunggu() {
    app().innerHTML = `
      <main class="skrin-masuk"><div class="masuk-bungkus"><img class="slogan" src="${SLOGAN}" alt="SMKUSR Tekad Berapi"><div class="panel kad-masuk">
        <div class="jenama"><img src="${LOGO}" alt=""><div><b>KOKUM SMART</b><span>SMK Ulu Sugut, Ranau</span></div></div>

        <p>Akaun <b>${e(S.user && S.user.email)}</b> telah didaftarkan tetapi belum diaktifkan.</p>
        <p class="pudar">Minta penyelaras kokurikulum membuka Tetapan, Akaun guru dan mengesahkan akaun anda. Selepas itu, tekan Semak semula.</p>
        <div class="baris-btn"><button class="btn utama" data-act="semak-semula">Semak semula</button><button class="btn" data-act="keluar">Log keluar</button></div>

  }

  // ------------------------------------------------------------------ rangka & penghala
  const MENU = [['utama', 'Utama'], ['murid', 'Murid'], ['unit', 'Unit'], ['takwim', 'Takwim'], ['olahraga', 'Olahraga'], ['cetak', 'Cetak'], ['tetapan', 'Tetapan']];
  const MENU_BAWAH = ['utama', 'murid', 'unit', 'takwim', 'olahraga', 'tetapan'];  // Cetak ada dalam setiap halaman
  const AIS = window.KokumAIS({ S, e, $, $$, IKON, roti, sahkan, gagal, render: () => render(), penyelaras, aktif: () => aktif(),
    eksport, KI, susunMurid, tetapLokasi, hariIni, LOGO, BINGKAI });
  const F2 = window.KokumFasa2({ S, e, $, $$, IKON, roti, sahkan, gagal, render: () => render(), penyelaras, aktif: () => aktif(),
    eksport, susunMurid, tetapLokasi, hariIni, LOGO, BINGKAI, KAT, bolehUrus, ahliUnit: (u) => ahliUnit(u), unitKat: (k, s) => unitKat(k, s), KP_,
    templatPajsk: (m, k, n, isi) => templatPajsk(m, k, n, isi) });

  function rangka(aktifMenu, isi) {
    const t = S.data.tetapan || {};
    const nav = (kelas) => `<nav class="nav ${kelas}" aria-label="Menu utama">${MENU.filter(([k]) => kelas !== 'nav-bawah' || MENU_BAWAH.includes(k)).map(([k, l]) =>
      `<a href="#/${k}" ${k === aktifMenu ? 'aria-current="page"' : ''}>${IKON[k]}<span>${l}</span></a>`).join('')}</nav>`;
    return `
      <div class="rangka">
        <aside class="rel">
          <div class="jenama"><img src="${LOGO}" alt=""><div><b>KOKUM SMART</b><span>${e(t.nama_sekolah || '')} · ${e(t.tahun || '')}</span></div></div>
          ${nav('')}
          <img class="slogan-rel" src="${SLOGAN}" alt="SMKUSR Tekad Berapi">
          <div class="bawah">
            <div><b>${e(S.profil.nama || S.profil.email)}</b></div>
            <div class="pudar">${penyelaras() ? 'Penyelaras' : S.unitSaya.size ? 'Guru penasihat' : 'Guru'}${S.demo ? ' <span class="lencana-demo">Demo</span>' : ''}</div>
          </div>
        </aside>
        <header class="atas-mudah"><img src="${LOGO}" alt=""><b>KOKUM SMART</b>${S.demo ? '<span class="lencana-demo">Demo</span>' : ''}</header>
