    /* ------------------------------------------------------------ pencapaian & aktiviti tambahan */
    const bolehPadamPc = (x) => penyelaras() || (S.user && x.oleh === S.user.id) || x.oleh === 'demo';
    function pjPencapaian(q) {

      const bidang = q.get('bidang') || '', cari = (q.get('q') || '').toUpperCase(), peta = new Map(S.data.murid.map((m) => [m.id, m]));

          <form class="penapis" id="f2-pc-tapis" style="grid-template-columns:2fr 1fr;margin-top:10px"><input class="cari" type="search" name="q" value="${e(q.get('q') || '')}" placeholder="Cari murid, aktiviti atau program" aria-label="Cari"><select name="bidang" aria-label="Bidang"><option value="">Semua bidang</option>${BIDANG.map((k) => `<option value="${k}" ${k === bidang ? 'selected' : ''}>${KAT[k]}</option>`).join('')}</select></form>
          <div class="baris-btn" style="margin-top:10px"><button class="btn utama" data-act="f2-pc-baru">${IKON.tambah} Tambah pencapaian</button><button class="btn" data-act="f2-excel-pc">${IKON.muat} Excel</button></div></div>
        ${kump.size ? Array.from(kump.values()).map((xs) => { const x = xs[0]; return `<div class="panel kad-pc" style="margin-bottom:12px"><div class="kecil pudar">${cipKat(x.bidang)} ${e(x.peringkat)}${x.tarikh ? ' · ' + e(fmtT(x.tarikh)) : ''}${x.oleh_nama ? ' · dimasukkan oleh ' + e(x.oleh_nama) : ''}</div>

              ${bolehPadamPc(y) ? `<button class="pautan kecil" data-act="f2-pc-padam" data-id="${e(y.id)}">padam</button>` : ''}</li>`; }).join('')}</ul></div>`; }).join('') : '<div class="panel kosong-isi"><h3>Belum ada rekod</h3><p>Tambah pencapaian pertandingan atau aktiviti tambahan murid.</p></div>'}`;
    }
    function bukaPc(pra) {

        <div class="db"><form class="borang" id="borang-f2-pc" data-kembali="${e(pra.kembali || '')}">

    async function simpanPc(f) {

        tarikh: d.get('tarikh') || null, peringkat: d.get('peringkat'), jenis_libat: d.get('jenis_libat'), kedudukan: d.get('kedudukan') || null,
        catatan: String(d.get('catatan') || '').trim() || null, oleh_nama: S.profil.nama || S.profil.email || null };
      const baru = await S.db.f2SimpanPencapaian(f._murid.map((mid) => ({ ...asas, murid_id: mid })));
      F().pencapaian.push(...baru);
      await simpanMarkahSemula(f._murid, asas.bidang);
      roti(`${baru.length} rekod disimpan`);
      if (f.dataset.kembali === 'murid' && f._murid.length === 1 && ctx.bukaMurid) ctx.bukaMurid(f._murid[0]);

    /* ============================================================ CETAK (semua dokumen Fasa 2) */
    function pCetak(q) {
      const doc = q.get('doc') || 'takwim', u = q.get('unit') ? S.unitPeta.get(q.get('unit')) : null;
      const kembali = u ? `#/unit/${encodeURIComponent(u.kod)}/${{ rancangan: 'takwim', kehadiran: 'kehadiran', opr: 'opr', pajsk: 'pajsk', laporan: 'laporan' }[doc] || ''}` : doc === 'opr' && q.get('id') ? (() => { const o = F().opr.find((x) => x.id === q.get('id')); return o ? `#/unit/${encodeURIComponent(o.unit_kod)}/opr` : '#/takwim'; })() : doc === 'pajskkelas' ? '#/pajsk/rumusan' : '#/takwim/bulan';
      let isi = '', landskap = false;
      try {
        if (doc === 'takwim') { isi = dokTakwim(); landskap = true; }
        else if (doc === 'takwimbulan') isi = dokTakwimBulan();
        else if (doc === 'rancangan' && u) isi = dokRancangan(u);
        else if (doc === 'kehadiran' && u) { isi = dokKehadiran(u); landskap = true; }
        else if (doc === 'opr') isi = dokOpr(q.get('id') ? F().opr.filter((o) => o.id === q.get('id')) : F().opr.filter((o) => u && o.unit_kod === u.kod).sort((a, b) => a.tarikh.localeCompare(b.tarikh)));
        else if (doc === 'pajsk' && u) { isi = dokPajskUnit(u); landskap = true; }
        else if (doc === 'pajskkelas') isi = dokPajskKelas(q.get('kelas'));
        else if (doc === 'laporan' && u) isi = dokLaporan(u);
        else isi = '<section class="halaman dok"><p>Dokumen tidak dijumpai.</p></section>';
      } catch (err) { return /^Memuatkan/.test(err.message) ? `<p class="pudar">${e(err.message)}</p>` : `<div class="mesej ralat">${e(err.message)}</div>`; }
      const bil = (isi.match(/<section class="halaman/g) || []).length;
      return `<div class="panel tanpa-cetak" style="margin-bottom:14px"><p style="margin:0 0 10px"><a href="${kembali}">← Kembali</a></p>
          <div class="baris-btn">${BINGKAI ? '' : `<button class="btn utama" data-act="cetak">${IKON.cetak} Cetak (${bil} halaman)</button>`}
            ${doc === 'takwim' || doc === 'takwimbulan' ? `<button class="btn" data-act="f2-excel-takwim">${IKON.muat} Excel</button><a class="btn" href="#/takwim/cetak?doc=${doc === 'takwim' ? 'takwimbulan' : 'takwim'}&tahun=${F().tahun}">${doc === 'takwim' ? 'Format ikut bulan' : 'Format sekolah'}</a>` : ''}${doc === 'kehadiran' && u ? `<button class="btn" data-act="f2-excel-hadir" data-unit="${e(u.kod)}">${IKON.muat} Excel</button>` : ''}</div>
          <p class="pudar kecil" style="margin:8px 0 0">${landskap ? 'Cetak pada A4 melintang (landskap). ' : 'Saiz A4. '}Matikan "Headers and footers" dalam tetapan cetak.</p></div>
        <div class="kertas-cetak">${isi}</div>`;
    }
    const ttdKokum = () => { const x = T().ttd_kokum; return Array.isArray(x) && x.length === 2 && (x[0].nama || x[1].nama) ? x : [{ nama: (T().pegawai || {}).su_kokum || '', jawatan: 'Setiausaha Kokurikulum' }, { nama: (T().pegawai || {}).pk_kokum || '', jawatan: 'Penolong Kanan Kokurikulum' }]; };
    function dokTakwim() {
      const b = barisSekolah(), C = kiraanBidang();
      if (!b.length) return '<section class="halaman dok"><p>Takwim kosong.</p></section>';
      return `<section class="halaman dok landskap takwim-dok">${kepalaDok(`TAKWIM KOKURIKULUM ${F().tahun}`)}
        ${jadualSekolah(b, false)}
        <p class="nota-borang">M = minggu ke-. ★ perjumpaan unit (dikira untuk PAJSK) · √ menyokong program (tidak dikira). Jumlah perjumpaan: UB ${C.UB}, KP ${C.KP}, SP ${C.SP}. Tarikh bertanda tentatif tertakluk kepada perubahan.</p>
        ${ttd(ttdKokum().map((x, i) => `${i ? 'Disahkan oleh' : 'Disediakan oleh'},<br>${x.nama ? `<b>(${e(x.nama)})</b><br>` : '<br>'}${e(x.jawatan || '')}<br>Tarikh:`))}</section>`;

    function dokTakwimBulan() {

        ${Array.from(ikut.entries()).map(([b, xs]) => { const [y, mo] = b.split('-').map(Number); return `<div class="blok-acara"><h4 class="bulan-cetak">${BULAN[mo - 1].toUpperCase()} ${y}</h4>

    /* ============================================================ Utama: panel ringkas */

    async function tindakan(act, el) {
      switch (act) {
        case 'f2-muat': S.f2 = null; render(); return true;

        case 'f2-padam-aktiviti': {
          if (!(await sahkan('Padam aktiviti ini?', { ok: 'Padam', bahaya: true }))) return true;
          await S.db.f2PadamAktiviti(+el.dataset.id); F().aktiviti = F().aktiviti.filter((a) => a.id !== +el.dataset.id);
          $('#dlg').close(); roti('Aktiviti dipadam'); S.kekalSkrol = true; render(); return true;
        }
        case 'f2-kpm': await masukKpm(); return true;
        case 'f2-draf': await muatDraf(); return true;
        case 'f2-baris': bukaBaris(el.dataset.tarikh || null); return true;
        case 'f2-padam-baris': await padamBaris(el.dataset.tarikh); return true;
        case 'f2-pc-baru': bukaPc({ mid: el.dataset.mid, bidang: el.dataset.bidang, kembali: el.dataset.kembali }); return true;
        case 'f2-km': {
          const f = $('#borang-f2-ekstra'), i = el.dataset.i, inp = f.querySelector(`[name=km_${i}]`), lama = +inp.value || 0;
          let n = +el.dataset.n; if (n === lama) n -= 1; // tekan kotak yang sama sekali lagi = kurangkan
          const lain = Array.from(f.querySelectorAll('[name^=km_]')).filter((x) => x !== inp).reduce((s2, x) => s2 + (+x.value || 0), 0);
          if (lain + n > 5) { roti('Maksimum 5 aktiviti khidmat masyarakat.', true); return true; }
          inp.value = n || '';
          el.parentNode.querySelectorAll('button').forEach((b, k) => b.classList.toggle('aktif', k < n));
          kiraEkstraBorang(); return true;
        }
        case 'f2-ekstra-kosong': { $$(`#borang-f2-ekstra [name=${el.dataset.nama}]`).forEach((x) => { x.checked = false; }); kiraEkstraBorang(); return true; }
        case 'f2-pc-semua': { const f = $('#borang-f2-pc'), l = padanPc(f) || []; l.forEach((m) => f._murid.push(m.id)); $('#pc-cari').value = ''; isiPc(); roti(`${l.length} murid ditambah`); return true; }
        case 'f2-pc-pilih': { const f = $('#borang-f2-pc'); if (!f._murid.includes(el.dataset.mid)) f._murid.push(el.dataset.mid); $('#pc-cari').value = ''; isiPc(); $('#pc-cari').focus(); return true; }
        case 'f2-pc-buang': { const f = $('#borang-f2-pc'); f._murid = f._murid.filter((x) => x !== el.dataset.mid); isiPc(); return true; }
        case 'f2-pc-padam': {
          const x = F().pencapaian.find((y) => y.id === el.dataset.id);
          if (!(await sahkan(`Padam rekod ${x.aktiviti}${x.program ? ' (' + x.program + ')' : ''} bagi murid ini?`, { ok: 'Padam', bahaya: true }))) return true;
          await S.db.f2PadamPencapaian(x.id); F().pencapaian = F().pencapaian.filter((y) => y.id !== x.id);
          await simpanMarkahSemula([x.murid_id], x.bidang);
          roti('Rekod dipadam');
          if (el.dataset.dari === 'murid') { const slot = $('#slot-pc'); if (slot) slot.innerHTML = pcMuridIsi(x.murid_id); return true; }
          S.kekalSkrol = true; render(); return true;
        }
        case 'f2-excel-pc': await eksportPc(); return true;
        case 'f2-buang-baru': { const f = $('#borang-f2-opr'); f._fail.splice(+el.dataset.i, 1); $('#opr-pratonton').innerHTML = f._fail.map((x, i) => `<span class="gambar-kecil"><img src="${URL.createObjectURL(x)}" alt="Gambar baharu ${i + 1}"><button type="button" class="pautan kecil" data-act="f2-buang-baru" data-i="${i}">Buang</button></span>`).join(''); return true; }
        case 'f2-semua': $$('#borang-f2-hadir input[type=radio]').forEach((x) => { x.checked = x.value === el.dataset.v; }); kiraHadirBorang(); return true;
        case 'f2-padam-opr': {
          const o = F().opr.find((x) => x.id === el.dataset.id);
          if (!(await sahkan(`Padam OPR "${o.tajuk}" bersama ${(o.gambar || []).length} gambar?`, { ok: 'Padam', bahaya: true }))) return true;
          await S.db.f2PadamOpr(o); F().opr = F().opr.filter((x) => x.id !== o.id);
          roti('OPR dipadam'); tetapLokasi(`#/unit/${encodeURIComponent(o.unit_kod)}/opr`); render(); return true;
        }
        case 'f2-pajsk': bukaPajsk(el.dataset.murid, el.dataset.unit); return true;
        case 'f2-pukal': bukaPukal(el.dataset.unit); return true;
        case 'f2-ekstra': bukaEkstra(el.dataset.murid, el.dataset.kembali); return true;
        case 'f2-excel-unit': { const u = S.unitPeta.get(el.dataset.unit); await excelPajsk(ahliUnit(u), [u.kategori], u.kod); return true; }
        case 'f2-excel-kelas': await excelPajsk(aktif().filter((m) => m.kelas === el.dataset.kelas), BIDANG, 'KELAS-' + el.dataset.kelas); return true;
        case 'f2-excel-semua': await excelPajsk(aktif(), BIDANG, 'SEMUA'); return true;
        case 'f2-excel-takwim': await eksportTakwim(); return true;
        case 'f2-excel-hadir': await eksportHadir(el.dataset.unit); return true;
        default: return false;
      }
    }
    function ubah(ev) {
      const t = ev.target;
      if (t.closest('#borang-f2-jana')) { pratontonJana(); return true; }
      if (t.closest('#borang-f2-hadir')) { kiraHadirBorang(); return true; }
      if (t.closest('#borang-f2-pajsk')) { kiraPajskBorang(); return true; }
      if (t.closest('#borang-f2-ekstra')) { kiraEkstraBorang(); return true; }
      if (t.id === 'pukal-semua') { $$('#borang-f2-pukal [name=murid]').forEach((x) => { x.checked = t.checked; }); return true; }
      if (t.closest('#borang-f2-opr') && t.name === 'perjumpaan_id') { isiDariPerjumpaan(t.closest('form')); return true; }
      if (t.closest('#borang-f2-opr') && (t.name === 'gambar' || t.name === 'kamera')) {
        const f = t.closest('form'); f._fail = (f._fail || []).concat(Array.from(t.files || [])); t.value = '';
        const ada = f.querySelectorAll('.gambar-kecil').length;
        if (ada + f._fail.length > 4) { f._fail = f._fail.slice(0, Math.max(0, 4 - ada)); roti('Maksimum 4 gambar.', true); }
        $('#opr-pratonton').innerHTML = f._fail.map((x, i) => `<span class="gambar-kecil"><img src="${URL.createObjectURL(x)}" alt="Gambar baharu ${i + 1}"><button type="button" class="pautan kecil" data-act="f2-buang-baru" data-i="${i}">Buang</button></span>`).join('');
        return true;
      }
      if (t.id === 'pc-cari') {
        isiPc();
        // telefon: naikkan kotak carian ke atas supaya senarai murid kelihatan di atas papan kekunci
        if (!t._naik && window.innerWidth < 700) { t._naik = true; t.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
        return true;
      }
      if (t.closest('#borang-f2-pc')) { skorPc(); return true; }
      if (t.closest('#f2-pc-tapis') || t.closest('#f2-pj-murid')) {
        const f = t.closest('form'), d = new FormData(f), tab = f.id === 'f2-pc-tapis' ? 'pencapaian' : 'murid';
        tetapLokasi(`#/pajsk/${tab}?tahun=${F().tahun}&q=${encodeURIComponent(d.get('q') || '')}${tab === 'pencapaian' ? '&bidang=' + encodeURIComponent(d.get('bidang') || '') : ''}`); S.kekalSkrol = true;
        clearTimeout(S.f2Timer); S.f2Timer = setTimeout(() => { render(); const c = $(`#${f.id} [name=q]`); if (c && t.name === 'q') { c.focus(); c.setSelectionRange(c.value.length, c.value.length); } }, t.name === 'q' ? 300 : 0);
        return true;
      }
      if (t.closest('#f2-pj-kelas')) { tetapLokasi(`#/pajsk/rumusan?tahun=${F().tahun}&kelas=${encodeURIComponent(t.value)}`); S.kekalSkrol = true; render(); return true; }
      if (t.closest('#f2-pj-ekstra')) {
        const f = t.closest('form'), d = new FormData(f);
        tetapLokasi(`#/pajsk/ekstra?tahun=${F().tahun}&q=${encodeURIComponent(d.get('q') || '')}&kelas=${encodeURIComponent(d.get('kelas') || '')}`); S.kekalSkrol = true;
        clearTimeout(S.f2Timer); S.f2Timer = setTimeout(() => { render(); const c = $('#f2-pj-ekstra [name=q]'); if (c && t.name === 'q') { c.focus(); c.setSelectionRange(c.value.length, c.value.length); } }, t.name === 'q' ? 300 : 0);
        return true;
      }
      return false;
    }
    async function hantar(f, ev) {
      const lagi = ev && ev.submitter && ev.submitter.name === 'lagi';
      switch (f.id) {
        case 'borang-f2-jana': await simpanJana(f); return true;
        case 'borang-f2-tarikh': await simpanTarikh(f); return true;
        case 'borang-f2-baris': await simpanBaris(f); return true;
        case 'borang-f2-aktiviti': await simpanAktiviti(f); return true;
        case 'borang-f2-rancangan': await simpanRancangan(f); return true;
        case 'borang-f2-hadir': await simpanHadir(f); return true;
        case 'borang-f2-opr': await simpanOpr(f); return true;
        case 'borang-f2-pajsk': await simpanPajsk(f, lagi); return true;
        case 'borang-f2-pukal': await simpanPukal(f); return true;
        case 'borang-f2-ekstra': await simpanEkstra(f); return true;
        case 'borang-f2-pc': await simpanPc(f); return true;
        case 'borang-f2-laporan': await simpanLaporan(f); return true;
        default: return false;
      }
    }
    function selepasRender() { if ($('#borang-f2-jana')) pratontonJana(); if ($('#borang-f2-hadir')) kiraHadirBorang(); }

    return { pcMurid, ekstraMurid, papar, paparUnit, navUnit, TAB_UNIT, tindakan, ubah, hantar, selepasRender, panelUtama, kiraMurid, isiExcel, muatTahun: (t, paksa) => muat(t, paksa), entri: () => entri(), teksEntri,
      _uji: { kiraBidang, kiraEkstra, skorHadir, janaTarikh, fmtT, mingguIso, teksKokum, teksBaris, tanda, barisSekolah } };
  };
})();

</script>
<script>
/* KOKUM SMART · Perkhemahan Perdana Unit-unit Beruniform
   Penyelaras menetapkan perkhemahan. Guru penasihat setiap unit beruniform mendaftar peserta, AJK pengiring dan urusetia
   daripada ahli unit sendiri, menanda borang kebenaran, yuran dan kehadiran. Dokumen: ringkasan bilangan peserta,
   senarai semak, borang pendaftaran, surat makluman ibu bapa dengan keratan jawapan, Excel, dan rekod pelibatan PAJSK. */
(function () {
  'use strict';

  const BULAN = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
  const HARI = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
  const PERANAN = { peserta: 'Peserta', ajk: 'AJK pengiring', urusetia: 'Urusetia' };
  const JAWATAN_AJK = ['PENGERUSI', 'SETIAUSAHA', 'BENDAHARI'];
  const TING_SEMUA = ['1', '2', '3', '4', '5', 'PPKI'];
  const BARANG_ASAS = ['Pakaian seragam unit yang lengkap', 'Pakaian sukan dan pakaian tidur', 'Peralatan mandi dan ubat-ubatan peribadi',
    'Selimut atau beg tidur', 'Pinggan, cawan dan sudu', 'Lampu suluh', 'Alat tulis', 'Kelengkapan ibadat (bagi yang berkenaan)'];

  window.KokumKem = function (ctx) {
    const { S, e, $, $$, IKON, roti, sahkan, gagal, render, penyelaras, aktif, eksport, susunMurid, tetapLokasi, hariIni, LOGO, BINGKAI,
      bolehUrus, ahliUnit, unitKat } = ctx;

    /* ============================================================ keadaan */
    const T = () => S.data.tetapan || {};
    const tahunAsal = () => +T().tahun || new Date().getFullYear();
    const K = () => S.kem;
    const renderLatar = () => { const d = $('#dlg'); if (d && d.open) return; S.kekalSkrol = true; render(); };
    let memuat = null;
    function muat(tahun, paksa) {
      if (!paksa && S.kem && S.kem.tahun === tahun) return Promise.resolve();
      if (memuat && memuat.tahun === tahun) return memuat.p;
      const p = S.db.kemMuat(tahun).then((d) => { S.kem = { ...d, tahun, ralat: null }; },
        (err) => { S.kem = { tahun, kem: [], peserta: [], unit: [], ralat: err.message || String(err) }; }).finally(() => { memuat = null; });
      memuat = { tahun, p };
      return p;
    }
    function sedia(tahun) {
      if (S.kem && S.kem.tahun === tahun) return S.kem.ralat ? `<div class="mesej ralat">${e(S.kem.ralat)}. Pastikan fail <b>kem.sql</b> sudah dijalankan di Supabase.</div><button class="btn" data-act="kem-muat">${IKON.segar} Cuba lagi</button>` : '';
      muat(tahun).then(renderLatar);
      return '<p class="pudar">Memuatkan perkhemahan…</p>';
    }
    const pilihTahun = (q) => { const t = +(q && q.get('tahun')) || S.kemTahun || tahunAsal(); S.kemTahun = t; return t; };

    /* ============================================================ bantuan */
    const tk = (s) => (s ? new Date(s + 'T00:00:00') : null);
    const fmtT = (s, panjang) => { const d = tk(s); if (!d) return '—'; return `${panjang ? HARI[d.getDay()] + ', ' : ''}${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; };
    const fmtJulat = (a, b) => {
      if (!a) return 'Tarikh belum ditetapkan';
      if (!b || b === a) return fmtT(a, true);
      const x = tk(a), y = tk(b);
      const hari = `(${HARI[x.getDay()]} – ${HARI[y.getDay()]})`;
      return x.getMonth() === y.getMonth() ? `${x.getDate()} – ${y.getDate()} ${BULAN[y.getMonth()]} ${y.getFullYear()} ${hari}` : `${fmtT(a)} – ${fmtT(b)} ${hari}`;
    };
    const rm = (n) => `RM${(+n || 0).toFixed(2)}`;
    const unitUB = () => unitKat('UB');
    const namaUnit = (kod) => { const u = S.unitPeta.get(kod); return u ? u.nama_penuh : kod || ''; };
    const tajukKem = (k) => `${k.nama}${k.kali_ke ? ` KALI KE-${k.kali_ke}` : ''} ${T().nama_sekolah ? T().nama_sekolah.replace(/\.$/, '') + ' ' : ''}TAHUN ${k.tahun}`;
    const kemId = (id) => (K().kem || []).find((k) => k.id === +id);
    const pesertaKem = (k) => K().peserta.filter((p) => p.kem_id === k.id);
    const pesertaUnit = (k, kod) => pesertaKem(k).filter((p) => p.unit_kod === kod);
    const muridPeta = () => new Map(S.data.murid.map((m) => [m.id, m]));
    const infoUnit = (k, kod) => K().unit.find((x) => x.kem_id === k.id && x.unit_kod === kod) || {};
    const M = (k) => k.maklumat || {};
    const tingLayak = (k) => (k.tingkatan && k.tingkatan.length ? k.tingkatan : ['3', '4']);
    const teksTing = (k) => tingLayak(k).map((t) => (t === 'PPKI' ? 'PPKI' : 'T' + t)).join(', ');
    function kuotaUnit(k, u) {
      const j = (u && u.jantina) || '';
      if (j === 'P') return { L: 0, P: k.kuota_l + k.kuota_p };
      if (j === 'L') return { L: k.kuota_l + k.kuota_p, P: 0 };
      return { L: k.kuota_l, P: k.kuota_p };
    }
    function kira(l, peta) {
      const c = { L: 0, P: 0, ajk: 0, urusetia: 0, jumlah: l.length, borang: 0, yuran: 0, hadir: 0 };
      l.forEach((p) => {
        const m = peta.get(p.murid_id) || {};
        if (p.peranan === 'peserta') { if (m.jantina === 'P') c.P++; else c.L++; } else c[p.peranan]++;
        if (p.borang) c.borang++; if (p.yuran) c.yuran++; if (p.hadir) c.hadir++;
      });
      return c;
    }
    const peranTeks = (p) => (p.peranan === 'ajk' ? `AJK${p.jawatan ? ' (' + p.jawatan + ')' : ''}` : PERANAN[p.peranan]);
    const susunPeserta = (l, peta) => l.slice().sort((a, b) => ['ajk', 'urusetia', 'peserta'].indexOf(a.peranan) - ['ajk', 'urusetia', 'peserta'].indexOf(b.peranan)
      || (JAWATAN_AJK.indexOf(a.jawatan) + 1 || 9) - (JAWATAN_AJK.indexOf(b.jawatan) + 1 || 9) || susunMurid(peta.get(a.murid_id) || {}, peta.get(b.murid_id) || {}));
    const bolehDaftar = (k, kod) => bolehUrus(kod) && (k.dibuka || penyelaras());

    /* ============================================================ halaman */
    function papar(a1, a2, q) {
      const tahun = pilihTahun(q);
      const x = sedia(tahun);
      const chip = (t) => `<a class="cip ${t === tahun ? 'pilih' : ''}" href="#/kem?tahun=${t}">${t}</a>`;
      const kepalaTahun = `<div class="cip-set tanpa-cetak" style="margin-bottom:12px">${[tahunAsal() - 1, tahunAsal(), tahunAsal() + 1].map(chip).join('')}</div>`;
      if (x) return `<div class="kepala"><div><h1>Perkhemahan Perdana</h1><p>Pendaftaran peserta unit-unit beruniform.</p></div></div>${kepalaTahun}${x}`;
      if (a1) {
        const k = kemId(a1);
        if (!k) return `<div class="mesej ralat">Perkhemahan tidak dijumpai dalam tahun ${tahun}.</div><a class="btn" href="#/kem">Kembali</a>`;
        if (a2 === 'cetak') return pCetak(k, q);
        if (a2) { const u = S.unitPeta.get(a2); return u ? pUnit(k, u, q) : `<div class="mesej ralat">Unit ${e(a2)} tidak dijumpai.</div>`; }
        return pRingkasan(k);
      }
      if (K().kem.length === 1 && !q.get('semua')) return kepalaTahun + pRingkasan(K().kem[0]);
      return pSenarai(kepalaTahun);
    }

    function pSenarai(kepalaTahun) {
      const t = K().tahun, l = K().kem;
      return `<div class="kepala"><div><h1>Perkhemahan Perdana ${t}</h1><p>Pendaftaran peserta unit-unit beruniform.</p></div>
          ${penyelaras() ? `<div class="baris-btn"><button class="btn utama" data-act="kem-baru">${IKON.tambah} Tetapkan perkhemahan</button></div>` : ''}</div>${kepalaTahun}
        ${l.length ? `<div class="grid-opr">${l.map((k) => `<a class="panel kad-kem" href="#/kem/${k.id}?tahun=${t}"><b>${e(k.nama)}${k.kali_ke ? ` KALI KE-${k.kali_ke}` : ''}</b>
            <span class="kecil">${e(fmtJulat(k.tarikh_mula, k.tarikh_tamat))}</span><span class="kecil pudar">${k.penganjur ? 'Anjuran ' + e(k.penganjur) : 'Penganjur belum ditetapkan'} · ${pesertaKem(k).length} berdaftar</span>
            <span class="status-kem ${k.dibuka ? 'buka' : 'tutup'}">${k.dibuka ? 'Pendaftaran dibuka' : 'Pendaftaran ditutup'}</span></a>`).join('')}</div>`
          : `<div class="panel kosong-isi"><h3>Belum ada perkhemahan untuk ${t}</h3><p>${penyelaras() ? 'Tetapkan tarikh, penganjur, kuota dan yuran. Guru penasihat unit beruniform boleh mendaftar peserta selepas itu.' : 'Penyelaras belum membuka pendaftaran perkhemahan.'}</p>
            ${penyelaras() ? `<div class="baris-btn" style="justify-content:center"><button class="btn utama" data-act="kem-baru">${IKON.tambah} Tetapkan perkhemahan</button></div>` : ''}</div>`}`;
    }

    function pRingkasan(k) {
      const peta = muridPeta(), us = unitUB(), saya = us.filter((u) => bolehUrus(u.kod) && !penyelaras());
      const baris = us.map((u) => ({ u, c: kira(pesertaUnit(k, u.kod), peta), q: kuotaUnit(k, u), g: infoUnit(k, u.kod).guru || '' }));
      const jum = baris.reduce((s, { c }) => { Object.keys(c).forEach((x) => { s[x] = (s[x] || 0) + c[x]; }); return s; }, {});
      const tempoh = k.tarikh_mula && k.tarikh_mula <= hariIni();
      return `<div class="kepala"><div><h1>${e(k.nama)}${k.kali_ke ? ` kali ke-${k.kali_ke}` : ''} ${k.tahun}</h1>
          <p>${e(fmtJulat(k.tarikh_mula, k.tarikh_tamat))}${k.tempat ? ' · ' + e(k.tempat) : ''}</p></div>
          <div class="baris-btn tanpa-cetak">${penyelaras() ? `<button class="btn" data-act="kem-ubah" data-id="${k.id}">Tetapan</button>` : ''}
            <a class="btn" href="#/kem/${k.id}/cetak?doc=ringkasan&tahun=${k.tahun}">${IKON.cetak} Cetak</a></div></div>
        ${saya.length ? `<div class="mesej ok tanpa-cetak">Unit anda: ${saya.map((u) => `<a href="#/kem/${k.id}/${encodeURIComponent(u.kod)}?tahun=${k.tahun}"><b>${e(u.kod)}</b>: daftar peserta</a>`).join(' · ')}</div>` : ''}
        <div class="panel" style="margin-bottom:14px"><div class="info-kem">
          <span><small>Penganjur</small><b>${k.penganjur ? e(namaUnit(k.penganjur)) : 'Belum ditetapkan'}</b></span>
          <span><small>Peserta</small><b>${e(teksTing(k))}</b></span>
          <span><small>Kuota setiap unit</small><b>${k.kuota_l} L + ${k.kuota_p} P</b></span>
          <span><small>AJK pengiring</small><b>${k.kuota_ajk} seunit</b></span>
          <span><small>Yuran</small><b>${rm(k.yuran)}</b></span>
          <span><small>Pendaftaran</small><b class="status-kem ${k.dibuka ? 'buka' : 'tutup'}">${k.dibuka ? 'Dibuka' : 'Ditutup'}${k.tarikh_tutup && k.dibuka ? ' hingga ' + e(fmtT(k.tarikh_tutup)) : ''}</b></span></div>
          ${penyelaras() ? `<div class="baris-btn" style="margin-top:12px"><button class="btn" data-act="kem-tukar-buka" data-id="${k.id}">${k.dibuka ? 'Tutup pendaftaran' : 'Buka semula pendaftaran'}</button>

          <a class="btn" href="#/kem/${k.id}/cetak?doc=daftar&unit=${encodeURIComponent(u.kod)}&tahun=${k.tahun}">${IKON.cetak} Borang pendaftaran</a></div></div>`;

    /* ============================================================ tetapan perkhemahan */
    function cadangTarikh(tahun) {
      const f2 = S.f2;
      if (!f2 || f2.tahun !== tahun || !f2.perjumpaan) return {};
      const l = f2.perjumpaan.filter((p) => p.kategori === 'UB' && /PERKHEMAHAN PERDANA/i.test(p.tema || '')).map((p) => p.tarikh).sort();
      return l.length ? { tarikh_mula: l[0], tarikh_tamat: l[l.length - 1] } : {};
    }
    function bukaTetapan(id) {
      const tahun = K().tahun, k = id ? kemId(id) : { tahun, nama: 'PERKHEMAHAN PERDANA UNIT-UNIT BERUNIFORM', tempat: `TAPAK PERKHEMAHAN, ${(T().nama_sekolah || '').replace(/\.$/, '')}`,
        tingkatan: ['3', '4'], kuota_l: 10, kuota_p: 10, kuota_ajk: 3, yuran: 5, dibuka: true, maklumat: { barang: BARANG_ASAS.join('\n'), ttd_nama: (T().pegawai || {}).pengetua || '', ttd_jawatan: 'Pengetua', cogan: 'BERKHIDMAT UNTUK NEGARA' }, ...cadangTarikh(tahun) };

          <div class="dua"><label class="medan" style="grid-column:span 1">Nama<input type="text" name="nama" value="${e(k.nama || '')}" required></label><label class="medan">Kali ke-<input type="number" name="kali_ke" value="${e(k.kali_ke || '')}" min="1" max="99"></label></div>

          <fieldset class="bidang-set"><legend>Tingkatan layak menjadi peserta</legend><div class="cip-set">${TING_SEMUA.map((t) => `<label class="cek"><input type="checkbox" name="ting" value="${t}" ${tingLayak(k).includes(t) ? 'checked' : ''}> ${t === 'PPKI' ? 'PPKI' : 'Tingkatan ' + t}</label>`).join('')}</div></fieldset>

    async function simpanTetapan(f) {

      const ting = d.getAll('ting');
      if (!ting.length) { roti('Pilih sekurang-kurangnya satu tingkatan.', true); return; }
      const rec = await S.db.kemSimpan({ id: f.dataset.id ? +f.dataset.id : null, tahun: K().tahun, nama: g('nama').toUpperCase(), kali_ke: +g('kali_ke') || null,
        tarikh_mula: g('tarikh_mula') || null, tarikh_tamat: g('tarikh_tamat') || null, tempat: g('tempat').toUpperCase() || null, penganjur: g('penganjur') || null,
        tingkatan: ting, kuota_l: +g('kuota_l') || 0, kuota_p: +g('kuota_p') || 0, kuota_ajk: +g('kuota_ajk') || 0, yuran: +g('yuran') || 0,
        tarikh_tutup: g('tarikh_tutup') || null, dibuka: !!d.get('dibuka'),
        maklumat: { rujukan: g('rujukan'), tarikh_borang: g('tarikh_borang'), lapor: g('lapor'), barang: g('barang'), nota: g('nota'), ttd_nama: g('ttd_nama').toUpperCase(), ttd_jawatan: g('ttd_jawatan'), cogan: g('cogan').toUpperCase() } });
      const i = K().kem.findIndex((x) => x.id === rec.id); if (i >= 0) K().kem[i] = rec; else K().kem.push(rec);
      $('#dlg').close(); roti('Tetapan perkhemahan disimpan'); tetapLokasi(`#/kem/${rec.id}?tahun=${rec.tahun}`); S.kekalSkrol = true; render();

    /* ============================================================ simpan pendaftaran */
    function gantiPeserta(hasil) {
      hasil.forEach((r) => { const i = K().peserta.findIndex((p) => p.kem_id === r.kem_id && p.murid_id === r.murid_id); if (i >= 0) K().peserta[i] = r; else K().peserta.push(r); });
    }
    async function simpanTambah(f) {
      const k = kemId(f.dataset.kem), kod = f.dataset.unit, u = S.unitPeta.get(kod), d = new FormData(f);
      const ids = d.getAll('mid'), peranan = d.get('peranan') || 'peserta';
      if (!ids.length) { roti('Tanda sekurang-kurangnya seorang murid.', true); return; }
      const peta = muridPeta(), c = kira(pesertaUnit(k, kod), peta), qu = kuotaUnit(k, u);
      const tambahL = peranan === 'peserta' ? ids.filter((x) => (peta.get(x) || {}).jantina !== 'P').length : 0, tambahP = peranan === 'peserta' ? ids.length - tambahL : 0;
      const lebih = [];
      if (c.L + tambahL > qu.L) lebih.push(`peserta lelaki ${c.L + tambahL}/${qu.L}`);
      if (c.P + tambahP > qu.P) lebih.push(`peserta perempuan ${c.P + tambahP}/${qu.P}`);
      if (peranan === 'ajk' && c.ajk + ids.length > k.kuota_ajk) lebih.push(`AJK pengiring ${c.ajk + ids.length}/${k.kuota_ajk}`);
      if (lebih.length && !(await sahkan(`Melebihi kuota: ${lebih.join(', ')}.\n\nDaftar juga? Penyelaras akan melihat unit ini ditanda melebihi kuota.`, { ok: 'Daftar juga' }))) return;
      const rows = ids.map((mid) => ({ kem_id: k.id, murid_id: mid, unit_kod: kod, peranan, jawatan: null, borang: false, yuran: false, hadir: null, catatan: null }));
      gantiPeserta(await S.db.kemSimpanPeserta(rows));
      roti(`${rows.length} murid didaftar sebagai ${PERANAN[peranan].toLowerCase()}`); S.kekalSkrol = true; render();
    }
    async function simpanPeserta(f) {
      const k = kemId(f.dataset.kem), kod = f.dataset.unit, d = new FormData(f), rows = [];
      pesertaUnit(k, kod).forEach((p) => {
        const id = p.murid_id, baru = { ...p, peranan: d.get('peranan_' + id) || p.peranan, jawatan: String(d.get('jawatan_' + id) || '').trim().toUpperCase() || null,
          borang: !!d.get('borang_' + id), yuran: !!d.get('yuran_' + id), hadir: f.querySelector(`[name="hadir_${CSS.escape(id)}"]`) ? !!d.get('hadir_' + id) : p.hadir };
        if (baru.peranan !== 'ajk') baru.jawatan = null;
        if (baru.peranan !== p.peranan || (baru.jawatan || null) !== (p.jawatan || null) || ['borang', 'yuran', 'hadir'].some((x) => !!baru[x] !== !!p[x])) rows.push(baru);
      });
      if (!rows.length) { roti('Tiada perubahan'); return; }
      gantiPeserta(await S.db.kemSimpanPeserta(rows));
      roti(`${rows.length} rekod dikemas kini`); S.kekalSkrol = true; render();
    }
    async function simpanUnit(f) {
      const r = await S.db.kemSimpanUnit({ kem_id: +f.dataset.kem, unit_kod: f.dataset.unit, guru: String(new FormData(f).get('guru') || '').trim().toUpperCase() });
      const i = K().unit.findIndex((x) => x.kem_id === r.kem_id && x.unit_kod === r.unit_kod); if (i >= 0) K().unit[i] = r; else K().unit.push(r);
      roti('Guru pengiring disimpan'); S.kekalSkrol = true; render();
    }
    async function rekodPajsk(k) {
      const peta = muridPeta(), l = pesertaKem(k).filter((p) => p.hadir && peta.has(p.murid_id));
      if (!l.length) { roti('Tiada peserta ditanda hadir. Guru unit perlu menanda kehadiran dahulu.', true); return; }
      const belum = pesertaKem(k).length - l.length;
      if (!(await sahkan(`Rekod pelibatan PAJSK peringkat sekolah bagi ${l.length} murid yang hadir?\n\n• Peserta: Pelibatan 1 (Peserta)\n• AJK pengiring dan urusetia: Pelibatan 2 (AJK)\n\nRekod dimasukkan sebagai aktiviti tambahan bidang UB.${belum ? `\n${belum} murid lain belum ditanda hadir dan tidak direkod.` : ''}`, { ok: 'Rekod' }))) return;
      const program = `${k.nama}${k.kali_ke ? ` KALI KE-${k.kali_ke}` : ''} ${k.tahun}`;
      await S.db.f2SimpanPencapaian(l.map((p) => ({ murid_id: p.murid_id, tahun: k.tahun, bidang: 'UB', aktiviti: namaUnit(p.unit_kod).toUpperCase(), program, tarikh: k.tarikh_mula,
        peringkat: 'SEKOLAH', jenis_libat: p.peranan === 'peserta' ? 'PELIBATAN 1 - Atlet/Peserta' : 'PELIBATAN 2 - AJK/Teknikal/Persembahan', kedudukan: null, catatan: 'Perkhemahan Perdana', oleh_nama: S.profil.nama || S.profil.email || null })));
      const rec = await S.db.kemSimpan({ id: k.id, pajsk_pada: new Date().toISOString() });
      Object.assign(k, rec); S.f2 = null;
      roti(`Pelibatan PAJSK direkod untuk ${l.length} murid`); S.kekalSkrol = true; render();
    }

    /* ============================================================ cetak */
    function kepalaDok(tajuk, sub) {
      const t = T();
      return `<div class="kepala-cetak"><img src="${LOGO}" alt="Lencana sekolah"><div><h3>${e(t.nama_sekolah || '')}${t.kod_sekolah ? ` (${e(t.kod_sekolah)})` : ''}</h3><p class="sub">${e(t.alamat || '')}</p></div></div>
        <h4 class="tajuk-dok">${e(tajuk)}</h4>${sub ? `<p class="sub" style="text-align:center">${sub}</p>` : ''}`;
    }
    const ttd = (l) => `<div class="tandatangan ttd-${l.length}">${l.map((x) => `<div>${x}</div>`).join('')}</div>`;
    function pCetak(k, q) {
      const doc = q.get('doc') || 'ringkasan', kod = q.get('unit') || '';
      const us = kod ? unitUB().filter((u) => u.kod === kod) : unitUB();
      const peta = muridPeta();
      let isi;
      if (doc === 'ringkasan') isi = dokRingkasan(k, peta);
      else if (doc === 'surat') isi = dokSurat(k, us, peta);
      else isi = us.map((u) => dokSenarai(k, u, peta, doc === 'daftar')).filter(Boolean).join('') || '<section class="halaman dok"><p>Tiada peserta berdaftar.</p></section>';
      const bil = (isi.match(/<section class="halaman/g) || []).length;
      return `<div class="panel tanpa-cetak" style="margin-bottom:14px"><p style="margin:0 0 10px"><a href="#/kem/${k.id}${kod ? '/' + encodeURIComponent(kod) : ''}?tahun=${k.tahun}">← Kembali</a></p>
          <div class="baris-btn">${BINGKAI ? '' : `<button class="btn utama" data-act="cetak">${IKON.cetak} Cetak (${bil} halaman)</button>`}<button class="btn" data-act="kem-excel" data-id="${k.id}">${IKON.muat} Excel</button></div>
          <p class="pudar kecil" style="margin:8px 0 0">Saiz A4. Matikan "Headers and footers" dalam tetapan cetak.${doc === 'surat' ? ' Satu muka surat bagi setiap murid.' : ''}</p></div>
        <div class="kertas-cetak">${isi}</div>`;
    }
    function dokRingkasan(k, peta) {
      const baris = unitUB().map((u) => ({ u, c: kira(pesertaUnit(k, u.kod), peta), g: infoUnit(k, u.kod).guru || '' }));
      const j = baris.reduce((s, { c }) => ({ L: s.L + c.L, P: s.P + c.P, ajk: s.ajk + c.ajk, urusetia: s.urusetia + c.urusetia, jumlah: s.jumlah + c.jumlah }), { L: 0, P: 0, ajk: 0, urusetia: 0, jumlah: 0 });
      const guru = baris.reduce((s, x) => s + (x.g ? x.g.split(',').filter((y) => y.trim()).length : 0), 0);
      return `<section class="halaman dok">${kepalaDok(tajukKem(k), `${e(fmtJulat(k.tarikh_mula, k.tarikh_tamat))}${k.tempat ? ' · ' + e(k.tempat) : ''}`)}
        <h4 class="tajuk-dok">BILANGAN PESERTA</h4>
        <table><thead><tr><th rowspan="2">Bil</th><th rowspan="2">Unit</th><th colspan="2">Peserta</th><th rowspan="2">AJK pengiring</th><th rowspan="2">Urusetia</th><th rowspan="2">Jumlah</th><th rowspan="2">Guru pengiring</th></tr><tr><th>L</th><th>P</th></tr></thead><tbody>
        ${baris.map(({ u, c, g }, i) => `<tr><td>${i + 1}</td><td>${e(u.nama_penuh)}${u.kod === k.penganjur ? ' (penganjur)' : ''}</td><td>${c.L || '-'}</td><td>${c.P || '-'}</td><td>${c.ajk || '-'}</td><td>${c.urusetia || '-'}</td><td><b>${c.jumlah}</b></td><td>${e(g)}</td></tr>`).join('')}
        <tr><td colspan="2"><b>JUMLAH</b></td><td><b>${j.L}</b></td><td><b>${j.P}</b></td><td><b>${j.ajk}</b></td><td><b>${j.urusetia}</b></td><td><b>${j.jumlah}</b></td><td><b>${guru || ''}</b></td></tr></tbody></table>
        <p class="nota-borang">Peserta: ${e(teksTing(k))}, kuota ${k.kuota_l} L + ${k.kuota_p} P setiap unit. AJK pengiring ${k.kuota_ajk} setiap unit. Yuran ${rm(k.yuran)} seorang: jumlah ${rm(j.jumlah * k.yuran)}.</p>
        ${ttd(['Disediakan oleh (Setiausaha Program)', 'Disemak oleh (Penolong Kanan Kokurikulum)'])}</section>`;
    }
    function dokSenarai(k, u, peta, daftar) {
      const l = susunPeserta(pesertaUnit(k, u.kod), peta);
      if (!l.length) return '';
      const g = infoUnit(k, u.kod).guru || '';
      return `<section class="halaman dok">${kepalaDok(daftar ? 'BORANG PENDAFTARAN PESERTA' : 'SENARAI SEMAK PESERTA', `${e(tajukKem(k))}<br><b>${e(u.nama_penuh)} (${e(u.kod)})</b>`)}
        <table class="${daftar ? 'jadual-daftar' : ''}"><thead><tr><th>Bil</th><th>Nama penuh</th>${daftar ? '<th>No. KP</th>' : ''}<th>Kelas</th><th>J</th><th>Peranan</th>${daftar ? '<th style="width:16%">Masa tiba</th><th style="width:16%">Tandatangan</th>' : '<th>Borang</th><th>Yuran</th><th>Hadir</th>'}</tr></thead><tbody>
        ${l.map((p, i) => { const m = peta.get(p.murid_id) || {}; return `<tr><td>${i + 1}</td><td>${e(m.nama || '')}</td>${daftar ? `<td>${e(m.mykad || '')}</td>` : ''}<td>${e(m.kelas || '')}</td><td>${e(m.jantina || '')}</td><td>${e(peranTeks(p))}</td>
          ${daftar ? '<td></td><td></td>' : `<td>${p.borang ? '✓' : ''}</td><td>${p.yuran ? '✓' : ''}</td><td>${p.hadir ? '✓' : ''}</td>`}</tr>`; }).join('')}</tbody></table>
        <p class="nota-borang">Guru pengiring: ${e(g || '………………………………………………')}</p>
        ${ttd(['Guru Penasihat', daftar ? 'AJK Pendaftaran' : 'Setiausaha Program'])}</section>`;
    }
    function dokSurat(k, us, peta) {
      const m = M(k), t = T(), barang = String(m.barang || '').split('\n').map((x) => x.trim()).filter(Boolean);
      const tajuk = `MAKLUMAN DAN KEBENARAN MENYERTAI ${tajukKem(k)}`;
      const l = us.flatMap((u) => susunPeserta(pesertaUnit(k, u.kod), peta).map((p) => ({ p, u })));
      if (!l.length) return '<section class="halaman dok"><p>Tiada peserta berdaftar.</p></section>';
      let no = 1;
      const para = (x) => `<p><span class="no-para">${++no}.</span>${x}</p>`;
      return l.map(({ p, u }) => { const mu = peta.get(p.murid_id) || {}; no = 1;
        return `<section class="halaman dok surat-kem">
          ${window.KokumSurat ? window.KokumSurat.kepala(t, LOGO) : `<div class="kepala-cetak"><img src="${LOGO}" alt="Lencana sekolah"><div><h3>${e(t.nama_sekolah || '')}</h3><p class="sub">${e(t.alamat || '')}</p></div></div><hr>`}
          <table class="ruj"><tbody><tr><td>Ruj. Kami</td><td>: ${e(m.rujukan || '')}</td></tr><tr><td>Tarikh</td><td>: ${e(fmtT(hariIni()))}</td></tr></tbody></table>
          <p>Ibu bapa / penjaga kepada,<br><b>${e(mu.nama || '')}</b><br>${e(mu.kelas || '')}</p>
          <p>Tuan / Puan,</p>
          <p class="tajuk-surat">${e(tajuk)}</p>
          <p>Dengan hormatnya perkara di atas adalah dirujuk.</p>
          ${para(`Sukacita dimaklumkan bahawa anak jagaan tuan/puan telah dipilih untuk menyertai perkhemahan di atas sebagai <b>${e(p.peranan === 'ajk' ? peranTeks(p).replace('AJK', 'AJK pengiring') : PERANAN[p.peranan].toLowerCase())}</b> mewakili <b>${e(u.nama_penuh)}</b>. Butiran perkhemahan adalah seperti berikut:`)}
          <table class="butiran"><tbody><tr><td>Tarikh</td><td>: ${e(fmtJulat(k.tarikh_mula, k.tarikh_tamat))}</td></tr><tr><td>Tempat</td><td>: ${e(k.tempat || '')}</td></tr>
            ${m.lapor ? `<tr><td>Lapor diri</td><td>: ${e(m.lapor)}</td></tr>` : ''}${+k.yuran ? `<tr><td>Sumbangan penyertaan</td><td>: ${rm(k.yuran)}</td></tr>` : ''}</tbody></table>
          ${barang.length ? para(`Peserta dikehendaki membawa barang-barang berikut:<span class="barang">${barang.map((x) => `<span>${e(x)}</span>`).join('')}</span>`) : ''}
          ${m.nota ? para(e(m.nota)) : ''}
          ${para(`Sehubungan itu, tuan/puan dimohon mengisi dan mengembalikan keratan jawapan di bawah kepada guru penasihat unit${m.tarikh_borang ? ` sebelum <b>${e(fmtT(m.tarikh_borang))}</b>` : ''}. Kerjasama dan perhatian tuan/puan amat dihargai.`)}
          <p>Sekian, terima kasih.</p>
          ${m.cogan ? `<p><b>"${e(m.cogan)}"</b></p>` : ''}
          <p>Saya yang menjalankan amanah,</p><p class="ruang-ttd"></p>
          <p>${m.ttd_nama ? `<b>(${e(m.ttd_nama)})</b><br>` : '…………………………………………<br>'}${e(m.ttd_jawatan || '')}<br>${e(t.nama_sekolah || '')}</p>
          <div class="keratan"><span class="gunting">✂ potong di sini</span>
            <p class="tajuk-surat">KERATAN JAWAPAN: ${e(k.nama)}${k.kali_ke ? ` KALI KE-${k.kali_ke}` : ''} ${k.tahun}</p>
            <p>Saya, ……………………………………………………… No. KP: ……………………………… ibu / bapa / penjaga kepada:</p>
            <table class="butiran"><tbody><tr><td>Nama murid</td><td>: <b>${e(mu.nama || '')}</b></td></tr><tr><td>Kelas / Unit</td><td>: ${e(mu.kelas || '')} / ${e(u.kod)}</td></tr></tbody></table>
            <p>☐ MEMBENARKAN &nbsp;&nbsp; ☐ TIDAK MEMBENARKAN &nbsp;anak jagaan saya menyertai perkhemahan tersebut.</p>
            <p>Masalah kesihatan / alahan / ubat yang diambil: ……………………………………………………………………</p>
            <p>No. telefon untuk dihubungi semasa kecemasan: ………………………………………</p>
            <div class="ttd-keratan"><span>Tandatangan: ……………………………</span><span>Tarikh: ………………………</span></div></div></section>`; }).join('');
    }

    async function eksportExcel(k) {
      const peta = muridPeta();
      const rows = [['BIL', 'UNIT', 'NAMA', 'NO. KP', 'KELAS', 'JANTINA', 'PERANAN', 'JAWATAN', 'BORANG', 'YURAN', 'HADIR']];
      let n = 0;
      unitUB().forEach((u) => susunPeserta(pesertaUnit(k, u.kod), peta).forEach((p) => { const m = peta.get(p.murid_id) || {};
        rows.push([++n, u.kod, m.nama || '', m.mykad || '', m.kelas || '', m.jantina || '', PERANAN[p.peranan].toUpperCase(), p.jawatan || '', p.borang ? 'YA' : '', p.yuran ? 'YA' : '', p.hadir ? 'YA' : '']); }));
      const ring = [['UNIT', 'NAMA UNIT', 'PESERTA L', 'PESERTA P', 'AJK', 'URUSETIA', 'JUMLAH', 'BORANG', 'YURAN', 'GURU PENGIRING']].concat(unitUB().map((u) => { const c = kira(pesertaUnit(k, u.kod), peta);
        return [u.kod, u.nama_penuh, c.L, c.P, c.ajk, c.urusetia, c.jumlah, c.borang, c.yuran, infoUnit(k, u.kod).guru || '']; }));
      const tajuk = [[tajukKem(k)], [fmtJulat(k.tarikh_mula, k.tarikh_tamat)], []];
      const ok = await eksport(`PERKHEMAHAN-${k.tahun}.xlsx`, [['Peserta', tajuk.concat(rows)], ['Ringkasan', tajuk.concat(ring)]]);
      if (ok) roti('Fail Excel disediakan');
    }

    /* ============================================================ panel lain */
    // banner dalam halaman unit beruniform dan Utama
    function kemTerbuka() {
      const t = tahunAsal();
      if (!S.kem) { if (!memuat) muat(t).then(renderLatar, () => {}); return []; }
      if (S.kem.tahun !== t) return [];
      return (S.kem.kem || []).filter((k) => k.dibuka);
    }
    function bannerUnit(u) {
      if (u.kategori !== 'UB') return '';
      return kemTerbuka().map((k) => `<div class="mesej ok tanpa-cetak" style="margin-bottom:12px">Pendaftaran <b>${e(k.nama)} ${k.tahun}</b> dibuka (${e(fmtJulat(k.tarikh_mula, k.tarikh_tamat))}).
        <a href="#/kem/${k.id}/${encodeURIComponent(u.kod)}?tahun=${k.tahun}"><b>${bolehUrus(u.kod) ? 'Daftar peserta' : 'Lihat peserta'}</b></a> · ${pesertaUnit(k, u.kod).length} berdaftar</div>`).join('');
    }
    function panelUtama() {
      const us = unitUB().filter((u) => bolehUrus(u.kod) && !penyelaras());
      if (!penyelaras() && !us.length) return '';
      const l = kemTerbuka();
      if (!l.length) return '';
      return l.map((k) => `<div class="panel" style="margin-bottom:18px"><div class="kepala-panel"><h2>${e(k.nama)} ${k.tahun}</h2><a class="btn kecil" href="#/kem/${k.id}?tahun=${k.tahun}">Buka</a></div>
        <p class="kecil" style="margin:0">${e(fmtJulat(k.tarikh_mula, k.tarikh_tamat))} · ${pesertaKem(k).length} berdaftar${k.tarikh_tutup ? ` · pendaftaran ditutup ${e(fmtT(k.tarikh_tutup))}` : ''}</p>
        ${us.length ? `<p class="kecil" style="margin:8px 0 0">${us.map((u) => `<a href="#/kem/${k.id}/${encodeURIComponent(u.kod)}?tahun=${k.tahun}">${e(u.kod)}: ${pesertaUnit(k, u.kod).length} berdaftar, daftar peserta</a>`).join(' · ')}</p>` : ''}</div>`).join('');
    }

    /* ============================================================ peristiwa */
    function kiraTanda() {
      const out = $('#kem-kiraan'); if (!out) return;
      const v = $$('#borang-kem-tambah input[name=mid]:checked');
      out.textContent = v.length ? `${v.length} ditanda (${v.filter((x) => x.dataset.j === 'L').length} L, ${v.filter((x) => x.dataset.j === 'P').length} P)` : '';
    }
    async function tindakan(act, el) {
      switch (act) {
        case 'kem-muat': S.kem = null; render(); return true;
        case 'kem-baru': bukaTetapan(null); return true;
        case 'kem-ubah': bukaTetapan(el.dataset.id); return true;
        case 'kem-padam': {
          const k = kemId(el.dataset.id), n = pesertaKem(k).length;
          if (!(await sahkan(`Padam ${k.nama} ${k.tahun}?${n ? `\n\n${n} pendaftaran peserta turut dipadam.` : ''}`, { ok: 'Padam', bahaya: true }))) return true;
          await S.db.kemPadam(k.id); await muat(K().tahun, true); $('#dlg').close(); roti('Perkhemahan dipadam'); tetapLokasi(`#/kem?tahun=${K().tahun}`); render(); return true;
        }
        case 'kem-tukar-buka': {
          const k = kemId(el.dataset.id);
          Object.assign(k, await S.db.kemSimpan({ id: k.id, dibuka: !k.dibuka }));
          roti(k.dibuka ? 'Pendaftaran dibuka semula' : 'Pendaftaran ditutup'); S.kekalSkrol = true; render(); return true;
        }
        case 'kem-pajsk': await rekodPajsk(kemId(el.dataset.id)); return true;
        case 'kem-excel': await eksportExcel(kemId(el.dataset.id)); return true;
        case 'kem-buang': {
          const k = kemId(el.dataset.kem), m = S.data.murid.find((x) => x.id === el.dataset.mid);
          if (!(await sahkan(`Buang ${m ? m.nama : 'murid ini'} daripada senarai peserta?`, { ok: 'Buang', bahaya: true }))) return true;
          await S.db.kemPadamPeserta(k.id, [el.dataset.mid]);
          K().peserta = K().peserta.filter((p) => !(p.kem_id === k.id && p.murid_id === el.dataset.mid));
          roti('Peserta dibuang'); S.kekalSkrol = true; render(); return true;
        }
        case 'kem-tanda': {
          const j = el.dataset.j;
          $$('#borang-kem-tambah .kem-calon').forEach((x) => { const c = x.querySelector('input'); if (x.hidden) return; c.checked = j ? c.dataset.j === j || c.checked : false; });
          kiraTanda(); return true;
        }
        default: return false;
      }
    }
    async function hantar(f) {
      switch (f.id) {
        case 'borang-kem': await simpanTetapan(f); return true;
        case 'borang-kem-unit': await simpanUnit(f); return true;
        case 'borang-kem-peserta': await simpanPeserta(f); return true;
        case 'borang-kem-tambah': await simpanTambah(f); return true;
        default: return false;
      }
    }
    function ubah(ev) {
      const t = ev.target;
      if (t.id === 'kem-cari') {
        const q = t.value.trim().toUpperCase();
        $$('#borang-kem-tambah .kem-calon').forEach((x) => { x.hidden = !!q && !x.dataset.cari.includes(q); });
        return true;
      }
      if (t.closest && t.closest('#borang-kem-tambah') && t.name === 'mid') { kiraTanda(); return true; }
      return false;
    }

    return { papar, tindakan, hantar, ubah, bannerUnit, panelUtama, _uji: { kuotaUnit, kira, fmtJulat } };
  };
})();

</script>
<script>
