        : '<div class="mesej amaran">Laptop TIC belum memuat turun data kejohanan. Minta TIC tekan "Muat turun dari KOKUM SMART" di Pusat kawalan.</div>'}

    const f = el.querySelector('#borang-hs-masuk');
    if (f) f.addEventListener('submit', async (ev) => {
      ev.preventDefault();

      try {
        const h = await api('/api/masuk', { kaedah: 'POST', badan: { id: d.profil, pin: d.pin.trim() } });

    });
  }

  /* ---------- denyutan: kesan perubahan daripada telefon lain, kemas kini paparan */
  let denyut = null, versiDiketahui = null;
  function mulaDenyut(padaPerubahan) {
    if (denyut) return;
    const sekali = async () => {
      try {
        const r = await api(`/api/versi?n=${encodeURIComponent(namaSaya())}`, { had: 6000 });
        if (X.S.db.luar) X.S.db.luar.tandaTalian(true);
        if (versiDiketahui != null && r.versi !== versiDiketahui) await padaPerubahan();
        versiDiketahui = r.versi;
      } catch (err) {
        if (err.kod === 401 && !LOKAL) { X.roti('PIN hari sukan telah ditukar. Sila log masuk semula.', true); await X.S.db.keluar(); location.reload(); return; }
        if (err.rangkaian && X.S.db.luar) X.S.db.luar.tandaTalian(false);
      }
    };
    denyut = setInterval(sekali, 3000);
    sekali();
  }

  /* ---------- bantuan paparan */
  const warnaRumah = (r) => WARNA_RUMAH[String(r || '').toUpperCase()] || null;
  function cip(r) {
    const { e, S } = X, w = warnaRumah(r);
    if (w) return `<span class="rumah hs-rumah" style="--w:${w}">${e(r)}</span>`;
    const i = ((S.data.tetapan || {}).senarai_rumah || []).indexOf(r);

  }
  const labelAcara = (a) => `${a.acara} · ${LABEL_KAT[a.kategori] || a.kategori}`;
  const denganUnit = (a, p) => (p ? (/^\d/.test(p) ? `${p} ${a.unit === 'm' ? 'm' : 's'}` : p) : '');
  const namaPeserta = (x) => { const m = X.S.data.murid.find((y) => y.id === x.murid_id); return m ? m.nama : `KUARTET ${x.rumah}`; };
  const PINGAT = { 1: 'emas', 2: 'perak', 3: 'gangsa' };
  const lencana = (k) => `<span class="pingat ${PINGAT[k] || ''}">${k}</span>`;
  const keputusanAkhir = (id) => X.S.ais.keputusan.filter((x) => x.acara_id === id && x.pusingan === 'akhir' && x.kedudukan && !x.status).sort((p, q) => p.kedudukan - q.kedudukan);
  const masaAcara = (a) => a.rasmi_pada || X.S.ais.keputusan.filter((x) => x.acara_id === a.id).reduce((m, x) => (String(x.dikemas || '') > m ? String(x.dikemas) : m), '');
  function pastikanAis() {
    if (X.S.ais) return true;
    X.AIS.muat().then(() => X.render(), (err) => X.gagal(err));
    return false;
  }
  function seterusnya(n) {
    const B = X.AIS.bantu(), fj = B._uji.fmtJam;
    const slot = [];
    X.S.ais.acara.forEach((a) => {
      const st = B.statusAcara(a)[0];
      if (a.rasmi || st === 'sedia') return;
      const adaAkhir = X.S.ais.keputusan.some((x) => x.acara_id === a.id && x.pusingan === 'akhir');
      if (a.no_saringan && !adaAkhir && B.bilPeserta(a) > ((X.S.ais.k || {}).bil_lorong || 6)) slot.push({ a, no: a.no_saringan, hari: a.hari_saringan, masa: a.masa_saringan, pus: 'Saringan' });
      slot.push({ a, no: a.no_acara, hari: a.hari, masa: a.masa, pus: 'Akhir' });
    });
    return slot.filter((s) => s.no || s.masa).sort((p, q) => (p.hari || 99) - (q.hari || 99) || String(p.masa || '').padStart(4, '0').localeCompare(String(q.masa || '').padStart(4, '0')) || (p.no || 0) - (q.no || 0))
      .slice(0, n).map((s) => ({ ...s, jam: fj(s.masa) }));
  }

  /* ---------- PAPAN MARKAH (TV / projektor, skrin penuh) */
  let jamPapan = null;
  function papan(q) {
    const { e, S, LOGO } = X;
    if (!pastikanAis()) return '<div class="papan"><p class="pemuat">Memuatkan papan markah…</p></div>';
    const k = S.ais.k;
    if (!k) return '<div class="papan"><p class="pemuat">Belum ada data kejohanan.</p></div>';
    const B = X.AIS.bantu(), semua = q.get('semua') === '1', P = B.kiraPingat(semua);
    const rasmi = S.ais.acara.filter((a) => a.rasmi);
    const terkini = rasmi.slice().sort((p, r) => String(r.rasmi_pada || '').localeCompare(String(p.rasmi_pada || ''))).slice(0, 4);
    const maks = Math.max(1, ...P.jadual.map((r) => r.E + r.P + r.G));
    const rb = S.ais.rekod.filter((r) => r.acara_id && S.ais.acara.some((a) => a.id === r.acara_id));
    if (!jamPapan) jamPapan = setInterval(() => { const j = document.getElementById('papan-jam'); if (j) j.textContent = new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }); else { clearInterval(jamPapan); jamPapan = null; } }, 15000);
    return `<div class="papan">
      <header class="papan-atas"><img src="${LOGO}" alt=""><div><h1>${e(k.nama)} ${e(k.tahun)}</h1><p>Kedudukan pingat · ${rasmi.length} daripada ${S.ais.acara.length} acara disahkan${semua ? ' · termasuk keputusan belum disahkan' : ''}</p></div>
        <div class="papan-jam" id="papan-jam">${new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })}</div></header>
      <main class="papan-isi">
        <section class="papan-kedudukan">${P.jadual.map((r, i) => { const w = warnaRumah(r.r) || 'var(--hijau)', j = r.E + r.P + r.G; return `
          <div class="papan-baris" style="--w:${w}"><span class="tempat">${i + 1}</span><span class="nama">${e(r.r)}</span>
            <span class="kira emas"><b>${r.E}</b><small>Emas</small></span><span class="kira perak"><b>${r.P}</b><small>Perak</small></span><span class="kira gangsa"><b>${r.G}</b><small>Gangsa</small></span>
            <span class="kira jumlah"><b>${j}</b><small>Jumlah</small></span><span class="bar"><i style="width:${Math.round((j / maks) * 100)}%"></i></span></div>`; }).join('')}</section>
        <section class="papan-terkini"><h2>Keputusan terkini</h2>${terkini.length ? terkini.map((a) => `<div class="papan-acara"><div class="tajuk"><span>No ${e(a.no_acara || '')}</span> ${e(labelAcara(a))}</div>
          ${keputusanAkhir(a.id).slice(0, 3).map((x) => `<div class="pemenang">${lencana(x.kedudukan)}<span class="n">${e(a.jenis === 'gandaan' ? x.rumah : namaPeserta(x))}</span>${cip(x.rumah)}<span class="p">${e(denganUnit(a, x.prestasi))}${/RB/.test(x.catatan || '') ? ' <b class="rb">RB</b>' : ''}</span></div>`).join('')}</div>`).join('')
          : '<p class="pudar">Belum ada acara disahkan.</p>'}</section>
      </main>
      <footer class="papan-bawah"><b>Acara seterusnya</b>${seterusnya(5).map((s) => `<span>${s.no ? `No ${e(s.no)} · ` : ''}${e(s.jam || '')} · ${e(labelAcara(s.a))}${s.pus === 'Saringan' ? ' (saringan)' : ''}</span>`).join('') || '<span>—</span>'}
        ${rb.length ? `<span class="rb-jumlah">${rb.length} rekod baharu</span>` : ''}</footer>
      <a class="papan-keluar" href="#/olahraga/pingat" title="Keluar dari papan markah">✕</a>
    </div>`;
  }

  /* ---------- JURUHEBAH */
  function juruhebah() {
    const { e, S, IKON } = X;
    if (!pastikanAis()) return '<p class="pudar">Memuatkan…</p>';
    if (!S.ais.k) return '<div class="panel kosong-isi"><h3>Belum ada data kejohanan</h3></div>';
    const B = X.AIS.bantu(), umum = new Set(bacaJ(K_UMUM, []));
    const sedia = S.ais.acara.filter((a) => ['rasmi', 'sedia'].includes(B.statusAcara(a)[0])).map((a) => ({ a, t: masaAcara(a) })).sort((p, q) => q.t.localeCompare(p.t));
    const belum = sedia.filter((x) => !umum.has(x.a.id)), sudah = sedia.filter((x) => umum.has(x.a.id)).slice(0, 8);
    const kad = ({ a }, siap) => `<div class="panel hs-kad ${siap ? 'siap' : ''}">
        <div class="hs-kad-atas"><b>No ${e(a.no_acara || '')} · ${e(labelAcara(a))}</b><span class="status-acara ${a.rasmi ? 'rasmi' : 'sedia'}">${a.rasmi ? 'Rasmi' : 'Belum disahkan'}</span></div>
        <ol class="hs-pemenang">${keputusanAkhir(a.id).slice(0, a.jenis === 'balapan' && parseInt(a.acara, 10) >= 3000 ? 6 : 3).map((x) => `<li>${lencana(x.kedudukan)}<span class="n">${e(a.jenis === 'gandaan' ? 'KUARTET ' + x.rumah : namaPeserta(x))}</span>${cip(x.rumah)}<span class="p">${e(denganUnit(a, x.prestasi))}</span>
          ${/RB/.test(x.catatan || '') ? '<span class="rb">REKOD BAHARU</span>' : ''}</li>`).join('')}</ol>
        ${siap ? '' : `<button class="btn kecil" data-act="hs-umum" data-id="${a.id}">✓ Sudah diumumkan</button>`}</div>`;
    return `<div class="kepala"><div><h1>Juruhebah</h1><p>Keputusan terkini untuk diumumkan. Paparan dikemas kini sendiri apabila pencatat menyimpan keputusan.</p></div>
        <a class="btn kecil" href="#/papan">${IKON.olahraga} Papan markah</a></div>
      <h2 style="margin:0 0 10px">Untuk diumumkan (${belum.length})</h2>
      ${belum.length ? belum.map((x) => kad(x, false)).join('') : '<p class="pudar">Tiada keputusan baharu.</p>'}
      <h2 style="margin:22px 0 10px">Panggilan acara seterusnya</h2>
      <div class="panel" style="padding:0"><table class="jadual"><tbody>${seterusnya(8).map((s) => `<tr><td class="n">${e(s.no || '')}</td><td>${e(s.jam || '')}</td><td><b>${e(labelAcara(s.a))}</b></td><td>${e(s.pus)}</td></tr>`).join('') || '<tr><td>Semua acara selesai.</td></tr>'}</tbody></table></div>
      ${sudah.length ? `<h2 style="margin:22px 0 10px">Sudah diumumkan</h2>${sudah.map((x) => kad(x, true)).join('')}` : ''}`;
  }

  /* ---------- PUSAT KAWALAN (laptop sahaja) */
  function pusat() {
    if (!LOKAL) return '<div class="panel kosong-isi"><h3>Pusat kawalan hanya di laptop TIC</h3><p>Buka Keputusan untuk merekod keputusan acara.</p></div>';
    return `<div class="kepala"><div><h1>Pusat kawalan hari sukan</h1><p>Laptop ini ialah pelayan tempatan. Biarkan tetingkap hitam pelayan terbuka sepanjang kejohanan.</p></div></div>
      <div id="hs-pusat"><p class="pudar">Memuatkan…</p></div>`;
  }
  let pusatTimer = null;
  async function isiPusat() {
    const el = document.getElementById('hs-pusat'); if (!el) { clearInterval(pusatTimer); pusatTimer = null; return; }
    if (!pusatTimer) pusatTimer = setInterval(isiPusat, 5000);
    const { e, IKON } = X;
    let i;
    try { i = await api('/api/info'); } catch (err) { el.innerHTML = `<div class="mesej ralat">Pelayan laptop tidak berjalan. Klik dua kali MULA-HARI-SUKAN.bat.</div>`; return; }
    const url = (i.ip || []).map((ip) => `http://${ip}:${i.port}`);
    el.innerHTML = `<div class="grid2 hs-pusat">
      <div class="panel"><h2>Sambungkan telefon pencatat</h2>
        <ol class="kecil" style="padding-left:18px"><li>Laptop dan semua telefon pencatat sambung ke WiFi yang sama: router hari sukan, atau hotspot sebuah telefon Android di khemah TIC (data mudah alih boleh dimatikan).</li><li>Pada telefon pencatat, matikan data mudah alih supaya telefon kekal pada WiFi itu.</li><li>Buka Chrome dan taip alamat ini:</li></ol>
        ${url.length ? url.map((u, n) => `<div class="hs-url ${n ? 'kecil' : ''}">${e(u)}</div>`).join('') : '<div class="mesej amaran">Laptop belum bersambung ke mana-mana WiFi. Sambungkan laptop ke router atau hotspot telefon hari sukan.</div>'}
        <div class="hs-pin"><span>PIN hari sukan</span><b>${e(i.pin)}</b><button class="btn kecil" data-act="hs-pin">Tukar PIN</button></div>
        <p class="pudar kecil">Alamat ini boleh berubah jika laptop bersambung semula ke WiFi; sentiasa rujuk skrin ini. Jika telefon tidak dapat membuka alamat, semak firewall Windows: benarkan Python pada rangkaian Private dan Public.</p></div>
      <div class="panel"><h2>Peranti bersambung (${(i.peranti || []).length})</h2>
        ${(i.peranti || []).length ? `<table class="jadual kecil"><tbody>${i.peranti.map((p) => `<tr><td><b>${e(p.nama || 'Belum log masuk')}</b></td><td class="pudar">${e(p.ip)}</td><td class="n">${p.saat < 10 ? '<span style="color:var(--hijau)">● aktif</span>' : `${p.saat} saat lalu`}</td></tr>`).join('')}</tbody></table>` : '<p class="pudar kecil">Belum ada telefon bersambung.</p>'}</div>
      <div class="panel"><h2>Data kejohanan</h2>
        ${i.ada_data ? `<p style="margin:0 0 6px"><b>${e(i.kejohanan || '')} ${e(i.tahun || '')}</b></p>
          <div class="stat-baris" style="margin:0 0 10px"><div><b>${i.bil_acara}</b>acara</div><div><b>${i.bil_rasmi}</b>disahkan</div><div><b>${i.kotor}</b>acara belum dihantar</div></div>
          <p class="kecil pudar" style="margin:0">Dimuat turun: ${e(i.dimuat_turun || '–')}<br>Perubahan terakhir: ${e(i.diubah || '–')}<br>Dihantar ke KOKUM SMART: ${e(i.dihantar || 'belum')}</p>`
          : '<div class="mesej amaran">Belum ada data. Semasa ada internet, tekan <b>Muat turun dari KOKUM SMART</b>.</div>'}
        <div class="baris-btn" style="margin-top:12px"><button class="btn ${i.ada_data ? '' : 'utama'}" data-act="hs-muat-turun">⬇ Muat turun dari KOKUM SMART</button>
          ${i.ada_data ? `<button class="btn ${i.kotor ? 'utama' : ''}" data-act="hs-hantar">⬆ Hantar ke KOKUM SMART${i.kotor ? ` (${i.kotor})` : ''}</button>` : ''}</div>
        <p class="pudar kecil" style="margin:8px 0 0">Kedua-dua butang memerlukan internet dan akaun penyelaras KOKUM SMART.</p></div>
      <div class="panel"><h2>Paparan</h2>
        <div class="baris-btn"><a class="btn utama" href="#/papan" target="_blank" rel="noopener">${IKON.olahraga} Papan markah (TV)</a><a class="btn" href="#/juruhebah">Juruhebah</a><a class="btn" href="#/olahraga/jadual">Jadual & keputusan</a></div>
        <p class="pudar kecil">Sambungkan TV/projektor ke laptop dengan kabel HDMI, buka Papan markah, kemudian tekan F11 untuk skrin penuh.</p>
        <h2 style="margin-top:16px">Keselamatan data</h2>
        <p class="kecil" style="margin:0">Setiap perubahan disimpan terus dalam fail <b>data-hari-sukan.json</b>. Salinan sandaran dibuat setiap 5 minit dalam folder <b>sandaran</b>${i.sandaran ? ` (terakhir ${e(i.sandaran)})` : ''}.<br><span class="pudar">${e(i.folder || '')}</span></p></div>
    </div>`;
  }

  /* ---------- Supabase (perlu internet): muat turun & hantar */
  let sb = null;
  function muatSkripSB() {
    if (window.supabase) return Promise.resolve();
    return new Promise((ok, tolak) => { const s = document.createElement('script'); s.src = URL_SB; s.onload = ok; s.onerror = () => tolak(new Error('Tiada internet. Muat turun dan hantar memerlukan internet.')); document.head.appendChild(s); });
  }
  function dialogMasukSB() {
    return new Promise((selesai) => {
      const { e } = X, d = document.getElementById('dlg');
      d.innerHTML = `<div class="dk"><div><h2>Log masuk KOKUM SMART</h2><p class="pudar kecil" style="margin:2px 0 0">Akaun penyelaras (perlu internet)</p></div><button class="btn kosong kecil" data-act="tutup" aria-label="Tutup">${X.IKON.tutup}</button></div>
        <div class="db"><form class="borang" id="hs-sb-masuk"><label class="medan">E-mel<input type="email" name="email" required autocomplete="username"></label>
          <label class="medan">Kata laluan<input type="password" name="pw" required autocomplete="current-password"></label><p class="mesej ralat" id="hs-sb-ralat" hidden></p></form></div>
        <div class="dt"><button class="btn" data-act="tutup">Batal</button><button class="btn utama" type="submit" form="hs-sb-masuk">Log masuk</button></div>`;
      const f = d.querySelector('form');
      f.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const v = Object.fromEntries(new FormData(f)), r = f.querySelector('#hs-sb-ralat');
        try { await sb.masuk(v.email.trim(), v.pw); d.onclose = null; d.close(); selesai(true); } catch (err) { r.textContent = err.message; r.hidden = false; }
      });
      d.onclose = () => selesai(false);
      d.showModal();
      void e;
    });
  }
  async function sambungSB() {
    await muatSkripSB();
    const C = window.KOKUM_CONFIG || {};
    if (!sb) sb = window.KokumDB.SupabaseDB(C.supabaseUrl, C.supabaseAnonKey);
    let u = await sb.sesi().catch(() => null);
    if (!u) { if (!(await dialogMasukSB())) return null; u = await sb.sesi(); }
    const p = await sb.profilSaya(u.id);
    if (!p || !p.aktif || !(p.peranan === 'penyelaras' || p.ais_pencatat)) throw new Error('Akaun ini bukan penyelaras atau pencatat keputusan.');
    return p;
  }
  function kemajuan(teks) {
    const d = document.getElementById('dlg');
    d.innerHTML = `<div class="db" style="padding-top:22px"><p style="margin:0" id="hs-kemajuan">${X.e(teks)}</p></div>`;
    if (!d.open) d.showModal();
    return (t) => { const el = document.getElementById('hs-kemajuan'); if (el) el.textContent = t; };
  }
  async function muatTurun() {
    const { S, roti, sahkan } = X;
    const info = await api('/api/info');
    if (info.kotor && !(await sahkan(`${info.kotor} acara ada keputusan yang BELUM dihantar ke KOKUM SMART.\nMuat turun akan menggantikan semua data di laptop ini. Hantar dahulu jika perlu.\n\nTeruskan muat turun?`, { ok: 'Muat turun juga', bahaya: true }))) return;
    const p = await sambungSB(); if (!p) return;
    const tulisK = kemajuan('Memuat turun data murid…');
    const semua = await sb.muatSemua(true);
    tulisK('Memuat turun data olahraga…');
    const ais = await sb.aisMuat();
    if (!ais.k) throw new Error('Tiada kejohanan aktif dalam KOKUM SMART.');
    // hanya murid yang terlibat (atlet); MyKad dipendekkan kepada tarikh lahir sahaja
    const atlet = new Set([...ais.penyertaan.map((x) => x.murid_id), ...ais.keputusan.map((x) => x.murid_id), ...ais.bib.map((x) => x.murid_id)].filter(Boolean));
    const murid = semua.murid.filter((m) => atlet.has(m.id)).map((m) => ({ id: m.id, nama: m.nama, tingkatan: m.tingkatan, kelas: m.kelas, jantina: m.jantina, rumah_sukan: m.rumah_sukan, status: m.status,
      mykad: /^\d{12}$/.test(m.mykad || '') ? m.mykad.slice(0, 6) + '000000' : null, ub: m.ub, kp: m.kp, sp: m.sp }));
    const data = {
      tetapan: [semua.tetapan], unit: semua.units, murid,
      profiles: semua.profiles.filter((x) => x.aktif).map((x) => ({ id: x.id, email: x.email, nama: x.nama || x.email, peranan: x.peranan, aktif: x.aktif, ais_pencatat: !!x.ais_pencatat, rumah_sukan: x.rumah_sukan || null })),
      ais_kejohanan: ais.kejohanan.filter((x) => x.id === ais.k.id), ais_acara: ais.acara, ais_penyertaan: ais.penyertaan, ais_keputusan: ais.keputusan, ais_bib: ais.bib,
      ais_rekod: ais.rekod, ais_sejarah: ais.sejarah,
    };
    tulisK('Menyimpan ke laptop…');
    await api('/api/import', { kaedah: 'POST', badan: { data }, had: 60000 });
    document.getElementById('dlg').close();
    S.ais = null; S.data = null;
    roti(`Data dimuat turun: ${ais.acara.length} acara, ${murid.length} atlet`);
    await X.muatData();
  }
  async function hantar() {
    const { S, roti } = X;
    const d = await api('/api/data', { had: 30000 });
    if (!(d.kotor || []).length) { roti('Tiada perubahan untuk dihantar'); return; }
    const p = await sambungSB(); if (!p) return;
    const tulisK = kemajuan('Menyemak data di KOKUM SMART…');
    const pelayan = await sb.aisMuat(), peta = new Map(pelayan.acara.map((a) => [a.id, a]));
    let ok = 0; const gagal = [];
    for (const [n, id] of d.kotor.entries()) {
      const a = d.ais_acara.find((x) => String(x.id) === String(id));
      if (!a) { await api('/api/bersih', { kaedah: 'POST', badan: { acara: [id] } }); continue; }
      tulisK(`Menghantar ${n + 1}/${d.kotor.length}: ${labelAcara(a)}`);
      try {
        const sv = peta.get(a.id);
        if (!sv) throw new Error('acara ini tiada dalam KOKUM SMART (kejohanan sudah ditukar?)');
        if (sv.rasmi) await sb.aisSahkan(a.id, false);
        for (const pus of ['saringan', 'akhir']) await sb.aisGantiKeputusan(a.id, pus, d.ais_keputusan.filter((x) => x.acara_id === a.id && x.pusingan === pus));
        if (MEDAN_JADUAL.some((m) => (a[m] ?? null) !== (sv[m] ?? null)) && p.peranan === 'penyelaras') await sb.aisSimpanJadual([{ id: a.id, ...pilih(a, MEDAN_JADUAL) }]);
        if (a.rasmi) await sb.aisSahkan(a.id, true);
        await api('/api/bersih', { kaedah: 'POST', badan: { acara: [id] } });
        ok++;
      } catch (err) { gagal.push(`${labelAcara(a)}: ${err.message}`); if (err.rangkaian || /Tiada sambungan/.test(err.message)) break; }
    }
    document.getElementById('dlg').close();
    if (gagal.length) await X.sahkan(`${ok} acara dihantar. ${gagal.length} gagal:\n\n${gagal.slice(0, 8).join('\n')}\n\nCuba tekan Hantar sekali lagi.`, { ok: 'Faham' });
    else roti(`${ok} acara dihantar ke KOKUM SMART`);
    S.ais = null; X.render();
  }

  /* ---------- tindakan */
  async function tindakan(act, el) {
    if (!act.startsWith('hs-')) return false;
    const { roti, render } = X;
    if (act === 'hs-umum') { const s = new Set(bacaJ(K_UMUM, [])); s.add(+el.dataset.id); tulisJ(K_UMUM, [...s].slice(-300)); X.S.kekalSkrol = true; render(); return true; }
    if (act === 'hs-pin') {
      const pin = prompt('PIN baharu (4 hingga 8 digit). Semua telefon perlu log masuk semula.');
      if (!pin) return true;
      await api('/api/pin', { kaedah: 'POST', badan: { pin: pin.trim() } }); roti('PIN ditukar'); isiPusat(); return true;
    }
    if (act === 'hs-muat-turun') { await muatTurun(); return true; }
    if (act === 'hs-hantar') { await hantar(); isiPusat(); return true; }
    return false;
  }

  window.KokumHariSukan = { LOKAL, DB, pasang, skrinMasuk, mulaDenyut, papan, juruhebah, pusat, isiPusat, tindakan, api, _uji: { susunAis } };
})();

</script>

      'BRASS BAND (DRUM MAJOR)', 'BRASS BAND (KETUA SEKSYEN)', 'BRASS BAND (PENOLONG KETUA SEKSYEN)',
      'BRASS BAND (KUATERMASTER)', 'AHLI JAWATANKUASA', 'AHLI AKTIF', 'AHLI BIASA'],
  };
  // nama lazim di sekolah -> teks MOEIS
  const SINONIM = {
    'AJK': 'AHLI JAWATANKUASA', 'AHLI JAWATAN KUASA': 'AHLI JAWATANKUASA', 'PRESIDEN': 'PENGERUSI', 'KETUA': 'PENGERUSI',
    'NAIB PRESIDEN': 'NAIB PENGERUSI', 'TIMBALAN PENGERUSI': 'NAIB PENGERUSI', 'TIMBALAN PRESIDEN': 'NAIB PENGERUSI',
    'PENOLONG SETIAUSAHA': 'NAIB SETIAUSAHA', 'PEN. SETIAUSAHA': 'NAIB SETIAUSAHA', 'TIMBALAN SETIAUSAHA': 'NAIB SETIAUSAHA',
    'PENOLONG BENDAHARI': 'NAIB BENDAHARI', 'PEN. BENDAHARI': 'NAIB BENDAHARI', 'TIMBALAN BENDAHARI': 'NAIB BENDAHARI',
    'AHLI': 'AHLI BIASA', 'AHLI BERDAFTAR': 'AHLI BIASA', 'KAPTEN': 'KAPTEN PASUKAN',
  };
  const norm = (s) => String(s == null ? '' : s).toUpperCase().replace(/[–—]/g, '-').replace(/\s+/g, ' ')
    .replace(/\s*([/\-()])\s*/g, '$1').trim();

  /* Jawatan aplikasi -> teks MOEIS bagi kategori itu ('' jika tiada padanan) */
  function petaJawatan(kat, j) {
    if (!j) return '';
    const senarai = JAWATAN[kat] || [];
    const n = norm(j);
    const terus = senarai.find((x) => norm(x) === n);
    if (terus) return terus;
    const s = SINONIM[n];
    if (s && senarai.indexOf(s) >= 0) return s;
    if (kat === 'SP' && n === 'PENOLONG KETUA PASUKAN') return 'PENOLONG KAPTEN';
    if (kat === 'SP' && n === 'KETUA PASUKAN') return 'KAPTEN PASUKAN';
    return '';
  }

  /* ------------------------------------------------------------ zip (baca + tulis) */
  let jadualCrc = null;
  function crc32(u8) {
    if (!jadualCrc) {
      jadualCrc = new Uint32Array(256);
      for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; jadualCrc[n] = c >>> 0; }
    }
    let c = 0xffffffff;
    for (let i = 0; i < u8.length; i++) c = jadualCrc[(c ^ u8[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }
  const strim = async (data, alir) => new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(alir)).arrayBuffer());

  function bacaZip(buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf);
    let e = buf.byteLength - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error('Fail templat rosak.');
    const n = dv.getUint16(e + 10, true);
    let p = dv.getUint32(e + 16, true);
    const masukan = [];
    for (let i = 0; i < n; i++) {
      const ln = dv.getUint16(p + 28, true), le = dv.getUint16(p + 30, true), lk = dv.getUint16(p + 32, true);
      const off = dv.getUint32(p + 42, true);
      const mula = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
      const csize = dv.getUint32(p + 20, true);
      masukan.push({
        nama: new TextDecoder().decode(u8.subarray(p + 46, p + 46 + ln)), kaedah: dv.getUint16(p + 10, true),
        masa: dv.getUint16(p + 12, true), tarikh: dv.getUint16(p + 14, true), crc: dv.getUint32(p + 16, true),
        csize, usize: dv.getUint32(p + 24, true), data: u8.subarray(mula, mula + csize),
      });
      p += 46 + ln + le + lk;
    }
    return masukan;
  }
  async function teksMasukan(m) {
    if (m.kaedah === 0) return new TextDecoder().decode(m.data);
    return new TextDecoder().decode(await strim(m.data, new DecompressionStream('deflate-raw')));
  }
  async function gantiMasukan(m, teks) {
    const asal = new TextEncoder().encode(teks);
    const mampat = await strim(asal, new CompressionStream('deflate-raw'));
    Object.assign(m, { kaedah: 8, crc: crc32(asal), usize: asal.length, csize: mampat.length, data: mampat });
  }
  function tulisZip(masukan) {
    const enc = new TextEncoder(), bahagian = [], pusat = [];
    let off = 0;
    for (const m of masukan) {
      const nama = enc.encode(m.nama);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, m.kaedah, true);
      lh.setUint16(10, m.masa, true); lh.setUint16(12, m.tarikh, true); lh.setUint32(14, m.crc, true);
      lh.setUint32(18, m.csize, true); lh.setUint32(22, m.usize, true); lh.setUint16(26, nama.length, true); lh.setUint16(28, 0, true);
      bahagian.push(new Uint8Array(lh.buffer), nama, m.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, m.kaedah, true); ch.setUint16(12, m.masa, true); ch.setUint16(14, m.tarikh, true); ch.setUint32(16, m.crc, true);
      ch.setUint32(20, m.csize, true); ch.setUint32(24, m.usize, true); ch.setUint16(28, nama.length, true); ch.setUint32(42, off, true);
      pusat.push(new Uint8Array(ch.buffer), nama);
      off += 30 + nama.length + m.csize;
    }
    const saizPusat = pusat.reduce((s, x) => s + x.length, 0);
    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(8, masukan.length, true); eocd.setUint16(10, masukan.length, true);
    eocd.setUint32(12, saizPusat, true); eocd.setUint32(16, off, true);
    return new Blob([...bahagian, ...pusat, new Uint8Array(eocd.buffer)],
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  /* ------------------------------------------------------------ isi templat */
  const escXml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function isiSel(xml, nilai) {
    if (!nilai.size) return xml;
    return xml.replace(/<c r="([A-Z]+\d+)"([^>]*?)(\/>|>[\s\S]*?<\/c>)/g, (asal, ref, attr) => {
      if (!nilai.has(ref)) return asal;
      const v = nilai.get(ref);
      const a = attr.replace(/\s+t="[^"]*"/, '');
      if (typeof v === 'number') return `<c r="${ref}"${a}><v>${v}</v></c>`;
      return `<c r="${ref}"${a} t="inlineStr"><is><t xml:space="preserve">${escXml(v)}</t></is></c>`;
    });
  }

  /* pilihan: { templat: ArrayBuffer, murid: [...], kategori: ['KP','UB','SP'], unitNama: Map(kod->nama penuh), sekolah, tahun } */
  async function janaTemplat(pilihan) {
    if (typeof CompressionStream === 'undefined') throw new Error('Pelayar ini terlalu lama. Sila guna Google Chrome terkini.');
    const MULA = 5, HAD = 1000;
    const murid = pilihan.murid;
    if (murid.length > HAD) throw new Error(`Templat menampung ${HAD} murid sahaja. Pilih kelas atau unit yang lebih kecil.`);
    const masukan = bacaZip(pilihan.templat);
    const cari = (n) => masukan.find((m) => m.nama === n);
    const wb = await teksMasukan(cari('xl/workbook.xml'));
    const rel = await teksMasukan(cari('xl/_rels/workbook.xml.rels'));
    const fail = {};
    for (const m of wb.matchAll(/<sheet [^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)) {
      const t = (rel.match(new RegExp('Id="' + m[2] + '"[^>]*Target="([^"]+)"')) || rel.match(new RegExp('Target="([^"]+)"[^>]*Id="' + m[2] + '"')) || [])[1];
      if (t) fail[m[1]] = 'xl/' + t.replace(/^\/?xl\//, '').replace(/^\//, '');
    }
    const nilai = { Murid: new Map(), KP: new Map(), UB: new Map(), SP: new Map(), Ekstra: new Map() };
    const KOL_KOM = ['J', 'K', 'L', 'M'], KOL_KM = ['I', 'J', 'K', 'L', 'M', 'N', 'O'];
    murid.forEach((m, i) => {
      const r = MULA + i;
      nilai.Murid.set('B' + r, m.nama || '');
      if (m.mykad) nilai.Murid.set('C' + r, m.mykad);
      if (m.tingkatan) nilai.Murid.set('D' + r, m.tingkatan);
      if (m.kelas) nilai.Murid.set('E' + r, m.kelas);
      // pilihan.pajsk(m): data PAJSK daripada aplikasi (Fasa 2) untuk mengisi semua lajur yang dibaca Robot PAJSK
      const pj = pilihan.pajsk ? pilihan.pajsk(m) : null;
      if (pj && pj.tl) nilai.Murid.set('F' + r, 'TL');
      for (const kat of pilihan.kategori) {
        const kod = m[kat.toLowerCase()];
        if (!kod) continue;
        nilai[kat].set('E' + r, (pilihan.unitNama && pilihan.unitNama.get(kod)) || kod);
        const j = petaJawatan(kat, m[kat.toLowerCase() + '_jawatan']) || (pj ? 'AHLI BIASA' : '');
        if (j) nilai[kat].set('F' + r, j);
        const d = pj && pj[kat];
        if (!d) continue;
        if (d.hadir != null && d.hadir !== '') nilai[kat].set('H' + r, +d.hadir);
        (d.komitmen || []).slice(0, 4).forEach((k, i) => nilai[kat].set(KOL_KOM[i] + r, k));
        if (d.khidmat) nilai[kat].set('O' + r, d.khidmat);
        if (d.libat_per && d.libat_jenis) { nilai[kat].set('Q' + r, d.libat_per); nilai[kat].set('R' + r, d.libat_jenis); }
        if (d.capai_per && d.capai_ked) { nilai[kat].set('T' + r, d.capai_per); nilai[kat].set('U' + r, d.capai_ked); }
      }
      const ek = pj && pj.EKSTRA;
      if (ek) {
        if (ek.perkhidmatan) nilai.Ekstra.set('E' + r, ek.perkhidmatan);
        if (ek.anugerah) nilai.Ekstra.set('G' + r, ek.anugerah);
        (ek.kmSusun || []).forEach((n, i) => { if (+n > 0) nilai.Ekstra.set(KOL_KM[i] + r, +n); });
        if (ek.nilam) nilai.Ekstra.set('Q' + r, ek.nilam);
        if (ek.timss) nilai.Ekstra.set('S' + r, ek.timss);
      }
    });
    for (const nama of ['Murid', 'KP', 'UB', 'SP', 'Ekstra']) {
      const m = cari(fail[nama]);
      if (!m || !nilai[nama].size) continue;
      await gantiMasukan(m, isiSel(await teksMasukan(m), nilai[nama]));
    }
    const pand = cari(fail.Panduan);
    if (pand && (pilihan.sekolah || pilihan.tahun)) {
      const t = await teksMasukan(pand);
      await gantiMasukan(pand, t.replace(/TEMPLAT KIRAAN PAJSK \d{4} &#183; SEKOLAH MENENGAH/,
        escXml(`TEMPLAT KIRAAN PAJSK ${pilihan.tahun || ''} · ${pilihan.sekolah || 'SEKOLAH MENENGAH'}`)));
    }
    return tulisZip(masukan);
  }

  window.KokumPAJSK = { JAWATAN, petaJawatan, janaTemplat, _uji: { bacaZip, teksMasukan, crc32 } };
})();

</script>

(function () {

    function layakKat(m, a) {

    const unitAcara = (nama) => { const a = A().acara.find((x) => x.acara === nama); return a ? a.unit : (/^\d.* m$|BERPAGAR|JALAN| x /.test(nama) ? 's' : 'm'); };

      const k = K(), peta = acaraId(), rumah = senaraiRumah();
      const tanpaRumah = aktif().filter((m) => !m.rumah_sukan && m.tingkatan !== 'PPKI').length;
      const atlet = new Set(A().penyertaan.map((p) => p.murid_id));
      const kad = rumah.map((r) => {
        const p = A().penyertaan.filter((x) => x.rumah === r);
        const at = new Set(p.map((x) => x.murid_id));
        const penuh = A().acara.filter((a) => p.filter((x) => x.acara_id === a.id).length >= kuotaAcara(a)).length;
        const ahli = aktif().filter((m) => m.rumah_sukan === r).length;
        return `<a class="kad-rumah r${idxRumah(r)}" href="#/olahraga/daftar?rumah=${encodeURIComponent(r)}">
          <div class="atas"><b>${e(r)}</b>${rumahGuru() === r ? '<span class="saya">Rumah anda</span>' : ''}</div>
          <div class="stat"><span><b>${at.size}</b>atlet</span><span><b>${p.length}</b>penyertaan</span><span><b>${penuh}/${A().acara.length}</b>acara penuh</span></div>
          <div class="pudar kecil">${ahli} murid dalam rumah ini</div></a>`;
      }).join('');
      const sejarahUS = A().sejarah.filter((h) => h.peringkat === 'MSSD' && h.kedudukan && h.kedudukan <= 3);
      return `
        ${tanpaRumah ? `<div class="mesej amaran">${tanpaRumah} murid belum ada rumah sukan, jadi belum boleh didaftarkan. ${penyelaras() ? '<a href="#/olahraga/rumah"><b>Agihkan rumah sukan</b></a>' : 'Hubungi penyelaras.'}</div>` : ''}
        ${!penyelaras() && !rumahGuru() ? '<div class="mesej amaran">Anda belum ditetapkan sebagai guru rumah sukan. Anda boleh melihat senarai, tetapi hanya guru rumah dan penyelaras boleh mendaftar atlet.</div>' : ''}
        <div class="ringkas">
          <div class="kotak"><b>${atlet.size}</b><span>Atlet berdaftar</span></div>
          <div class="kotak"><b>${A().penyertaan.length}</b><span>Penyertaan dalam ${A().acara.length} acara</span></div>
          <div class="kotak"><b>${k.had_acara} / ${k.kuota}</b><span>Had acara setiap atlet / kuota setiap rumah bagi setiap acara</span></div>
          <div class="kotak"><b>${A().rekod.filter((r) => r.peringkat === 'SEKOLAH').length}</b><span>Rekod sekolah tersimpan</span></div>
        </div>
        ${A().fasaB ? pantasB() : '<div class="mesej amaran">Fasa B (jadual, keputusan, pingat dan sijil) belum dipasang. Penyelaras perlu menjalankan fail <b>ais_fasab.sql</b> di Supabase.</div>'}
        <h2 style="margin-bottom:10px">Rumah sukan</h2>
        <div class="grid-rumah">${kad || '<p class="pudar">Senarai rumah sukan belum ditetapkan di Tetapan, Sekolah.</p>'}</div>
        <div class="grid2" style="margin-top:22px">
          <div class="panel"><h2>Cara pendaftaran</h2><ol class="kecil" style="padding-left:18px;margin:8px 0 0">
            <li>Penyelaras menetapkan rumah sukan murid dan guru rumah.</li>
            <li>Guru rumah membuka <b>Pendaftaran</b>, memilih kategori, kemudian memilih atlet bagi setiap acara.</li>
            <li>Aplikasi menyemak jantina, kategori umur daripada MyKad (atlet hanya dalam kategori sendiri; Terbuka untuk semua), had ${k.had_acara} acara${k.kira_gandaan ? ' termasuk gandaan' : ''} dan kuota ${k.kuota} atlet setiap rumah.</li>
            <li>Penyelaras menutup pendaftaran dan memberi nombor BIB (tab Atlet).</li>
            <li>Pencatat menjana senarai mula, mengisi keputusan dari telefon dan mengesahkan setiap acara (tab Jadual & keputusan).</li>
            <li>Pingat, olahragawan/olahragawati, laporan dan sijil dijana automatik (tab Pingat dan Cetak).</li></ol></div>
          <div class="panel"><h2>Pingat SMK Ulu Sugut di MSSD</h2>
            ${sejarahUS.length ? `<table class="jadual"><tbody>${sejarahUS.slice(0, 16).map((h) => `<tr><td>${lencanaPingat(h.kedudukan)}</td><td><b>${e(h.nama)}</b><br><span class="pudar kecil">${e(h.kategori)} ${e(h.acara)} · ${e(h.tahun)}</span></td><td class="n">${e(prestasiUnit(h.prestasi, unitAcara(h.acara)))}</td></tr>`).join('')}</tbody></table>` : '<p class="pudar">Tiada data.</p>'}
          </div>
        </div>`;
    }

    function pantasB() {
      const rasmi = A().acara.filter((a) => a.rasmi).length, P = B.kiraPingat(false), d = P.jadual[0];
      const bibKurang = new Set(A().penyertaan.map((p) => p.murid_id)).size - A().bib.length;
      const berjalan = A().acara.filter((a) => !a.rasmi && A().keputusan.some((x) => x.acara_id === a.id)).length;
      return `<div class="panel" style="margin-bottom:18px"><div class="ringkas" style="margin:0">
          <div class="kotak"><b>${rasmi}/${A().acara.length}</b><span>Acara disahkan${berjalan ? ` · ${berjalan} sedang berjalan` : ''}</span></div>
          <div class="kotak"><b>${d && d.E + d.P + d.G ? e(d.r) : '—'}</b><span>${d && d.E + d.P + d.G ? `Mendahului: ${d.E} emas, ${d.P} perak, ${d.G} gangsa` : 'Kutipan pingat bermula selepas keputusan disahkan'}</span></div>
          <div class="kotak"><b>${A().rekod.filter((r) => r.acara_id).length}</b><span>Rekod baharu ${e(K().tahun)}</span></div></div>
        <div class="baris-btn" style="margin-top:12px"><a class="btn" href="#/olahraga/jadual">Jadual & keputusan</a><a class="btn" href="#/olahraga/pingat">Kutipan pingat</a><a class="btn" href="#/olahraga/cetak">${IKON.cetak} Cetak borang</a></div>
        ${bibKurang > 0 ? `<p class="pudar kecil" style="margin:8px 0 0">${bibKurang} atlet belum ada nombor BIB.</p>` : ''}</div>`;
    }

    /* ------------------------------------------------------------ PENDAFTARAN */
    function pDaftar(q) {
      const rumah = senaraiRumah();
      let r = q.get('rumah') || S.aisRumah || rumahGuru() || rumah[0] || '';
      let kk = q.get('kat') || S.aisKat || 'P15';
      if (!KUMP_KAT.some((x) => x[0] === kk)) kk = 'P15';
      S.aisRumah = r; S.aisKat = kk;
      const k = K(), boleh = bolehRumah(r) && (k.pendaftaran_dibuka || penyelaras());
      const peta = muridPeta(), petaA = acaraId();
      const acara = A().acara.filter((a) => kumpKat(a.kategori) === kk).sort((a, b) => a.susunan - b.susunan);
      const baris = acara.map((a) => {
        const p = A().penyertaan.filter((x) => x.acara_id === a.id && x.rumah === r);
        const had = kuotaAcara(a);
        const rs = rekodBagi(a, 'SEKOLAH');
        return `<div class="acara-baris">
          <div class="acara-nama"><b>${e(a.acara)}</b> ${a.kategori.endsWith('T') ? `<span class="pudar kecil">${e(LABEL_KAT[a.kategori])}</span>` : ''}
            <div class="pudar kecil">Rekod: ${rs.length ? e(prestasiUnit(rs[0].prestasi, a.unit)) + ' · ' + e(rs[0].nama) + ' (' + e(rs[0].tahun) + ')' : '—'}</div></div>
          <div class="slot-atlet">
            ${p.map((x) => { const m = peta.get(x.murid_id) || { nama: '?', kelas: '' }; return `<span class="atlet-cip"><button class="pautan" data-act="ais-profil" data-id="${e(x.murid_id)}">${e(m.nama)}</button>
              <small>${e(m.kelas)} · ${bilAcara(x.murid_id, petaA)}/${k.had_acara}</small>${boleh ? `<button class="buang" data-act="ais-batal" data-id="${e(x.id)}" aria-label="Batalkan ${e(m.nama)}">${IKON.tutup}</button>` : ''}</span>`; }).join('')}
            ${p.length < had ? (boleh ? `<button class="btn kecil" data-act="ais-pilih" data-acara="${a.id}">${IKON.tambah} Atlet (${p.length}/${had})</button>` : `<span class="pudar kecil">${p.length}/${had}</span>`) : `<span class="penuh">Penuh ${p.length}/${had}</span>`}
          </div></div>`;
      }).join('');
      return `
        <div class="panel" style="margin-bottom:14px">
          <div class="baris-pilih"><span class="kecil pudar">Rumah</span><div class="cip-set">${rumah.map((x) => `<a class="cip ${x === r ? 'pilih' : ''}" href="#/olahraga/daftar?rumah=${encodeURIComponent(x)}&kat=${kk}">${e(x)}</a>`).join('')}</div></div>
          <div class="baris-pilih"><span class="kecil pudar">Kategori</span><div class="cip-set">${KUMP_KAT.map(([x, l]) => `<a class="cip ${x === kk ? 'pilih' : ''}" href="#/olahraga/daftar?rumah=${encodeURIComponent(r)}&kat=${x}">${l}</a>`).join('')}</div></div>
          ${!bolehRumah(r) ? `<p class="pudar kecil" style="margin:8px 0 0">Anda boleh melihat pendaftaran rumah ${e(r)}. Hanya guru rumah ${e(r)} dan penyelaras boleh mengubahnya.</p>` : ''}
          ${bolehRumah(r) && !k.pendaftaran_dibuka && !penyelaras() ? '<div class="mesej amaran" style="margin:8px 0 0">Pendaftaran sudah ditutup oleh penyelaras.</div>' : ''}
        </div>
        <div class="panel" style="padding:0">${baris || '<div class="kosong-isi">Tiada acara.</div>'}</div>
        <div class="baris-btn" style="margin-top:14px"><button class="btn" data-act="ais-eksport" data-rumah="${e(r)}">${IKON.muat} Excel penyertaan ${e(r)}</button>
          ${penyelaras() ? `<button class="btn" data-act="ais-eksport" data-rumah="">${IKON.muat} Excel semua rumah</button>` : ''}</div>`;
    }

    function bukaPilih(acaraId_) {
      const a = A().acara.find((x) => x.id === acaraId_), r = S.aisRumah, k = K(), petaA = acaraId();
      const dalam = new Set(A().penyertaan.filter((p) => p.acara_id === a.id).map((p) => p.murid_id));
      const dlg = $('#dlg');
      dlg.innerHTML = `<div class="dk"><div><h2>${e(a.acara)} · ${e(LABEL_KAT[a.kategori] || a.kategori)}</h2><p class="pudar kecil" style="margin:2px 0 0">Rumah ${e(r)}. Pilih atlet (kuota ${kuotaAcara(a)}).</p></div><button class="btn kosong kecil" data-act="tutup" aria-label="Tutup">${IKON.tutup}</button></div>
        <div class="db"><input class="cari" type="search" id="ap-q" placeholder="Cari nama atau kelas" aria-label="Cari atlet" style="width:100%;margin-bottom:8px">
          <p class="pudar kecil" id="ap-bil"></p><ul class="senarai" id="ap-senarai" style="max-height:52vh;overflow:auto"></ul></div>
        <div class="dt"><button class="btn" data-act="tutup">Selesai</button></div>`;
      dlg.dataset.id = ''; dlg.dataset.acara = String(a.id); dlg.dataset.ubah = '';
      if (!dlg.open) dlg.showModal();
      const isi = () => {
        const qq = $('#ap-q').value.trim().toUpperCase();
        const calon = aktif().filter((m) => m.rumah_sukan === r && m.jantina === a.kategori[0] && !dalam.has(m.id)
          && layakKat(m, a) && (!qq || m.nama.includes(qq) || m.kelas.includes(qq))).sort(susunMurid);
        $('#ap-bil').textContent = `${calon.length} murid rumah ${r} dalam kategori ${a.kategori.endsWith('T') ? 'terbuka' : a.kategori} boleh dipilih.`;
        $('#ap-senarai').innerHTML = calon.slice(0, 200).map((m) => {
          const n = bilAcara(m.id, petaA), ka = katAtlet(m), penuh = dikira(a) && n >= k.had_acara;
          const lalu = sejarahMurid(m).filter((h) => h.acara === a.acara)[0];
          return `<li><button class="baris" data-act="ais-daftar" data-murid="${e(m.id)}" ${penuh ? 'disabled' : ''}>
            <span><span class="nama">${e(m.nama)}</span><br><span class="meta">${e(m.kelas)} · ${ka.kod ? e(ka.kod.slice(1)) + ' tahun' : 'kategori ?'}${ka.umur ? ' (umur ' + ka.umur + ')' : ''}${!ka.kod ? ' · <b style="color:var(--amaran)">umur tidak pasti</b>' : ''}${lalu ? ` · ${lalu.tahun}: ${lalu.kedudukan ? 'ked. ' + lalu.kedudukan : ''} ${e(lalu.prestasi)}` : ''}</span></span>
            <span class="${penuh ? 'penuh' : 'pudar kecil'}">${n}/${k.had_acara} acara</span></button></li>`;
        }).join('') || '<li class="kosong-isi">Tiada murid sepadan.</li>';
      };
      $('#ap-q').addEventListener('input', isi);
      dlg._isiPilih = () => { A().penyertaan.filter((p) => p.acara_id === a.id).forEach((p) => dalam.add(p.murid_id)); isi(); };
      isi();
    }

    async function daftar(muridId, btn) {
      const dlg = $('#dlg'), acara = +dlg.dataset.acara, a = A().acara.find((x) => x.id === acara);
      const m = S.data.murid.find((x) => x.id === muridId);
      if (!layakKat(m, a)) { roti(`${m.nama} dalam kategori ${katAtlet(m).kod || 'lain'} dan tidak boleh menyertai acara ${a.kategori}.`, true); return; }
      if (!a.kategori.endsWith('T') && !katAtlet(m).kod && !(await sahkan(`Kategori umur ${m.nama} tidak dapat ditentukan (MyKad atau tingkatan tidak lengkap). Daftar juga dalam ${a.kategori}?`, { ok: 'Daftar juga' }))) return;
      if (btn) btn.disabled = true;
      try {
        const rec = await S.db.aisDaftar(acara, muridId);
        A().penyertaan.push(rec);
        dlg.dataset.ubah = '1';
        roti(`${m.nama.split(' ')[0]} didaftarkan: ${a.acara} ${a.kategori}`);
        const bil = A().penyertaan.filter((p) => p.acara_id === acara && p.rumah === rec.rumah).length;
        if (bil >= kuotaAcara(a)) dlg.close(); else dlg._isiPilih();
      } catch (err) { gagal(err); if (btn) btn.disabled = false; }
    }

    /* ------------------------------------------------------------ ATLET */
    function pAtlet(q) {
      const r = q.get('rumah') || '', petaA = acaraId(), peta = muridPeta(), bib = A().fasaB ? B.bibPeta() : new Map();
      const tanpaBib = new Set(A().penyertaan.map((p) => p.murid_id).filter((id) => !bib.has(id))).size;
      const ikut = new Map();
      A().penyertaan.filter((p) => !r || p.rumah === r).forEach((p) => { if (!ikut.has(p.murid_id)) ikut.set(p.murid_id, []); ikut.get(p.murid_id).push(petaA.get(p.acara_id)); });
      const senarai = Array.from(ikut.entries()).map(([id, as]) => ({ m: peta.get(id), as })).filter((x) => x.m).sort((x, y) => (x.m.rumah_sukan || '').localeCompare(y.m.rumah_sukan || '') || susunMurid(x.m, y.m));
      return `<div class="panel" style="margin-bottom:14px"><div class="baris-pilih"><span class="kecil pudar">Rumah</span><div class="cip-set">
          <a class="cip ${!r ? 'pilih' : ''}" href="#/olahraga/atlet">Semua</a>${senaraiRumah().map((x) => `<a class="cip ${x === r ? 'pilih' : ''}" href="#/olahraga/atlet?rumah=${encodeURIComponent(x)}">${e(x)}</a>`).join('')}</div></div>
          ${A().fasaB ? `<p class="kecil ${tanpaBib ? '' : 'pudar'}" style="margin:10px 0 0">${tanpaBib ? `${tanpaBib} atlet belum ada nombor BIB.` : 'Semua atlet ada nombor BIB.'}</p>
          <div class="baris-btn" style="margin-top:8px">${penyelaras() ? `<button class="btn kecil ${tanpaBib ? 'utama' : ''}" data-act="ais-bib-jana" ${tanpaBib ? '' : 'disabled'}>Beri nombor BIB (${tanpaBib})</button>${A().bib.length ? '<button class="btn kecil" data-act="ais-bib-semula">Susun semula semua BIB</button>' : ''}` : ''}
            <a class="btn kecil" href="#/olahraga/cetak?doc=bib${r ? '&rumah=' + encodeURIComponent(r) : ''}">${IKON.cetak} Kad BIB</a><a class="btn kecil" href="#/olahraga/cetak?doc=atlet${r ? '&rumah=' + encodeURIComponent(r) : ''}">${IKON.cetak} Senarai atlet</a></div>` : ''}</div>
        ${senarai.length ? `<ul class="senarai">${senarai.map(({ m, as }) => `<li><button class="baris" data-act="ais-profil" data-id="${e(m.id)}">
          <span><span class="nama">${bib.has(m.id) ? `<span class="bib-cip">${e(bib.get(m.id))}</span> ` : ''}${e(m.nama)}</span><br><span class="meta">${e(m.kelas)} · ${e(katAtlet(m).kod || '?')} · ${as.length} acara: ${as.sort((x, y) => x.susunan - y.susunan).map((a) => e(a.acara) + (a.kategori.endsWith('T') ? ' (T)' : '')).join(', ')}</span></span>
          ${cipRumah(m.rumah_sukan)}</button></li>`).join('')}</ul>` : '<div class="panel kosong-isi"><h3>Belum ada atlet berdaftar</h3><p>Guru rumah boleh mula mendaftar di tab Pendaftaran.</p></div>'}`;
    }

    function bukaProfil(id) {
      const m = S.data.murid.find((x) => x.id === id);
      if (!m) return;
      const ka = katAtlet(m), petaA = acaraId();
      const p = A().penyertaan.filter((x) => x.murid_id === id).map((x) => ({ x, a: petaA.get(x.acara_id) })).sort((u, v) => u.a.susunan - v.a.susunan);
      const sj = sejarahMurid(m);
      const dlg = $('#dlg');
      dlg.innerHTML = `<div class="dk"><div><h2>${e(m.nama)}</h2><p class="pudar kecil" style="margin:2px 0 0">${e(m.kelas)} · ${m.jantina === 'L' ? 'Lelaki' : m.jantina === 'P' ? 'Perempuan' : '?'} · ${cipRumah(m.rumah_sukan)}</p></div><button class="btn kosong kecil" data-act="tutup" aria-label="Tutup">${IKON.tutup}</button></div>
        <div class="db">
          <div class="stat-baris" style="margin-top:0"><div><b>${ka.kod ? e(LABEL_KAT[ka.kod]) : '—'}</b>kategori ${e(K().tahun)}</div><div><b>${ka.umur == null ? '—' : ka.umur}</b>umur (${e(ka.sumber)})</div><div><b>${bilAcara(id, petaA)}/${K().had_acara}</b>acara didaftar</div></div>
          <h3 style="margin:16px 0 6px">Acara ${e(K().tahun)}</h3>
          ${p.length ? `<ul class="kecil" style="margin:0;padding-left:18px">${p.map(({ a }) => `<li>${e(a.acara)} · ${e(a.kategori)}${a.jenis === 'gandaan' ? ' <span class="pudar">(gandaan)</span>' : ''}</li>`).join('')}</ul>` : '<p class="pudar kecil">Belum didaftarkan dalam mana-mana acara.</p>'}
          <h3 style="margin:16px 0 6px">Keputusan lalu</h3>
          ${sj.length ? `<div class="skrol-x"><table class="jadual"><thead><tr><th>Tahun</th><th>Peringkat</th><th>Acara</th><th class="n">Ked.</th><th class="n">Prestasi</th></tr></thead><tbody>
            ${sj.map((h) => `<tr><td>${e(h.tahun)}</td><td>${h.peringkat === 'MSSD' ? 'MSSD' : 'Sekolah'}</td><td>${e(h.kategori)} ${e(h.acara)}</td><td class="n">${lencanaPingat(h.kedudukan)}</td><td class="n">${e(h.prestasi)}${h.catatan ? ` <b class="kecil" style="color:var(--hijau)">${e(h.catatan)}</b>` : ''}</td></tr>`).join('')}</tbody></table></div>`
            : '<p class="pudar kecil">Tiada keputusan lalu (SMKUSR 2024, SMKUSR 2026, MSSD 2023) yang sepadan dengan nama murid ini.</p>'}
        </div><div class="dt"><button class="btn" data-act="tutup">Tutup</button></div>`;
      dlg.dataset.id = ''; dlg.dataset.ubah = '';
      if (!dlg.open) dlg.showModal();
    }

    /* ------------------------------------------------------------ REKOD */
    function pRekod(q) {
      let kk = q.get('kat') || 'P15';
      if (!KAT_A.includes(kk)) kk = 'P15';
      const acara = A().acara.filter((a) => a.kategori === kk).sort((a, b) => a.susunan - b.susunan);
      return `<div class="panel" style="margin-bottom:14px"><div class="cip-set">${KAT_A.map((x) => `<a class="cip ${x === kk ? 'pilih' : ''}" href="#/olahraga/rekod?kat=${x}">${e(LABEL_KAT[x])}</a>`).join('')}</div></div>
        <div class="panel skrol-x" style="padding:0"><table class="jadual"><thead><tr><th>Acara</th><th>Rekod sekolah (SMKUSR)</th><th>Rekod MSSD Ranau</th></tr></thead><tbody>
        ${acara.map((a) => `<tr><td><b>${e(a.acara)}</b></td><td>${teksRekod(rekodBagi(a, 'SEKOLAH'), a.unit)}</td><td>${teksRekod(rekodBagi(a, 'MSSD'), a.unit)}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="pudar kecil" style="margin-top:10px">Sumber: laporan penuh Kejohanan Olahraga MSS SMK Ulu Sugut ke-33 (2024) dan ke-34 (2026). Rekod ialah prestasi terbaik antara kedua-dua laporan, termasuk rekod baharu 2024 dan 2026. Rekod MSSD seperti tercatat dalam laporan yang sama.</p>`;
    }

    /* ------------------------------------------------------------ KEPUTUSAN LALU */
    function pSejarah(q) {
      const tahunPer = Array.from(new Set(A().sejarah.map((h) => h.tahun + '|' + h.peringkat))).sort().reverse();
      const pilih = q.get('t') || tahunPer[0] || '';
      const [tahun, per] = pilih.split('|');
      const cari = (q.get('q') || '').toUpperCase();
      const kat = q.get('kat') || '';
      let rows = A().sejarah.filter((h) => String(h.tahun) === tahun && h.peringkat === per && (!kat || h.kategori === kat) && (!cari || h.nama.includes(cari) || h.acara.includes(cari)));
      const kumpulan = new Map();
      rows.forEach((h) => { const kk = h.kategori + '|' + h.acara; if (!kumpulan.has(kk)) kumpulan.set(kk, []); kumpulan.get(kk).push(h); });
      const katAda = Array.from(new Set(A().sejarah.filter((h) => String(h.tahun) === tahun && h.peringkat === per).map((h) => h.kategori))).sort();
      const nama = new Set(aktif().map((m) => norm(m.nama)));
      return `<div class="panel" style="margin-bottom:14px"><form class="penapis" id="ais-cari" style="grid-template-columns:1.2fr 1fr 1.5fr">
          <select name="t" aria-label="Kejohanan">${tahunPer.map((x) => { const [t, p] = x.split('|'); return `<option value="${x}" ${x === pilih ? 'selected' : ''}>${p === 'MSSD' ? 'MSSD Ranau' : 'Sekolah (SMKUSR)'} ${t}</option>`; }).join('')}</select>
          <select name="kat" aria-label="Kategori"><option value="">Semua kategori</option>${katAda.map((x) => `<option value="${x}" ${x === kat ? 'selected' : ''}>${e(LABEL_KAT[x] || x)}</option>`).join('')}</select>
          <input class="cari" type="search" name="q" value="${e(q.get('q') || '')}" placeholder="Cari nama atau acara" aria-label="Cari"></form>
          ${per === 'MSSD' ? '<p class="pudar kecil" style="margin:8px 0 0">MSSD: hanya keputusan akhir atlet SMK Ulu Sugut.</p>' : ''}</div>
        ${Array.from(kumpulan.entries()).map(([kk, hs]) => { const [kt, ac] = kk.split('|'); return `<div class="panel" style="margin-bottom:12px"><h3>${e(LABEL_KAT[kt] || kt)} · ${e(ac)}</h3>
          <table class="jadual" style="margin-top:6px"><tbody>${hs.sort((x, y) => (x.kedudukan || 99) - (y.kedudukan || 99)).map((h) => `<tr><td style="width:44px">${lencanaPingat(h.kedudukan)}</td>
            <td><b>${e(h.nama)}</b>${nama.has(norm(h.nama)) ? ' <span class="lencana-demo" style="background:var(--hijau-latar);color:var(--hijau)">murid kini</span>' : ''}<br><span class="pudar kecil">${e(h.pasukan)}</span></td>
            <td class="n">${e(h.prestasi)}${h.catatan ? `<br><b class="kecil" style="color:var(--hijau)">${e(h.catatan)}</b>` : ''}</td></tr>`).join('')}</tbody></table></div>`; }).join('') || '<div class="panel kosong-isi">Tiada keputusan sepadan.</div>'}`;
    }

    /* ------------------------------------------------------------ RUMAH SUKAN (penyelaras) */
    function pRumah(q) {
      const rumah = senaraiRumah(), m = aktif().filter((x) => x.tingkatan !== 'PPKI');
      const ting = ['1', '2', '3', '4', '5'];
      const kira = (r, t, j) => m.filter((x) => (r === null ? !x.rumah_sukan : x.rumah_sukan === r) && (!t || x.tingkatan === t) && (!j || x.jantina === j)).length;
      const kelas = q.get('kelas') || '';
      const senaraiKelas = Array.from(new Set(m.map((x) => x.kelas))).sort((a, b) => a.localeCompare(b, 'ms', { numeric: true }));
      const muridKelas = kelas ? aktif().filter((x) => x.kelas === kelas).sort(susunMurid) : [];
      return `<div class="panel" style="margin-bottom:14px"><h2>Agihan semasa</h2>
          <div class="skrol-x"><table class="jadual"><thead><tr><th>Rumah</th>${ting.map((t) => `<th class="n">T${t} L</th><th class="n">T${t} P</th>`).join('')}<th class="n">Jumlah</th></tr></thead><tbody>
          ${rumah.concat([null]).map((r) => `<tr><td>${r ? cipRumah(r) : '<b>Belum ada rumah</b>'}</td>${ting.map((t) => `<td class="n">${kira(r, t, 'L')}</td><td class="n">${kira(r, t, 'P')}</td>`).join('')}<td class="n"><b>${kira(r)}</b></td></tr>`).join('')}
          </tbody></table></div>
          <div class="baris-btn" style="margin-top:12px"><button class="btn utama" data-act="ais-agih" ${kira(null) && rumah.length ? '' : 'disabled'}>Agih automatik ${kira(null)} murid tanpa rumah</button></div>
          <p class="pudar kecil">Agihan automatik mengimbangkan bilangan lelaki dan perempuan bagi setiap tingkatan antara ${rumah.length} rumah. Murid yang sudah ada rumah tidak diubah. Murid PPKI tidak termasuk.</p></div>
        <div class="panel"><h2>Tetapkan ikut kelas</h2>
          <form class="penapis" id="ais-kelas" style="grid-template-columns:1fr 1fr"><select name="kelas" aria-label="Kelas"><option value="">Pilih kelas</option>${senaraiKelas.map((x) => `<option ${x === kelas ? 'selected' : ''}>${e(x)}</option>`).join('')}</select>
            <select id="ais-rumah-pilih" aria-label="Rumah">${rumah.map((r) => `<option>${e(r)}</option>`).join('')}<option value="">(Kosongkan rumah)</option></select></form>
          ${kelas ? `<label class="cek kecil" style="margin:6px 0"><input type="checkbox" id="ais-semua-kelas"> Pilih semua</label>
            <ul class="senarai" id="ais-murid-kelas" style="max-height:46vh;overflow:auto">${muridKelas.map((x) => `<li><label class="cek" style="padding:8px 12px;justify-content:space-between;width:100%"><span><input type="checkbox" value="${e(x.id)}"> ${e(x.nama)} <span class="pudar kecil">${e(x.jantina || '?')}</span></span>${cipRumah(x.rumah_sukan)}</label></li>`).join('')}</ul>
            <div class="baris-btn" style="margin-top:10px"><button class="btn utama" data-act="ais-tetap-rumah">Tetapkan rumah untuk murid dipilih</button></div>` : '<p class="pudar kecil">Pilih kelas untuk melihat murid.</p>'}</div>`;
    }

    function rancangAgih() {
      const rumah = senaraiRumah(), m = aktif().filter((x) => x.tingkatan !== 'PPKI');
      const bil = new Map();
      const kunci = (r, t, j) => r + '|' + t + '|' + j;
      m.forEach((x) => { if (x.rumah_sukan) { const k = kunci(x.rumah_sukan, x.tingkatan, x.jantina); bil.set(k, (bil.get(k) || 0) + 1); } });
      const jumlah = new Map(rumah.map((r) => [r, m.filter((x) => x.rumah_sukan === r).length]));
      const rancang = new Map(rumah.map((r) => [r, []]));
      // susun ikut tingkatan, jantina, kelas, nama supaya kelas yang sama tersebar
      m.filter((x) => !x.rumah_sukan).sort((a, b) => a.tingkatan.localeCompare(b.tingkatan) || (a.jantina || '').localeCompare(b.jantina || '') || a.kelas.localeCompare(b.kelas) || a.nama.localeCompare(b.nama))
        .forEach((x) => {
          const r = rumah.slice().sort((p, q2) => (bil.get(kunci(p, x.tingkatan, x.jantina)) || 0) - (bil.get(kunci(q2, x.tingkatan, x.jantina)) || 0) || jumlah.get(p) - jumlah.get(q2))[0];
          rancang.get(r).push(x.id);
          bil.set(kunci(r, x.tingkatan, x.jantina), (bil.get(kunci(r, x.tingkatan, x.jantina)) || 0) + 1);
          jumlah.set(r, jumlah.get(r) + 1);
        });
      return rancang;
    }

    async function tetapRumah(ids, rumah, label) {
      const peta = muridPeta();
      await S.db.setRumahPukal(ids, rumah, (n, j) => roti(`${label}: ${n}/${j}…`));
      ids.forEach((id) => { const m = peta.get(id); if (m) m.rumah_sukan = rumah || null; });
    }

    /* ------------------------------------------------------------ TETAPAN (penyelaras) */
    function pTetapan() {
      const k = K(), T = k.tetapan || {}, ttd = (T.ttd && T.ttd.length === 2) ? T.ttd : [{ jawatan: 'Pengetua' }, { jawatan: 'Setiausaha Sukan' }];
      const guru = S.data.profiles.filter((p) => p.aktif && p.rumah_sukan);
      return `<div class="grid2"><div class="panel"><h2>Kejohanan</h2>
        <form class="borang" id="borang-ais">
          <label class="medan">Nama kejohanan<input type="text" name="nama" value="${e(k.nama)}" required></label>
          <div class="dua"><label class="medan">Tahun (untuk kiraan kategori umur)<input type="number" name="tahun" value="${e(k.tahun)}" min="2020" max="2100" required></label>
            <label class="medan">Tempat<input type="text" name="tempat" value="${e(k.tempat)}"></label></div>
          <div class="dua"><label class="medan">Tarikh mula<input type="date" name="tarikh_mula" value="${e(k.tarikh_mula || '')}"></label>
            <label class="medan">Tarikh tamat<input type="date" name="tarikh_tamat" value="${e(k.tarikh_tamat || '')}"></label></div>
          <div class="dua"><label class="medan">Had acara setiap atlet<input type="number" name="had_acara" value="${e(k.had_acara)}" min="1" max="20" required></label>
            <label class="medan">Kuota setiap rumah bagi setiap acara<input type="number" name="kuota" value="${e(k.kuota)}" min="1" max="20" required></label></div>
          <div class="dua"><label class="medan">Atlet setiap rumah bagi acara gandaan<input type="number" name="kuota_gandaan" value="${e(k.kuota_gandaan)}" min="4" max="12" required><span class="bantu">4 pelari + simpanan</span></label>
            <label class="medan">Acara gandaan<select name="kira_gandaan"><option value="0" ${!k.kira_gandaan ? 'selected' : ''}>Tidak dikira dalam had acara</option><option value="1" ${k.kira_gandaan ? 'selected' : ''}>Dikira dalam had acara</option></select></label></div>
          <label class="cek"><input type="checkbox" name="pendaftaran_dibuka" ${k.pendaftaran_dibuka ? 'checked' : ''}> Pendaftaran dibuka kepada guru rumah</label>
          ${A().fasaB ? `<h3 style="margin:14px 0 0">Perjalanan kejohanan</h3>
          <div class="dua"><label class="medan">Bilangan lorong balapan<input type="number" name="bil_lorong" value="${e(k.bil_lorong || 6)}" min="4" max="10" required><span class="bantu">Saringan diadakan jika peserta melebihi bilangan lorong.</span></label>
            <label class="medan">Kali ke- (untuk sijil dan laporan)<input type="text" name="kali_ke" value="${e(T.kali_ke || '')}" placeholder="35" inputmode="numeric"></label></div>
          <div class="medan"><span>Awalan nombor BIB setiap rumah</span><div class="grid-awalan">${senaraiRumah().map((r) => `<label>${cipRumah(r)}<input type="text" name="bib_${e(r)}" value="${e((T.bib_awalan || {})[r] || '')}" maxlength="3" placeholder="${e(r[0])}${senaraiRumah().indexOf(r) + 1}" autocapitalize="characters"></label>`).join('')}</div>
            <span class="bantu">Contoh awalan T1 memberi BIB T100, T101 dan seterusnya (corak 2026).</span></div>
          <div class="dua"><label class="medan">Tandatangan sijil 1: nama<input type="text" name="ttd1_nama" value="${e(ttd[0].nama || '')}"></label><label class="medan">Jawatan<input type="text" name="ttd1_jawatan" value="${e(ttd[0].jawatan || 'Pengetua')}"></label></div>
          <div class="dua"><label class="medan">Tandatangan sijil 2: nama<input type="text" name="ttd2_nama" value="${e(ttd[1].nama || '')}"></label><label class="medan">Jawatan<input type="text" name="ttd2_jawatan" value="${e(ttd[1].jawatan || 'Setiausaha Sukan')}"></label></div>` : ''}
          <button class="btn utama" type="submit">Simpan tetapan kejohanan</button>
        </form></div>
        <div class="panel"><h2>Guru rumah sukan</h2>
          <p class="pudar kecil">Guru rumah boleh mendaftar atlet bagi rumah masing-masing. Tetapkan di Tetapan, Akaun guru, Ubah.</p>
          ${senaraiRumah().map((r) => `<p style="margin:8px 0">${cipRumah(r)} ${guru.filter((p) => p.rumah_sukan === r).map((p) => e(p.nama)).join(', ') || '<span class="pudar kecil">belum ditetapkan</span>'}</p>`).join('')}
          <p class="pudar kecil" style="margin-top:14px">Pencatat keputusan: ${S.data.profiles.filter((p) => p.aktif && p.ais_pencatat).map((p) => e(p.nama)).join(', ') || 'belum ditetapkan (penyelaras sentiasa boleh mencatat)'}.</p>
          <a class="btn" href="#/tetapan/akaun">Akaun guru</a>
          ${A().fasaB ? `<h2 style="margin-top:22px">Selepas kejohanan</h2>
          <p class="pudar kecil">Pindahkan keputusan akhir yang disahkan ke tab Keputusan lalu supaya prestasi atlet boleh dirujuk tahun depan.</p>
          <button class="btn" data-act="ais-arkib">Pindah keputusan ${e(k.tahun)} ke Keputusan lalu</button>
          <form class="borang" id="borang-ais-baharu" style="margin-top:16px"><b class="kecil">Buka kejohanan tahun baharu</b>
            <div class="dua"><label class="medan">Nama<input type="text" name="nama" value="${e(k.nama)}" required></label><label class="medan">Tahun<input type="number" name="tahun" value="${e(k.tahun + 1)}" min="2020" max="2100" required></label></div>
            <button class="btn" type="submit">Buka kejohanan baharu</button>
            <span class="bantu">Jadual dan senarai acara disalin. Kejohanan ${e(k.tahun)} kekal tersimpan tetapi tidak aktif.</span></form>` : ''}</div></div>`;
    }

    /* ------------------------------------------------------------ eksport */
    function eksportPenyertaan(r) {
      const peta = muridPeta(), petaA = acaraId(), k = K();
      const rows = A().penyertaan.filter((p) => !r || p.rumah === r).map((p) => ({ p, a: petaA.get(p.acara_id), m: peta.get(p.murid_id) }))
        .filter((x) => x.a && x.m).sort((x, y) => x.a.susunan - y.a.susunan || x.p.rumah.localeCompare(y.p.rumah) || x.m.nama.localeCompare(y.m.nama));
      const ikutAcara = [['BIL', 'KATEGORI', 'ACARA', 'RUMAH', 'NAMA', 'KELAS', 'JANTINA', 'NO MYKAD', 'TAHUN LAHIR']]
        .concat(rows.map((x, i) => [i + 1, x.a.kategori, x.a.acara, x.p.rumah, x.m.nama, x.m.kelas, x.m.jantina || '', x.m.mykad || '', tahunLahir(x.m) || '']));
      const atlet = new Map();
      rows.forEach((x) => { if (!atlet.has(x.m.id)) atlet.set(x.m.id, { m: x.m, r: x.p.rumah, as: [] }); atlet.get(x.m.id).as.push(x.a); });
      const ikutAtlet = [['BIL', 'RUMAH', 'NAMA', 'KELAS', 'KATEGORI', 'BIL ACARA', 'ACARA']].concat(Array.from(atlet.values())
        .sort((x, y) => x.r.localeCompare(y.r) || x.m.nama.localeCompare(y.m.nama))
        .map((x, i) => [i + 1, x.r, x.m.nama, x.m.kelas, katAtlet(x.m).kod || '', x.as.filter(dikira).length, x.as.map((a) => a.acara + (a.kategori.endsWith('T') ? ' (T)' : '')).join(', ')]));
      const tajuk = [[`${k.nama} ${k.tahun}`], [`Senarai penyertaan ${r ? 'rumah ' + r : 'semua rumah'} · dimuat turun ${hariIni()}`], []];
      return eksport(`PENYERTAAN-OLAHRAGA-${r || 'SEMUA'}-${k.tahun}.xlsx`, [['Ikut acara', tajuk.concat(ikutAcara)], ['Ikut atlet', tajuk.concat(ikutAtlet)]])
        .then((ok) => { if (ok) roti('Fail Excel disediakan'); });
    }

    /* ------------------------------------------------------------ tindakan (klik) */
    async function tindakan(act, el) {
      const dlg = $('#dlg');
      switch (act) {
        case 'ais-muat': S.ais = null; await muat(true); roti('Data olahraga dimuat semula'); S.kekalSkrol = true; render(); return true;
        case 'ais-pilih': bukaPilih(+el.dataset.acara); return true;
        case 'ais-daftar': await daftar(el.dataset.murid, el); return true;
        case 'ais-batal': {
          const p = A().penyertaan.find((x) => x.id === el.dataset.id), m = S.data.murid.find((x) => x.id === p.murid_id), a = A().acara.find((x) => x.id === p.acara_id);
          if (!(await sahkan(`Batalkan ${m ? m.nama : 'atlet'} daripada ${a.acara} ${a.kategori}?`, { ok: 'Batalkan', bahaya: true }))) return true;
          await S.db.aisBatal(p.id);
          A().penyertaan = A().penyertaan.filter((x) => x.id !== p.id);
          roti('Penyertaan dibatalkan'); S.kekalSkrol = true; render(); return true;
        }
        case 'ais-profil': bukaProfil(el.dataset.id); return true;
        case 'ais-eksport': await eksportPenyertaan(el.dataset.rumah || ''); return true;
        case 'ais-agih': {
          const rancang = rancangAgih();
          const ringkas = Array.from(rancang.entries()).map(([r, ids]) => `${r}: ${ids.length}`).join('\n');
          if (!(await sahkan(`Agihkan murid tanpa rumah seperti berikut?\n\n${ringkas}`, { ok: 'Agihkan' }))) return true;
          for (const [r, ids] of rancang) if (ids.length) await tetapRumah(ids, r, r);
          roti('Rumah sukan diagihkan'); S.kekalSkrol = true; render(); return true;
        }
        case 'ais-tetap-rumah': {
          const ids = $$('#ais-murid-kelas input:checked').map((x) => x.value), r = $('#ais-rumah-pilih').value;
          if (!ids.length) { roti('Pilih sekurang-kurangnya seorang murid.', true); return true; }
          const ada = A().penyertaan.filter((p) => ids.includes(p.murid_id) && p.rumah !== r).length;
          if (ada && !(await sahkan(`${ada} penyertaan olahraga murid ini didaftarkan di bawah rumah lama. Penyertaan itu kekal di bawah rumah lama sehingga dibatalkan. Teruskan?`))) return true;
          await tetapRumah(ids, r, r || 'Kosongkan');
          roti(`${ids.length} murid ditetapkan ke ${r || '(tiada rumah)'}`); S.kekalSkrol = true; render(); return true;
        }
        default: return B.tindakan(act, el);
      }
    }

    /* ------------------------------------------------------------ input / borang */
    function ubah(ev) {
      const t = ev.target;
      if (t.closest('#ais-cari')) {
        const f = t.closest('form'), d = new FormData(f);
        const qs = new URLSearchParams({ t: d.get('t') || '', kat: d.get('kat') || '', q: d.get('q') || '' });
        if (t.name === 't') qs.set('kat', '');
        tetapLokasi('#/olahraga/sejarah?' + qs.toString()); S.kekalSkrol = true;
        clearTimeout(S.aisTimer); S.aisTimer = setTimeout(() => { render(); const c = $('#ais-cari [name=q]'); if (c && t.name === 'q') { c.focus(); c.setSelectionRange(c.value.length, c.value.length); } }, t.name === 'q' ? 300 : 0);
        return true;
      }
      if (t.closest('#ais-kelas') && t.name === 'kelas') { tetapLokasi('#/olahraga/rumah?kelas=' + encodeURIComponent(t.value)); S.kekalSkrol = true; render(); return true; }
      if (t.id === 'ais-semua-kelas') { $$('#ais-murid-kelas input').forEach((x) => { x.checked = t.checked; }); return true; }
      return B.ubah(ev);
    }
    async function hantar(f) {
      if (f.id !== 'borang-ais') return B.hantar(f);
      const fd = new FormData(f), d = Object.fromEntries(fd);
      const awalan = {}, salahAwalan = [];
      senaraiRumah().forEach((r) => { const v = String(d['bib_' + r] || '').trim().toUpperCase(); if (v) { if (!/^[A-Z0-9]{1,3}$/.test(v)) salahAwalan.push(r); awalan[r] = v; } });
      if (salahAwalan.length) { roti(`Awalan BIB hanya huruf/nombor (maksimum 3): ${salahAwalan.join(', ')}`, true); return true; }
      if (new Set(Object.values(awalan)).size !== Object.values(awalan).length) { roti('Awalan BIB setiap rumah mesti berbeza.', true); return true; }
      const tetapanK = { ...(K().tetapan || {}), bib_awalan: awalan, kali_ke: (d.kali_ke || '').trim() || null,
        ttd: [{ nama: (d.ttd1_nama || '').trim().toUpperCase(), jawatan: (d.ttd1_jawatan || '').trim() || 'Pengetua' }, { nama: (d.ttd2_nama || '').trim().toUpperCase(), jawatan: (d.ttd2_jawatan || '').trim() || 'Setiausaha Sukan' }] };
      const k = await S.db.aisSimpanKejohanan({
        id: K().id, nama: d.nama.trim().toUpperCase(), tahun: +d.tahun, tempat: (d.tempat || '').trim().toUpperCase() || null,
        tarikh_mula: d.tarikh_mula || null, tarikh_tamat: d.tarikh_tamat || null, had_acara: +d.had_acara, kuota: +d.kuota,
        kuota_gandaan: +d.kuota_gandaan, kira_gandaan: d.kira_gandaan === '1', pendaftaran_dibuka: !!d.pendaftaran_dibuka,
        ...(A().fasaB ? { bil_lorong: +d.bil_lorong || 6, tetapan: tetapanK } : {}),
      });
      Object.assign(K(), k);
      const i = A().kejohanan.findIndex((x) => x.id === k.id); if (i >= 0) A().kejohanan[i] = K();
      roti('Tetapan kejohanan disimpan'); render();
      return true;
    }

    B = window.KokumAISB(ctx, { A, K, senaraiRumah, cipRumah, idxRumah, katAtlet, LABEL_KAT, muridPeta, acaraId, rekodBagi, lencanaPingat, muat, tarikhPendek });
    return { papar, muat, tindakan, ubah, hantar, katAtlet, bantu: () => B };
  };
})();

</script>
<script>
/* KOKUM SMART · AIS Olahraga (Fasa B): perjalanan kejohanan.
   Jadual acara, nombor BIB, senarai mula automatik (saringan/akhir, lorong, giliran), catat keputusan dari telefon
   (kedudukan, Q/q, RB automatik), pengesahan keputusan, kutipan pingat, olahragawan/olahragawati dan semua dokumen
   cetak: senarai mula, borang hakim, keputusan, laporan penuh, sijil, kad BIB, senarai atlet dan calon MSSD. */
(function () {
  'use strict';

  const KUMP = [['P15', 'Perempuan 15'], ['L15', 'Lelaki 15'], ['P18', 'Perempuan 18'], ['L18', 'Lelaki 18'], ['T', 'Terbuka']];
  const TEMPAT = { 1: 'JOHAN', 2: 'NAIB JOHAN', 3: 'TEMPAT KETIGA' };
  const STATUS = ['DNS', 'DNF', 'DQ', 'NM'];
  const LABEL_STATUS = { DNS: 'DNS (tidak hadir)', DNF: 'DNF (tidak tamat)', DQ: 'DQ (dibatalkan)', NM: 'NM (tiada ukuran)' };

  window.KokumAISB = function (ctx, h) {

    function lorongTengah(L) {

    // rekod sekolah yang dipecahkan (rekod terbaik sebelum kejohanan ini)

    function rekodSekolah(a) {

      if (!rs.length) return null;

    const rekodTeks = (a, per) => { const r = rekodBagi(a, per).filter((x) => x.acara_id !== a.id)[0] || rekodBagi(a, per)[0]; return r ? `${denganUnit(a, r.prestasi)} · ${r.nama} (${r.pasukan || ''}, ${r.tahun || ''})` : '—'; };

    /* ------------------------------------------------------------ baca input prestasi */

      if (!a) return '<div class="panel kosong-isi">Acara tidak dijumpai. <a href="#/olahraga/jadual">Kembali ke jadual</a></div>';
      const sar = kepAcara(a.id, 'saringan'), ak = kepAcara(a.id, 'akhir'), boleh = pencatat() && !a.rasmi;
      const n = bilPeserta(a), perlu = perluSaringan(a);
      const btn = [];
      if (boleh) {
        if (!sar.length && !ak.length) btn.push(`<button class="btn utama" data-act="ais-jana-mula" data-acara="${a.id}" ${n ? '' : 'disabled'}>Jana senarai mula${perlu ? ' (saringan)' : ''}</button>`);
        else if (!adaHasil(sar) && !adaHasil(ak)) btn.push(`<button class="btn" data-act="ais-jana-mula" data-acara="${a.id}">Jana semula senarai mula</button>`);
