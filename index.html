    --hijau: #5fb08c; --hijau-tekan: #4c9877; --hijau-latar: #1c3329;
    --ub: #b7c47f; --ub-latar: #2a311a; --ub-pudar: #6d7744;
    --kp: #8db8e2; --kp-latar: #1a2c3e; --kp-pudar: #4f7396;
    --sp: #e3be5e; --sp-latar: #3a2f12; --sp-pudar: #9a7a2a;
    --bahaya: #f08a80; --bahaya-latar: #3a1c19; --amaran: #f0c060; --amaran-latar: #352a12;
    --bayang: none; color-scheme: dark;
  --atas-hijau: #0c1a13;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--fon); font-size: 15px; line-height: 1.5; color: var(--dakwat); background: var(--kertas);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--hijau); }
h1, h2, h3 { line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -.01em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .75rem; }
.kecil { font-size: .85rem; }
.pudar { color: var(--kabus); }
.tersembunyi { display: none !important; }
:focus-visible { outline: 3px solid var(--hijau); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Rangka ---------- */
.rangka { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.rel {
  position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--garis);
  background: var(--permukaan); display: flex; flex-direction: column; gap: 4px;
}
.jenama { display: flex; gap: 10px; align-items: center; padding: 0 8px 18px; }
.jenama img { width: 36px; height: 36px; border-radius: 9px; }
.jenama b { display: block; font-size: 1rem; }
.jenama span { font-size: .78rem; color: var(--kabus); }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none;
  color: var(--dakwat); font-weight: 500;
}
.nav a svg { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; }
.nav a:hover { background: var(--kertas); }
.nav a[aria-current="page"] { background: var(--hijau-latar); color: var(--hijau); font-weight: 700; }
.rel .bawah { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--garis); font-size: .85rem; }
.isi { padding: 28px clamp(16px, 4vw, 44px) 80px; max-width: 1180px; width: 100%; min-width: 0; }
.atas-mudah { display: none; }

@media (max-width: 860px) {
  .rangka { grid-template-columns: minmax(0, 1fr); }
  .rel { display: none; }
  .atas-mudah {
    display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding: 10px 16px;
    background: var(--permukaan); border-bottom: 1px solid var(--garis);
  }
  .atas-mudah img { width: 30px; height: 30px; border-radius: 8px; }
  .atas-mudah b { font-size: .98rem; }
  .isi { padding: 18px 16px 96px; }
  .nav-bawah {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--permukaan); border-top: 1px solid var(--garis); padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .nav-bawah a { flex-direction: column; gap: 2px; padding: 6px 2px; font-size: .7rem; justify-content: center; text-align: center; }
  .nav-bawah a svg { width: 22px; height: 22px; }
}
@media (min-width: 861px) { .nav-bawah { display: none; } }

/* ---------- Komponen asas ---------- */
.kepala { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.kepala p { margin: 4px 0 0; color: var(--kabus); }
.panel { background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--jejari); padding: 18px; box-shadow: var(--bayang); }
.panel + .panel, .bahagian + .bahagian { margin-top: 18px; }
.panel > h2 { margin-bottom: 12px; }
.grid2 > .panel { margin-top: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px;
  border-radius: 8px; border: 1px solid var(--garis-kuat); background: var(--permukaan); cursor: pointer; font-weight: 600;
  text-decoration: none; color: var(--dakwat); white-space: nowrap;
}
.btn:hover { background: var(--kertas); }
.btn.utama { background: var(--hijau); border-color: var(--hijau); color: var(--atas-hijau); }
.btn.utama:hover { background: var(--hijau-tekan); }
.btn.bahaya { color: var(--bahaya); border-color: var(--bahaya); }
.btn.kosong { border-color: transparent; background: transparent; }
.btn.kecil { min-height: 32px; padding: 4px 10px; font-size: .85rem; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.baris-btn { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

label.medan { display: grid; gap: 4px; font-size: .85rem; font-weight: 600; }
label.medan span.bantu { font-weight: 400; color: var(--kabus); font-size: .8rem; }
input[type="text"], input[type="email"], input[type="password"], input[type="search"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; min-height: 42px; padding: 8px 11px; border: 1px solid var(--garis-kuat); border-radius: 8px;
  background: var(--permukaan); font-size: .95rem; font-weight: 400;
}
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--hijau); outline-offset: -1px; border-color: var(--hijau); }
.borang { display: grid; gap: 14px; }
.borang .dua { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
label.medan { align-content: start; }
@media (max-width: 520px) { .borang .dua { grid-template-columns: 1fr; } }
.cek { display: flex; gap: 8px; align-items: center; font-size: .9rem; cursor: pointer; }
.cek input { width: 18px; height: 18px; accent-color: var(--hijau); }

.mesej { padding: 10px 14px; border-radius: 8px; font-size: .9rem; margin-bottom: 12px; }
.mesej.ralat { background: var(--bahaya-latar); color: var(--bahaya); }
.mesej.amaran { background: var(--amaran-latar); color: var(--amaran); }
.mesej.ok { background: var(--hijau-latar); color: var(--hijau); }

/* ---------- Lencana kategori: tanda khas aplikasi ---------- */
.lencana-set { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.lencana {
  display: inline-flex; align-items: center; gap: 4px; min-width: 48px; justify-content: center; height: 24px; padding: 0 8px;
  border-radius: 6px; font-size: .74rem; font-weight: 700; letter-spacing: .02em; border: 1.5px solid transparent;
}
.lencana.UB { background: var(--ub-latar); color: var(--ub); border-color: var(--ub-pudar); }
.lencana.KP { background: var(--kp-latar); color: var(--kp); border-color: var(--kp-pudar); }
.lencana.SP { background: var(--sp-latar); color: var(--sp); border-color: var(--sp-pudar); }
.lencana.kosong { background: transparent; border: 1.5px dashed var(--garis-kuat); color: var(--kabus); font-weight: 500; }
.lencana .j { font-weight: 500; opacity: .85; }
.tag-kat { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: .72rem; font-weight: 700; }
.tag-kat.UB { background: var(--ub); color: var(--permukaan); }
.tag-kat.KP { background: var(--kp); color: var(--permukaan); }
.tag-kat.SP { background: var(--sp); color: var(--permukaan); }

/* ---------- Dashboard ---------- */
.ringkas { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
.ringkas .kotak { background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--jejari); padding: 14px 16px; }
.ringkas .kotak b { display: block; font-size: 1.7rem; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; }
.ringkas .kotak span { font-size: .85rem; color: var(--kabus); }
.ringkas .kotak.isyarat b { color: var(--amaran); }
a.kotak, button.kotak { text-decoration: none; color: inherit; text-align: left; font: inherit; cursor: pointer; }
a.kotak:hover, button.kotak:hover { border-color: var(--garis-kuat); }

.kategori { margin-top: 26px; }
.kategori-kepala { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  border-bottom: 3px solid var(--warna); padding-bottom: 8px; margin-bottom: 6px; }
.kategori-kepala h2 { color: var(--warna); }
.kategori.UB { --warna: var(--ub); --pudar: var(--ub-pudar); --latar: var(--ub-latar); }
.kategori.KP { --warna: var(--kp); --pudar: var(--kp-pudar); --latar: var(--kp-latar); }
.kategori.SP { --warna: var(--sp); --pudar: var(--sp-pudar); --latar: var(--sp-latar); }
.petunjuk { display: flex; gap: 14px; font-size: .8rem; color: var(--kabus); align-items: center; flex-wrap: wrap; }
.petunjuk i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.petunjuk i.L { background: var(--warna); }
.petunjuk i.P { background: var(--pudar); }
.petunjuk i.garis-p { width: 2px; height: 14px; border-radius: 0; background: var(--dakwat); }

.palang {
  display: grid; grid-template-columns: 58px 1fr 92px; gap: 10px; align-items: center; padding: 7px 4px; border-radius: 6px;
  text-decoration: none; color: inherit;
}
.palang:hover { background: var(--latar); }
.palang .kod { font-weight: 800; font-size: .85rem; color: var(--warna); }
.palang .trek { position: relative; height: 18px; background: var(--kertas); border-radius: 4px; }
.palang .isi-L, .palang .isi-P { position: absolute; top: 0; bottom: 0; }
.palang .isi-L { left: 0; background: var(--warna); border-radius: 4px 0 0 4px; }
.palang .isi-P { background: var(--pudar); }
.palang .purata { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--dakwat); opacity: .6; }
.palang .had { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--bahaya); }
.palang .angka { text-align: right; font-size: .85rem; }
.palang .angka b { font-size: .98rem; }
.palang .angka small { color: var(--kabus); }
.palang.lebih .angka b { color: var(--bahaya); }

.semakan a { display: flex; justify-content: space-between; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--garis);
  text-decoration: none; color: inherit; }
.semakan a:last-child { border-bottom: 0; }
.semakan a:hover { color: var(--hijau); }
.semakan b.ada { color: var(--amaran); }
.semakan b.sifar { color: var(--hijau); }

table { border-collapse: collapse; width: 100%; }
.jadual th, .jadual td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--garis); vertical-align: middle; }
.jadual th { font-size: .78rem; color: var(--kabus); font-weight: 600; background: var(--kertas); position: sticky; top: 0; }
.jadual td.n, .jadual th.n { text-align: right; }
.jadual tr:hover td { background: color-mix(in srgb, var(--kertas) 60%, transparent); }
.skrol-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* ---------- Senarai murid ---------- */
.penapis { display: grid; grid-template-columns: 2fr repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
@media (max-width: 860px) { .penapis { grid-template-columns: 1fr 1fr; } .penapis .cari { grid-column: 1 / -1; } }
.kiraan { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0 10px; font-size: .88rem; color: var(--kabus); flex-wrap: wrap; }
.senarai { list-style: none; margin: 0; padding: 0; background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--jejari); }
.senarai li + li { border-top: 1px solid var(--garis); }
.senarai button.baris {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; width: 100%; text-align: left; padding: 11px 14px;
  background: none; border: 0; cursor: pointer; align-items: center;
}
.senarai button.baris:hover { background: var(--kertas); }
.senarai .nama { font-weight: 600; }
.senarai .meta { font-size: .82rem; color: var(--kabus); }
.senarai .keluar .nama { text-decoration: line-through; color: var(--kabus); }
@media (max-width: 600px) { .senarai button.baris { grid-template-columns: 1fr; } }
.kosong-isi { padding: 36px 16px; text-align: center; color: var(--kabus); }
.kosong-isi h3 { color: var(--dakwat); margin-bottom: 6px; }

/* ---------- Unit ---------- */
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 10px; }
.kad-unit {
  display: block; padding: 13px 14px; border-radius: var(--jejari); border: 1px solid var(--garis); background: var(--permukaan);
  text-decoration: none; color: inherit; border-left: 5px solid var(--warna);
}
.kad-unit:hover { border-color: var(--garis-kuat); border-left-color: var(--warna); }
.kad-unit .atas { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.kad-unit .atas b { color: var(--warna); font-size: .95rem; }
.kad-unit .atas span { font-weight: 800; font-size: 1.2rem; }
.kad-unit .nama-penuh { font-size: .85rem; margin: 2px 0 6px; }
.kad-unit .bawah { font-size: .78rem; color: var(--kabus); display: flex; justify-content: space-between; gap: 6px; }
.kad-unit .saya { color: var(--hijau); font-weight: 700; }
.unit-kepala { border-left: 6px solid var(--warna); padding-left: 14px; }
.unit-kepala .kod-besar { font-size: 2.2rem; font-weight: 800; color: var(--warna); line-height: 1; letter-spacing: -.02em; }
.stat-baris { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; font-size: .9rem; }
.stat-baris b { font-size: 1.25rem; display: block; }
input.jawatan { min-height: 34px; padding: 4px 8px; font-size: .85rem; max-width: 210px; }

/* ---------- Dialog ---------- */
dialog {
  border: 0; padding: 0; border-radius: 14px; width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 32px);
  background: var(--permukaan); color: var(--dakwat); box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
}
dialog::backdrop { background: rgba(16, 24, 20, .45); }
dialog .dk { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 18px 20px 12px; border-bottom: 1px solid var(--garis); position: sticky; top: 0; background: var(--permukaan); z-index: 1; }
dialog .db { padding: 16px 20px 20px; }
dialog .dt { padding: 12px 20px; border-top: 1px solid var(--garis); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--permukaan); }
@media (max-width: 600px) {
  dialog { width: 100vw; max-width: 100vw; max-height: 92vh; margin: auto 0 0; border-radius: 16px 16px 0 0; }
}
.slot { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--garis); }
.slot:last-child { border-bottom: 0; }
@media (max-width: 520px) { .slot { grid-template-columns: 52px 1fr; } .slot .jaw { grid-column: 2; } }
.meter { height: 8px; background: var(--kertas); border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
.meter > div { height: 100%; background: var(--hijau); }
.isu { list-style: none; padding: 0; margin: 8px 0 0; font-size: .85rem; }
.isu li { padding: 3px 0; color: var(--amaran); }
.isu li::before { content: "! "; font-weight: 800; }

/* ---------- Log masuk ---------- */
.skrin-masuk { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: linear-gradient(180deg, var(--hijau-latar), var(--kertas) 55%); }
.kad-masuk { width: min(420px, 100%); }
.kad-masuk .jenama { padding: 0 0 18px; }
.kad-masuk .jenama img { width: 48px; height: 48px; border-radius: 12px; }
.kad-masuk .jenama b { font-size: 1.3rem; }
.tukar { text-align: center; margin-top: 14px; font-size: .9rem; }
.tukar button { background: none; border: 0; color: var(--hijau); font-weight: 600; cursor: pointer; padding: 4px; }

/* ---------- Tab ---------- */
.tab { display: flex; gap: 4px; border-bottom: 1px solid var(--garis); margin-bottom: 16px; overflow-x: auto; }
.tab a { padding: 10px 14px; text-decoration: none; color: var(--kabus); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab a[aria-current="page"] { color: var(--hijau); border-bottom-color: var(--hijau); }
.cip-set { display: flex; flex-wrap: wrap; gap: 6px; }
.cip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--garis-kuat); font-size: .8rem; cursor: pointer; background: var(--permukaan); }
.cip input { display: none; }
.cip:has(input:checked) { background: var(--hijau); border-color: var(--hijau); color: var(--atas-hijau); }

.roti { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 100; background: var(--dakwat); color: var(--kertas);
  padding: 10px 18px; border-radius: 8px; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
.roti.ralat { background: var(--bahaya); color: var(--kertas); }
.pemuat { display: grid; place-items: center; min-height: 50vh; color: var(--kabus); }
.kemajuan { height: 10px; background: var(--kertas); border-radius: 5px; overflow: hidden; border: 1px solid var(--garis); }
.kemajuan > div { height: 100%; background: var(--hijau); transition: width .2s; }
.lencana-demo { display: inline-block; background: var(--amaran-latar); color: var(--amaran); font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 5px; }

/* ---------- Cetak ---------- */
.kertas-cetak { background: #fff; color: #000; padding: 24px; border: 1px solid var(--garis); border-radius: 8px; overflow-x: auto; }
@media (max-width: 600px) { .kertas-cetak { padding: 14px; } .kertas-cetak table { font-size: 8.5pt; } }
.kertas-cetak .halaman + .halaman { margin-top: 40px; padding-top: 30px; border-top: 2px dashed #ccc; }
.kertas-cetak h3 { text-align: center; font-size: 13pt; }
.kertas-cetak .sub { text-align: center; font-size: 10pt; margin: 2px 0; }
.kertas-cetak .info { display: flex; justify-content: space-between; font-size: 10pt; margin: 12px 0 6px; flex-wrap: wrap; gap: 6px; }
.kertas-cetak table { font-size: 9.5pt; }
.kertas-cetak th, .kertas-cetak td { border: 1px solid #555; padding: 4px 6px; text-align: left; }
.kertas-cetak th { background: #eee; }
.kertas-cetak .tandatangan { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 36px; font-size: 10pt; }
.kertas-cetak .tandatangan div { border-top: 1px solid #000; padding-top: 4px; margin-top: 36px; }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; }
  .rel, .atas-mudah, .nav-bawah, .tanpa-cetak, .roti { display: none !important; }
  .rangka { display: block; }
  .isi { padding: 0; max-width: none; }
  .kertas-cetak { border: 0; padding: 0; overflow: visible; }
  .kertas-cetak .halaman + .halaman { border-top: 0; margin-top: 0; padding-top: 0; break-before: page; }
  .kertas-cetak tr { break-inside: avoid; }
}

</style>

      }
      for (const [kunci, uji] of TAJUK) {
        if (peta[kunci] == null && uji(t)) {
          peta[kunci] = i;
          kategoriAkhir = ['ub', 'kp', 'sp'].includes(kunci) ? kunci : null;
          return;
        }
      }
      kategoriAkhir = null;
    });
    return peta;
  }

  function normalMykad(v) {
    let s = bersih(v).replace(/[\s-]/g, '').toUpperCase();
    if (/^\d+(\.0+)?$/.test(s)) s = s.replace(/\.0+$/, '');
    if (/^\d{11}$/.test(s)) s = '0' + s; // sifar di hadapan hilang apabila Excel simpan sebagai nombor
    return s;
  }

  const mykadSah = (s) => /^\d{12}$/.test(s || '') && tarikhLahir(s) != null;

  function tarikhLahir(s) {
    if (!/^\d{12}$/.test(s || '')) return null;
    const bb = +s.slice(2, 4), hh = +s.slice(4, 6);
    if (bb < 1 || bb > 12 || hh < 1 || hh > 31) return null;
    return s.slice(0, 6);
  }

  const jantinaMykad = (s) => (/^\d{12}$/.test(s || '') ? (+s[11] % 2 ? 'L' : 'P') : null);

  function normalJantina(v) {
    const t = besar(v);
    if (t === 'L' || t.startsWith('LELAKI') || t === 'M') return 'L';
    if (t === 'P' || t.startsWith('PEREMPUAN') || t === 'F') return 'P';
    return '';
  }

  function normalTingkatan(t, kelas) {
    const a = besar(t), k = besar(kelas);
    if (a === 'X' || a.includes('PPKI') || k.startsWith('PPKI')) return 'PPKI';
    const m = (a.match(/[1-5]/) || k.match(/^[1-5]/) || [])[0];
    return m || '';
  }

  const normalKod = (v) => {
    const t = besar(v);
    return t === 'X' || t === '0' || t === '-' ? '' : t;
  };

  /**
   * rows: tatasusunan 2D (sheet_to_json header:1).
   * units: [{kod, kategori, jantina}] untuk semakan.
   */
  function bacaDaftar(rows, units) {
    const iT = cariTajuk(rows);
    if (iT < 0) throw new Error('Tajuk lajur "BIL" dan "NAMA" tidak dijumpai. Pastikan helaian ialah DAFTAR KOKUM.');
    const p = petaLajur(rows[iT]);
    if (p.nama == null) throw new Error('Lajur nama murid tidak dijumpai.');
    const unitPeta = new Map((units || []).map((u) => [u.kod, u]));
    const ambil = (r, k) => (p[k] == null ? '' : r[p[k]]);
    const murid = [];
    const amaran = [];

    for (let i = iT + 1; i < rows.length; i++) {
      const r = rows[i] || [];
      const nama = besar(ambil(r, 'nama'));
      if (!nama || nama === '0') continue;
      const bilMentah = bersih(ambil(r, 'bil'));
      if (p.bil != null && !/^\d+$/.test(bilMentah)) continue;
      const kelas = besar(ambil(r, 'kelas'));
      const rec = {
        baris: i + 1,
        bil_asal: bilMentah ? +bilMentah : null,
        nama,
        tingkatan: normalTingkatan(ambil(r, 'tingkatan'), kelas),
        kelas,
        mykad: normalMykad(ambil(r, 'mykad')),
        jantina: normalJantina(ambil(r, 'jantina')),
        rumah_sukan: besar(ambil(r, 'rumah_sukan')),
        status: besar(ambil(r, 'keluar')) ? 'keluar' : 'aktif',
        ub: normalKod(ambil(r, 'ub')), ub_jawatan: besar(ambil(r, 'ub_jawatan')),
        kp: normalKod(ambil(r, 'kp')), kp_jawatan: besar(ambil(r, 'kp_jawatan')),
        sp: normalKod(ambil(r, 'sp')), sp_jawatan: besar(ambil(r, 'sp_jawatan')),
      };
      const isu = semakMurid(rec, unitPeta);
      if (!rec.tingkatan) isu.unshift({ tahap: 'ralat', mesej: 'Tingkatan tidak dikenali' });
      if (!rec.kelas) isu.unshift({ tahap: 'ralat', mesej: 'Kelas kosong' });
      isu.forEach((x) => amaran.push({ baris: rec.baris, nama, ...x }));
      murid.push(rec);
    }

    // rekod berganda dalam fail
    const ikutKad = new Map(), ikutNama = new Map();
    murid.forEach((m) => {
      if (m.mykad) {
        if (ikutKad.has(m.mykad)) amaran.push({ baris: m.baris, nama: m.nama, tahap: 'ralat', mesej: `No. MyKad sama dengan baris ${ikutKad.get(m.mykad)}` });
        else ikutKad.set(m.mykad, m.baris);
      }
      if (ikutNama.has(m.nama)) amaran.push({ baris: m.baris, nama: m.nama, tahap: 'amaran', mesej: `Nama sama dengan baris ${ikutNama.get(m.nama)}` });
      else ikutNama.set(m.nama, m.baris);
    });

    const boleh = murid.filter((m) => m.tingkatan && m.kelas);
    return {
      lajur: p,
      murid: boleh,
      ditolak: murid.length - boleh.length,
      amaran: amaran.sort((a, b) => a.baris - b.baris),
    };
  }

  function semakMurid(m, unitPeta) {
    const isu = [];
    if (!m.mykad) isu.push({ tahap: 'amaran', mesej: 'Tiada No. MyKad' });
    else if (!mykadSah(m.mykad)) isu.push({ tahap: 'amaran', mesej: `No. MyKad tidak sah (${m.mykad})` });
    else if (m.jantina && jantinaMykad(m.mykad) !== m.jantina) isu.push({ tahap: 'amaran', mesej: 'Jantina tidak sepadan dengan digit akhir MyKad' });
    if (!m.jantina) isu.push({ tahap: 'amaran', mesej: 'Jantina kosong' });
    if (unitPeta && unitPeta.size) {
      for (const kat of ['ub', 'kp', 'sp']) {
        const kod = m[kat];
        if (!kod) continue;
        const u = unitPeta.get(kod);
        if (!u) isu.push({ tahap: 'ralat', mesej: `Kod ${kat.toUpperCase()} "${kod}" tiada dalam senarai unit` });
        else if (u.kategori !== kat.toUpperCase()) isu.push({ tahap: 'ralat', mesej: `${kod} bukan unit ${kat.toUpperCase()}` });
        else if (u.jantina && m.jantina && u.jantina !== m.jantina) isu.push({ tahap: 'amaran', mesej: `${kod} untuk murid ${u.jantina === 'P' ? 'perempuan' : 'lelaki'} sahaja` });
      }
    }
    return isu;
  }

  function jarak(a, b, had) {
    if (Math.abs(a.length - b.length) > had) return had + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let min = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (cur[j] < min) min = cur[j];
      }
      if (min > had) return had + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  /** Pasangan murid yang mungkin rekod berganda (nama hampir sama). */
  function cariBerganda(senarai) {
    const hasil = [];
    const kunci = (n) => besar(n).replace(/\b(BIN|BINTI|BT|B)\b\.?/g, '').replace(/[^A-Z]/g, '');
    const arr = senarai.map((m) => ({ m, k: kunci(m.nama) })).sort((x, y) => x.k.length - y.k.length);
    for (let i = 0; i < arr.length; i++) {
      for (let j = i + 1; j < arr.length; j++) {
        const a = arr[i], b = arr[j];
        if (b.k.length - a.k.length > 2) break;
        if (a.m.mykad && b.m.mykad && a.m.mykad === b.m.mykad) { hasil.push([a.m, b.m, 'No. MyKad sama']); continue; }
        // Dua MyKad sah yang berbeza = dua orang berbeza (adik-beradik, kembar).
        if (mykadSah(a.m.mykad) && mykadSah(b.m.mykad)) continue;
        if (a.k.length < 8) continue;
        const d = jarak(a.k, b.k, 2);
        if (d <= (a.k.length > 14 ? 2 : 1)) hasil.push([a.m, b.m, d === 0 ? 'Nama sama' : 'Nama hampir sama']);
      }
    }
    return hasil;
  }

  const api = { bacaDaftar, semakMurid, cariBerganda, normalMykad, mykadSah, jantinaMykad, tarikhLahir, normalTingkatan };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.KokumImport = api;
})(typeof window !== 'undefined' ? window : globalThis);

    else if (kod === '23505' && /mykad/i.test(m)) teks = 'No. MyKad ini sudah digunakan oleh murid lain.';

    else if (/rate limit/i.test(m)) teks = 'Terlalu banyak cubaan. Tunggu sebentar dan cuba lagi.';

  // ------------------------------------------------------------------ Supabase
  function SupabaseDB(url, key) {
    const sb = window.supabase.createClient(url, key, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
    const semak = ({ data, error }) => { if (error) throw terjemah(error); return data; };
    const pautanBalik = () => location.origin + location.pathname;

    async function semuaBaris(binaQuery) {
      let hasil = [];
      for (let mula = 0; ; mula += 1000) {
        const data = semak(await binaQuery().range(mula, mula + 999));
        hasil = hasil.concat(data);
        if (data.length < 1000) return hasil;
      }
    }

    return {
      mod: 'supabase',
      async sesi() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },

      async daftar(email, password, nama) {

      },
      async lupa(email) { semak(await sb.auth.resetPasswordForEmail(email, { redirectTo: pautanBalik() })); },
      async tukarKataLaluan(password) { semak(await sb.auth.updateUser({ password })); },
      async keluar() { await sb.auth.signOut(); },

          sb.from('tetapan').select('*').eq('id', 1).maybeSingle().then(semak),

          semuaBaris(() => sb.from('v_murid').select('*').order('tingkatan').order('kelas').order('nama')),

        return { tetapan, units, murid, profiles, guruUnit };
      },

      async simpanMurid(m) {
        const data = pilih(m, MEDAN_MURID);
        if (m.id) return semak(await sb.from('murid').update(data).eq('id', m.id).select().single());

      async padamMurid(id) { semak(await sb.from('murid').delete().eq('id', id)); },

  // Data contoh: murid rekaan untuk mencuba aplikasi. Bukan murid sebenar.
  function janaContoh(units) {
    let benih = 20261011;
    const rawak = () => { benih = (benih * 1103515245 + 12345) % 2147483648; return benih / 2147483648; };
    const pilih = (a) => a[Math.floor(rawak() * a.length)];
    const L = ['ADRIAN', 'HAFIZ', 'JOVEN', 'RAYNOLD', 'AIMAN', 'DARREN', 'ELVIS', 'FIRDAUS', 'GERALD', 'IKHWAN', 'JASON', 'KELVIN', 'MARVIN', 'NAZRIN', 'RIZAL', 'SHAWN', 'TERENCE', 'WILFRED'];
    const P = ['AMIRA', 'BELINDA', 'CHRISTINA', 'DAYANG', 'ELVIRA', 'FARAH', 'GLORIA', 'HANNAH', 'IRENE', 'JESLYN', 'KATRINA', 'MELISA', 'NUR AINA', 'ROSALIND', 'SITI HAJAR', 'VALERIE', 'YVONNE', 'ZAHIRAH'];
    const BAPA = ['JAMIL', 'GANDING', 'SAPIN', 'LOJIUS', 'MAJIMBUN', 'TINGGANG', 'RAMLI', 'ODOI', 'SULAIMAN', 'GUNDA', 'KUNTOH', 'ABDULLAH', 'MOJINUN', 'SINDUN', 'JUANIS'];
    const KELAS = ['AMANAH', 'BESTARI', 'CEMERLANG'];
    const ikutKat = (k) => units.filter((u) => u.kategori === k);
    const murid = [];
    let n = 0;
    ['1', '2', '3', '4', '5'].forEach((ting) => KELAS.forEach((kls) => {
      for (let i = 0; i < 20; i++) {
        const jantina = rawak() < 0.52 ? 'P' : 'L';
        const islam = rawak() < 0.35;
        const nama = (jantina === 'L' ? pilih(L) : pilih(P)) + (islam ? (jantina === 'L' ? ' BIN ' : ' BINTI ') : ' ') + pilih(BAPA);
        const tahunLahir = 2026 - 12 - (+ting) + 1;
        const bb = 1 + Math.floor(rawak() * 12), hh = 1 + Math.floor(rawak() * 28);
        let akhir = Math.floor(rawak() * 9000) + 1000;
        if ((akhir % 2 === 1) !== (jantina === 'L')) akhir += 1;
        const mykad = String(tahunLahir).slice(2) + String(bb).padStart(2, '0') + String(hh).padStart(2, '0') + '99' + String(akhir % 10000).padStart(4, '0');
        const sesuai = (u) => !u.jantina || u.jantina === jantina;
        const m = { id: 'contoh-' + (++n), nama, tingkatan: ting, kelas: `${ting} ${kls}`, mykad, jantina, rumah_sukan: null, status: 'aktif', catatan: null, bil_asal: n };
        ['UB', 'KP', 'SP'].forEach((k) => {
          const calon = ikutKat(k).filter(sesuai).filter((u) => k !== 'UB' || u.kod !== 'PPIM' || islam);
          m[k.toLowerCase()] = rawak() < 0.06 ? null : pilih(calon).kod;
          m[k.toLowerCase() + '_jawatan'] = null;
        });

    }));
    return murid;
  }

  function DemoDB() {

    const baca = () => {
      if (ingatan) return ingatan;
      try { ingatan = JSON.parse(localStorage.getItem(KUNCI) || 'null'); } catch (e) { ingatan = null; }
      if (!ingatan) ingatan = {
        tetapan: { id: 1, nama_sekolah: 'SMK. ULU SUGUT', kod_sekolah: 'XEA2140', alamat: 'PETI SURAT 234, 89308 RANAU.', tahun: 2026, senarai_rumah: [] },
        units: UNIT_ASAS.map((u) => ({ ...u })), murid: [], log: [], baharu: true,
      };
      return ingatan;
    };
    const tulis = () => { try { localStorage.setItem(KUNCI, JSON.stringify(ingatan)); } catch (e) { /* simpanan penuh: kekal dalam ingatan sahaja */ } };
    const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    const catat = (jadual, tindakan, ringkasan) => {
      const d = baca();
      d.log.unshift({ id: Date.now() + Math.random(), jadual, tindakan, ringkasan, oleh_email: 'demo', masa: new Date().toISOString() });
      d.log.length = Math.min(d.log.length, 300);
    };
    const profil = { id: 'demo', email: 'demo@peranti', nama: 'CIKGU PENYELARAS', peranan: 'penyelaras', aktif: true };
    const salin = (o) => JSON.parse(JSON.stringify(o));
    const tunda = () => new Promise((r) => setTimeout(r, 60));

    return {
      mod: 'demo',
      async sesi() { return { id: 'demo', email: profil.email }; },
      onAuth() {},
      async masuk() {}, async daftar() { return {}; }, async lupa() {}, async tukarKataLaluan() {}, async keluar() {},
      async profilSaya() { return { ...profil }; },
      async muatSemua() {
        await tunda();
        const d = baca();
        if (d.baharu && window.KOKUM_BINGKAI) { d.murid = janaContoh(d.units); d.contoh = true; }
        if (d.baharu) { delete d.baharu; tulis(); }
        return { tetapan: salin(d.tetapan), units: salin(d.units), murid: salin(d.murid), profiles: [{ ...profil }], guruUnit: [], contoh: !!d.contoh };
      },
      async simpanMurid(m) {
        const d = baca();
        const data = pilih(m, MEDAN_MURID);
        if (data.mykad && d.murid.some((x) => x.mykad === data.mykad && x.id !== m.id)) throw new Error('No. MyKad ini sudah digunakan oleh murid lain.');
        let rec;
        if (m.id) { rec = d.murid.find((x) => x.id === m.id); Object.assign(rec, data); catat('murid', 'UPDATE', rec.nama); }
        else { rec = { id: uuid(), status: 'aktif', ub: null, kp: null, sp: null, ...data }; d.murid.push(rec); catat('murid', 'INSERT', rec.nama); }
        rec.updated_at = new Date().toISOString();
        tulis(); return salin(rec);
      },
      async padamMurid(id) {
        const d = baca(); const i = d.murid.findIndex((x) => x.id === id);
        if (i >= 0) { catat('murid', 'DELETE', d.murid[i].nama); d.murid.splice(i, 1); tulis(); }
      },
      async setAhli(murid_id, kategori, unit_kod, jawatan) {
        const d = baca(); const m = d.murid.find((x) => x.id === murid_id);
        const k = kategori.toLowerCase(); const lama = m[k];
        m[k] = unit_kod || null; m[k + '_jawatan'] = unit_kod ? (jawatan || null) : null;
        catat('keahlian', unit_kod ? (lama ? 'UPDATE' : 'INSERT') : 'DELETE', `${m.nama} · ${kategori}: ${lama || '—'} → ${unit_kod || '—'}`);
        tulis();
      },
      async importMurid(rows, kemajuan) {
        const d = baca(); const hasil = { baru: 0, dikemas: 0, keahlian: 0, ralat: [] };
        if (d.contoh) { d.murid = []; d.log = []; d.contoh = false; } // data contoh diganti dengan data sebenar
        const kodSah = new Map(d.units.map((u) => [u.kod, u.kategori]));
        const normal = (s) => String(s || '').replace(/\s+/g, ' ').trim().toUpperCase();
        rows.forEach((r) => {
          let m = (r.mykad && d.murid.find((x) => x.mykad === r.mykad)) || d.murid.find((x) => normal(x.nama) === normal(r.nama));
          for (const kat of ['ub', 'kp', 'sp']) {
            if (r[kat] && kodSah.get(r[kat]) !== kat.toUpperCase()) { hasil.ralat.push({ nama: r.nama, ralat: `Kod ${r[kat]} tidak sah untuk ${kat.toUpperCase()}` }); return; }
          }
          if (!m) { m = { id: uuid(), ub: null, kp: null, sp: null }; d.murid.push(m); hasil.baru++; } else hasil.dikemas++;
          Object.assign(m, {
            nama: r.nama, tingkatan: r.tingkatan, kelas: r.kelas, mykad: r.mykad || m.mykad || null,
            jantina: r.jantina || m.jantina || null, rumah_sukan: r.rumah_sukan || m.rumah_sukan || null,
            status: r.status || m.status || 'aktif', bil_asal: r.bil_asal || m.bil_asal || null,
          });
          for (const kat of ['ub', 'kp', 'sp']) {
            if (r[kat]) { m[kat] = r[kat]; m[kat + '_jawatan'] = r[kat + '_jawatan'] || m[kat + '_jawatan'] || null; hasil.keahlian++; }
          }
        });
        catat('murid', 'IMPORT', `Import Excel: ${hasil.baru} baharu, ${hasil.dikemas} dikemas kini, ${hasil.keahlian} keahlian, ${hasil.ralat.length} ralat`);
        tulis(); if (kemajuan) kemajuan(rows.length, rows.length);
        return hasil;
      },
      async simpanUnit(u, kodAsal) {
        const d = baca(); const data = pilih(u, MEDAN_UNIT);
        if (kodAsal) {
          const rec = d.units.find((x) => x.kod === kodAsal);
          if (data.kod && data.kod !== kodAsal) {
            if (d.units.some((x) => x.kod === data.kod)) throw new Error('Kod unit ini sudah wujud.');
            const k = rec.kategori.toLowerCase();
            d.murid.forEach((m) => { if (m[k] === kodAsal) m[k] = data.kod; });
          }
          Object.assign(rec, data); catat('unit', 'UPDATE', rec.kod); tulis(); return salin(rec);
        }
        if (d.units.some((x) => x.kod === data.kod)) throw new Error('Kod unit ini sudah wujud.');
        const rec = { aktif: true, susunan: d.units.length, ...data }; d.units.push(rec); catat('unit', 'INSERT', rec.kod); tulis(); return salin(rec);
      },
      async padamUnit(kod) {
        const d = baca(); const u = d.units.find((x) => x.kod === kod);
        if (d.murid.some((m) => m[u.kategori.toLowerCase()] === kod)) throw new Error('Kod unit tidak wujud atau masih digunakan.');
        d.units = d.units.filter((x) => x.kod !== kod); catat('unit', 'DELETE', kod); tulis();
      },
      async simpanTetapan(t) { const d = baca(); Object.assign(d.tetapan, t); tulis(); return salin(d.tetapan); },
      async simpanProfil(p) { Object.assign(profil, { nama: p.nama }); return { ...profil }; },
      async setGuruUnit() {},
      async log(had) { return salin(baca().log.slice(0, had || 200)); },
      reset() { ingatan = null; try { localStorage.removeItem(KUNCI); } catch (e) { /* abai */ } const d = baca(); delete d.baharu; tulis(); },
      isiContoh() { const d = baca(); d.murid = janaContoh(d.units); d.contoh = true; d.log = []; catat('murid', 'IMPORT', 'Data contoh dimuatkan'); tulis(); },
    };
  }

  window.KokumDB = { SupabaseDB, DemoDB, terjemah, UNIT_ASAS };
})();

/* KOKUM SMART 2026 · aplikasi utama (Fasa 1) */
(function () {

  // ------------------------------------------------------------------ ikon

    unit: P('<path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'),
    cetak: P('<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>'),
    tetapan: P('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
    tambah: P('<path d="M12 5v14M5 12h14"/>'),

  };

  // ------------------------------------------------------------------ bantuan
  let rotiTimer;
  function roti(teks, ralat) {
    let el = $('#roti');
    if (!el) { el = document.createElement('div'); el.id = 'roti'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.className = 'roti' + (ralat ? ' ralat' : '');
    el.textContent = teks;
    el.hidden = false;
    clearTimeout(rotiTimer);
    rotiTimer = setTimeout(() => { el.hidden = true; }, ralat ? 6000 : 2600);
  }
  // Pengesahan dalam halaman (confirm() tidak berfungsi dalam semua paparan)
  function sahkan(teks, { ok = 'Teruskan', bahaya = false } = {}) {
    return new Promise((selesai) => {
      let d = document.getElementById('dlg-sah');
      if (!d) { d = document.createElement('dialog'); d.id = 'dlg-sah'; document.body.appendChild(d); }
      d.innerHTML = `<div class="db" style="padding-top:20px"><p style="white-space:pre-line;margin:0">${e(teks)}</p></div>
        <div class="dt"><button class="btn" value="0" id="sah-batal">Batal</button><button class="btn ${bahaya ? 'bahaya' : 'utama'}" id="sah-ok">${e(ok)}</button></div>`;
      const tamat = (v) => { d.onclose = null; if (d.open) d.close(); selesai(v); };
      d.querySelector('#sah-batal').onclick = () => tamat(false);
      d.querySelector('#sah-ok').onclick = () => tamat(true);
      d.onclose = () => selesai(false);
      d.showModal();
      d.querySelector('#sah-ok').focus();

  const skripDimuat = {};
  function muatSkrip(url) {
    if (!skripDimuat[url]) skripDimuat[url] = new Promise((ok, tolak) => {
      const s = document.createElement('script');
      s.src = url; s.onload = ok;
      s.onerror = () => { delete skripDimuat[url]; tolak(new Error('Tidak dapat memuat turun komponen. Semak sambungan internet.')); };
      document.head.appendChild(s);
    });
    return skripDimuat[url];
  }
  const muatXLSX = () => (window.XLSX ? Promise.resolve() : muatSkrip(URL_XLSX));

  const penyelaras = () => S.profil && S.profil.peranan === 'penyelaras';
  const bolehUrus = (kod) => penyelaras() || S.unitSaya.has(kod);
  const aktif = () => S.data.murid.filter((m) => m.status !== 'keluar');
  const unitKat = (kat, semua) => S.data.units.filter((u) => u.kategori === kat && (semua || u.aktif !== false)).sort((a, b) => (a.susunan || 0) - (b.susunan || 0) || a.kod.localeCompare(b.kod));
  const susunTing = (t) => { const i = TING.indexOf(t); return i < 0 ? 99 : i; };
  const susunMurid = (a, b) => susunTing(a.tingkatan) - susunTing(b.tingkatan) || a.kelas.localeCompare(b.kelas) || a.nama.localeCompare(b.nama);
  const labelTing = (t) => (t === 'PPKI' ? 'PPKI' : 'Tingkatan ' + t);
  const kadRingkas = (k) => (!k ? 'tiada MyKad' : KI.mykadSah(k) ? 'MyKad …' + k.slice(-4) : 'MyKad belum sah');
  const hariIni = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const tarikh = (s) => { try { return new Date(s).toLocaleString('ms-MY', { dateStyle: 'medium', timeStyle: 'short' }); } catch (x) { return s; } };

  function kelasSenarai(ting) {
    const set = new Set(S.data.murid.filter((m) => !ting || m.tingkatan === ting).map((m) => m.kelas));
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'ms', { numeric: true }));
  }

  function bilanganUnit() {
    const peta = new Map(S.data.units.map((u) => [u.kod, { L: 0, P: 0, j: 0 }]));
    aktif().forEach((m) => KATS.forEach((k) => {
      const kod = m[k.toLowerCase()];
      if (!kod) return;
      if (!peta.has(kod)) peta.set(kod, { L: 0, P: 0, j: 0 });
      const c = peta.get(kod); c.j++; if (m.jantina === 'L') c.L++; else if (m.jantina === 'P') c.P++;
    }));
    return peta;
  }

  function lencanaSet(m) {
    return '<span class="lencana-set">' + KATS.map((k) => {
      const kod = m[k.toLowerCase()];
      return kod ? `<span class="lencana ${k}" title="${e(KAT[k])}: ${e(kod)}">${e(kod)}</span>`
        : `<span class="lencana kosong" title="${e(KAT[k])} belum ditetapkan">${k} —</span>`;
    }).join('') + '</span>';
  }

  function kelengkapan(m) {
    const item = [
      ['No. MyKad sah', KI.mykadSah(m.mykad)],
      ['Unit beruniform', !!m.ub], ['Kelab & persatuan', !!m.kp], ['Sukan & permainan', !!m.sp],
      ['Rumah sukan', !!m.rumah_sukan],

    return { peratus: Math.round((item.filter((x) => x[1]).length / item.length) * 100), kurang: item.filter((x) => !x[1]).map((x) => x[0]) };
  }

  function isuMurid(m) {

    isuKad: (m) => !KI.mykadSah(m.mykad), tiadaRumah: (m) => !m.rumah_sukan,

  // ------------------------------------------------------------------ eksport Excel
  async function eksport(namaFail, helaian) {
    await muatXLSX();

      const ws = window.XLSX.utils.aoa_to_sheet(aoa);

    if (!dl) throw new Error('Muat turun fail tidak tersedia dalam paparan ini.');
    const buf = window.XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    try { await dl.save({ filename: namaFail, data: new Blob([buf]) }); return true; } catch (err) {
      if (err && err.code === 'declined') return false;
      throw new Error(err && err.code === 'rate_limited' ? 'Tunggu sebentar, kemudian cuba muat turun lagi.' : 'Fail tidak dapat dimuat turun di sini.');

  function baris_eksport(senarai) {

  const TAJUK_EKSPORT = ['BIL', 'NAMA PELAJAR', 'TINGKATAN', 'KELAS', 'NO MYKAD', 'GENDER', 'UNIT BERUNIFORM (UB)', 'JAWATAN',

  }

  // ------------------------------------------------------------------ permulaan
  async function mula() {
    const qs = new URLSearchParams(location.search);
    const adaKonfig = C.supabaseUrl && C.supabaseAnonKey && !/GANTI/i.test(C.supabaseUrl + C.supabaseAnonKey);
    S.demo = qs.has('demo') || !adaKonfig;
